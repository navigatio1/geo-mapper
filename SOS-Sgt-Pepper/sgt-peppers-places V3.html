oach) p01l95gh",false,false,"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Magical Mystery Tour (Beatles standing up through top of coach"],[" p01l95gh__1494777525155.jpg)",false,false,null]]},{"para":[["Magical Mystery Tour",false,true,null],[" is the opening track and theme song for the album, double EP and TV film of the same name. Unlike the theme songs for their other film projects, it was not released as a single.",false,false,null]]},{"para":[["Magical Mystery Tour (Title track)",false,true,null]]},{"media":{"kind":"Spotify embed","title":"","caption":"","url":"https://embed.spotify.com/?uri=spotify%3Atrack%3A7GeZEzG1QEjqRzuWVlrBFt"}},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: bfe8339b7a204428adc8969e116dbdbe","caption":"","webmap_id":"bfe8339b7a204428adc8969e116dbdbe","size":"large","url":"https://www.arcgis.com/home/item.html?id=bfe8339b7a204428adc8969e116dbdbe","extent_lonlat":[0.3436,51.2606,0.4305,51.2851],"extent_key":"0.3436,51.2606,0.4305,51.2851"}},{"para":[["Much of the film was shot in and around RAF West Malling, since decommissioned. Most of the area is now a small new town called King's Hill and a golf course.",false,false,null]]},{"media":{"kind":"Image","title":"Magical Mystery Tour West Malling RAF Base RS4_MMT_Press04-lpr","caption":"The Beatles sing 'I Am The Walrus' at RAF West Malling","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Magical%20Mystery%20Tour%20West%20Malling%20RAF%20Base%20RS4_MMT_Press04-lpr__1529247741608.jpg","size":"large"}},{"media":{"kind":"Image","title":"RAF West Malling film locations aerial image","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/RAF%20West%20Malling%20film%20locations%20aerial%20image__1529247882968.jpg","size":"large"}},{"para":[["This aerial photograph of RAF West Malling shows some of the main locations used for the film.",false,false,null]]},{"para":[["Kenwood Lennon",false,true,"http://kenwoodlennon.blogspot.co.uk/2010_08_01_archive.html"]]},{"level":2,"text":"The Fool On The Hill","anchor":"section-44"},{"media":{"kind":"Image","title":"Fool On The Hill (Paul McCartney - still from promo 1)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Fool%20On%20The%20Hill%20(Paul%20McCartney%20-%20still%20from%20promo%201)__1494779238711.jpg","size":"large"}},{"para":[["The Fool On The Hill",false,true,null],[" is a ballad with spiritual connotations. The notion of a 'holy fool' goes back to the Middle Ages referring to a characteristic of spiritual leaders with mystical qualities.  A titular 'fool' was a character who could stand back from society, offering wise perspectives which might not be properly appreciated by everyone, leading to isolation or discrimination.",false,false,null]]},{"media":{"kind":"Video","title":"The Beatles - The Fool On The Hill (from Magical Mystery Tour)","caption":"","url":"https://www.youtube.com/embed/DGEX_7IqaC4?wmode=opaque&rel=0"}},{"level":2,"text":"The Fool On The Hill","anchor":"section-45"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: bfe8339b7a204428adc8969e116dbdbe","caption":"","webmap_id":"bfe8339b7a204428adc8969e116dbdbe","size":"large","url":"https://www.arcgis.com/home/item.html?id=bfe8339b7a204428adc8969e116dbdbe","extent_lonlat":[-9.399,39.856,15.9575,48.8475],"extent_key":"-9.3990,39.8560,15.9575,48.8475"}},{"para":[["The Fool On The Hill",false,true,null],[" was written by Paul McCartney about anyone whose wisdom is unappreciated: ",false,false,null],["\"someone like Maharishi\". His detractors called him a fool. Because of his giggle he wasn't taken too seriously. It was this idea of a fool on the hill, a guru in a cave, I was attracted to\"",false,true,null],[".",false,false,null]]},{"para":[["Source: Paul McCartney - Many Years from Now",false,true,null]]},{"para":[["The Beatles with Maharishi Mahesh Yogi",false,false,null]]},{"media":{"kind":"Image","title":"67_beatles_maharishi-mahesh_yogi_002","caption":"Maharishi Mahesh Yogi, meeting The Beatles in 1967","url":"https://www.beatlesbible.com/wp/media/67_beatles_maharishi-mahesh_yogi_002.jpg","size":"large"}},{"para":[["The promo film for ",false,false,null],["The Fool On The Hill",false,true,null],[" featured Paul McCartney on his own.  It was filmed in the south of France.",false,false,null]]},{"para":[["Like the promos for ",false,false,null],["Penny Lane",false,true,null],[" and ",false,false,null],["Strawberry Fields Forever",false,true,null],[", it influenced the style of music videos in years to come.",false,false,null]]},{"para":[["The promo film was made on a hill near Nice, France (possibly Mont Macaron).",false,false,null]]},{"media":{"kind":"Image","title":"im_montmacaron3","caption":"Mont Macaron (Mercantour info)","url":"https://mercantour.info/images/im_montmacaron3.jpg","size":"large"}},{"level":2,"text":"Flying","anchor":"section-46"},{"para":[["!",false,false,null],["Magical Mystery Tour - Flying bus (flyingmmtbus)",false,false,"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Magical Mystery Tour - Flying bus (flyingmmtbus"],["__1494780504186.jpg)",false,false,null]]},{"para":[["Flying",false,true,null],[" is an psychedelic instrumental track used as background music in the 1967 ",false,false,null],["Magical Mystery Tour",false,true,null],[".",false,false,null]]},{"media":{"kind":"Video","title":"The Beatles - Flying (Magical Mystery Tour)","caption":"","url":"https://www.youtube.com/embed/zLV-aIEPREw?wmode=opaque&rel=0"}},{"level":2,"text":"Flying","anchor":"section-47"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: bfe8339b7a204428adc8969e116dbdbe","caption":"","webmap_id":"bfe8339b7a204428adc8969e116dbdbe","size":"large","url":"https://www.arcgis.com/home/item.html?id=bfe8339b7a204428adc8969e116dbdbe","extent_lonlat":[-54.107,58.3753,4.2963,70.6542],"extent_key":"-54.1070,58.3753,4.2963,70.6542"}},{"para":[["Flying",false,true,null],[" is an instrumental track used in as the ",false,false,null],["Magical Mystery Tour",false,true,null],[" bus floats over a mountainous landscape.",false,false,null]]},{"media":{"kind":"Image","title":"Magical Mystery Tour - Flying bus (flyingmmtbus)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Magical%20Mystery%20Tour%20-%20Flying%20bus%20(flyingmmtbus)__1494780504186.jpg","size":"large"}},{"para":[["In this typically 1967 psychedelic sequence the ",false,false,null],["Magical Mystery Tour",false,true,null],[" bus crosses colour-altered snow-capped mountains in Iceland.",false,false,null]]},{"para":[["Curiously, some of the images used were off-cuts from the 1964 Stanley Kubrick film ",false,false,null],["Dr. Strangelove",false,true,null],[".",false,false,null]]},{"media":{"kind":"Spotify embed","title":"The Beatles - Flying (Magical Mystery Tour)","caption":"","url":"https://embed.spotify.com/?uri=spotify%3Atrack%3A2z1p43SNSbeowzy8WdYHNk"}},{"level":2,"text":"Blue Jay Way","anchor":"section-48"},{"media":{"kind":"Image","title":"blue-jay-way1","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/blue-jay-way1__1494785150562.jpeg","size":"large"}},{"para":[["George Harrison contributed the song ",false,false,null],["Blue Jay Way",false,true,null],[" to ",false,false,null],["Magical Mystery Tour",false,true,null],[".  It was based on a real place in the USA.",false,false,null]]},{"level":2,"text":"Blue Jay Way","anchor":"section-49"},{"media":{"kind":"Image","title":"Blue Jay Way (beatlesfacts.files.wordpress.com)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Blue%20Jay%20Way%20(beatlesfacts.files.wordpress.com)__1494784968468.jpg","size":"large"}},{"para":[["Blue Jay Way",false,true,null],[" is named after a road in the Hollywood Hills of Los Angeles where Harrison stayed in August 1967, shortly before visiting the Haight-Ashbury district of San Francisco.",false,false,null]]},{"media":{"kind":"Spotify embed","title":"The Beatles - Blue Jay Way (Magical Mystery Tour)","caption":"","url":"https://embed.spotify.com/?uri=spotify%3Atrack%3A0ttMfoND7IQqFSMVOPkELC"}},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: 32e08ebb2d8f430081d2717ace9966e6","caption":"","webmap_id":"32e08ebb2d8f430081d2717ace9966e6","size":"large","url":"https://www.arcgis.com/home/item.html?id=32e08ebb2d8f430081d2717ace9966e6","extent_lonlat":[-151.3116,27.5298,-100.5987,45.6771],"extent_key":"-151.3116,27.5298,-100.5987,45.6771"}},{"para":[["The lyrics of ",false,false,null],["Blue Jay Way",false,true,null],[" document Harrison's wait for music publicist Derek Taylor to find his way to Blue Jay Way through the fog-ridden hills, while Harrison struggled to stay awake after the flight from London to Los Angeles.",false,false,null]]},{"level":2,"text":"Your Mother Should Know","anchor":"section-50"},{"para":[["!",false,false,null],["Your Mother Should Know 1 (thefaustorocksyeah.files.wordpress.com)",false,false,"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Your Mother Should Know 1 (thefaustorocksyeah.files.wordpress.com"],["__1494786000890.jpg)",false,false,null]]},{"level":2,"text":"Your Mother Should Know","anchor":"section-51"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: bfe8339b7a204428adc8969e116dbdbe","caption":"","webmap_id":"bfe8339b7a204428adc8969e116dbdbe","size":"large","url":"https://www.arcgis.com/home/item.html?id=bfe8339b7a204428adc8969e116dbdbe","extent_lonlat":[-1.7656,51.0874,1.4039,51.9741],"extent_key":"-1.7656,51.0874,1.4039,51.9741"}},{"para":[["Paul McCartney wrote this 'sing-along' song at his home in Cavendish Avenue, St John's Wood, London when some older relatives were staying with him.",false,false,null]]},{"para":[["\"My Aunty Jin and Uncle Harry and a couple of relatives were staying and they were in the living room just across the hall, so I just went to the dining room and spent a few hours with the door open with them listening... It's a very music-hall kind of thing...\"",false,false,null]]},{"para":[["Paul McCartney: Many Years From Now",false,true,null]]},{"media":{"kind":"Spotify embed","title":"The Beatles - Your Mother Should Know (Magical Mystery Tour)","caption":"","url":"https://embed.spotify.com/?uri=spotify%3Atrack%3A61iJ2np62qzaMdEcGvjICc"}},{"para":[["The song was used as the basis for an elaborate sequence involving ballroom dancers and a staircase reminiscent of old Hollywood dance musicals.",false,false,null]]},{"media":{"kind":"Image","title":"Your Mother Should Know 1 (thefaustorocksyeah.files.wordpress.com)","caption":"The Beatles - Your Mother Should Know (Magical Mystery Tour)","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Your%20Mother%20Should%20Know%201%20(thefaustorocksyeah.files.wordpress.com)__1494786000890.jpg","size":"large"}},{"para":[["The filiming was carried out in a hangar at RAF West Malling in Kent, a military airport which has since been decommissioned.",false,false,null]]},{"para":[["Most of the area is now a small new town called King's Hill and a golf course.",false,false,null]]},{"level":2,"text":"I Am The Walrus","anchor":"section-52"},{"media":{"kind":"Image","title":"I Am The Walrus (classic shot with policemen on blast wall)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/I%20Am%20The%20Walrus%20(classic%20shot%20with%20policemen%20on%20blast%20wall)__1494787310790.jpg","size":"large"}},{"para":[["I Am The Walrus",false,true,null],[" is one of the best known songs from ",false,false,null],["Magical Mystery Tour",false,true,null],[" and one of the most baffling.",false,false,null]]},{"media":{"kind":"Video","title":"The Beatles - I Am The Walrus (Magical Mystery Tour)","caption":"","url":"https://www.youtube.com/embed/UKIs1J_nB4A?wmode=opaque&rel=0"}},{"level":2,"text":"I Am The Walrus","anchor":"section-53"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: bfe8339b7a204428adc8969e116dbdbe","caption":"","webmap_id":"bfe8339b7a204428adc8969e116dbdbe","size":"large","url":"https://www.arcgis.com/home/item.html?id=bfe8339b7a204428adc8969e116dbdbe","extent_lonlat":[-4.0371,53.2179,-2.4523,53.6425],"extent_key":"-4.0371,53.2179,-2.4523,53.6425"}},{"para":[["John Lennon wrote the mysterious lyrics of ",false,false,null],["I Am The Walrus",false,true,null],[" to intentionally defy interpretation, and in this respect there is a connection to his old school, Quarry Bank High School in Allerton, Liverpool.",false,false,null]]},{"para":[["John Lennon had received a letter from a student at his old school who said that his English teacher encouraged students to analyse The Beatles' lyrics.",false,false,null]]},{"para":[["Lennon, amused that a teacher was putting so much effort into understanding The Beatles' lyrics, decided to make his next song especially obscure and confusing.",false,false,null]]},{"media":{"kind":"Image","title":"Magical Mystery Tour West Malling RAF Base RS4_MMT_Press04-lpr","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Magical%20Mystery%20Tour%20West%20Malling%20RAF%20Base%20RS4_MMT_Press04-lpr__1529247741608.jpg","size":"large"}},{"para":[["The footage for ",false,false,null],["I Am The Walrus",false,true,null],[" was filmed on the airfield at RAF West Malling (since been decommissioned).",false,false,null]]},{"para":[["The austere setting featured thick concrete blast walls designed to protect military aircraft from from enemy attacks.",false,false,null]]},{"media":{"kind":"Image","title":"The Beatles sing I Am The Walrus at RAF West Malling","caption":"The Beatles sing 'I Am The Walrus' at RAF West Malling","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/The%20Beatles%20sing%20I%20Am%20The%20Walrus%20at%20RAF%20West%20Malling__1529248348456.jpg","size":"large"}},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: bfe8339b7a204428adc8969e116dbdbe","caption":"","webmap_id":"bfe8339b7a204428adc8969e116dbdbe","size":"large","url":"https://www.arcgis.com/home/item.html?id=bfe8339b7a204428adc8969e116dbdbe","extent_lonlat":[0.3575,51.2617,0.4191,51.2791],"extent_key":"0.3575,51.2617,0.4191,51.2791"}},{"para":[["Most of the area is now a small new town called King's Hill and a golf course.",false,false,null]]},{"level":2,"text":"Baby You're A Rich Man","anchor":"section-54"},{"media":{"kind":"Image","title":"Baby You're A Rich Man cover (b-side of All You Need Is Love)c","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Baby%20You're%20A%20Rich%20Man%20cover%20(b-side%20of%20All%20You%20Need%20Is%20Love)c__1494968403736.jpg","size":"large"}},{"para":[["Baby You're A Rich Man",false,true,null],[" is a song which appeared first as the B-side of the single ",false,false,null],["All You Need Is Love",false,true,null],[".",false,false,null]]},{"level":2,"text":"Baby, You're A Rich Man","anchor":"section-55"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: 32e08ebb2d8f430081d2717ace9966e6","caption":"","webmap_id":"32e08ebb2d8f430081d2717ace9966e6","size":"large","url":"https://www.arcgis.com/home/item.html?id=32e08ebb2d8f430081d2717ace9966e6","extent_lonlat":[-1.999,51.1982,0.7833,51.9747],"extent_key":"-1.9990,51.1982,0.7833,51.9747"}},{"para":[["During the mid-1960s, the burgeoning youth movements associated with psychedelia found some expression via semi-spontaneous 'happenings' and venues such as the UFO Club in London, with residencies by avant-garde bands such as Pink Floyd and Soft Machine.",false,false,null]]},{"para":[["The Beatles were influenced by, and an influence on these trends.  In fact Pink Floyd were recording their first album ",false,false,null],["The Piper at the Gates of Dawn",false,true,null],[" at EMI's Abbey Road Studios at the same time as the Beatles were recording ",false,false,null],["Sgt. Pepper",false,true,null],[".",false,false,null]]},{"para":[["Baby, You're A Rich Man",false,true,null],[" may have been initially inspired by the 14-Hour ",false,false,null],["Technicolour Dream",false,true,null],[", a 'happening' which took place on 29 April 1967, shortly before the song was recorded in the Great Hall of the Alexandra Palace, London.",false,false,null]]},{"para":[["Some of the lyrics are thought to be ",false,false,null],["about Brian Epstein, the Beatles' manager",false,false,"https://en.wikipedia.org/wiki/Baby,_You%2527re_a_Rich_Man"],[".",false,false,null]]},{"media":{"kind":"Image","title":"John Lennon at the 14-Hour Technicolour Dream 1967 tech-dream-lennon-2","caption":"John Lennon at the 14-Hour Technicolour Dream 1967","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/John%20Lennon%20at%20the%2014-Hour%20Technicolour%20Dream%201967%20tech-dream-lennon-2__1529248552798.jpg","size":"large"}},{"para":[["The song hints at some of the contradictions of the London 'scene' that Lennon had observed.",false,false,null]]},{"media":{"kind":"Spotify embed","title":"","caption":"","url":"https://open.spotify.com/embed/track/7ncH66qOYWLn3Bdw4OjoFi"}},{"para":[["It was cleverly used at the end of ",false,false,null],["The Social Network",false,true,null],[" (2010), a movie profiling the phenomenal rise of Facebook, starring Jesse Eisenberg as Mark Zuckerberg.",false,false,null]]},{"media":{"kind":"Video","title":"Baby You're A Rich Man - The Beatles (The Social Network 2010)","caption":"","url":"https://www.youtube.com/embed/IRmE2AiabUY?wmode=opaque&rel=0"}},{"para":[["Baby, You're A Rich Man",false,true,null],[" was recorded at Olympic Studios, Barnes, in south-west London.",false,false,null]]},{"media":{"kind":"Image","title":"olympic-sound-studios-821w","caption":"Olympic Studios, Barnes, in south-west London.","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/olympic-sound-studios-821w__1496323806751.jpg","size":"large"}},{"para":[["It became the first Beatles song recorded entirely away from Abbey Road Studios.",false,false,null]]},{"para":[["Olympic Studios was ",false,false,null],["favoured by many recording artists",false,false,"https://en.wikipedia.org/wiki/Olympic_Studios#Artists_at_Olympic_Studios.2C_1966-2009.2C_includes"],[" including The Who, Queen, Led Zeppelin and Pink Floyd.  It was also used to record movie soundtracks.",false,false,null]]},{"para":[["The studios closed in 2009 but the building ",false,false,null],["re-opened in 2013",false,false,"http://www.bbc.co.uk/news/entertainment-arts-24639862"],[" reverting to its original function as a cinema.",false,false,null]]},{"media":{"kind":"Image","title":"Oympic Studios, Barnes (olympic-cinema)","caption":"Olympic Studios building (now the Olympic Cinema)","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Oympic%20Studios%2C%20Barnes%20(olympic-cinema)__1496324150587.jpg","size":"large"}},{"level":2,"text":"\"Are you sad because you're on your own?\"","anchor":"section-56"},{"media":{"kind":"Image","title":"Are you sad because youre on your own Yogi #4","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Are%20you%20sad%20because%20youre%20on%20your%20own%20Yogi%20%234__1529248641215.jpg","size":"large"}},{"para":[["27 August 1967 was one of the most significant days in the life of The Beatles.  Their manager, Brian Epstein, died unexpectedly at his home in London.",false,false,null]]},{"level":2,"text":"The death of Brian Epstein","anchor":"section-57"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: 32e08ebb2d8f430081d2717ace9966e6","caption":"","webmap_id":"32e08ebb2d8f430081d2717ace9966e6","size":"large","url":"https://www.arcgis.com/home/item.html?id=32e08ebb2d8f430081d2717ace9966e6","extent_lonlat":[-2.7314,50.988,0.9188,52.1185],"extent_key":"-2.7314,50.9880,0.9188,52.1185"}},{"para":[["The Beatles' manager, Brian Epstein died unexpectedly at his home in Chapel Street, Belgravia, London on 27 August 1967.",false,false,null]]},{"media":{"kind":"Image","title":"984674c633869af431f16f0185e9a23d","caption":"","url":"https://s-media-cache-ak0.pinimg.com/736x/98/46/74/984674c633869af431f16f0185e9a23d.jpg","size":"large"}},{"para":[["The Beatles heard about the death of Brian Epstein while in Bangor University in Wales.",false,false,null]]},{"para":[["They had travelled to Bangor to take part in a conference with the Indian guru, Maharishi Mahesh Yogi.",false,false,null]]},{"para":[["In 2002, Bangor University unveiled a plaque to commemorate the 35th anniversary of The Beatles' visit in the Hugh Owen Hall, which is now part of Bangor Business School's Management Centre.",false,false,null]]},{"media":{"kind":"Video","title":"The Beatles interviewed about the death of Brian Epstein","caption":"","url":"https://www.youtube.com/embed/T6wmiPIa88c"}},{"media":{"kind":"Video","title":"","caption":"","url":"https://www.youtube.com/embed/gv_0EH-mOBg?wmode=opaque&rel=0"}},{"level":2,"text":"\"It's getting very near the end\"","anchor":"section-58"},{"para":[["!",false,false,null],["Sgt Pepper cover (ultimateclassicrock)",false,false,"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Sgt Pepper cover (ultimateclassicrock"],["__1494074357578.jpg)",false,false,null]]},{"level":2,"text":"The Apple Boutique","anchor":"section-59"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: 32e08ebb2d8f430081d2717ace9966e6","caption":"","webmap_id":"32e08ebb2d8f430081d2717ace9966e6","size":"large","url":"https://www.arcgis.com/home/item.html?id=32e08ebb2d8f430081d2717ace9966e6","extent_lonlat":[-0.1589,51.5199,-0.1558,51.5209],"extent_key":"-0.1589,51.5199,-0.1558,51.5209"}},{"para":[["Apple Corps",false,true,null],[" was a company created by The Beatles in 1967, after the death of their manager Brian Epstein. The Apple Boutique was one of their first business ventures.",false,false,null]]},{"para":[["It was a retail store located in a building on the corner of Baker Street and Paddington Street, Marylebone, London. It opened on 7 December 1967 but was unsuccessful and closed on 30 July 1968.",false,false,null]]},{"para":[["The Apple Boutique being painted, 1967",false,false,null]]},{"media":{"kind":"Image","title":"Apple boutique being painted","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Apple%20boutique%20being%20painted__1514127488786.jpg","size":"large"}},{"para":[["Errors of judgement such as the ",false,false,null],["Magical Mystery Tour",false,true,null],[" film and the ill-fated Apple Boutique can be looked back on as indicators that The Beatles project was unravelling.  Within two years, John, Paul, George and Ringo had gone their separate ways.",false,false,null]]},{"level":2,"text":"Hello, Goodbye","anchor":"section-60"},{"media":{"kind":"Image","title":"beatles-1967-hello-goodbye-video-web","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/beatles-1967-hello-goodbye-video-web__1494794671825.jpg","size":"large"}},{"media":{"kind":"Image","title":"Hello Goodbye - Beatles sleeve cover tumblr_m8rw3sufZE1r3cxcoo1_1280","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Hello%20Goodbye%20-%20Beatles%20sleeve%20cover%20tumblr_m8rw3sufZE1r3cxcoo1_1280__1529248772238.png","size":"large"}},{"para":[["In spite of their autumn inconsistencies, The Beatles finished 1967 with a return to form releasing ",false,false,null],["Hello, Goodbye",false,true,null],[" and one of the greatest ever B-sides ",false,false,null],["I Am The Walrus",false,true,null],[".",false,false,null]]},{"para":[["The title ",false,false,null],["Hello, Goodbye",false,true,null],[" may later have transpired to be prophetic.  The song became a major hit, topping the UK's official singles chart for seven weeks, through to 23 January 1968, giving The Beatles their longest run at number one on this chart since their best performing single ",false,false,null],["She Loves You",false,true,null],[" in 1963.",false,false,null]]},{"media":{"kind":"Image","title":"Hello Goodbye - Beatles Melody Maker advert 1967 - Copy","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Hello%20Goodbye%20-%20Beatles%20Melody%20Maker%20advert%201967%20-%20Copy__1663147353156.jpg","size":"large"}},{"para":[["While they started the year determined to shake off their past, by the end of the year their artistic confidence was sufficiently robust for them to include a self-deprecating return to their 1963 suits in one scene of the promo film for ",false,false,null],["Hello, Goodbye",false,true,null],[" as if to show how far they had travelled artistically in just four years.",false,false,null]]},{"media":{"kind":"Video","title":"The Beatles - Hello, Goodbye","caption":"","url":"https://www.youtube.com/embed/rblYSKz_VnI?wmode=opaque&rel=0"}},{"level":2,"text":"Hello, Goodbye","anchor":"section-61"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: 32e08ebb2d8f430081d2717ace9966e6","caption":"","webmap_id":"32e08ebb2d8f430081d2717ace9966e6","size":"large","url":"https://www.arcgis.com/home/item.html?id=32e08ebb2d8f430081d2717ace9966e6","extent_lonlat":[-2.181,51.0765,0.9885,51.9634],"extent_key":"-2.1810,51.0765,0.9885,51.9634"}},{"para":[["Hello, Goodbye",false,true,null],[" was issued as a non-album single in November 1967, the group's first release since the death of their manager, Brian Epstein.",false,false,null]]},{"media":{"kind":"Image","title":"Hello Goodbye - Beatles Melody Maker advert 1967 - Copy","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Hello%20Goodbye%20-%20Beatles%20Melody%20Maker%20advert%201967%20-%20Copy__1663147353156.jpg","size":"large"}},{"para":[["The promo film for ",false,false,null],["Hello, Goodbye",false,true,null],[" was made in the Saville Theatre, Shaftesbury Avenue, London which is now a multi-screen cinema.",false,false,null]]},{"level":2,"text":"\"We hope you have enjoyed the show...\"","anchor":"section-62"},{"para":[["!",false,false,null],["Sgt Pepper cover (ultimateclassicrock)",false,false,"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Sgt Pepper cover (ultimateclassicrock"],["__1494074357578.jpg)",false,false,null]]},{"para":[["Many thanks for following this Story Map!",false,false,null]]},{"level":2,"text":"\"We'd like to thank you once again.\"","anchor":"section-63"},{"para":[["!",false,false,null],["Sgt Pepper cover (ultimateclassicrock)",false,false,"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/Sgt Pepper cover (ultimateclassicrock"],["__1494074357578.jpg)",false,false,null]]},{"level":2,"text":"Sources & Credits","anchor":"section-64"},{"credits":[["Wikipedia: The Beatles","Wikipedia: The Beatles","https://en.wikipedia.org/wiki/The_Beatles"],["The Beatles - Alone: At the BBC","The Beatles - Alone: At the BBC (BBC Radio 2)","http://www.bbc.co.uk/programmes/b03m75x3"],["YouTube GB","YouTube GB","https://www.youtube.com/ <script id="story-nav" type="application/json">{"header_title":"A Story Map by BC","header_logo_url":"https://www.arcgis.com/sharing/rest/content/items/a4fdfbf9676d4534b62f737bc06e575d/resources/the-beatles-sgt-pepper-kicker-drum-logo-button-b2043%20button%20edit%203__1499450318410.png","bookmarks":[{"anchor":"top","label":"Intro"},{"anchor":"section-10","label":"Sgt P Side 1"},{"anchor":"section-24","label":"Sgt P Side 2"},{"anchor":"section-38","label":"1967 after Sgt P"}],"layout":"stacked"}</script>
<script>
const items = JSON.parse(document.getElementById('story-data').textContent);
const navConfig = JSON.parse(document.getElementById('story-nav').textContent);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderRuns(runs) {
  return runs.map(([text, bold, italic, href]) => {
    let t = esc(text);
    if (bold) t = `<b>${t}</b>`;
    if (italic) t = `<i>${t}</i>`;
    if (href) t = `<a href="${esc(href)}" target="_blank" rel="noopener">${t}</a>`;
    return t;
  }).join('');
}

function toEmbedUrl(url) {
  if (!url) return url;
  if (url.startsWith('//')) return 'https:' + url;
  return url;
}

function dimAttr(media) {
  // Reserves layout space using the image's original AGOL dimensions (when known), so the
  // browser doesn't reflow the page after images finish loading — which used to knock
  // scroll position (and bookmark-tab targets) out from under the reader.
  const w = media && media.width, h = media && media.height;
  return (w && h) ? ` width="${w}" height="${h}"` : '';
}

function sizeClass(media) {
  const s = (media && media.size) || 'large';
  return 'size-' + (['small', 'medium', 'large', 'full'].includes(s) ? s : 'large');
}
function mapHeightFor(media) {
  if (media && media.custom_height) return media.custom_height;
  const size = media && media.size;
  return ({ small: 280, medium: 400, large: 500, full: 640 })[size] || 400;
}

function renderMedia(media) {
  const wrap = document.createElement('div');

  if (media.kind && media.kind.startsWith('Background image')) {
    wrap.className = 'media ' + sizeClass(media);
    wrap.innerHTML = `<img src="${esc(toEmbedUrl(media.url))}"${dimAttr(media)} loading="lazy" alt="${esc(media.title||'')}">`
      + `<div class="media-caption">Scene image — ${esc(media.title||'')}</div>`;
    return wrap;
  }

  if (media.kind === 'Image') {
    wrap.className = 'media ' + sizeClass(media);
    wrap.innerHTML = `<img src="${esc(toEmbedUrl(media.url))}"${dimAttr(media)} loading="lazy" alt="${esc(media.title||'')}">`;
    if (media.caption) wrap.innerHTML += `<div class="media-caption">${esc(media.caption)}</div>`;
    return wrap;
  }

  if (media.kind === 'Image gallery') {
    wrap.className = 'media ' + sizeClass(media);
    const grid = document.createElement('div');
    grid.className = 'gallery';
    (media.gallery || []).forEach(g => {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = toEmbedUrl(g.url);
      img.alt = g.title || '';
      if (g.width && g.height) { img.width = g.width; img.height = g.height; }
      grid.appendChild(img);
    });
    wrap.appendChild(grid);
    if (media.caption) {
      const cap = document.createElement('div');
      cap.className = 'media-caption';
      cap.textContent = media.caption;
      wrap.appendChild(cap);
    }
    return wrap;
  }

  if (media.kind === 'Video' || media.kind === 'Video embed') {
    wrap.className = 'media ' + sizeClass(media);
    const src = toEmbedUrl(media.url);
    wrap.innerHTML = `<iframe src="${esc(src)}" height="${mapHeightFor(media)}" frameborder="0" `
      + `allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" `
      + `allowfullscreen loading="lazy"></iframe>`;
    let cap = media.title ? esc(media.title) : '';
    // Extract just the video ID before swapping in watch?v= — a naive string-replace left any
    // tracking/player query string (e.g. ?si=..., ?wmode=opaque&rel=0) stuck onto the ID, producing
    // a broken watch?v=ID?wmode=... link with two "?" in it.
    const embedMatch = media.url.match(/youtube\.com\/embed\/([^?&]+)/);
    const watchUrl = embedMatch
      ? `https://www.youtube.com/watch?v=${embedMatch[1]}`
      : media.url;
    cap += `${cap ? ' — ' : ''}<a href="${esc(watchUrl)}" target="_blank" rel="noopener">Open on YouTube ↗</a>`;
    wrap.innerHTML += `<div class="media-caption">${cap}</div>`;
    return wrap;
  }

  if (media.kind === 'Spotify embed') {
    wrap.className = 'media ' + sizeClass(media);
    wrap.innerHTML = `<iframe src="${esc(toEmbedUrl(media.url))}" height="80" frameborder="0" `
      + `allow="encrypted-media" loading="lazy"></iframe>`;
    let cap = media.title ? esc(media.title) : '';
    cap += `${cap ? ' — ' : ''}<a href="${esc(media.url)}" target="_blank" rel="noopener">Open on Spotify ↗</a>`;
    wrap.innerHTML += `<div class="media-caption">${cap}</div>`;
    return wrap;
  }

  if (media.kind && media.kind.startsWith('Interactive map')) {
    wrap.className = 'media ' + sizeClass(media);
    const mh = mapHeightFor(media);
    let embedSrc = '', label = '';
    if (media.custom_link_url) { embedSrc = media.custom_link_url; label = 'Custom map view'; }
    else if (media.webmap_id) {
      embedSrc = `https://www.arcgis.com/apps/Embed/index.html?webmap=${encodeURIComponent(media.webmap_id)}&zoom=true&scale=true&theme=light&disable_scroll=true`;
      if (media.extent_lonlat) embedSrc += `&extent=${media.extent_lonlat.join(',')}`;
      label = 'Live ArcGIS web map';
    }
    if (embedSrc) {
      // Click-to-load rather than embedding the iframe immediately: some map embeds (custom
      // GeoMapper/Gist links in particular) show their own blocking "loaded" dialog on mount —
      // with several such maps in one story that becomes unusable while editing. Not loading
      // until asked also means a genuinely lighter first paint for readers who skip a given map.
      const holder = document.createElement('div');
      holder.className = 'map-placeholder';
      holder.style.height = mh + 'px';
      holder.innerHTML = `<button class="map-load-btn" type="button">▶ Load interactive map</button>`;
      holder.querySelector('.map-load-btn').addEventListener('click', () => {
        // Tells the editor (if this page is embedded in one) that this specific map is now
        // loaded, by its position in the story — lets the editor silently reload it again after
        // its own refreshes, instead of every map you've already set up going back to a blank
        // "Load interactive map" button each time you edit something unrelated elsewhere.
        try { window.parent.postMessage({ type: 'sos-map-loaded', docIdx: wrap.dataset.docIdx }, '*'); } catch (e0) {}

        function buildIframe() {
          const f = document.createElement('iframe');
          f.src = embedSrc;
          f.height = mh;
          f.setAttribute('frameborder', '0');
          f.loading = 'lazy';
          return f;
        }

        // Listens for the embedded map's own "I'm ready" signal (bookmarks load asynchronously,
        // so this can't just fire immediately on iframe load) — see gm-ready / gm-loadBookmark in
        // Geo Mapper's own code. Always listens, not just when a bookmark name is already set:
        // this is also how the SOS editor discovers the map's actual bookmark names to offer as
        // a pick-list, rather than requiring anyone to type one by hand. Relayed one level up so
        // the editor (this iframe's own parent) can see it, since postMessage doesn't bubble.
        function wireGmReady(fr) {
          const onGmReady = (ev) => {
            if (ev.source !== fr.contentWindow) return;
            if (!ev.data || ev.data.type !== 'gm-ready') return;
            if (media.bookmark_name) {
              fr.contentWindow.postMessage({ type: 'gm-loadBookmark', name: media.bookmark_name }, '*');
            }
            try {
              window.parent.postMessage({ type: 'sos-gm-ready', docIdx: wrap.dataset.docIdx, bookmarkNames: ev.data.bookmarkNames || [] }, '*');
            } catch (e2) {}
            window.removeEventListener('message', onGmReady);
          };
          window.addEventListener('message', onGmReady);
        }

        let iframe = buildIframe();
        holder.replaceWith(iframe);
        wireGmReady(iframe);

        // Lets anyone reading the published story — not just the person editing it — expand a
        // map to fill the screen when a pop-up (or anything else) needs more room than whatever
        // fixed height was set for it, then collapse it back down again.
        wrap.style.position = 'relative';
        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'map-toggle-btn';
        toggleBtn.title = 'Maximise map';
        toggleBtn.innerHTML = '⛶';
        toggleBtn.addEventListener('click', () => {
          const maximized = wrap.classList.toggle('map-maximized');
          document.documentElement.classList.toggle('map-lock-scroll', maximized);
          toggleBtn.innerHTML = maximized ? '✕' : '⛶';
          toggleBtn.title = maximized ? 'Restore map size' : 'Maximise map';
        });
        wrap.appendChild(toggleBtn);

        // Locked-view behaviour, modelled on what Classic Cascade did: the map opens fixed to
        // the editor's chosen view, on a scroll-past page that's mostly text — without a lock,
        // an accidental wheel-scroll or drag over a full-width map changes ITS view instead of
        // scrolling the page, so the next reader (or the same reader scrolling back down) finds
        // it drifted away from the framing that was actually intended. This is enforced from
        // outside the map entirely (an overlay blocking interaction), the same way Cascade's own
        // app controlled it rather than the map's own bookmark data — so it works identically
        // regardless of what's embedded underneath.
        if (media.allow_explore === false) {
          // Editor has said this map should never be pannable/zoomable by readers at all.
          iframe.style.pointerEvents = 'none';
        } else {
          const lockOverlay = document.createElement('div');
          lockOverlay.className = 'map-lock-overlay';
          const exploreBtn = document.createElement('button');
          exploreBtn.type = 'button';
          exploreBtn.className = 'map-explore-btn';
          exploreBtn.textContent = '🔓 Explore this map';
          lockOverlay.appendChild(exploreBtn);
          wrap.appendChild(lockOverlay);
          let unlocked = false;
          // Only the button itself unlocks — the overlay still covers (and blocks) the whole
          // map underneath, but clicking anywhere else on it just absorbs the click and does
          // nothing, rather than treating a tap near one of the map's own icons as "unlock".
          exploreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            unlocked = true;
            lockOverlay.classList.add('is-hidden');
          });

          // Once scrolled mostly out of view after being explored, silently reload back to the
          // locked, editor-chosen view — so it's never left wherever a reader happened to leave
          // it. A fresh iframe load is what actually resets the view; it works for any embed
          // (Geo Mapper bookmark, ArcGIS custom link, or the generic fallback) without needing to
          // know anything about what's inside it.
          const io = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting && unlocked) {
                unlocked = false;
                lockOverlay.classList.remove('is-hidden');
                const fresh = buildIframe();
                iframe.replaceWith(fresh);
                iframe = fresh;
                wireGmReady(iframe);
              }
            });
          }, { threshold: 0 });
          io.observe(wrap);
        }
      });
      wrap.appendChild(holder);
      const cap = document.createElement('div');
      cap.className = 'media-caption';
      cap.innerHTML = `${label} — <a href="${esc(media.custom_link_url || media.url)}" target="_blank" rel="noopener">open full map ↗</a>`;
      wrap.appendChild(cap);
    } else {
      wrap.className = 'placeholder';
      wrap.innerHTML = `Interactive map — no embeddable ID found.<br><a href="${esc(media.url)}" target="_blank">${esc(media.title||media.url)}</a>`;
    }
    return wrap;
  }

  wrap.className = 'placeholder';
  wrap.innerHTML = `${esc(media.kind||'Media')}: <a href="${esc(media.url)}" target="_blank">${esc(media.title||media.url||'')}</a>`;
  return wrap;
}

const app = document.getElementById('app');

function buildNav() {
  if (!navConfig.bookmarks || !navConfig.bookmarks.length) return;
  const nav = document.createElement('div');
  nav.className = 'storynav';
  let brandHtml = '';
  if (navConfig.header_logo_url) brandHtml += `<img src="${esc(navConfig.header_logo_url)}" alt="">`;
  brandHtml += `<span>${esc(document.title)}</span>`;
  const tabsHtml = navConfig.bookmarks.map((b, i) =>
    `<a class="tab${i === 0 ? ' active' : ''}" data-anchor="${esc(b.anchor)}" href="#${esc(b.anchor)}">${esc(b.label)}</a>`
  ).join('');
  nav.innerHTML = `<div class="brand">${brandHtml}</div><div class="tabs">${tabsHtml}</div>`
    + (navConfig.header_title ? `<div class="credit">${esc(navConfig.header_title)}</div>` : '');
  app.appendChild(nav);

  // Measure the real, rendered nav height (varies by theme/font/logo) instead of guessing a
  // fixed pixel offset — used both to keep clicked headings from landing hidden behind the
  // sticky bar (via scroll-margin-top) and to keep the scroll-spy active-tab detection in sync.
  const navH = nav.offsetHeight || 76;
  document.documentElement.style.setProperty('--nav-h', navH + 'px');

  nav.querySelectorAll('a.tab').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(a.dataset.anchor);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  window.addEventListener('scroll', () => {
    const anchors = navConfig.bookmarks.map(b => document.getElementById(b.anchor)).filter(Boolean);
    let current = anchors[0];
    for (const el of anchors) {
      if (el.getBoundingClientRect().top - navH - 4 <= 0) current = el;
    }
    nav.querySelectorAll('a.tab').forEach(a => {
      a.classList.toggle('active', current && a.dataset.anchor === current.id);
    });
  }, { passive: true });
}

let idx = 0;
if (items[0] && items[0].level === 1) {
  const cover = document.createElement('div');
  cover.className = 'cover';
  if (navConfig.cover_text === 'dark') cover.classList.add('cover-text-dark');
  if (navConfig.cover_box === 'light') cover.classList.add('cover-box-light');
  else if (navConfig.cover_box === 'dark') cover.classList.add('cover-box-dark');
  cover.id = 'top';
  cover.dataset.docIdx = 'cover';
  let bgUrl = '', bgMedia = null;
  let subtitle = '';
  for (let i = 1; i < Math.min(items.length, 4); i++) {
    if (items[i].media && items[i].media.kind === 'Background image (cover)') { bgUrl = toEmbedUrl(items[i].media.url); bgMedia = items[i].media; }
    if (items[i].para && !subtitle) subtitle = renderRuns(items[i].para);
  }
  if (bgUrl) {
    cover.style.backgroundImage = `url('${bgUrl}')`;
    // The author's real focal point from Cascade, when known — otherwise fall back to a plain
    // centred crop rather than guessing.
    if (bgMedia && typeof bgMedia.focal_x === 'number' && typeof bgMedia.focal_y === 'number') {
      cover.style.backgroundPosition = `${(bgMedia.focal_x * 100).toFixed(1)}% ${(bgMedia.focal_y * 100).toFixed(1)}%`;
    }
    if (bgMedia && bgMedia.fit_color) cover.style.backgroundColor = bgMedia.fit_color;
  }
  cover.innerHTML = `<div class="cover-text"><h1>${esc(items[0].text)}</h1><div class="subtitle">${subtitle}</div></div>`;
  app.appendChild(cover);
  idx = 1;
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.media.map-maximized').forEach(el => {
    el.classList.remove('map-maximized');
    const btn = el.querySelector('.map-toggle-btn');
    if (btn) { btn.innerHTML = '⛶'; btn.title = 'Maximise map'; }
  });
  document.documentElement.classList.remove('map-lock-scroll');
});

buildNav();

const main = document.createElement('main');
app.appendChild(main);

function renderSectionBanner(headingItem, mediaItem, headingIdx) {
  const m = mediaItem.media;
  const div = document.createElement('div');
  div.className = 'section-banner';
  div.dataset.docIdx = headingIdx;
  const bgUrl = toEmbedUrl(m.url);
  if (bgUrl) div.style.backgroundImage = `url('${bgUrl}')`;
  if (typeof m.focal_x === 'number' && typeof m.focal_y === 'number') {
    div.style.backgroundPosition = `${(m.focal_x * 100).toFixed(1)}% ${(m.focal_y * 100).toFixed(1)}%`;
  }
  if (m.fit_color) div.style.backgroundColor = m.fit_color;
  div.style.minHeight = (m.banner_height_px || 340) + 'px';
  const textWrap = document.createElement('div');
  textWrap.className = 'section-banner-text';
  const h = document.createElement(headingItem.level === 2 ? 'h2' : 'h3');
  h.textContent = headingItem.text;
  if (headingItem.anchor) h.id = headingItem.anchor;
  textWrap.appendChild(h);
  div.appendChild(textWrap);
  return div;
}

function renderStackedLayout(startIdx) {
  for (let idx = startIdx; idx < items.length; idx++) {
    const item = items[idx];

    if (item.level === 1) continue;
    if (item.media && item.media.kind === 'Background image (cover)') continue;
    if (idx <= 2 && item.para) continue;

    // "Leitmotif" section banners: a heading with its own themed background image behind it,
    // opted into per-image (not automatic) — mirrors the cover's own treatment, just scoped to
    // one section rather than the whole story. Only kicks in when the very next item is an image
    // explicitly marked for this.
    if (item.level !== undefined && items[idx + 1] && items[idx + 1].media && items[idx + 1].media.use_as_banner) {
      main.appendChild(renderSectionBanner(item, items[idx + 1], idx));
      idx++; // this consumed the following image item too
      continue;
    }

    if (item.level !== undefined) {
      const h = document.createElement(item.level === 2 ? 'h2' : 'h3');
      h.textContent = item.text;
      if (item.anchor) h.id = item.anchor;
      h.dataset.docIdx = idx;
      main.appendChild(h);
    } else if (item.para) {
      const p = document.createElement('p');
      p.innerHTML = renderRuns(item.para);
      p.dataset.docIdx = idx;
      main.appendChild(p);
    } else if (item.media) {
      const m = renderMedia(item.media);
      m.dataset.docIdx = idx;
      main.appendChild(m);
    } else if (item.credits) {
      const box = document.createElement('div');
      box.className = 'credits';
      box.dataset.docIdx = idx;
      item.credits.forEach(([label, source, link]) => {
        const e = document.createElement('div');
        e.className = 'entry';
        e.innerHTML = `<b>${esc(label)}</b>${source ? ' — ' + esc(source) : ''}` +
          (link ? `<br><a href="${esc(link)}" target="_blank">${esc(link)}</a>` : '');
        box.appendChild(e);
      });
      main.appendChild(box);
    }
  }
}

/* ==================== side-panel layout (Journal-style scroll sync) ====================
   Groups the flat items[] into panels (one per heading, plus a leading intro panel for
   anything before the first heading). Each panel's FIRST media item becomes its "panel media" —
   shown in the sticky left column while that panel is in view — exactly mirroring how the
   original Journal always paired one section with one persistent side-panel visual. Any
   additional media in the same panel stays in the scrolling text column instead of being
   dropped, the same "preserve everything, degrade honestly" approach used throughout this
   toolkit rather than silently discarding a second image a section happened to have. */

function groupIntoPanels(startIdx) {
  const panels = [];
  let current = { heading: null, anchor: null, media: null, body: [] };
  let hasContent = false;

  function pushCurrentIfNonEmpty() {
    if (hasContent) panels.push(current);
  }

  for (let idx = startIdx; idx < items.length; idx++) {
    const item = items[idx];
    if (item.level === 1) continue; // cover title, already rendered separately
    if (item.media && item.media.kind === 'Background image (cover)') continue;
    if (idx <= 2 && item.para) continue; // cover subtitle, already rendered on the cover

    if (item.level !== undefined) {
      pushCurrentIfNonEmpty();
      current = { heading: item.text, anchor: item.anchor || null, media: null, body: [] };
      hasContent = true;
      continue;
    }

    hasContent = true;
    if (item.media && !current.media) {
      current.media = item.media; // first media in this panel -> the panel's fixed visual
    } else {
      current.body.push(item); // everything else (including any 2nd+ media) stays in the text flow
    }
  }
  pushCurrentIfNonEmpty();
  return panels;
}

function renderPanelBody(panel, panelIdx) {
  const section = document.createElement('section');
  section.className = 'sidepanel-panel';
  section.dataset.panelIdx = panelIdx;
  if (panel.heading) {
    const h = document.createElement('h2');
    h.textContent = panel.heading;
    if (panel.anchor) h.id = panel.anchor;
    section.appendChild(h);
  }
  panel.body.forEach(item => {
    if (item.para) {
      const p = document.createElement('p');
      p.innerHTML = renderRuns(item.para);
      section.appendChild(p);
    } else if (item.media) {
      section.appendChild(renderMedia(item.media));
    } else if (item.credits) {
      const box = document.createElement('div');
      box.className = 'credits';
      item.credits.forEach(([label, source, link]) => {
        const e = document.createElement('div');
        e.className = 'entry';
        e.innerHTML = `<b>${esc(label)}</b>${source ? ' — ' + esc(source) : ''}` +
          (link ? `<br><a href="${esc(link)}" target="_blank">${esc(link)}</a>` : '');
        box.appendChild(e);
      });
      section.appendChild(box);
    }
  });
  return section;
}

function renderSidePanelLayout(startIdx) {
  const panels = groupIntoPanels(startIdx);
  if (!panels.length) return; // nothing to show in this mode -- leave main empty rather than error

  const layout = document.createElement('div');
  layout.className = 'sidepanel-layout';
  const mediaCol = document.createElement('div');
  mediaCol.className = 'sidepanel-media';
  mediaCol.id = 'sidepanelMedia';
  const textCol = document.createElement('div');
  textCol.className = 'sidepanel-text';

  panels.forEach((panel, i) => textCol.appendChild(renderPanelBody(panel, i)));

  layout.appendChild(mediaCol);
  layout.appendChild(textCol);
  const breakout = document.createElement('div');
  breakout.className = 'sidepanel-breakout';
  breakout.appendChild(layout);
  main.appendChild(breakout);

  // Lazily rendered per panel, the first time it's actually needed -- not upfront for all
  // panels, which matters a lot for a story with a dozen map embeds: each map only actually
  // loads once the reader has scrolled to the section it belongs to, same click-to-load spirit
  // the rest of this template already uses for maps, just triggered by scroll instead of a click.
  const renderedMediaCache = {};
  let activePanelIdx = -1;

  function showPanelMedia(panelIdx) {
    if (panelIdx === activePanelIdx) return;
    const panel = panels[panelIdx];
    if (!panel.media) return; // no fresh visual for this panel -- keep showing whatever's already there
    activePanelIdx = panelIdx;
    const swap = () => {
      mediaCol.innerHTML = '';
      if (!renderedMediaCache[panelIdx]) renderedMediaCache[panelIdx] = renderMedia(panel.media);
      mediaCol.appendChild(renderedMediaCache[panelIdx]);
      mediaCol.classList.remove('is-swapping');
    };
    if (mediaCol.childElementCount === 0) {
      swap(); // first paint -- no fade needed, nothing to fade from
    } else {
      mediaCol.classList.add('is-swapping');
      setTimeout(swap, 220);
    }
  }

  // Panel 0 shown immediately, synchronously, so there's no blank/empty left column on first
  // paint while waiting for the reader to scroll or for the observer to fire.
  showPanelMedia(0);

  // A panel becomes "active" when it's crossing roughly the vertical middle of the viewport --
  // a wide (-45%/-45%) band rather than a hard line, so ordinary scroll jitter near a panel
  // boundary doesn't cause the image to flicker back and forth between two panels.
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) showPanelMedia(Number(entry.target.dataset.panelIdx));
      });
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
    textCol.querySelectorAll('.sidepanel-panel').forEach(el => observer.observe(el));
  }
  // No IntersectionObserver support: panel 0's media (already shown above) simply stays fixed
  // for the whole story rather than swapping -- a plain, working fallback, not a broken one.
}

if (navConfig.layout === 'sidepanel') {
  renderSidePanelLayout(idx);
} else {
  renderStackedLayout(idx);
}
</script>
</body>
</html>
