<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geo Mapper 3D v2.30</title>

    <!-- Cesium -->
    <script>window.CESIUM_BASE_URL = 'https://unpkg.com/cesium@1.114.0/Build/Cesium/';</script>
    <script src="https://unpkg.com/cesium@1.114.0/Build/Cesium/Cesium.js"
            onerror="document.addEventListener('DOMContentLoaded',function(){var d=document.getElementById('diagnosticOutput');if(d)d.innerHTML='<span style=color:red>[ERROR] Cesium.js failed to load from CDN — check internet connection</span>';})"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.114/Build/Cesium/Widgets/widgets.css" rel="stylesheet">

    <!-- PapaParse for CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.5.0/lz-string.min.js"></script>

    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --sidebar-w: 300px;
            --sidebar-bg: #f0f2f7;
            --sidebar-border: #c8cdd8;
            --accent: #4a6fa5;
            --accent2: #5b4ba0;
            --text: #1a1d2e;
            --text-soft: #5a6070;
            --input-bg: #ffffff;
        }

        html, body { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

        /* ── Layout ───────────────────────────────────────── */
        /* ── Layout ───────────────────────────────────────── */
        /* OVERLAY SIDEBAR: cesiumContainer is always full-viewport and NEVER
           changes size. Sidebar floats on top as a fixed overlay. This is the
           only architecture that avoids Cesium's ResizeObserver white-screen bug,
           which fires whenever cesiumContainer's left/width changes. */
        #app { width: 100%; height: 100%; }

        #cesiumContainer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            /* No z-index — creating a stacking context breaks Cesium internal z-ordering */
            pointer-events: none; /* block all children by default; restored surgically via JS */
        }

        /* ── Sidebar ──────────────────────────────────────── */
        #sidebar {
            position: fixed;
            top: 0; left: 0;
            width: var(--sidebar-w);
            height: 100%;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--sidebar-border);
            display: flex;
            flex-direction: column;
            overflow: visible; /* allow eyeBtn to hang outside right edge */
            z-index: 200;        /* above cesiumContainer stacking context */
            /* No transition, no transform — both promote GPU compositing layer, blank WebGL */
        }

        #sidebar.collapsed {
            left: calc(-1 * var(--sidebar-w));  /* offset left, no compositing layer change */
            pointer-events: none;
        }

        #sidebarInner {
            width: var(--sidebar-w);
            height: 100%;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Sidebar header ───────────────────────────────── */
        .sidebar-header {
            padding: 1rem 1rem 0.75rem;
            border-bottom: 1px solid var(--sidebar-border);
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .sidebar-header h1 span.version {
            font-size: 0.65rem;
            color: var(--text-soft);
            font-weight: 400;
            background: var(--input-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 3px;
            padding: 1px 5px;
            letter-spacing: 0.02em;
        }

        /* ── Sidebar scroll area ──────────────────────────── */
        #sidebarScroll {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            padding: 0.75rem 0;
        }

        #sidebarScroll::-webkit-scrollbar { width: 4px; }
        #sidebarScroll::-webkit-scrollbar-track { background: transparent; }
        #sidebarScroll::-webkit-scrollbar-thumb { background: var(--sidebar-border); border-radius: 2px; }

        /* ── Sections ─────────────────────────────────────── */
        .section {
            margin-bottom: 0.25rem;
        }

        .section-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.55rem 1rem;
            cursor: pointer;
            color: #3a4a5a;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: none;
            letter-spacing: 0.02em;
            user-select: none;
            transition: color 0.12s;
        }

        .section-header:hover { color: #1a1d2e; font-weight: 700; }

        .section-header .chevron {
            margin-right: 0.35rem;
            font-size: 0.65rem;
            transition: transform 0.2s;
            flex-shrink: 0;
            order: -1;   /* always first child visually */
        }

        .section-header.open .chevron { transform: rotate(90deg); }

        .section-body {
            padding: 0 1rem 0.75rem;
            display: none;
        }

        .section-body.open { display: block; }

        /* ── Form elements ────────────────────────────────── */
        .form-group { margin-bottom: 0.75rem; }

        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-soft);
            margin-bottom: 0.3rem;
        }

        .form-group select,
        .form-group input[type="number"],
        .form-group input[type="text"] {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            color: var(--text);
            padding: 0.4rem 0.6rem;
            font-size: 0.82rem;
            outline: none;
            transition: border-color 0.15s;
        }

        .form-group select:focus,
        .form-group input:focus { border-color: var(--accent); }

        .form-group select option { background: var(--input-bg); }

        .color-size-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        input[type="color"] {
            width: 100%;
            height: 32px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 4px;
            cursor: pointer;
            padding: 2px;
        }

        /* ── Buttons ──────────────────────────────────────── */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.5rem 1rem;
            border-radius: 5px;
            border: none;
            cursor: pointer;
            font-size: 0.82rem;
            font-weight: 600;
            transition: all 0.2s;
            width: 100%;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            color: white;
            box-shadow: 0 2px 8px rgba(102,126,234,0.35);
        }

        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-primary:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .btn-secondary {
            background: var(--input-bg);
            color: var(--text);
            border: 1px solid var(--input-border);
        }

        .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }

        /* ── Upload zone ──────────────────────────────────── */
        #uploadZone {
            border: 2px dashed #7bb3e0;
            border-radius: 8px;
            padding: 1.4rem 0.75rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0.75rem;
            background: #edf5fc;
        }

        #uploadZone:hover, #uploadZone.drag-over {
            border-color: var(--accent);
            background: #ddeefa;
        }

        #uploadZone .upload-icon { font-size: 2rem; margin-bottom: 0.35rem; }
        #uploadZone .upload-main { font-size: 0.85rem; font-weight: 700; color: #1a1d2e; margin-bottom: 0.15rem; }
        #uploadZone .upload-sub  { font-size: 0.76rem; color: var(--text-soft); }

        #fileInput { display: none; }

        /* ── Status bar ───────────────────────────────────── */
        #statusBar {
            padding: 0.5rem 1rem;
            font-size: 0.75rem;
            color: var(--text-soft);
            border-top: 1px solid var(--sidebar-border);
            flex-shrink: 0;
            min-height: 2rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        #statusBar .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-soft);
            flex-shrink: 0;
        }

        #statusBar.ready .status-dot { background: var(--success); }
        #statusBar.loading .status-dot { background: var(--warning); animation: pulse 1s infinite; }
        #statusBar.error .status-dot { background: var(--danger); }

        @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

        /* ── Floating toggle buttons ──────────────────────── */
        #legendBtn {
            position: fixed;
            top: 0.75rem;
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* eyeBtn is a fixed element, independent of the sidebar.
           Its left position tracks the sidebar open/closed state via a CSS class. */
        #eyeBtn {
            position: fixed;
            top: 0.75rem;
            left: calc(var(--sidebar-w) + 8px);  /* sidebar open: just to the right of it */
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #2c3a52;
            color: #e8eaf0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            pointer-events: auto;
            z-index: 500;          /* above sidebar (200) and cesiumContainer */
        }

        #eyeBtn.sidebar-collapsed {
            left: 8px;             /* sidebar collapsed: near left edge of screen */
        }

        #eyeBtn.panel-open {
            background: var(--accent);
        }

        #legendBtn {
            right: 0.75rem;
            background: #2c3a52;
            color: #e8eaf0;
        }

        #legendBtn.panel-open { background: var(--accent); }

        #eyeBtn:hover, #legendBtn:hover { transform: scale(1.08); }

        /* ── Compass ──────────────────────────────────────── */
        #compassBtn {
            position: fixed;
            bottom: 3rem;
            right: 0.75rem;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            background: var(--sidebar-bg);
            cursor: pointer;
            z-index: 200;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s;
        }
        #compassBtn:hover { background: var(--section-bg); }
        #compassBtn svg { transition: transform 0.4s ease; }

        /* ── Search ───────────────────────────────────────── */
        #searchBtn {
            position: fixed;
            top: 0.75rem;
            right: 4.5rem;        /* sits left of the legend button (0.75rem + 48px + 0.25rem gap) */
            width: 48px;
            height: 48px;
            border-radius: 8px;
            border: none;
            background: var(--sidebar-bg);
            color: var(--text);
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 500;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
            pointer-events: auto;
        }
        #searchBtn:hover, #searchBtn.active { background: var(--accent); color: #fff; }

        #searchPanel {
            position: fixed;
            top: 3.8rem;          /* below button row, matching legend panel */
            right: 4.5rem;        /* aligned under the search button */
            width: 280px;
            background: var(--sidebar-bg);
            border: 1px solid var(--sidebar-border);
            border-radius: 8px;
            padding: 0.75rem;
            z-index: 200;
            box-shadow: 0 4px 16px rgba(0,0,0,0.5);
            display: none;
        }
        #searchPanel.open { display: block; }
        #searchRow { display: flex; gap: 0.5rem; }
        #searchInput {
            flex: 1;
            background: var(--section-bg);
            border: 1px solid var(--sidebar-border);
            color: var(--text);
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            font-size: 0.85rem;
        }
        #searchInput::placeholder { color: var(--text-soft); }
        #searchGo {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 4px;
            padding: 0.4rem 0.75rem;
            cursor: pointer;
            font-size: 0.85rem;
        }
        #searchResults { margin-top: 0.5rem; max-height: 220px; overflow-y: auto; }
        .search-result {
            padding: 0.4rem 0.5rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--text);
            border-bottom: 1px solid var(--sidebar-border);
        }
        .search-result:hover { background: var(--section-bg); }
        .search-result:last-child { border-bottom: none; }

        /* ── Navigation buttons (mobile/mouseless) ────────── */
        #navControls {
            position: fixed;
            bottom: 6.5rem;   /* sits below the compass button */
            right: 0.75rem;
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            z-index: 200;
        }
        /* Hide nav arrows on touch-only devices — Cesium handles pinch/drag natively */
        @media (hover: none) and (pointer: coarse) {
            #navControls { display: none; }
        }
        #navControls .nav-row {
            display: flex;
            gap: 0.25rem;
            justify-content: center;
        }
        .nav-btn {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.15);
            background: var(--sidebar-bg);
            color: var(--text);
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        .nav-btn:active { background: var(--accent); transform: scale(0.95); }

        /* ── Map title overlay ─────────────────────────────── */
        #mapTitleOverlay {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.95);
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.18);
            z-index: 200;
            font-size: 1.2rem;
            font-weight: 600;
            color: #2c3e50;
            max-width: min(80%, calc(100vw - 340px));
            text-align: center;
            cursor: grab;
            user-select: none;
            display: none;
            overflow-wrap: break-word;
            word-break: break-word;
            white-space: normal;
            box-sizing: border-box;
        }
        #mapTitleOverlay:hover { box-shadow: 0 3px 12px rgba(0,0,0,0.28); }

        /* Immediately hide editor-only sections in view-only mode — applied before paint */
        .view-only-early [data-vo-hide="1"] { display: none !important; }
        #mapTitleOverlay.dragging { opacity: 0.85; box-shadow: 0 6px 20px rgba(0,0,0,0.3); cursor: grabbing; }

        /* ── Icon Library Picker ─────────────────────────── */
        #libraryIconPicker { font-family: inherit; }
        .lib-picker-panel {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: #fff; border-radius: 10px;
            width: 560px; max-width: 95vw; max-height: 80vh;
            display: flex; flex-direction: column; overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.35);
        }
        .lib-picker-header {
            display: flex; align-items: center; gap: 0.75rem;
            padding: 0.75rem 1rem; border-bottom: 1px solid #e0e0e0; flex-shrink: 0;
        }
        .lib-picker-search {
            flex: 1; padding: 0.3rem 0.75rem;
            border: 1px solid #ccc; border-radius: 20px; font-size: 0.85rem; outline: none;
        }
        .lib-picker-search:focus { border-color: var(--accent); }
        .lib-picker-grid { flex: 1; overflow-y: auto; padding: 0.65rem 0.9rem; }
        .lib-picker-group-title {
            font-size: 0.68rem; font-weight: 700; color: var(--accent);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin: 0.2rem 0 0.35rem; padding-bottom: 0.2rem; border-bottom: 1px solid #eee;
        }
        .lib-picker-row {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(68px, 1fr));
            gap: 0.25rem; margin-bottom: 0.6rem;
        }
        .lib-icon-thumb {
            display: flex; flex-direction: column; align-items: center; gap: 0.15rem;
            padding: 0.35rem 0.15rem; border-radius: 5px; cursor: pointer;
            border: 2px solid transparent; transition: background 0.12s, border-color 0.12s;
        }
        .lib-icon-thumb:hover { background: #f0f4ff; border-color: var(--accent); }
        .lib-icon-thumb.lib-selected { background: #e4edff; border-color: #3b5bdb; }
        .lib-icon-img { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
        .lib-icon-label { font-size: 0.56rem; color: #555; line-height: 1.2; text-align: center; max-width: 64px; word-break: break-word; }
        .lib-picker-footer { padding: 0.45rem 1rem; border-top: 1px solid #eee; font-size: 0.68rem; color: #999; flex-shrink: 0; }
        .lib-icon-current { display: flex; align-items: center; gap: 0.5rem; padding: 0.35rem 0.55rem; background: #f5f6f8; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 0.4rem; }
        /* Custom icon upload zone */
        .custom-icon-drop { border: 2px dashed #7bb3e0; border-radius: 6px; padding: 0.9rem; text-align: center; cursor: pointer; background: #edf5fc; transition: all 0.2s; margin-bottom: 0.4rem; }
        .custom-icon-drop:hover { border-color: var(--accent); background: #ddeefa; }

        /* ── Bookmark tab bar ─────────────────────────────── */
        #bookmarkTabBar {
            position: fixed;
            bottom: 0;
            top: auto;
            left: 0;
            right: var(--sidebar-w, 320px);
            height: 32px;
            display: none;
            align-items: stretch;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            background: rgba(12,14,18,0.82);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 300;
            pointer-events: auto;
            gap: 1px;
        }
        #bookmarkTabBar.bm-top { bottom: auto; top: 0; border-top: none; border-bottom: 1px solid rgba(255,255,255,0.08); }
        #bookmarkTabBar::-webkit-scrollbar { display: none; }
        /* Overflow scroll indicators */
        #bmTabMore, #bmTabMoreLeft {
            position: fixed;
            bottom: 0;
            width: 36px;
            height: 32px;
            display: none;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,0.85);
            font-size: 1rem;
            font-weight: 700;
            z-index: 301;
            cursor: pointer;
            pointer-events: auto;
            user-select: none;
            transition: opacity 0.2s;
        }
        #bmTabMore {
            right: 0;
            background: linear-gradient(to right, transparent, rgba(12,14,18,0.92) 40%);
        }
        #bmTabMoreLeft {
            left: 0;
            background: linear-gradient(to left, transparent, rgba(12,14,18,0.92) 40%);
        }
        #bmTabMore.bm-top, #bmTabMoreLeft.bm-top { bottom: auto; top: 0; }
        #bmTabMore:hover, #bmTabMoreLeft:hover { color: #fff; }
        .bm-tab {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 0 12px;
            font-size: 0.72rem;
            font-weight: 600;
            white-space: nowrap;
            cursor: pointer;
            color: rgba(255,255,255,0.75);
            background: rgba(255,255,255,0.04);
            border: none;
            border-right: 1px solid rgba(255,255,255,0.07);
            transition: background 0.15s, color 0.15s;
            flex-shrink: 0;
            height: 100%;
            letter-spacing: 0.01em;
        }
        .bm-tab:hover { background: rgba(255,255,255,0.10); color: #fff; }
        .bm-tab.active { background: rgba(243,156,18,0.18); color: #f39c12; border-bottom: 2px solid #f39c12; }
        #bookmarkTabBar.bm-top .bm-tab.active { border-bottom: none; border-top: 2px solid #f39c12; }
        .bm-tab .bm-filter-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: currentColor;
            flex-shrink: 0;
            opacity: 0.75;
        }
        .bm-card { background: var(--input-bg); border: 1px solid var(--sidebar-border); border-radius: 5px; padding: 0.35rem 0.5rem; }
        .bm-card-row { display: flex; align-items: center; gap: 0.25rem; }
        .bm-reorder-btn { background: none; border: none; color: var(--text-soft); cursor: pointer; font-size: 0.6rem; padding: 1px 4px; line-height: 1.2; border-radius: 2px; }
        .bm-reorder-btn:hover:not(:disabled) { background: var(--sidebar-border); color: var(--text); }
        .bm-reorder-btn:disabled { opacity: 0.2; cursor: default; }
        .bm-action-btn { background: none; border: none; cursor: pointer; font-size: 0.82rem; padding: 2px 4px; border-radius: 2px; flex-shrink: 0; color: var(--text-soft); }
        .bm-action-btn:hover { background: var(--sidebar-border); color: var(--text); }
        /* Map Tools cards */
        .mt-card { background: var(--input-bg); border: 1px solid var(--sidebar-border); border-radius:6px; padding:0.6rem 0.65rem; }
        .mt-title { font-weight:600; font-size:0.82rem; margin-bottom:0.3rem; }

        /* ── Tab-bar-at-top layout shift ────────────────────── */
        body.bm-tabs-top #sidebar            { top: 32px; }
        body.bm-tabs-top #legendBtn          { top: calc(0.75rem + 32px); }
        body.bm-tabs-top #legendPanel        { top: calc(3.8rem + 32px); }

        /* ── Legend panel ─────────────────────────────────── */
        #legendPanel {
            position: fixed;
            top: 3.8rem;          /* below the button row, not overlapping search button */
            right: 0.75rem;
            width: 220px;
            background: rgba(240,242,247,0.97);
            border: 1px solid var(--sidebar-border);
            border-radius: 8px;
            padding: 0.85rem;
            z-index: 150;
            display: none;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        #legendPanel.open { display: block; }

        #legendPanel h3 {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-soft);
            text-transform: none;
            letter-spacing: 0.02em;
            margin-bottom: 0.6rem;
        }
