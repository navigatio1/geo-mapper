  .cover.cover-box-dark:not(.cover-text-dark) h1, .cover.cover-box-dark:not(.cover-text-dark) .subtitle {

  main { max-width: 720px; margin: 0 auto; padding: 40px 24px 100px; }

  .section-banner {

  /* ---------- side-panel layout (Journal-style scroll sync) ---------- */
  /* Media stays fixed in a left column while the reader scrolls a right-hand text column past
     it; the media swaps to match whichever panel is currently in view. This is a genuinely
     different reading pattern from the rest of this template (which is single-column, top to
     bottom) — eye-tracking research on this exact layout (visual left, text right) is why it's
     offered as an option rather than a replacement for the default. */
  /* Breaks the whole two-column layout out of <main>'s own max-width:720px box (sized for
     comfortable single-column reading, and otherwise applying regardless of what's inside it) so
     it sizes against the real viewport instead — same full-bleed technique already used by
     .section-banner elsewhere in this template. Two elements are needed: the outer one does the
     breakout itself, uncapped; the inner one then re-applies a sane 1400px cap so it doesn't
     stretch edge-to-edge on an ultra-wide monitor. Combining both jobs into a single element
     doesn't work: width:100vw and max-width together would leave the negative breakout margins
     computed against the wrong (uncapped) width once the cap actually kicks in, pulling the
     whole thing off-centre exactly on the wide screens the cap exists for. */
  .sidepanel-breakout { width: 100vw; margin-left: calc(50% - 50vw); margin-right: calc(50% - 50vw); }
  .sidepanel-layout { display: flex; align-items: flex-start; gap: 0; max-width: 1400px; margin: 0 auto; }
  .sidepanel-media {
    position: sticky; top: var(--nav-h);
    width: 62%; flex-shrink: 0;
    height: calc(100vh - var(--nav-h));
    background: var(--media-bg);
    overflow: hidden;
    transition: opacity 0.22s ease;
  }
  .sidepanel-media > * { height: 100%; margin: 0 !important; border-radius: 0 !important; }
  .sidepanel-media .media { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  /* contain, not cover: a landscape photo in this tall, narrow column would otherwise have its
     left/right edges cropped away to fill the full height. Showing the whole image letterboxed
     (against --media-bg, the same fill colour already used elsewhere for "image doesn't perfectly
     fill its frame") loses some vertical fill but never crops content out of view. */
  .sidepanel-media .media img { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; flex: 0 0 auto; }
  .sidepanel-media .media iframe {
    width: 100%; max-height: 100%; border: 0;
    /* No stretching -- unlike an <img>, an iframe has no intrinsic aspect ratio and no
       object-fit equivalent, so forcing it to fill the column's full height (as an earlier
       version of this rule did) just squashes a normally landscape-shaped map or video into a
       tall, narrow box with no aspect protection at all. Leaving its own height alone (already
       set sensibly elsewhere, e.g. via the map height presets) and centring it, the same way an
       image already centres via object-fit, keeps it at a natural, comfortable shape instead. */
  }
  .sidepanel-media .media .map-placeholder { max-height: 100%; }
  .sidepanel-media.is-swapping { opacity: 0; }
  .sidepanel-text { flex: 1; min-width: 0; padding: 40px clamp(24px, 4vw, 64px); }
  .sidepanel-panel { padding-bottom: 64px; }
  .sidepanel-panel:last-child { padding-bottom: 100px; }
  .sidepanel-panel h2, .sidepanel-panel h3 { margin-top: 0; }
  .sidepanel-panel .media { max-width: none; } /* extra (non-primary) media in a panel's own text column */

  @media (prefers-reduced-motion: reduce) {
    .sidepanel-media { transition: none; }
  }

  /* Below this width there isn't room for a genuine side-by-side split, so the panel media
     collapses to a single strip that sits above the (now full-width) scrolling text, rather
     than trying to force two narrow columns. It still updates as you scroll past each panel —
     just above the text instead of beside it, since sticky-beside-narrow-text doesn't work. */
  @media (max-width: 880px) {
    .sidepanel-layout { flex-direction: column; }
    .sidepanel-media { position: static; width: 100%; height: 45vh; }
    .sidepanel-text { padding: 24px 20px; }
  }
</style>

},{"media":{"kind":"Image","title":"Typhoon Haiyan Nov 2013 OverPhilippines Funktop w lat long (ft_lalo-animated)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Typhoon%20Haiyan%20Nov%202013%20OverPhilippines%20Funktop%20w%20lat%20long%20%28ft_lalo-animated%29__1490002282542.gif","size":"large"}},{"para":[["Tropical storms (tropical cyclones) form in low latitudes, between 5° and 20° north or south of the Equator.",false,false,null]]},{"media":{"kind":"Image","title":"tropical_cyclone_map_lrg","caption":"Source: NASA Earth Observatory","url":"https://eoimages.gsfc.nasa.gov/images/imagerecords/7000/7079/tropical_cyclone_map_lrg.gif","size":"large"}},{"para":[["Having formed, tropical storms normally start to travel in a westerly direction, moving gradually further away from the equator.  If a tropical storm lasts long enough, towards the end of its life cycle it may change direction and move eastward.",false,false,null]]},{"para":[["Typhoon Haiyan started as a typical tropical storm, forming between 6° and 7° north of the equator in the Western Pacific near the Federated States of Micronesia.",false,false,null]]},{"level":2,"text":"Where did Typhoon Haiyan happen?","anchor":"section-1"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: ba1c1be38aea40f885271b66a5b340e2","caption":"","webmap_id":"ba1c1be38aea40f885271b66a5b340e2","size":"large","url":"https://www.arcgis.com/home/item.html?id=ba1c1be38aea40f885271b66a5b340e2","extent_lonlat":[84.9184,-9.5214,186.3441,33.8825],"extent_key":"84.9184,-9.5214,186.3441,33.8825"}},{"para":[["Typhoon Haiyan formed between 6° and 7° north of the equator in the Western Pacific near the Federated States of Micronesia.",false,false,null]]},{"para":[["It was 'born' over warm waters of the Western Pacific.",false,false,null]]},{"para":[["The developing storm then tracked west and west-north west towards the Philippines, growing in intensity to become a category 5 'super typhoon'.",false,false,null]]},{"para":[["By the time Typhoon Haiyan reached east coast of the Philippines it produced sustained winds of 315 km/h or 195 mi/h winds at landfall, the highest ever recorded.",false,false,null]]},{"para":[["Later, the typhoon tracked north-west over the South China Sea and began to weaken.",false,false,null]]},{"para":[["It eventually moved over the land mass of SE Asia in Vietnam and China, tracking north-north-east and ",false,false,null],["dissipated",true,false,null],[" as it lost energy.",false,false,null]]},{"level":2,"text":"Philippines: Key geographical features","anchor":"section-2"},{"media":{"kind":"Image","title":"1280px-Flag_of_the_Philippines.svg","caption":"","url":"https://upload.wikimedia.org/wikipedia/commons/thumb/9/99/Flag_of_the_Philippines.svg/1280px-Flag_of_the_Philippines.svg.png","size":"large"}},{"para":[["The Philippines is located in South-East Asia.  It is an ",false,false,null],["archipelago",false,false,"https://en.wikipedia.org/wiki/Geography_of_the_Philippines"],[" of well over 7000 islands, with the South China Sea to the west and the Philippine Sea and Pacific Ocean to the east.",false,false,null]]},{"para":[["The country has just over 100 million people, making it the twelfth largest population in the world and the eighth largest population in Asia.",false,false,null]]},{"para":[["The Philippines is classified by the ",false,false,null],["World Bank",false,false,"https://datahelpdesk.worldbank.org/knowledgebase/articles/906519-world-bank-country-and-lending-groups"],[" as a 'lower middle-income economy' (countries with GNI per capita between $1,026 and $4,035), so it may be categorised as a 'newly emerging economy' (NEE).",false,false,null]]},{"para":[["Another way to assess the development status of a country is to use the Human Development Index (HDI), a widely-recognised measure of a country's overall development.",false,false,null]]},{"level":2,"text":"HDI for UN countries","anchor":"section-3"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: 7860fc8feafe4ef9855b789cda513a1f","caption":"","webmap_id":"7860fc8feafe4ef9855b789cda513a1f","size":"large","url":"https://www.arcgis.com/home/item.html?id=7860fc8feafe4ef9855b789cda513a1f","extent_lonlat":[67.9788,-9.4831,169.4046,37.8302],"extent_key":"67.9788,-9.4831,169.4046,37.8302"}},{"para":[["The Human Development Index (HDI) is a 'composite' index of statistics for economic, education and health.",false,false,null]]},{"para":[["Click green icons for details.",false,true,null]]},{"para":[["The HDI of the Philippines was 0.67 in 2014, placing it at a rank of 115 among 188 UN countries.",false,false,null]]},{"para":[["Click green icons for details.",false,false,null]]},{"para":[["Like many 'newly emerging economies' (NEEs), the Philippines' population has been urbanising rapidly, but just ",false,false,null],["over half still live in rural areas",false,false,"https://www.cia.gov/library/publications/the-world-factbook/fields/2212.html"],[", some of which are quite remote and inaccessible, especially in the most mountainous regions.",false,false,null]]},{"media":{"kind":"Image","title":"Batad-Rice-Terraces-in-Banaue-Ifugao","caption":"Batad Rice Terraces, Banaue Ifugao, Luzon, Philippines (Source: Out of Town Blog)","url":"https://outoftownblog.com/wp-content/uploads/2015/01/Batad-Rice-Terraces-in-Banaue-Ifugao.jpeg","size":"large"}},{"para":[["About 2000 of the islands of the Philippines ",false,false,null],["archipelago",false,false,"https://en.wikipedia.org/wiki/Geography_of_the_Philippines"],[" of are inhabited, which also be a major challenge for accessibility.  Transport links depend heavily on sea and air transport.",false,false,null]]},{"para":[["Most inter-island transport relies on a ferry network with multiple operators, providing key links in the ",false,false,null],["Philippine Nautical Highway System",false,false,"https://en.wikipedia.org/wiki/Philippine_Nautical_Highway_System"],[".",false,false,null]]},{"media":{"kind":"Image","title":"p1010038","caption":"Ferry from Bacolod to Iloilo.  (Source: Philippine Pearl)","url":"https://magicmagicol.files.wordpress.com/2007/08/p1010038.jpg?w=500","size":"large"}},{"para":[["Inland, the mountainous terrain can make ground transport very slow.  Interruptions due to river flooding and landslides are common.",false,false,null]]},{"media":{"kind":"Image","title":"20150824-kennonroad-landslide-rtr","caption":"Landslides are a common secondary impact of typhoons (Source: ABS-CBN)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/20150824-kennonroad-landslide-rtr__1519559452332.jpg","size":"large"}},{"para":[["Consequently, a combination of challenging physical and human geographical factors means that a country such as the Philippines tends to be very ",false,false,null],["vulnerable",true,false,null],[" to damage from natural hazards such as tropical storms.",false,false,null]]},{"para":[["Degg's Model (by Dr Martin Degg at the University of Chester, UK) shows this using a simple Venn diagram.  In a country where vulnerability is greater, ",false,false,null],["resilience",true,false,null],[" is lower.  There is more overlap with the hazard and the scale of a disaster increases.",false,false,null]]},{"media":{"kind":"Image","title":"Degg's Model 1 ac c","caption":"Degg's Model  (by Dr Martin Degg at the University of Chester, UK sometimes incorrectly called Dregg's Model)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Degg's%20Model%201%20ac%20c__1492545047911.png","size":"large"}},{"level":2,"text":"Why did Typhoon Haiyan happen?","anchor":"section-4"},{"media":{"kind":"Image","title":"Typhoon Haiyan Nov 2013 OverPhilippines Funktop w lat long (ft_lalo-animated)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Typhoon%20Haiyan%20Nov%202013%20OverPhilippines%20Funktop%20w%20lat%20long%20%28ft_lalo-animated%29__1490002282542.gif","size":"large"}},{"para":[["Typhoon Haiyan began in much the same way as all tropical storms (tropical cyclones).",false,false,null]]},{"para":[["The principle cause of tropical storms is evaporation over very warm oceans near to the Equator, where the ocean surface temperature (SST) is high enough to provide a constant source of energy transfer to the atmosphere.  The warm, moisture-rich air rises, contributing to the ",false,false,null],["Inter Tropical Convergence Zone (ITCZ)",false,false,"https://en.wikipedia.org/wiki/Intertropical_Convergence_Zone"],[" of the global atmospheric circulation.",false,false,null]]},{"level":2,"text":"Sea Surface Temperature","anchor":"section-5"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: ba1c1be38aea40f885271b66a5b340e2","caption":"","webmap_id":"ba1c1be38aea40f885271b66a5b340e2","size":"large","url":"https://www.arcgis.com/home/item.html?id=ba1c1be38aea40f885271b66a5b340e2","extent_lonlat":[53.551,-35.1129,256.4026,47.2105],"extent_key":"53.5510,-35.1129,256.4026,47.2105"}},{"para":[["Tropical storms develop over warm oceans where the seawater is over 26°C as shown on this map of sea surface temperatures (SST) ",false,false,null],["(Click any point on the colour layer to see SST - only visible with ArcGIS subscription).",false,true,null]]},{"para":[["Sea Surface Temperature animation (live data)",true,false,null]]},{"para":[["The interactive animation below shows the spatial pattern of ",false,false,null],["Sea Surface Temperatures",true,false,null],[" (SST).  It is set to the exact location where Typhoon Haiayan formed.  The SST is usually highest in the months from August to November.",false,false,null]]},{"para":[["The animation is set to the exact location where Typhoon Haiayan formed (6.60",false,true,null],["°",false,false,null],["N, 161.60",false,true,null],["°",false,false,null],["E).  Click anywhere on the ocean to find out the current sea surface temperature (SST).",false,true,null]]},{"media":{"kind":"Video","title":"Source: earth.nullschool.net (Cameron Beccario)","caption":"","url":"https://earth.nullschool.net/#current/ocean/primary/waves/overlay=sea_surface_temp/orthographic=156.90,0.29,209/loc=161.6,6.6"}},{"para":[["How warm oceans produce tropical storms",true,false,null]]},{"para":[["(Diagram source:",false,true,null],[" ",false,false,null],["S-Cool",false,true,"http://www.s-cool.co.uk/gcse/geography"],[")",false,true,null]]},{"para":[["Moisture from the warm oceans ",false,false,null],["evaporates",true,false,null],[" and rises in warm ",false,false,null],["convection currents",true,false,null],[" of air, creating 'unstable' conditions with intense ",false,false,null],["low pressure",true,false,null],[".",false,false,null]]},{"para":[["As the rising air cools, the moisture condenses forming clouds and rain. The process of condensation releases more heat, providing further convection.",false,false,null]]},{"media":{"kind":"Image","title":"Tropical storm CS from S-cool a-geo-nathaz-dia10","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Tropical%20storm%20CS%20from%20S-cool%20a-geo-nathaz-dia10__1515970200244.gif","size":"large"}},{"para":[["If there is sufficient energy transferred into the atmosphere, a tropical storm (tropical cyclone) is created.",false,false,null]]},{"para":[["Why do tropical storms 'spin'?",false,false,null]]},{"para":[["The Earth's rotation creates ",false,false,null],["Coriolis Force",true,false,null],[". Consequently, the rising air deflects away from the vertical.  A spinning pattern develops which is called the ",false,false,null],["Coriolis Effect",true,false,null],[".  In the northern hemisphere, the rotation is anti-clockwise, as happened with Typhoon Haiyan.  In the southern hemisphere the rotation is clockwise.",false,false,null]]},{"para":[["The ",false,false,null],["Coriolis Effect",true,false,null],[" shows up on satellite images as the clouds of the in-flowing air develop an appearance like a giant Catherine-wheel.",false,false,null]]},{"para":[["In the centre of the rotation, tropical storms with intense low pressure may develop an ",false,false,null],["'eye'",true,false,null],[", which can be cloud-free and clear all the way to the surface of the ocean or land.  The eye is surrounded by a cylindrical column of cloud known as the ",false,false,null],["'eyewall'",true,false,null],[" which contains the most powerful winds of the storm.  However, weather conditions in the eye itself  are paradoxically calm.",false,false,null]]},{"media":{"kind":"Image","title":"Tropical Storm from space anatomy","caption":"A tropical storm with a distinct eye (Source: Lyndon State College Atmospheric Sciences)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Tropical%20Storm%20from%20space%20anatomy__1588172215886.jpg","size":"large"}},{"media":{"kind":"Image","title":"Eye and eye wall NOAA","caption":"A tropical storm with a distinct eye (Source: University Corporation for Atmospheric Research)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Eye%20and%20eye%20wall%20NOAA__1492276061969.gif","size":"large"}},{"media":{"kind":"Image","title":"ir_lalo-animated","caption":"","url":"https://www.ospo.noaa.gov/data/history/Haiyan/20131107_1057Z-1730Z/ir_lalo-animated.gif","size":"large"}},{"para":[["Coriolis Force",true,false,null],[" created an anti-clcockwise rotation of air in Typhoon Haiyan with a distinct ",false,false,null],["eye",true,false,null],[", seen as it approached the Philippines on 7th November 2013.",false,false,null]]},{"para":[["Source:",false,true,null],[" ",false,false,null],["NOAA",false,true,"http://www.ospo.noaa.gov/data/history/Haiyan/20131107_1857Z-1108_0157Z/ir_lalo-animated.gif"]]},{"para":[["Tropical storms 'feed' on the energy from warm oceans.  As soon as they cross over land, they begin to lose that energy.  Unless such storms move over warm oceans again, they can ",false,false,null],["dissipate",true,false,null],[" quickly.",false,false,null]]},{"para":[["Land surfaces also cause ",false,false,null],["friction",true,false,null],[".  Land is a 'rougher' surface than the sea and this saps energy from the storm.  Tropical storms don't cope well with high relief.   Hills and mountains can disrupt the storm, reduce its intensity and contribute to its demise.  Typhoon Haiyan lost some of its power as it crossed the larger Philippine islands.",false,false,null]]},{"media":{"kind":"Image","title":"ir_lalo-animated","caption":"","url":"http://www.ospo.noaa.gov/data/history/Haiyan/20131107_1857Z-1108_0157Z/ir_lalo-animated.gif","size":"large"}},{"para":[["On 8th November 2013, Typhoon Haiyan can be seen temporarily losing energy as it crosses the island of Leyte in the Eastern Visayas province of the Philippines.  The ",false,false,null],["eye",true,false,null],[" becomes less distinct.",false,false,null]]},{"para":[["Source:",false,true,null],[" ",false,false,null],["NOAA",false,true,"http://www.ospo.noaa.gov/data/history/Haiyan/20131107_1857Z-1108_0157Z/ir_lalo-animated.gif"]]},{"para":[["How may human factors contribute to tropical storms?",true,false,null]]},{"para":[["It is likely that ",false,false,null],["human factors",true,false,null],[" also contributed to the causes of Typhoon Haiyan.",false,false,null]]},{"para":[["Anthropogenic climate change",true,false,"http://www.global-greenhouse-warming.com/anthropogenic-climate-change.html"],[" is likely to increase the intensity of tropical storms because the oceans are absorbing atmospheric heat from global warming (",false,false,null],["Explaining ocean warming 2016, IUCN Report",false,false,"https://portals.iucn.org/library/node/46254"],[").  Oceanic ",false,false,null],["thermal expansion",true,false,null],[" will also exacerbate the impact of ",false,false,null],["storm surges",true,false,null],[" which occur in tropical storms.",false,false,null]]},{"para":[["Deforestation",true,false,null],[" is another factor.  ",false,false,null],["70% of the Philippines has been deforested since 1900",false,false,"http://www.huffingtonpost.com/mary-ellen-harte/climate-change-this-week_b_4266391.html"],[".  The reduction in ",false,false,null],["interception",true,false,null],[" of rainfall reduces ",false,false,null],["lag time",true,false,null],[" into rivers.  Consequently ",false,false,null],["flooding",true,false,null],[" from cyclones like Haiyan is more likely.",false,false,null]]},{"level":2,"text":"What were the effects?","anchor":"section-6"},{"media":{"kind":"Image","title":"Typhoon Haiyan Nov 2013 OverPhilippines Funktop w lat long (ft_lalo-animated)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Typhoon%20Haiyan%20Nov%202013%20OverPhilippines%20Funktop%20w%20lat%20long%20%28ft_lalo-animated%29__1490002282542.gif","size":"large"}},{"para":[["Tropical storms regularly form in the Western Pacific and transit the Philippines, but the intensity and impacts of Typhoon Haiyan were of an unusually high magnitude.  Over ",false,false,null],["6,300 people were killed",true,false,null],[".",false,false,null]]},{"para":[["The vulnerability of the population seems to have been exacerbated by the combination of economic and social factors linked to the Philippines' overall level of development which reduced ",false,false,null],["resilience",true,false,null],[" (see infographic below by ",false,false,null],["UN OCHA",false,false,"http://reliefweb.int/sites/reliefweb.int/files/resources/ocha_phl_destructive_typhoons_2006_to_2016.pdf"],[").",false,false,null]]},{"media":{"kind":"Image","title":"Philippines - Destructive Tropical Cyclones From 2006 to 2016 (UN OCHA)","caption":"Philippines - Destructive Tropical Cyclones From 2006 to 2016 (Source: UN OCHA)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Philippines%20-%20Destructive%20Tropical%20Cyclones%20From%202006%20to%202016%20%28UN%20OCHA%29__1491833629873.png","size":"large"}},{"para":[["Typhoon Haiyan was about 1500 km or 1000 mi in diameter, meaning that it was about as large as France and Spain combined, more or less the same extent as the Philippines.",false,false,null]]},{"para":[["Compare the size of the Philippines using",false,true,null],[" ",false,false,null],["The True Size Of The Philippines",false,false,"https://thetruesize.com/#?borders=1~!MTUwMDgzMjI.MzMwNzUxMw*MTIyMzM0MQ(MTAyMjMzNDE~!PH*MA.MTgwMDAwMDA "]]},{"level":2,"text":"Typhoon Haiyan: Main damage zone","anchor":"section-7"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: ba1c1be38aea40f885271b66a5b340e2","caption":"","webmap_id":"ba1c1be38aea40f885271b66a5b340e2","size":"large","url":"https://www.arcgis.com/home/item.html?id=ba1c1be38aea40f885271b66a5b340e2","extent_lonlat":[99.8438,4.8851,150.5566,26.6788],"extent_key":"99.8438,4.8851,150.5566,26.6788"}},{"para":[["Typhoon Haiyan affected the whole of the Philippines, but most of the damage was in the central area.",false,false,null]]},{"para":[["The area which suffered the most damage was a 200 km or 125 mile wide path across the central islands called the Visayas.",false,false,null]]},{"level":2,"text":"What were the primary effects?","anchor":"section-8"},{"media":{"kind":"Image","title":"main_900","caption":"","url":"https://cdn.theatlantic.com/assets/media/img/photo/2013/11/the-philippines-one-week-after-typhoon-haiyan/h06_87851255/main_900.jpg?1420506324","size":"large"}},{"para":[["Primary effects",true,false,null],[" are those resulting directly from the event itself.   The primary effects of Typhoon Haiyan were caused by physical factors, especially storm surge, high wind speeds and heavy rain.",false,false,null]]},{"para":[["A ",false,false,null],["storm surge",true,false,null],[" from Typhoon Haiyan was particularly severe, especially in the Eastern Visayas.  It was as 5 to 6 metres or 16 to 20 feet high on some coasts of Leyte and Samar.  It swept through some coastal settlements in much the same way as a tsunami, causing drownings, injuries and the destruction of buildings and infrastructure.",false,false,null]]},{"para":[["The ",false,false,null],["death toll",true,false,null],[" from Typhoon Haiyan was over 6,300.  Most of these casualties were due to the storm surge.  There was severe criticism of the failure of key players to properly educate and warn residents about their general vulnerability to storm surge, the specific risks posed by Typhoon Haiyan and most importantly, what action to take.  It became clear that ",false,false,null],["many lives were saved",false,false,"http://www.academia.edu/9656331/Devastating_storm_surges_of_Typhoon_Haiyan"],[" where the issue of ",false,false,null],["inertia",true,false,null],[" (failure to leave high risk areas) had been addressed.",false,false,null]]},{"para":[["A team of experts led by Alfredo Lagmayin analysed the event and reached the following conclusion in the ",false,false,null],["International Journal of Disaster Risk Reduction",false,true,null],[":",false,false,null]]},{"para":[["'The storm surges of Haiyan were predicted two days in advance with a complete list that was broadcast over media the night before Haiyan made landfall. Unfortunately, despite the advanced warnings, these were not translated into appropriate action in every coastal village in the Central Philippines region.'",false,true,null]]},{"para":[["Source:",false,true,null],[" ",false,false,null],["Devastating storm surges of Typhoon Haiyan",false,true,"http://www.academia.edu/9656331/Devastating_storm_surges_of_Typhoon_Haiyan"]]},{"para":[["The impact of a storm surge is shown in the animation below (",false,false,null],["Source:",false,true,null],[" ",false,false,null],["University of Wisconsin-Madison",false,true,"http://homepages.cae.wisc.edu/~chinwu/CEE514_Coastal_Engineering/2005_Students_Web/Eric/surgea1.gif"],[").",false,false,null]]},{"level":2,"text":"Storm surge","anchor":"section-9"},{"media":{"kind":"Image","title":"giphy","caption":"","url":"https://media.giphy.com/media/LFFqtzb2haTTi/giphy.gif","size":"large"}},{"para":[["Storm surges",true,false,null],[" are a common feature of tropical storms. They are caused by a combination of intensely ",false,false,null],["low pressure",true,false,null],[" which causes a 'dome' of higher sea water under the centre of the storm and ",false,false,null],["high winds",true,false,null],[" causing a 'piling up' of sea water. This results in ",false,false,null],["coastal flooding",true,false,null],[".",false,false,null]]},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: ba1c1be38aea40f885271b66a5b340e2","caption":"","webmap_id":"ba1c1be38aea40f885271b66a5b340e2","size":"large","url":"https://www.arcgis.com/home/item.html?id=ba1c1be38aea40f885271b66a5b340e2","extent_lonlat":[125.3463,11.2265,125.7425,11.4197],"extent_key":"125.3463,11.2265,125.7425,11.4197"}},{"para":[["The storm surge in Hernani, Eastern Samar, Philippines 6am 8th November 2013",false,false,null]]},{"media":{"kind":"Video","title":"Typhoon Haiyan storm surge in Hernani, Eastern Samar, Philippines 6am 8th November 2013 (Source: Plan International)","caption":"","url":"https://www.youtube.com/embed/rS0gv4Xbw7w"}},{"level":2,"text":"Storm surge","anchor":"section-10"},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: ba1c1be38aea40f885271b66a5b340e2","caption":"","webmap_id":"ba1c1be38aea40f885271b66a5b340e2","size":"large","url":"https://www.arcgis.com/home/item.html?id=ba1c1be38aea40f885271b66a5b340e2","extent_lonlat":[123.24,10.4818,126.4096,11.8802],"extent_key":"123.2400,10.4818,126.4096,11.8802"}},{"para":[["The city of Tacloban was devastated by the storm surge.",false,false,null]]},{"para":[["The city is located at one end of San Pedro and San Pablo Bay.  The 'funnel' shape of the bay and shallow water amplified the storm surge.",false,false,null]]},{"para":[["The height of the storm surge at Tacloban City ranged between 4.6-7.0 metres or 15-23 feet.",false,false,null]]},{"para":[["Detail about the storm surge",false,true,"https://www.wunderground.com/blog/JeffMasters/super-typhoon-haiyan-storm-surge-survey-finds-high-water-marks-46-feet"]]},{"para":[["Much of the city is low-lying. Many of the most densely populated areas and Tacloban Airport are only 2-3 m or 6-10 feet above sea level.",false,false,null]]},{"para":[["Elevation profile:",false,true,null],[" ",false,false,null],["BBC",false,true,"https://ichef.bbci.co.uk/news/976/media/images/73868000/jpg/_73868285_typhoon_haiyan_cross_section_976.jpg"]]},{"media":{"kind":"Image","title":"_73868285_typhoon_haiyan_cross_section_976","caption":"","url":"https://ichef.bbci.co.uk/news/976/media/images/73868000/jpg/_73868285_typhoon_haiyan_cross_section_976.jpg","size":"large"}},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: ba1c1be38aea40f885271b66a5b340e2","caption":"","webmap_id":"ba1c1be38aea40f885271b66a5b340e2","size":"large","url":"https://www.arcgis.com/home/item.html?id=ba1c1be38aea40f885271b66a5b340e2","extent_lonlat":[124.9485,11.2094,125.0475,11.2531],"extent_key":"124.9485,11.2094,125.0475,11.2531"}},{"para":[["Tacloban City Convention Center was serving as an evacuation shelter.  On a lower floor many people were drowned.",false,false,null]]},{"media":{"kind":"Image","title":"tacloban-city-convention-center-pba-ag-sano-20140118","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/tacloban-city-convention-center-pba-ag-sano-20140118__1588172931255.jpg","size":"large"}},{"para":[["The damage to Tacloban Airport was very severe.",false,false,null]]},{"media":{"kind":"Image","title":"REU-PHILIPPINES-TYPHOON__031","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/REU-PHILIPPINES-TYPHOON__031__1588172997162.jpg","size":"large"}},{"para":[["Tacloban Airport control tower after Typhoon Haiyan. (Source: ",false,false,null],["Baltimore Sun",false,false,"http://darkroom.baltimoresun.com/2013/11/philippines-bracing-for-enormous-typhoon-haiyan/the-damaged-control-tower-of-tacloban-airport-is-seen-after-super-typhoon-haiyan-battered-tacloban-city-in-central-philippines/"],[")",false,false,null]]},{"media":{"kind":"Image","title":"131112113123-06-haiyan-1112-horizontal-gallery","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/131112113123-06-haiyan-1112-horizontal-gallery__1588173055104.jpg","size":"large"}},{"para":[["Tacloban Airport infrastructure damage.",false,false,null]]},{"para":[["Source: ",false,false,null],["CNN",false,false,"http://www.ctvnews.ca/world/relief-operations-pick-up-pace-in-typhoon-devastated-philippines-1.1538961"]]},{"media":{"kind":"Interactive map (custom)","title":"AGOL web map item: ba1c1be38aea40f885271b66a5b340e2","caption":"","webmap_id":"ba1c1be38aea40f885271b66a5b340e2","size":"large","url":"https://www.arcgis.com/home/item.html?id=ba1c1be38aea40f885271b66a5b340e2","extent_lonlat":[124.9468,11.2353,125.0337,11.2778],"extent_key":"124.9468,11.2353,125.0337,11.2778"}},{"para":[["Further damage to Tacloban City could be seen by comparing older satellite images with the aftermath of Typhoon Haiyan.",false,false,null]]},{"media":{"kind":"Image","title":"Tacloban-before and after (nr oil refinery) 4-22Feb2012","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Tacloban-before%20and%20after%20%28nr%20oil%20refinery%29%204-22Feb2012__1493033359852.gif","size":"large"}},{"para":[["Before and after image near oil refinery, Tacloban City.",false,false,null]]},{"para":[["More ",false,false,null],["'before and after images'",false,false,"http://www.huffingtonpost.com/2013/11/12/before-and-after-typhoon-haiyan-_n_4262348.html"],[" (Huffington Post).",false,false,null]]},{"para":[["Source: Digital Globe / Google Earth.",false,true,null]]},{"para":[["Elsewhere, heavy rain led to significant flooding and ",false,false,null],["landslides",false,false,"http://www.latimes.com/world/worldnow/la-fg-wn-typhoon-haiyan-blasts-philippines-20131108-story.html"],[", which damaged transport infrastructure such as roads and bridges.",false,false,null]]},{"media":{"kind":"Image","title":"haiyan-bridge","caption":"Infrastructure damage by Typhoon Haiyan (Source: The Week)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/haiyan-bridge__1588173120729.jpg","size":"large"}},{"para":[["Wind damage",false,false,null]]},{"para":[["Typhoon Haiyan recorded 315 km/h or 195 mi/h",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Philippines"],[" winds as it hit the coast - the highest ever recorded at landfall.  Wind damage to vulnerable buildings was widespread and significant.  Flying debris caused further destruction, injury and loss of life.  The video clips below give some impression of the wind impacts.",false,false,null]]},{"media":{"kind":"Video","title":"Super Tyhooon Haiyan (Yolanda) - Journey to Tacloban (Source: Jim Edds)","caption":"","url":"https://www.youtube.com/embed/3ZhItkcs9qw?wmode=opaque&rel=0"}},{"level":2,"text":"What were the secondary effects?","anchor":"section-11"},{"media":{"kind":"Image","title":"philippines-typhoon-10nov2013","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/philippines-typhoon-10nov2013__1588173744886.jpg","size":"large"}},{"para":[["ECONOMIC EFFECTS",false,false,null]]},{"para":[["All ",false,false,null],["economic losses",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Philippines"],[" such as lost work time, loss of business premises and property was estimated at about US$1 billion. Development came to a halt for several months.",false,false,null]]},{"para":[["Infrastructure: ",false,false,null],["Landslides",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan"],[" and felled trees prevented access to remote settlements and ",false,false,null],["electricity power outages",false,false,"http://www.unhcr.org/528228cf9.pdf"],[" continued for over a month in some areas.  Transport including ",false,false,null],["air and ferry routes were badly disrupted",false,false,"http://www.adelaidenow.com.au/travel/travel-news/super-typhoon-haiyan-shuts-airports-flights-cancelled-across-philippines/news-story/5afafde44067755d48d19d4b7a153450"],[".",false,false,null]]},{"para":[["SOCIAL EFFECTS",false,false,null]]},{"para":[["Homelessness",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Humanitarian_crisis_and_population_displacement"],[": 1.9 million homeless and more than 6 million were displaced.",false,false,null]]},{"para":[["Medical and education services:",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Philippines_2"],[" Many hospitals and schools were damaged.",false,false,null]]},{"media":{"kind":"Image","title":"philippines-hospital-8x5","caption":"Filipino army and medical doctors assist mothers in giving birth inside a damaged building in the typhoon-devastated city of Tacloban, Leyte province, Philippines. This photo was taken on November 11, 2013, just days after the typhoon. Photo: EPA/Dennis M. Sabangan (Source: Oxfam America)","url":"https://s3.amazonaws.com/blog.oxfamamerica.org/firstperson/2013/11/philippines-hospital-8x5.jpg","size":"large"}},{"para":[["Water and food shortages",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Criticism_of_government_response"],[" were common for days and ",false,false,null],["looting",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Looting_and_violence"],[" was a serious issue, especially in Tacloban City.",false,false,null]]},{"para":[["Intangible impacts are very difficult to quantify, but some estimates suggested that social losses were in ",false,false,null],["excess of US$1.2 billion",false,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Philippines"],[".",false,false,null]]},{"level":2,"text":"What were the responses?","anchor":"section-12"},{"media":{"kind":"Image","title":"Typhoon Haiyan Nov 2013 OverPhilippines Funktop w lat long (ft_lalo-animated)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Typhoon%20Haiyan%20Nov%202013%20OverPhilippines%20Funktop%20w%20lat%20long%20%28ft_lalo-animated%29__1490002282542.gif","size":"large"}},{"para":[["The responses to Typhoon Haiyan can be classified as ",false,false,null],["immediate",true,false,null],[" (short-term) and ",false,false,null],["long-term",true,false,null],[".",false,false,null]]},{"para":[["The ",false,false,null],["United Nations Office for the Coordination of Humanitarian Affairs (UN OCHA)",false,false,"http://www.unocha.org/"],[" played a leading role in the ",false,false,null],["immediate and long-term response",true,false,null],[", among key players using its ",false,false,null],["Cluster System",false,false,"http://www.unocha.org/what-we-do/coordination-tools/cluster-coordination"],[":",false,false,null]]},{"media":{"kind":"Image","title":"cluster-leads","caption":"The Cluster System used by the United Nations Office for Coordination of Humanitarian Affairs (UN OCHA)","url":"https://www.un.org/sites/un2.un.org/files/cluster_system_ocha.jpg","size":"large"}},{"level":2,"text":"Immediate responses","anchor":"section-13"},{"para":[["Key players",true,false,null],[" from the Philippines involved first responders, the military forces, supranational organisations such as the United Nations and NGOs such as the Red Cross.  Food aid was distributed, including rice, canned food, sugar and cooking oil.",false,false,null]]},{"para":[["Looting and violence",true,false,"https://en.wikipedia.org/wiki/Typhoon_Haiyan#Looting_and_violence"],[" broke out in the immediate aftermath of the storm.  Curfews were imposed and security checkpoints were set up in key locations in an effort to prevent control these issues. Much of the Visayas region of the central Philippines was placed under a ",false,false,null],["'state of national calamity'",true,false,"http://www.bbc.co.uk/news/world-asia-24901993"],[".",false,false,null]]},{"para":[["The ",false,false,null],["international response",true,false,null],[" was significant, involving ",false,false,null],["governments",true,false,null],[" from the USA, UK, France, Belgium and Israel and ",false,false,null],["non-government organisations (NGOs)",true,false,null],[".  There were donations of over $500 million.",false,false,null]]},{"para":[["Material support included field hospitals, food aid, water and temporary shelters.",false,false,null]]},{"para":[["The NGO ",false,false,null],["Shelter Box",true,false,"http://www.rotary-ribi.org/districts/page.php?PgID=477503&amp;DistrictNo=1020"],[" provided important short-term assistance.",false,false,null]]},{"media":{"kind":"Image","title":"ShelterBox-shelterbox-contents-2015_bcxm7l","caption":"The contents of a Shelter Box","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/ShelterBox-shelterbox-contents-2015_bcxm7l__1588173491497.jpg","size":"large"}},{"para":[["Hundreds of ",false,false,null],["evacuation centres",true,false,null],[" were set up to provide temporary shelter as shown on these maps of the Central and Western Visayas.",false,false,null]]},{"media":{"kind":"Image","title":"ma013cevacuationcentresv01-300dpi","caption":"Evacuation Centres in the Central and Western Visayas (Source: MapAction)","url":"https://maps.mapaction.org/dataset/04a59c15-2970-4224-9368-9cb21f5c2372/resource/b2ebdf25-0bb4-44ea-8b50-18a122417fbd/download/ma013cevacuationcentresv01-300dpi.jpeg","size":"large"}},{"para":[["The USA has close ties with the Philippines.  The US Department of Defense assisted with a fund of US $7.2 million including helicopter transport from their aircraft carrier ",false,false,null],["USS George Washington",false,false,"http://www.bbc.co.uk/news/world-asia-24936387"],[".",false,false,null]]},{"media":{"kind":"Video","title":"USS George Washington assisted in the relief operation for Typhoon Haiyan (Source: ABC)","caption":"","url":"https://www.youtube.com/embed/xtJs_yNWnms?wmode=opaque&rel=0"}},{"para":[["The USAID / Office of US Foreign Disaster Assistance assisted with US $20 million and the USAID / Office of Food for Peace assisted with US $10 million.  Medical assistance included deployment of a hospital ship, the ",false,false,null],["USNS Mercy",false,false,"https://en.wikipedia.org/wiki/USNS_Mercy_(T-AH-19"],[").",false,false,null]]},{"media":{"kind":"Image","title":"military-sealift","caption":"The Military Sealift Command hospital ship USNS Mercy was deployed to support disaster relief efforts in the wake of Typhoon Haiyan. (Source: REUTERS/U.S. Navy Handout)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/military-sealift__1588173636063.jpg","size":"large"}},{"level":2,"text":"Long-term responses","anchor":"section-14"},{"media":{"kind":"Image","title":"cropped-cropped-cropped-un-habitat_11","caption":"","url":"https://unhabitattyphoonhaiyanresponse.files.wordpress.com/2014/01/cropped-cropped-cropped-un-habitat_11.png","size":"large"}},{"para":[["Long-term aid",true,false,null],[" was provided by the Philippines government, national governments and NGOs, supported by international donations from the USA, EU, UK, Australia and Japan, for rebuilding of workplaces, public services (e.g. hospitals, schools) and reconstruction of infrastructure such as roads, bridges and airports.",false,false,null]]},{"para":[["UN Habitat",false,false,"https://unhabitat.org/governments-of-philippines-and-japan-join-hands-with-un-habitat-to-help-typhoon-haiyan-victims/"],[" led programmes for rebuilding, in partnership with national government agencies.",false,false,null]]},{"media":{"kind":"Image","title":"20141208_vc2_after-ruby_tm-41","caption":"660 families finally completed the building of their houses and 54 community infrastructure projects in Panay (Source: UN Habitat)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/20141208_vc2_after-ruby_tm-41__1588174126019.jpg","size":"large"}},{"para":[["'Cash for work' programmes",false,false,"http://www.undp.org/content/undp/en/home/presscenter/pressreleases/2013/11/25/undp-launches-cash-for-work-programme-for-destroyed-communities-in-the-philippines.html"],[" were set up by the United Nations Development Programme (UNDP), whereby local people were paid  to clear rubble and medical waste, earning much needed income to help their recovery, while also easing access routes for humanitarian supplies.",false,false,null]]},{"media":{"kind":"Image","title":"5492-philippines-cash-work-program-feature-01","caption":"'Cash for work' programmes were part of the recovery process after Typhoon Haiyan (Source: Tsukasa Maekawa / ADB)","url":"https://www.adb.org/sites/default/files/styles/content_media/public/content-media/5492-philippines-cash-work-program-feature-01.jpg?itok=9xWNotk4","size":"large"}},{"para":[["Rebuilding and community development programmes were supported by ",false,false,null],["CAFOD",false,false,"https://blog.cafod.org.uk/2016/11/04/philippines-typhoon-three-years-on/"],[", in consultation with local people.",false,false,null]]},{"para":[["Some agricultural production recovered quickly, such as rice and fishing, but coconut production suffered longer-term impacts.  Some NGOs such as ",false,false,null],["Oxfam provided funds for the replacement of fishing boats.",false,false,"http://www.oxfam.org.uk/what-we-do/emergency-response/philippines-typhoon-haiyan/after-the-storm"]]},{"level":2,"text":"Evaluation: Lessons learned?","anchor":"section-15"},{"media":{"kind":"Image","title":"Typhoon Haiyan Nov 2013 OverPhilippines Funktop w lat long (ft_lalo-animated)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Typhoon%20Haiyan%20Nov%202013%20OverPhilippines%20Funktop%20w%20lat%20long%20%28ft_lalo-animated%29__1490002282542.gif","size":"large"}},{"para":[["It quickly became clear that ",false,false,null],["some key aspects of the responses were inadequate",false,false,"http://newsinfo.inquirer.net/526693/cnn-bbc-intl-media-slam-aquino-for-disorganized-yolanda-aid-response"],[", especially the lack of warning about the severity of the storm surge and the failure to enforce evacuation of vulnerable areas.",false,false,null]]},{"para":[["Efforts have been made to learn lessons from Typhoon Haiyan in order to improve the ",false,false,null],["resilience",true,false,null],[" of the Philippines (and other countries) to such weather hazards.  These initiatives can be categorised under the '3Ps':",false,false,null]]},{"para":[["Prediction:",true,false,null]]},{"para":[["Forecasting has improved significantly, especially for storm surges.  There is now much ",false,false,null],["improved international cooperation",false,false,"http://www.metoffice.gov.uk/news/releases/2014/typhoon-haiyan"],[" in sharing of data and atmospheric modelling of tropical storms.",false,false,null]]},{"para":[["Protection:",true,false,null]]},{"para":[["New homes are being built on higher ground to reduce future risk from storm surges and river flooding.",false,false,null]]},{"para":[["More cyclone shelters are being constructed to improve local resilience.",false,false,null]]},{"para":[["Planning and preparation:",true,false,null]]},{"para":[["Education about such weather hazards",false,false,"https://www.unisdr.org/archive/35524"],[" can improve resilience and save lives as the residents of the small island of Tulang Diyot proved.",false,false,null]]},{"media":{"kind":"Video","title":"A former mayor organised the evacuation of Tulang Diyot island ahead of Typhoon Haiyan, saving their lives. (Source UNISDR)","caption":"","url":"https://www.youtube.com/embed/-hyoqmr1Mqg?wmode=opaque&rel=0"}},{"para":[["Education programmes",false,false,"http://www.unesco.org/new/en/jakarta/inter-sectoral/haiyan/"],[" for all ages have been enhanced to help people understand the risks and to know better ways to react.",false,false,null]]},{"para":[["In particular, efforts have concentrated on addressing the ",false,false,null],["problem of inertia",false,false,"http://edition.cnn.com/2013/11/11/world/asia/typhoon-haiyan-questions/"],[" so that people feel more compelled or empowered to evacuate their homes more quickly and effectively.",false,false,null]]},{"para":[["Following a review of the 3Ps, the authorities adopted much more proactive strategies with ",false,false,null],["‘zero casualty’",true,false,null],[" targets. They tackled the issue of ",false,false,null],["inertia",true,false,null],[" with incentives such as free bags of rice to persuade people to leave homes and property behind.",false,false,null]]},{"media":{"kind":"Image","title":"Evacuated children receive free chocolate rice porridge as they seek shelter at an evacuation centre","caption":"Evacuated children receive free chocolate rice porridge as they seek shelter at an evacuation centre. (Source: Bullit Marquez/AP)","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Evacuated%20children%20receive%20free%20chocolate%20rice%20porridge%20as%20they%20seek%20shelter%20at%20an%20evacuation%20centre__1588174271695.jpg","size":"large"}},{"para":[["The new strategies proved successful.  Just over a year after Hayian, Typhoon Hagupit hit the Philippines. It was also a Category 5 storm, but in marked contrast only 18 people were killed.  The resilience of vulnerable communities had clearly improved.  ",false,false,null],["‘",false,false,"http://www.bbc.co.uk/news/world-asia-30375007"],["Evacuation rather than rescue, that’s our doctrine",false,true,"http://www.bbc.co.uk/news/world-asia-30375007"],[",’ said an emergency management chief.",false,false,"http://www.bbc.co.uk/news/world-asia-30375007"]]},{"para":[["The ",false,false,null],["United Nations Office for Disaster Risk Reduction (UNISDR)",false,false,"https://www.unisdr.org/archive/35452"],[" concludes that Typhoon Haiyan represented \"a turning point\" for disaster risk management.",false,false,null]]},{"para":[["Further details and reflections",true,false,null]]},{"para":[["Images showing improvements since Typhoon Haiyan can be seen in this Guardian article ",false,false,null],["Tacloban: a year after Typhoon Haiyan",false,true,"https://www.theguardian.com/world/2014/oct/31/tacloban-a-year-after-typhoon-haiyan"],[".",false,false,null]]},{"para":[["Further details and reflections about the response to Typhoon Haiyan by NGOs have been provided by the ",false,false,null],["Red Cross",false,false,"http://www.redcross.org.uk/What-we-do/Emergency-response/Recovering-from-disasters/Typhoon-Haiyan-2013"],[" and ",false,false,null],["Care International",false,false,"http://www.careinternational.org.uk/emergencies/recovery-and-rebuilding/typhoon-haiyan"],[":",false,false,null]]},{"media":{"kind":"Video","title":"A year on, has the Philippines recovered from Haiyan? (Source: CNN)","caption":"","url":"https://www.youtube.com/embed/9gGq8fcYjEg?wmode=opaque&rel=0"}},{"level":2,"text":"Credits","anchor":"section-16"},{"media":{"kind":"Image","title":"Typhoon Haiyan Nov 2013 OverPhilippines Funktop w lat long (ft_lalo-animated)","caption":"","url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Typhoon%20Haiyan%20Nov%202013%20OverPhilippines%20Funktop%20w%20lat%20long%20%28ft_lalo-animated%29__1490002282542.gif","size":"large"}},{"level":2,"text":"Sources & Credits","anchor":"section-17"},{"credits":[["Typhoon Haiyan (Wikipedia)","","https://en.wikipedia.org/wiki/Typhoon_Haiyan"],["NASA Earth Observatory","","https://science.nasa.gov/earth/earth-observatory/"],["University Corporation for Atmospheric Research","","https://www.ucar.edu/"],["Killer Typhoon (NOVA / Geographic TV)","","https://www.youtube.com/watch?v=NgK-1osaoQA"],["Plan International","","https://plan-international.org/"],["Gro Learning (formerly S-cool)","","https://grolearning.com/a-level/geography/natural-hazards/revise-it/tropical-cyclones"],["University of Wisconsin, Madison","","https://www.wisc.edu/"],["Devastating storm surges of Typhoon Haiyan by Alfredo Lagmay et al (2014)","","https://www.academia.edu/9656331/Devastating_storm_surges_of_Typhoon_Haiyan"],["Typhoon Hagupit: What did the Philippines do differently? (BBC)","","https://www.bbc.co.uk/news/world-asia-30375007"],["United Nations Office for Disaster Risk Reduction (UNISDR)","https://www.unisdr.org/archive/35452","https://www.unisdr.org/archive/35452"],["Red Cross","","https://redcross.eu/projects/empowering-communities-after-typhoon-haiyan"],["American Red Cross: 'Typhoon Haiyan: 5 Years On in the Philippines'","","https://www.redcross.org/about-us/news-and-events/news/2018/typhoon-haiyan-5-years-on-in-the-philippines.html?srsltid=AU7gw4XmqxNuHnt-MB-EHk7VEdHty-qjDsRevDhKlJ0lqp1HyqgX6khZdisasters/Typhoon-Haiyan-2013"],["Care International","","https://www.careintjp.org/newsE/e/one_year_after_haiyan.html"],["National Oceanic and Atmospheric Administration (NOAA)","","https://www.ospo.noaa.gov/index.html"]]}]</script>
<script id="story-nav" type="application/json">{"header_title":"A Story Map by BC","header_logo_url":"https://www.arcgis.com/sharing/rest/content/items/bba35e41b8da423498ae3bf461e161c8/resources/Typhoon%20Haiyan%20Nov%202013%20OverPhilippines%20Funktop%20w%20lat%20long%20(ft_lalo-animated)__1490002282542.gif","bookmarks":[{"anchor":"top","label":"Intro"},{"anchor":"section-0","label":"Where?"},{"anchor":"section-4","label":"Why?"},{"anchor":"section-6","label":"Effects?"},{"anchor":"section-12","label":"Responses?"},{"anchor":"section-15","label":"Evaluation?"},{"anchor":"section-16","label":"Credits"}],"layout":"stacked"}</script>
<script>
const items = JSON.parse(document.getElementById('story-data').textContent);
const navConfig = JSON.parse(document.getElementById('story-nav').textContent);

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function renderRuns(runs) {
  return runs.map(([text, bold, italic, href]) => {
    let t = esc(text);
    if (bold) t = `<b>${t}</b>`;
    if (italic) t = `<i>${t}</i>`;
    if (href) t = `<a href="${esc(href)}" target="_blank" rel="noopener">${t}</a>`;
    return t;
  }).join('');
}

function toEmbedUrl(url) {
  if (!url) return url;
  if (url.startsWith('//')) return 'https:' + url;
  return url;
}

function dimAttr(media) {
  // Reserves layout space using the image's original AGOL dimensions (when known), so the
  // browser doesn't reflow the page after images finish loading — which used to knock
  // scroll position (and bookmark-tab targets) out from under the reader.
  const w = media && media.width, h = media && media.height;
  return (w && h) ? ` width="${w}" height="${h}"` : '';
}

function sizeClass(media) {
  const s = (media && media.size) || 'large';
  return 'size-' + (['small', 'medium', 'large', 'full'].includes(s) ? s : 'large');
}
function mapHeightFor(media) {
  if (media && media.custom_height) return media.custom_height;
  const size = media && media.size;
  return ({ small: 280, medium: 400, large: 500, full: 640 })[size] || 400;
}

function renderMedia(media) {
  const wrap = document.createElement('div');

  if (media.kind && media.kind.startsWith('Background image')) {
    wrap.className = 'media ' + sizeClass(media);
    wrap.innerHTML = `<img src="${esc(toEmbedUrl(media.url))}"${dimAttr(media)} loading="lazy" alt="${esc(media.title||'')}">`
      + `<div class="media-caption">Scene image — ${esc(media.title||'')}</div>`;
    return wrap;
  }

  if (media.kind === 'Image') {
    wrap.className = 'media ' + sizeClass(media);
    wrap.innerHTML = `<img src="${esc(toEmbedUrl(media.url))}"${dimAttr(media)} loading="lazy" alt="${esc(media.title||'')}">`;
    if (media.caption) wrap.innerHTML += `<div class="media-caption">${esc(media.caption)}</div>`;
    return wrap;
  }

  if (media.kind === 'Image gallery') {
    wrap.className = 'media ' + sizeClass(media);
    const grid = document.createElement('div');
    grid.className = 'gallery';
    (media.gallery || []).forEach(g => {
      const img = document.createElement('img');
      img.loading = 'lazy';
      img.src = toEmbedUrl(g.url);
      img.alt = g.title || '';
      if (g.width && g.height) { img.width = g.width; img.height = g.height; }
      grid.appendChild(img);
    });
    wrap.appendChild(grid);
    if (media.caption) {
      const cap = document.createElement('div');
      cap.className = 'media-caption';
      cap.textContent = media.caption;
      wrap.appendChild(cap);
    }
    return wrap;
  }

  if (media.kind === 'Video' || media.kind === 'Video embed') {
    wrap.className = 'media ' + sizeClass(media);
    const src = toEmbedUrl(media.url);
    wrap.innerHTML = `<iframe src="${esc(src)}" height="${mapHeightFor(media)}" frameborder="0" `
      + `allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" `
      + `allowfullscreen loading="lazy"></iframe>`;
    let cap = media.title ? esc(media.title) : '';
    // Extract just the video ID before swapping in watch?v= — a naive string-replace left any
    // tracking/player query string (e.g. ?si=..., ?wmode=opaque&rel=0) stuck onto the ID, producing
    // a broken watch?v=ID?wmode=... link with two "?" in it.
    const embedMatch = media.url.match(/youtube\.com\/embed\/([^?&]+)/);
    const watchUrl = embedMatch
      ? `https://www.youtube.com/watch?v=${embedMatch[1]}`
      : media.url;
    cap += `${cap ? ' — ' : ''}<a href="${esc(watchUrl)}" target="_blank" rel="noopener">Open on YouTube ↗</a>`;
    wrap.innerHTML += `<div class="media-caption">${cap}</div>`;
    return wrap;
  }

  if (media.kind === 'Spotify embed') {
    wrap.className = 'media ' + sizeClass(media);
    wrap.innerHTML = `<iframe src="${esc(toEmbedUrl(media.url))}" height="80" frameborder="0" `
      + `allow="encrypted-media" loading="lazy"></iframe>`;
    let cap = media.title ? esc(media.title) : '';
    cap += `${cap ? ' — ' : ''}<a href="${esc(media.url)}" target="_blank" rel="noopener">Open on Spotify ↗</a>`;
    wrap.innerHTML += `<div class="media-caption">${cap}</div>`;
    return wrap;
  }

  if (media.kind && media.kind.startsWith('Interactive map')) {
    wrap.className = 'media ' + sizeClass(media);
    const mh = mapHeightFor(media);
    let embedSrc = '', label = '';
    if (media.custom_link_url) { embedSrc = media.custom_link_url; label = 'Custom map view'; }
    else if (media.webmap_id) {
      embedSrc = `https://www.arcgis.com/apps/Embed/index.html?webmap=${encodeURIComponent(media.webmap_id)}&zoom=true&scale=true&theme=light&disable_scroll=true`;
      if (media.extent_lonlat) embedSrc += `&extent=${media.extent_lonlat.join(',')}`;
      label = 'Live ArcGIS web map';
    }
    if (embedSrc) {
      // Click-to-load rather than embedding the iframe immediately: some map embeds (custom
      // GeoMapper/Gist links in particular) show their own blocking "loaded" dialog on mount —
      // with several such maps in one story that becomes unusable while editing. Not loading
      // until asked also means a genuinely lighter first paint for readers who skip a given map.
      const holder = document.createElement('div');
      holder.className = 'map-placeholder';
      holder.style.height = mh + 'px';
      holder.innerHTML = `<button class="map-load-btn" type="button">▶ Load interactive map</button>`;
      holder.querySelector('.map-load-btn').addEventListener('click', () => {
        // Tells the editor (if this page is embedded in one) that this specific map is now
        // loaded, by its position in the story — lets the editor silently reload it again after
        // its own refreshes, instead of every map you've already set up going back to a blank
        // "Load interactive map" button each time you edit something unrelated elsewhere.
        try { window.parent.postMessage({ type: 'sos-map-loaded', docIdx: wrap.dataset.docIdx }, '*'); } catch (e0) {}

        function buildIframe() {
          const f = document.createElement('iframe');
          f.src = embedSrc;
          f.height = mh;
          f.setAttribute('frameborder', '0');
          f.loading = 'lazy';
          return f;
        }

        // Listens for the embedded map's own "I'm ready" signal (bookmarks load asynchronously,
        // so this can't just fire immediately on iframe load) — see gm-ready / gm-loadBookmark in
        // Geo Mapper's own code. Always listens, not just when a bookmark name is already set:
        // this is also how the SOS editor discovers the map's actual bookmark names to offer as
        // a pick-list, rather than requiring anyone to type one by hand. Relayed one level up so
        // the editor (this iframe's own parent) can see it, since postMessage doesn't bubble.
        function wireGmReady(fr) {
          const onGmReady = (ev) => {
            if (ev.source !== fr.contentWindow) return;
            if (!ev.data || ev.data.type !== 'gm-ready') return;
            if (media.bookmark_name) {
              fr.contentWindow.postMessage({ type: 'gm-loadBookmark', name: media.bookmark_name }, '*');
            }
            try {
              window.parent.postMessage({ type: 'sos-gm-ready', docIdx: wrap.dataset.docIdx, bookmarkNames: ev.data.bookmarkNames || [] }, '*');
            } catch (e2) {}
            window.removeEventListener('message', onGmReady);
          };
          window.addEventListener('message', onGmReady);
        }

        let iframe = buildIframe();
        holder.replaceWith(iframe);
        wireGmReady(iframe);

        // Lets anyone reading the published story — not just the person editing it — expand a
        // map to fill the screen when a pop-up (or anything else) needs more room than whatever
        // fixed height was set for it, then collapse it back down again.
        wrap.style.position = 'relative';
        const toggleBtn = document.createElement('button');
        toggleBtn.type = 'button';
        toggleBtn.className = 'map-toggle-btn';
        toggleBtn.title = 'Maximise map';
        toggleBtn.innerHTML = '⛶';
        toggleBtn.addEventListener('click', () => {
          const maximized = wrap.classList.toggle('map-maximized');
          document.documentElement.classList.toggle('map-lock-scroll', maximized);
          toggleBtn.innerHTML = maximized ? '✕' : '⛶';
          toggleBtn.title = maximized ? 'Restore map size' : 'Maximise map';
        });
        wrap.appendChild(toggleBtn);

        // Locked-view behaviour, modelled on what Classic Cascade did: the map opens fixed to
        // the editor's chosen view, on a scroll-past page that's mostly text — without a lock,
        // an accidental wheel-scroll or drag over a full-width map changes ITS view instead of
        // scrolling the page, so the next reader (or the same reader scrolling back down) finds
        // it drifted away from the framing that was actually intended. This is enforced from
        // outside the map entirely (an overlay blocking interaction), the same way Cascade's own
        // app controlled it rather than the map's own bookmark data — so it works identically
        // regardless of what's embedded underneath.
        if (media.allow_explore === false) {
          // Editor has said this map should never be pannable/zoomable by readers at all.
          iframe.style.pointerEvents = 'none';
        } else {
          const lockOverlay = document.createElement('div');
          lockOverlay.className = 'map-lock-overlay';
          const exploreBtn = document.createElement('button');
          exploreBtn.type = 'button';
          exploreBtn.className = 'map-explore-btn';
          exploreBtn.textContent = '🔓 Explore this map';
          lockOverlay.appendChild(exploreBtn);
          wrap.appendChild(lockOverlay);
          let unlocked = false;
          // Only the button itself unlocks — the overlay still covers (and blocks) the whole
          // map underneath, but clicking anywhere else on it just absorbs the click and does
          // nothing, rather than treating a tap near one of the map's own icons as "unlock".
          exploreBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            unlocked = true;
            lockOverlay.classList.add('is-hidden');
          });

          // Once scrolled mostly out of view after being explored, silently reload back to the
          // locked, editor-chosen view — so it's never left wherever a reader happened to leave
          // it. A fresh iframe load is what actually resets the view; it works for any embed
          // (Geo Mapper bookmark, ArcGIS custom link, or the generic fallback) without needing to
          // know anything about what's inside it.
          const io = new IntersectionObserver((entries) => {
            entries.forEach((entry) => {
              if (!entry.isIntersecting && unlocked) {
                unlocked = false;
                lockOverlay.classList.remove('is-hidden');
                const fresh = buildIframe();
                iframe.replaceWith(fresh);
                iframe = fresh;
                wireGmReady(iframe);
              }
            });
          }, { threshold: 0 });
          io.observe(wrap);
        }
      });
      wrap.appendChild(holder);
      const cap = document.createElement('div');
      cap.className = 'media-caption';
      cap.innerHTML = `${label} — <a href="${esc(media.custom_link_url || media.url)}" target="_blank" rel="noopener">open full map ↗</a>`;
      wrap.appendChild(cap);
    } else {
      wrap.className = 'placeholder';
      wrap.innerHTML = `Interactive map — no embeddable ID found.<br><a href="${esc(media.url)}" target="_blank">${esc(media.title||media.url)}</a>`;
    }
    return wrap;
  }

  wrap.className = 'placeholder';
  wrap.innerHTML = `${esc(media.kind||'Media')}: <a href="${esc(media.url)}" target="_blank">${esc(media.title||media.url||'')}</a>`;
  return wrap;
}

const app = document.getElementById('app');

function buildNav() {
  if (!navConfig.bookmarks || !navConfig.bookmarks.length) return;
  const nav = document.createElement('div');
  nav.className = 'storynav';
  let brandHtml = '';
  if (navConfig.header_logo_url) brandHtml += `<img src="${esc(navConfig.header_logo_url)}" alt="">`;
  brandHtml += `<span>${esc(document.title)}</span>`;
  const tabsHtml = navConfig.bookmarks.map((b, i) =>
    `<a class="tab${i === 0 ? ' active' : ''}" data-anchor="${esc(b.anchor)}" href="#${esc(b.anchor)}">${esc(b.label)}</a>`
  ).join('');
  nav.innerHTML = `<div class="brand">${brandHtml}</div><div class="tabs">${tabsHtml}</div>`
    + (navConfig.header_title ? `<div class="credit">${esc(navConfig.header_title)}</div>` : '');
  app.appendChild(nav);

  // Measure the real, rendered nav height (varies by theme/font/logo) instead of guessing a
  // fixed pixel offset — used both to keep clicked headings from landing hidden behind the
  // sticky bar (via scroll-margin-top) and to keep the scroll-spy active-tab detection in sync.
  const navH = nav.offsetHeight || 76;
  document.documentElement.style.setProperty('--nav-h', navH + 'px');

  nav.querySelectorAll('a.tab').forEach(a => {
    a.addEventListener('click', e => {
      e.preventDefault();
      const target = document.getElementById(a.dataset.anchor);
      if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    });
  });

  window.addEventListener('scroll', () => {
    const anchors = navConfig.bookmarks.map(b => document.getElementById(b.anchor)).filter(Boolean);
    let current = anchors[0];
    for (const el of anchors) {
      if (el.getBoundingClientRect().top - navH - 4 <= 0) current = el;
    }
    nav.querySelectorAll('a.tab').forEach(a => {
      a.classList.toggle('active', current && a.dataset.anchor === current.id);
    });
  }, { passive: true });
}

let idx = 0;
if (items[0] && items[0].level === 1) {
  const cover = document.createElement('div');
  cover.className = 'cover';
  if (navConfig.cover_text === 'dark') cover.classList.add('cover-text-dark');
  if (navConfig.cover_box === 'light') cover.classList.add('cover-box-light');
  else if (navConfig.cover_box === 'dark') cover.classList.add('cover-box-dark');
  cover.id = 'top';
  cover.dataset.docIdx = 'cover';
  let bgUrl = '', bgMedia = null;
  let subtitle = '';
  for (let i = 1; i < Math.min(items.length, 4); i++) {
    if (items[i].media && items[i].media.kind === 'Background image (cover)') { bgUrl = toEmbedUrl(items[i].media.url); bgMedia = items[i].media; }
    if (items[i].para && !subtitle) subtitle = renderRuns(items[i].para);
  }
  if (bgUrl) {
    cover.style.backgroundImage = `url('${bgUrl}')`;
    // The author's real focal point from Cascade, when known — otherwise fall back to a plain
    // centred crop rather than guessing.
    if (bgMedia && typeof bgMedia.focal_x === 'number' && typeof bgMedia.focal_y === 'number') {
      cover.style.backgroundPosition = `${(bgMedia.focal_x * 100).toFixed(1)}% ${(bgMedia.focal_y * 100).toFixed(1)}%`;
    }
    if (bgMedia && bgMedia.fit_color) cover.style.backgroundColor = bgMedia.fit_color;
  }
  cover.innerHTML = `<div class="cover-text"><h1>${esc(items[0].text)}</h1><div class="subtitle">${subtitle}</div></div>`;
  app.appendChild(cover);
  idx = 1;
}

document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  document.querySelectorAll('.media.map-maximized').forEach(el => {
    el.classList.remove('map-maximized');
    const btn = el.querySelector('.map-toggle-btn');
    if (btn) { btn.innerHTML = '⛶'; btn.title = 'Maximise map'; }
  });
  document.documentElement.classList.remove('map-lock-scroll');
});

buildNav();

const main = document.createElement('main');
app.appendChild(main);

function renderSectionBanner(headingItem, mediaItem, headingIdx) {
  const m = mediaItem.media;
  const div = document.createElement('div');
  div.className = 'section-banner';
  div.dataset.docIdx = headingIdx;
  const bgUrl = toEmbedUrl(m.url);
  if (bgUrl) div.style.backgroundImage = `url('${bgUrl}')`;
  if (typeof m.focal_x === 'number' && typeof m.focal_y === 'number') {
    div.style.backgroundPosition = `${(m.focal_x * 100).toFixed(1)}% ${(m.focal_y * 100).toFixed(1)}%`;
  }
  if (m.fit_color) div.style.backgroundColor = m.fit_color;
  div.style.minHeight = (m.banner_height_px || 340) + 'px';
  const textWrap = document.createElement('div');
  textWrap.className = 'section-banner-text';
  const h = document.createElement(headingItem.level === 2 ? 'h2' : 'h3');
  h.textContent = headingItem.text;
  if (headingItem.anchor) h.id = headingItem.anchor;
  textWrap.appendChild(h);
  div.appendChild(textWrap);
  return div;
}

function renderStackedLayout(startIdx) {
  for (let idx = startIdx; idx < items.length; idx++) {
    const item = items[idx];

    if (item.level === 1) continue;
    if (item.media && item.media.kind === 'Background image (cover)') continue;
    if (idx <= 2 && item.para) continue;

    // "Leitmotif" section banners: a heading with its own themed background image behind it,
    // opted into per-image (not automatic) — mirrors the cover's own treatment, just scoped to
    // one section rather than the whole story. Only kicks in when the very next item is an image
    // explicitly marked for this.
    if (item.level !== undefined && items[idx + 1] && items[idx + 1].media && items[idx + 1].media.use_as_banner) {
      main.appendChild(renderSectionBanner(item, items[idx + 1], idx));
      idx++; // this consumed the following image item too
      continue;
    }

    if (item.level !== undefined) {
      const h = document.createElement(item.level === 2 ? 'h2' : 'h3');
      h.textContent = item.text;
      if (item.anchor) h.id = item.anchor;
      h.dataset.docIdx = idx;
      main.appendChild(h);
    } else if (item.para) {
      const p = document.createElement('p');
      p.innerHTML = renderRuns(item.para);
      p.dataset.docIdx = idx;
      main.appendChild(p);
    } else if (item.media) {
      const m = renderMedia(item.media);
      m.dataset.docIdx = idx;
      main.appendChild(m);
    } else if (item.credits) {
      const box = document.createElement('div');
      box.className = 'credits';
      box.dataset.docIdx = idx;
      item.credits.forEach(([label, source, link]) => {
        const e = document.createElement('div');
        e.className = 'entry';
        e.innerHTML = `<b>${esc(label)}</b>${source ? ' — ' + esc(source) : ''}` +
          (link ? `<br><a href="${esc(link)}" target="_blank">${esc(link)}</a>` : '');
        box.appendChild(e);
      });
      main.appendChild(box);
    }
  }
}

/* ==================== side-panel layout (Journal-style scroll sync) ====================
   Groups the flat items[] into panels (one per heading, plus a leading intro panel for
   anything before the first heading). Each panel's FIRST media item becomes its "panel media" —
   shown in the sticky left column while that panel is in view — exactly mirroring how the
   original Journal always paired one section with one persistent side-panel visual. Any
   additional media in the same panel stays in the scrolling text column instead of being
   dropped, the same "preserve everything, degrade honestly" approach used throughout this
   toolkit rather than silently discarding a second image a section happened to have. */

function groupIntoPanels(startIdx) {
  const panels = [];
  let current = { heading: null, anchor: null, media: null, body: [] };
  let hasContent = false;

  function pushCurrentIfNonEmpty() {
    if (hasContent) panels.push(current);
  }

  for (let idx = startIdx; idx < items.length; idx++) {
    const item = items[idx];
    if (item.level === 1) continue; // cover title, already rendered separately
    if (item.media && item.media.kind === 'Background image (cover)') continue;
    if (idx <= 2 && item.para) continue; // cover subtitle, already rendered on the cover

    if (item.level !== undefined) {
      pushCurrentIfNonEmpty();
      current = { heading: item.text, anchor: item.anchor || null, media: null, body: [] };
      hasContent = true;
      continue;
    }

    hasContent = true;
    if (item.media && !current.media) {
      current.media = item.media; // first media in this panel -> the panel's fixed visual
    } else {
      current.body.push(item); // everything else (including any 2nd+ media) stays in the text flow
    }
  }
  pushCurrentIfNonEmpty();
  return panels;
}

function renderPanelBody(panel, panelIdx) {
  const section = document.createElement('section');
  section.className = 'sidepanel-panel';
  section.dataset.panelIdx = panelIdx;
  if (panel.heading) {
    const h = document.createElement('h2');
    h.textContent = panel.heading;
    if (panel.anchor) h.id = panel.anchor;
    section.appendChild(h);
  }
  panel.body.forEach(item => {
    if (item.para) {
      const p = document.createElement('p');
      p.innerHTML = renderRuns(item.para);
      section.appendChild(p);
    } else if (item.media) {
      section.appendChild(renderMedia(item.media));
    } else if (item.credits) {
      const box = document.createElement('div');
      box.className = 'credits';
      item.credits.forEach(([label, source, link]) => {
        const e = document.createElement('div');
        e.className = 'entry';
        e.innerHTML = `<b>${esc(label)}</b>${source ? ' — ' + esc(source) : ''}` +
          (link ? `<br><a href="${esc(link)}" target="_blank">${esc(link)}</a>` : '');
        box.appendChild(e);
      });
      section.appendChild(box);
    }
  });
  return section;
}

function renderSidePanelLayout(startIdx) {
  const panels = groupIntoPanels(startIdx);
  if (!panels.length) return; // nothing to show in this mode -- leave main empty rather than error

  const layout = document.createElement('div');
  layout.className = 'sidepanel-layout';
  const mediaCol = document.createElement('div');
  mediaCol.className = 'sidepanel-media';
  mediaCol.id = 'sidepanelMedia';
  const textCol = document.createElement('div');
  textCol.className = 'sidepanel-text';

  panels.forEach((panel, i) => textCol.appendChild(renderPanelBody(panel, i)));

  layout.appendChild(mediaCol);
  layout.appendChild(textCol);
  const breakout = document.createElement('div');
  breakout.className = 'sidepanel-breakout';
  breakout.appendChild(layout);
  main.appendChild(breakout);

  // Lazily rendered per panel, the first time it's actually needed -- not upfront for all
  // panels, which matters a lot for a story with a dozen map embeds: each map only actually
  // loads once the reader has scrolled to the section it belongs to, same click-to-load spirit
  // the rest of this template already uses for maps, just triggered by scroll instead of a click.
  const renderedMediaCache = {};
  let activePanelIdx = -1;

  function showPanelMedia(panelIdx) {
    if (panelIdx === activePanelIdx) return;
    const panel = panels[panelIdx];
    if (!panel.media) return; // no fresh visual for this panel -- keep showing whatever's already there
    activePanelIdx = panelIdx;
    const swap = () => {
      mediaCol.innerHTML = '';
      if (!renderedMediaCache[panelIdx]) renderedMediaCache[panelIdx] = renderMedia(panel.media);
      mediaCol.appendChild(renderedMediaCache[panelIdx]);
      mediaCol.classList.remove('is-swapping');
    };
    if (mediaCol.childElementCount === 0) {
      swap(); // first paint -- no fade needed, nothing to fade from
    } else {
      mediaCol.classList.add('is-swapping');
      setTimeout(swap, 220);
    }
  }

  // Panel 0 shown immediately, synchronously, so there's no blank/empty left column on first
  // paint while waiting for the reader to scroll or for the observer to fire.
  showPanelMedia(0);

  // A panel becomes "active" when it's crossing roughly the vertical middle of the viewport --
  // a wide (-45%/-45%) band rather than a hard line, so ordinary scroll jitter near a panel
  // boundary doesn't cause the image to flicker back and forth between two panels.
  if ('IntersectionObserver' in window) {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) showPanelMedia(Number(entry.target.dataset.panelIdx));
      });
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });
    textCol.querySelectorAll('.sidepanel-panel').forEach(el => observer.observe(el));
  }
  // No IntersectionObserver support: panel 0's media (already shown above) simply stays fixed
  // for the whole story rather than swapping -- a plain, working fallback, not a broken one.
}

if (navConfig.layout === 'sidepanel') {
  renderSidePanelLayout(idx);
} else {
  renderStackedLayout(idx);
}

// "Load all maps": maps are click-to-load so a story with dozens of them doesn't open 30+ embeds at
// once, but readers of a long story shouldn't have to click each one. This adds one optional button
// to the nav bar that loads every map on the page in one go. Stacked layout only: the side-panel
// layout shows a single map at a time, so there is nothing to load in bulk.
function addLoadAllMapsButton() {
  if (navConfig.layout === 'sidepanel') return;
  const nav = document.querySelector('.storynav');
  if (!nav) return;
  const remaining = () => document.querySelectorAll('.map-load-btn');
  if (remaining().length < 2) return;
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'loadall-btn';
  btn.title = 'Load every interactive map in this story at once';
  const credit = nav.querySelector('.credit');
  nav.insertBefore(btn, credit || null);
  function refresh() {
    const n = remaining().length;
    if (n < 2) { btn.remove(); return; }   // one or none left: the individual buttons are enough
    btn.innerHTML = '\u25B6 Load all maps <span class="count">(' + n + ')</span>';
  }
  btn.addEventListener('click', () => {
    btn.disabled = true;
    btn.textContent = 'Loading maps\u2026';
    // Staggered a little rather than all in the same instant, so the browser isn't asked to start
    // dozens of map embeds in one frame.
    Array.from(remaining()).forEach((b, i) => setTimeout(() => b.click(), i * 120));
    setTimeout(() => btn.remove(), remaining().length * 120 + 200);
  });
  document.addEventListener('click', () => setTimeout(refresh, 0));
  refresh();
}
addLoadAllMapsButton();
</script>
</body>
</html>
