<style>
:root{
  --red:#B8202F; --red-soft:#F6E3E4; --ink:#1F1B18; --muted:#6B625B; --line:#E7E0D8;
  --paper:#FBF8F4; --card:#FFFFFF; --sand:#E2B567; --earth:#B0683A; --jungle:#3F8A5A;
  --sea:#4D86B5; --radius:14px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(60,40,20,.07);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
.logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(90deg,var(--red) 33%,#fff 33% 66%,var(--red) 66%);border:1px solid var(--line);flex:none}
header h1{font:700 1.25rem/1.1 Fraunces,Georgia,serif;margin:0}
header h1 small{font:500 .78rem Inter;color:var(--muted);margin-left:6px}
.lang{margin-left:auto;display:flex;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:2px}
.lang button{border:0;background:none;font:600 .75rem Inter,system-ui,sans-serif;padding:4px 10px;border-radius:99px;cursor:pointer;color:var(--muted)}
.lang button.on{background:var(--ink);color:#fff}
.ver{font:600 .75rem Inter;color:var(--red);background:var(--red-soft);padding:4px 10px;border-radius:99px}
main{display:grid;grid-template-columns:1fr 420px;height:calc(100% - 59px)}
#mapWrap{position:relative}
#map{position:absolute;inset:0;background:#EEF3F6}
.toolbar{position:absolute;top:12px;left:56px;z-index:500;display:flex;gap:4px;background:var(--card);padding:4px;border-radius:12px;box-shadow:var(--shadow);flex-wrap:wrap}
.toolbar span{font:600 .72rem Inter;color:var(--muted);padding:6px 6px 6px 8px;text-transform:uppercase;letter-spacing:.04em}
.toolbar button{border:0;background:none;font:500 .85rem Inter;padding:6px 11px;border-radius:9px;cursor:pointer;color:var(--ink)}
.toolbar button.on{background:var(--ink);color:#fff}
.legend{position:absolute;left:12px;bottom:24px;z-index:500;background:var(--card);padding:10px 12px;border-radius:12px;box-shadow:var(--shadow);font-size:.8rem;min-width:150px}
.legend b{display:block;font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:6px}
.legend div{display:flex;align-items:center;gap:8px;margin:3px 0}
.legend i{width:14px;height:14px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.08)}
aside{background:var(--card);border-left:1px solid var(--line);overflow-y:auto;display:flex;flex-direction:column}
.pad{padding:18px 20px}
.search{position:sticky;top:0;background:var(--card);z-index:2;padding:14px 20px;border-bottom:1px solid var(--line)}
.search input{width:100%;padding:10px 14px;border:1px solid var(--line);border-radius:10px;font:inherit;background:var(--paper)}
.search input:focus{outline:2px solid var(--red);border-color:transparent}
.intro h2{font:700 1.5rem/1.2 Fraunces,Georgia,serif;margin:0 0 6px}
.intro p{color:var(--muted);margin:0 0 14px}
.peru-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:18px}
.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;cursor:pointer}
.list li:hover,.list li:focus{background:var(--paper);outline:none}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.list .nm{font-weight:500}
.list .cap{color:var(--muted);font-size:.82rem;margin-left:auto}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);font:500 .85rem Inter;cursor:pointer;padding:0;margin-bottom:12px}
.back:hover{color:var(--ink)}
.hero{display:flex;gap:16px;align-items:center}
.flag{width:120px;height:80px;border-radius:8px;background:var(--paper) center/cover no-repeat;border:1px solid var(--line);flex:none;display:grid;place-items:center;overflow:hidden}
.flag img{width:100%;height:100%;object-fit:cover}
.flag .ph{font-size:.7rem;color:var(--muted);text-align:center;padding:6px}
.hero h2{font:700 1.65rem/1.1 Fraunces,Georgia,serif;margin:0 0 4px}
.hero .sub{color:var(--muted);font-size:.9rem}
.badges{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.badge{font:600 .72rem Inter;padding:3px 9px;border-radius:99px;background:var(--paper);border:1px solid var(--line)}
.badge.coast{background:#E5EFF7;border-color:#C9DCEC;color:#245A86}
.badge.land{background:#F3EBDD;border-color:#E6D6BB;color:#7A5320}
.section{margin-top:20px}
.section h3{font:600 .72rem Inter;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--paper);border-radius:12px;padding:10px 12px}
.tile .v{font:700 1.15rem/1.2 Fraunces,Georgia,serif}
.tile .l{font-size:.75rem;color:var(--muted)}
.tile .r{font-size:.7rem;color:var(--red);font-weight:600;margin-top:2px}
.outline{display:grid;grid-template-columns:1fr 110px;gap:10px;background:var(--paper);border-radius:12px;padding:12px;align-items:center}
.outline .shape svg,.outline .loc svg{width:100%;height:auto;display:block}
.cap-note svg{width:12px;height:12px;flex:none}
.outline .loc{border-left:1px dashed var(--line);padding-left:10px}
.cap-note{font-size:.75rem;color:var(--muted);display:flex;gap:6px;align-items:center;margin-top:8px}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0}
dl.facts dt{color:var(--muted);font-size:.85rem}
dl.facts dd{margin:0;font-weight:500;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:4px 10px;font:500 .8rem Inter;cursor:pointer}
.chip:hover{border-color:var(--red);color:var(--red)}
.about{background:var(--red-soft);border-radius:12px;padding:12px 14px;font-size:.92rem}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:22px;padding-top:14px;border-top:1px solid var(--line)}
.nav button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px;font:500 .85rem Inter;cursor:pointer}
.nav button:hover{border-color:var(--ink)}
.foot{font-size:.72rem;color:var(--muted);margin-top:16px;line-height:1.45}
.foot a{color:var(--muted)}
.leaflet-tooltip.tt{font:600 .8rem Inter;border-radius:8px;border:0;box-shadow:var(--shadow);padding:4px 8px}
.mapopts{position:absolute;top:12px;right:12px;z-index:600;font-size:.85rem;display:flex;flex-direction:column;align-items:flex-end}
.mo-btn{display:flex;align-items:center;gap:7px;border:0;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:8px 12px;font:600 .85rem Inter,system-ui,sans-serif;cursor:pointer;color:var(--ink)}
.mo-btn[aria-expanded="true"]{background:var(--ink);color:#fff}
.mo-panel{margin-top:6px;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:10px;width:250px;max-height:70vh;overflow:auto}
.mo-panel h4{margin:2px 4px 6px;font:600 .7rem Inter,system-ui,sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.mo-panel label{display:flex;align-items:center;gap:9px;padding:6px 6px;border-radius:8px;cursor:pointer}
.mo-panel label:hover{background:var(--paper)}
.mo-panel input{accent-color:var(--red);margin:0}
.mo-panel hr{border:0;border-top:1px solid var(--line);margin:8px 0}
.mo-panel .sw{width:22px;height:16px;border-radius:4px;flex:none;border:1px solid rgba(0,0,0,.1)}
@media (max-width:860px){
  .mapopts{top:58px;right:10px}
  .mo-panel{max-height:calc(46vh - 110px);width:230px}
  .mo-btn{padding:7px 10px}
  main{grid-template-columns:1fr;grid-template-rows:46vh auto;height:auto}
  #mapWrap{height:46vh}
  aside{border-left:0;border-top:1px solid var(--line);overflow:visible}
  .toolbar{left:10px;right:10px;top:10px;justify-content:center}
  .toolbar span{display:none}
  .toolbar button{padding:6px 7px;font-size:.8rem}
  .legend{left:10px;bottom:22px;min-width:0;padding:7px 9px;font-size:.72rem}
  .legend div{margin:1px 0}
  .leaflet-control-attribution{font-size:9px}
  .leaflet-control-zoom{display:none}
  header h1 small{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo" aria-hidden="true"></div>
  <h1>Geo States <small id="sub">Departments of Peru</small></h1>
  <div class="lang" role="group" aria-label="Language / Idioma"><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
  <span class="ver">v4</span>
</header>
<main>
  <div id="mapWrap">
    <div id="map" aria-label="Map of the departments of Peru"></div>
    <div class="toolbar" id="toolbar">
      <span id="cb">Colour by</span>
      <button data-mode="region" class="on">Landscape</button>
      <button data-mode="coast">Coast</button>
      <button data-mode="pop">Population</button>
      <button data-mode="area">Area</button>
      <button data-mode="density">Density</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="mapopts" id="mapopts">
      <button class="mo-btn" id="moBtn" aria-expanded="false" aria-controls="moPanel"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 2 8l10 5 10-5-10-5Z"/><path d="m2 13 10 5 10-5"/></svg><span id="moLabel">Map</span></button>
      <div class="mo-panel" id="moPanel" hidden>
        <h4 id="moBase">Basemap</h4>
        <div id="moList"></div>
        <hr>
        <label><input type="checkbox" id="zoomTo"><span id="moZoom">Zoom to selected department</span></label>
      </div>
    </div>
  </div>
  <aside id="panel"></aside>
</main>

/* ---------- Outline SVG ---------- */
function rings(g){return g.type==="Polygon"?[g.coordinates]:g.coordinates;}
function svgFor(geoms,w,h,highlight,capLL){
  let pts=[];geoms.forEach(g=>rings(g.geom).forEach(p=>p.forEach(r=>pts.push(...r))));
  const lat0=pts.reduce((s,p)=>s+p[1],0)/pts.length,k=Math.cos(lat0*Math.PI/180);
  const xs=pts.map(p=>p[0]*k),ys=pts.map(p=>-p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const pad=6,sc=Math.min((w-2*pad)/(x1-x0),(h-2*pad)/(y1-y0));
  const ox=(w-(x1-x0)*sc)/2,oy=(h-(y1-y0)*sc)/2;
  const P=(lon,lat)=>[(lon*k-x0)*sc+ox,(-lat-y0)*sc+oy];
  const path=g=>rings(g).map(poly=>poly.map(r=>"M"+r.map(c=>P(c[0],c[1]).map(v=>v.toFixed(1)).join(",")).join("L")+"Z").join("")).join("");
  let s=`<svg viewBox="0 0 ${w} ${h}" role="img">`;
  geoms.forEach(g=>{const on=!highlight||g===highlight;
    s+=`<path d="${path(g.geom)}" fill="${on?(highlight?"#B8202F":"#D8CFC5"):"#E3DBD2"}" stroke="${on&&highlight?"#7E1220":"#fff"}" stroke-width="${highlight&&on?1.2:.6}" stroke-linejoin="round"/>`;});
  if(capLL){const [cx,cy]=P(capLL[1],capLL[0]);s+=`<circle cx="${cx}" cy="${cy}" r="5.5" fill="#fff" stroke="#1F1B18" stroke-width="2"/><circle cx="${cx}" cy="${cy}" r="2" fill="#1F1B18"/>`;}
  return s+"</svg>";
}

/* ---------- Flags (via Wikidata P41) ---------- */
const flagCache={};
const fileURL=f=>"https://commons.wikimedia.org/wiki/Special:FilePath/"+encodeURIComponent(f.replace(/ /g,"_"))+"?width=360";
async function wikidataFlag(site,title){
  const u=`https://www.wikidata.org/w/api.php?action=wbgetentities&sites=${site}&titles=${encodeURIComponent(title)}&props=claims&normalize=1&format=json&origin=*`;
  const j=await (await fetch(u)).json();
  const ent=Object.values(j.entities||{}).find(e=>e.claims);
  const c=ent?.claims?.P41;if(!c||!c.length)return null;
  const live=c.filter(x=>!(x.qualifiers&&x.qualifiers.P582));
  const pick=(live.find(x=>x.rank==="preferred")||live[0]||c[0]);
  return pick?.mainsnak?.datavalue?.value||null;
}
async function findFlag(d){
  if(d.id in flagCache)return flagCache[d.id];
  const tries=SITES[d.id]||[];
  for(let i=0;i<tries.length;i++){
    try{const f=await wikidataFlag(i===0?"enwiki":"eswiki",tries[i]);if(f)return flagCache[d.id]=[f,...d.flag];}catch(e){}
  }
  return flagCache[d.id]=d.flag.slice();
}
async function showFlag(d){
  const box=document.getElementById("flag");if(!box)return;
  const files=await findFlag(d);if(selected!==d)return;
  let i=0;
  const next=()=>{if(i>=files.length){box.innerHTML=`<div class="ph">${t("flagNone")}</div>`;return;}
    const img=new Image();img.alt=t("flagOf")+d.n;img.onload=()=>{box.innerHTML="";box.appendChild(img);};img.onerror=()=>{i++;next();};img.src=fileURL(files[i]);};
  next();
}

/* ---------- Panel ---------- */
const panel=document.getElementById("panel");
const regBadges=d=>d.reg.map(r=>`<span class="badge" style="border-color:${REGC[r]}">${t("reg")[r]}</span>`).join("");
const fold=s=>s.normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let lastQuery="";
function renderHome(q=""){
  lastQuery=q;selected=null;if(capMarker){capMarker.remove();capMarker=null;}
  const totalPop=D.reduce((s,d)=>s+d.pop,0),totalArea=D.reduce((s,d)=>s+d.area,0);
  const ql=fold(q);
  const list=order.filter(d=>fold(d.n+" "+d.cap).includes(ql));
  panel.innerHTML=`<div class="search"><input type="search" placeholder="${t("search")}" value="${esc(q)}" aria-label="${t("search")}"></div>
  <div class="pad intro">
    <h2>${t("title")}</h2>
    <p>${t("intro")}</p>
    <div class="peru-stats">
      <div class="tile"><div class="v">25</div><div class="l">${t("regions")}</div></div>
      <div class="tile"><div class="v">${fmtShort(totalPop)}</div><div class="l">${t("people2017")}</div></div>
      <div class="tile"><div class="v">${fmtShort(totalArea)}</div><div class="l">km²</div></div>
    </div>
    <ul class="list">${list.map(d=>`<li tabindex="0" data-id="${d.id}"><span class="dot" style="background:${fillFor(d)}"></span><span class="nm">${d.n}</span><span class="cap">${d.cap}</span></li>`).join("")||`<li>${t("nomatch")}</li>`}</ul>
  </div>`;
  const inp=panel.querySelector("input");
  inp.addEventListener("input",()=>{const v=inp.value,p=inp.selectionStart;renderHome(v);const n=panel.querySelector("input");n.focus();n.setSelectionRange(p,p);});
  inp.addEventListener("keydown",e=>{if(e.key==="Enter"&&list.length)select(list[0].id);});
  layer.setStyle(style);
}
panel.addEventListener("click",e=>{
  const el=e.target.closest("[data-id]");if(el)select(el.dataset.id);
  if(e.target.closest(".back")){renderHome();if(zoomOn)map.flyToBounds(peruBounds,{padding:[20,20],duration:.6});}
});
panel.addEventListener("keydown",e=>{const el=e.target.closest("li[data-id]");if(el&&e.key==="Enter")select(el.dataset.id);});

function zoomToDept(d){map.flyToBounds(d.layer.getBounds(),{padding:[40,40],maxZoom:d.area<500?10:8,duration:.7});}
function select(id,keepView){
  const d=byId[id];if(!d)return;selected=d;
  layer.setStyle(style);d.layer.bringToFront();
  if(!keepView){
    if(zoomOn)zoomToDept(d);
    else if(!map.getBounds().contains(d.layer.getBounds()))map.flyToBounds(peruBounds,{padding:[20,20],duration:.6});
  }
  if(capMarker)capMarker.remove();
  capMarker=L.circleMarker(d.ll,{radius:6,color:"#1F1B18",weight:2,fillColor:"#fff",fillOpacity:1}).bindTooltip(d.cap+" ("+t("capital").toLowerCase()+")",{className:"tt",direction:"right",offset:[8,0]}).addTo(map);
  const idx=order.indexOf(d),prev=order[(idx+24)%25],next=order[(idx+1)%25];
  const all=D.map(x=>({geom:x.geom}));const me=all[D.indexOf(d)];
  const isCallao=d.id==="CALLAO";
  const wiki=lang==="es"?`https://es.wikipedia.org/w/index.php?search=${encodeURIComponent((SITES[d.id]||[,d.n])[1])}`:`https://en.wikipedia.org/w/index.php?search=${encodeURIComponent((SITES[d.id]||[d.n])[0])}`;
  panel.innerHTML=`<div class="pad">
    <button class="back">← ${t("back")}</button>
    <div class="hero">
      <div class="flag" id="flag"><div class="ph">${t("flagLoading")}</div></div>
      <div><h2>${d.n}</h2><div class="sub">${isCallao?t("constProv"):t("dept")} · ${t("capital").toLowerCase()} <b>${d.cap}</b></div>
      <div class="badges"><span class="badge ${d.coast?"coast":"land"}">${d.coast?"🌊 "+t("coastal"):"⛰ "+t("landlocked")}</span></div></div>
    </div>

    <div class="section"><h3>${t("glance")}</h3>
      <div class="tiles">
        <div class="tile"><div class="v">${fmtShort(d.pop)}</div><div class="l">${t("people")}</div><div class="r">#${d.popRank} ${t("of")} 25</div></div>
        <div class="tile"><div class="v">${fmt(d.area)}</div><div class="l">km²</div><div class="r">#${d.areaRank} ${t("of")} 25</div></div>
        <div class="tile"><div class="v">${d.dens<10?fmtDec(d.dens):fmt(Math.round(d.dens))}</div><div class="l">${t("perKm")}</div><div class="r">#${d.densRank} ${t("of")} 25</div></div>
      </div>
    </div>

    <div class="section"><h3>${t("shape")}</h3>
      <div class="outline">
        <div class="shape">${svgFor([{geom:d.geom}],260,200,null,d.ll).replace('fill="#D8CFC5"','fill="#B8202F"').replace('stroke="#fff"','stroke="#7E1220"')}</div>
        <div class="loc">${svgFor(all,100,150,me,null)}</div>
      </div>
      <div class="cap-note"><svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="#fff" stroke="#1F1B18" stroke-width="2"/></svg> ${d.cap} (${t("capital").toLowerCase()}) &nbsp;·&nbsp; ${t("inset")}</div>
    </div>

    <div class="section"><h3>${t("about")}</h3><div class="about">${lang==="es"?ABOUT_ES[d.id]:d.about}</div></div>

    <div class="section"><h3>${t("facts")}</h3>
      <dl class="facts">
        <dt>${t("capital")}</dt><dd>${d.cap} · ${t("elev")(fmt(d.elev))}</dd>
        <dt>${t("coastline")}</dt><dd>${d.coast?t("yesCoast"):t("noCoast")}${d.id==="PUNO"?" "+t("titicaca"):""}</dd>
        <dt>${t("landscape")}</dt><dd><div class="badges" style="margin:0">${regBadges(d)}</div></dd>
        <dt>${t("borders")}</dt><dd>${d.ctry.length?d.ctry.map(c=>t("ctry")[c]||c).join(", "):t("noBorder")}</dd>
      </dl>
    </div>

    <div class="section"><h3>${t("neighbours")}</h3>
      <div class="chips">${d.nb.map(n=>`<button class="chip" data-id="${n}">${byId[n].n}</button>`).join("")}</div>
    </div>

    <div class="nav"><button data-id="${prev.id}">← ${prev.n}</button><button data-id="${next.id}">${next.n} →</button></div>
    <div class="foot">${t("foot")} <a href="${wiki}" target="_blank" rel="noopener">${t("wiki")} ↗</a></div>
  </div>`;
  if(!keepView){panel.scrollTop=0;if(window.innerWidth<=860)panel.scrollIntoView({behavior:"smooth",block:"start"});}
  showFlag(d);
}
document.addEventListener("keydown",e=>{
  if(!selected||e.target.tagName==="INPUT")return;
  const i=order.indexOf(selected);
  if(e.key==="ArrowRight")select(order[(i+1)%25].id);
  if(e.key==="ArrowLeft")select(order[(i+24)%25].id);
  if(e.key==="Escape"&&document.getElementById("moPanel").hidden){renderHome();if(zoomOn)map.flyToBounds(peruBounds,{padding:[20,20],duration:.6});}
});

/* ---------- Language ---------- */
function applyLang(l){
  lang=l;try{localStorage.setItem("geoStatesLang",l);}catch(e){}
  document.documentElement.lang=l;
  document.title="Geo States · "+t("titleShort")+" v4";
  document.getElementById("sub").textContent=t("title");
  document.getElementById("cb").textContent=t("colourBy");
  document.querySelectorAll(".toolbar button").forEach(b=>b.textContent=t("modes")[b.dataset.mode]);
  document.getElementById("map").setAttribute("aria-label",t("mapLabel"));
  document.querySelectorAll(".lang button").forEach(b=>{b.classList.toggle("on",b.dataset.lang===l);b.setAttribute("aria-pressed",b.dataset.lang===l);});
  legend();renderMapOpts();
  const sp=panel.scrollTop;
  if(selected){select(selected.id,true);panel.scrollTop=sp;}else renderHome(lastQuery);
}
document.querySelector(".lang").addEventListener("click",e=>{const b=e.target.closest("button");if(b&&b.dataset.lang!==lang)applyLang(b.dataset.lang);});
applyLang(lang);

</script>
