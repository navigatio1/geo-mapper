<!DOCTYPE html>
<html>
<head>
    <title>Navigatio Earth - Mapping Applications</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        .container {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #7f8c8d;
            margin-bottom: 30px;
        }
        .app-list {
            list-style: none;
            padding: 0;
        }
        .app-list li {
            margin: 15px 0;
        }
        .app-list a {
            display: block;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 8px;
            text-decoration: none;
            color: #2c3e50;
            border-left: 4px solid #3498db;
            transition: all 0.3s;
        }
        .app-list a:hover {
            background: #e9ecef;
            transform: translateX(5px);
            border-left-color: #2980b9;
        }
        .app-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 5px;
        }
        .app-desc {
            color: #7f8c8d;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌍 Navigatio Earth</h1>
        <p class="subtitle">Professional Mapping & Geospatial Applications</p>
        
        <ul class="app-list">
            <li>
                <a href="/map/">
                    <div class="app-title">📍 Geo Point Mapper</div>
                    <div class="app-desc">Interactive map for visualizing geographic data with custom symbols, time animation, and overlay layers</div>
                </a>
            </li>
            <!-- Add more apps here later -->
        </ul>
    </div>
</body>
</html>
