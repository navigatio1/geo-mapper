// flagcdn.com works on all Android devices; no emoji dependency
// flagcdn.com valid 4:3 sizes: 16x12 20x15 24x18 28x21 32x24 40x30 48x36 64x48 80x60
// Always snap to a valid size to avoid 404s
function snapSize(w) {
  const valid = [16,20,24,28,32,40,48,64,80,96,128,160];
  return valid.reduce((a,b) => Math.abs(b-w)<Math.abs(a-w)?b:a);
}
function FlagImg({iso, w, h, style}) {
  if (!iso) return <div style={{width:w,height:h,...style}}/>;
  // Snap to nearest valid width; height = width * 3/4
  const sw = snapSize(w||20);
  const sh = Math.round(sw * 0.75);
  return <img src={`https://flagcdn.com/${sw}x${sh}/${iso}.png`}
    width={w||sw} height={h||sh} alt={iso} loading="lazy"
    style={{display:"block",borderRadius:2,objectFit:"cover",...(style||{})}}
    onError={e=>{e.target.style.visibility="hidden"}}/>;
}

// ── HELPERS ────────────────────────────────────────────────────────────────
function getInterpolatedRanked(catKey,floatIdx){
  const ev=EVENTS[catKey],maxIdx=ev.years.length-1;
  const lo=Math.max(0,Math.min(Math.floor(floatIdx),maxIdx));
  const hi=Math.min(lo+1,maxIdx),t=floatIdx-lo;
  return ev.items.map(d=>{
    const v0=d.gold[lo],v1=d.gold[hi];
    if(v0==null&&v1==null) return null;
    const val=(v0??0)*(1-t)+(v1??0)*t;
    if(val<=0) return null;
    return {...d,value:val};
  }).filter(Boolean).sort((a,b)=>b.value-a.value);
}
function getRankedAt(catKey,idx){
  return EVENTS[catKey].items
    .filter(d=>d.gold[idx]!=null&&d.gold[idx]>0)
    .map(d=>({...d,value:d.gold[idx]}))
    .sort((a,b)=>b.value-a.value);
}

function easeInOut(t){return t<0.5?2*t*t:-1+(4-2*t)*t;}

// ── BAR RACE ───────────────────────────────────────────────────────────────
function BarRace({catKey,displayIdx,highlighted,onHighlight,logScale,showAll}){
  const ev=EVENTS[catKey];
  const allRanked=getInterpolatedRanked(catKey,displayIdx);
  const topN=showAll?allRanked.length:20;
  const ranked=allRanked.slice(0,topN);
  const prev=displayIdx>=1?getRankedAt(catKey,Math.max(0,Math.floor(displayIdx)-1)).slice(0,Math.max(topN,ev.topN)):null;
  const maxVal=ranked[0]?.value||1,minVal=ranked[ranked.length-1]?.value||1;
  const logMax=Math.log(Math.max(maxVal,1)),logMin=Math.log(Math.max(minVal,1)),logRng=logMax-logMin||1;
  const prevMap={};
  if(prev) prev.forEach((d,i)=>{prevMap[d.name]=i+1;});
  if(!ranked.length) return <div style={{textAlign:"center",color:"rgba(255,255,255,0.3)",fontSize:"0.8rem",marginTop:20}}>No data for this year.</div>;
  const compact=topN>10,superCompact=topN>30;
  const rowH=superCompact?13:compact?17:23;
  const rowMb=superCompact?2:compact?3:6;
  const nameFz=superCompact?"0.56rem":compact?"0.63rem":"0.76rem";
  const valFz=superCompact?"0.50rem":compact?"0.57rem":"0.67rem";
  const badgeW=superCompact?16:compact?20:24;
  const flagW=superCompact?13:compact?17:20;
  const flagH=superCompact?10:compact?13:15;
  return (
    <div style={{maxWidth:700,margin:"0 auto",padding:"0 2px"}}>
      {ranked.map((d,i)=>{
        const pct=logScale?((Math.log(Math.max(d.value,1))-logMin)/logRng)*100:(d.value/maxVal)*100;
        const prevRk=prevMap[d.name],delta=prevRk!=null?prevRk-(i+1):null;
        const isHL=highlighted===d.name,dimmed=highlighted&&!isHL;
        return (
          <div key={d.name} onClick={()=>onHighlight(d.name)}
            style={{display:"flex",alignItems:"center",gap:5,marginBottom:rowMb,
              opacity:dimmed?0.13:1,cursor:"pointer"}}>
            <div style={{width:badgeW,height:badgeW,borderRadius:5,flexShrink:0,
              background:i===0?"rgba(255,215,0,0.2)":i===1?"rgba(192,192,192,0.15)":i===2?"rgba(205,127,50,0.15)":"rgba(255,255,255,0.04)",
              border:`1px solid ${i===0?"rgba(255,215,0,0.4)":i===1?"rgba(192,192,192,0.3)":i===2?"rgba(205,127,50,0.3)":"rgba(255,255,255,0.07)"}`,
              display:"flex",alignItems:"center",justifyContent:"center",
              fontSize:"0.57rem",fontWeight:700,color:i<3?d.color:"#666"}}>{i+1}</div>
            <div style={{width:17,flexShrink:0,textAlign:"center",fontSize:"0.52rem",fontWeight:700}}>
              {delta===null||delta===0
                ?<span style={{color:"rgba(255,255,255,0.12)"}}>—</span>
                :delta>0?<span style={{color:"#6ddc90"}}>▲{delta}</span>
                        :<span style={{color:"#ff7070"}}>▼{Math.abs(delta)}</span>}
            </div>
            <div style={{width:flagW,height:flagH,flexShrink:0,
              display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
              <FlagImg iso={d.iso} w={flagW} h={flagH}/>
            </div>
            <div style={{width:compact?70:76,fontSize:nameFz,flexShrink:0,
              whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis",
              color:isHL?d.color:"#ccc",fontWeight:isHL?700:400}}>{d.name}</div>
            <div style={{flex:1,background:"rgba(255,255,255,0.04)",borderRadius:4,
              overflow:"hidden",height:rowH,position:"relative"}}>
              <div style={{width:`${pct}%`,height:"100%",
                background:`linear-gradient(90deg,${d.color}44,${d.color}bb)`,
                borderRadius:4,display:"flex",alignItems:"center",justifyContent:"flex-end",
                paddingRight:5,boxSizing:"border-box",minWidth:36,position:"relative"}}>
                <div style={{position:"absolute",top:0,left:0,right:0,height:"40%",
                  background:"rgba(255,255,255,0.05)",borderRadius:"4px 4px 0 0",pointerEvents:"none"}}/>
                <span style={{fontSize:valFz,fontWeight:700,color:"#fff",
                  textShadow:"0 1px 3px rgba(0,0,0,0.9)",whiteSpace:"nowrap",position:"relative"}}>
                  {Math.round(d.value)}🥇
                </span>
              </div>
            </div>
          </div>
        );
      })}
      {highlighted&&<div style={{textAlign:"center",marginTop:5}}>
        <button onClick={()=>onHighlight(null)} style={{fontSize:"0.63rem",
          color:"rgba(255,255,255,0.25)",background:"none",border:"none",
          cursor:"pointer",textDecoration:"underline"}}>Clear spotlight</button>
      </div>}
    </div>
  );
}

// ── APP ────────────────────────────────────────────────────────────────────
function App(){
  const [cat,setCat]=useState("summerOlympics");
  const [medalType,setMedalType]=useState("gold");
  const [showAll,setShowAll]=useState(true); // "gold" | "all"
  const [playing,setPlaying]=useState(false);
  const [speed,setSpeed]=useState(1800);
  const [highlighted,setHighlighted]=useState(null);
  const [logScale,setLogScale]=useState(false);
  const [displayIdx,setDisplayIdx]=useState(0);
  const [yearIdx,setYearIdx]=useState(0);
  const displayIdxRef=useRef(0),rafRef=useRef(null);
  const playingRef=useRef(false),speedRef=useRef(speed),catRef=useRef(cat),lastTsRef=useRef(null);
  const catKeyRef=useRef(cat);
  useEffect(()=>{speedRef.current=speed;},[speed]);
  useEffect(()=>{catRef.current=cat;},[cat]);

  const playLoop=useCallback((ts)=>{
    if(!playingRef.current)return;
    if(lastTsRef.current===null)lastTsRef.current=ts;
    const dt=ts-lastTsRef.current;lastTsRef.current=ts;
    const maxIdx=EVENTS[catKeyRef.current].years.length-1;
    const newIdx=Math.min(displayIdxRef.current+dt/speedRef.current,maxIdx);
    displayIdxRef.current=newIdx;setDisplayIdx(newIdx);
    setYearIdx(Math.min(Math.round(newIdx),maxIdx));
    if(newIdx>=maxIdx){playingRef.current=false;setPlaying(false);return;}
    rafRef.current=requestAnimationFrame(playLoop);
  },[]);

  const stopPlay=useCallback(()=>{
    playingRef.current=false;
    if(rafRef.current){cancelAnimationFrame(rafRef.current);rafRef.current=null;}
    lastTsRef.current=null;
  },[]);

  const startPlay=useCallback(()=>{
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    lastTsRef.current=null;playingRef.current=true;
    rafRef.current=requestAnimationFrame(playLoop);
  },[playLoop]);

  const tweenTo=useCallback((targetIdx)=>{
    stopPlay();setPlaying(false);
    const start=displayIdxRef.current,t0=performance.now();
    const dur=Math.min(Math.max(Math.abs(targetIdx-start)*150,120),500);
    function frame(ts){
      const t=Math.min((ts-t0)/dur,1),e=easeInOut(t),v=start+(targetIdx-start)*e;
      displayIdxRef.current=v;setDisplayIdx(v);setYearIdx(Math.round(v));
      if(t<1)rafRef.current=requestAnimationFrame(frame);
      else{displayIdxRef.current=targetIdx;setDisplayIdx(targetIdx);setYearIdx(targetIdx);}
    }
    if(rafRef.current)cancelAnimationFrame(rafRef.current);
    rafRef.current=requestAnimationFrame(frame);
  },[stopPlay]);

  const togglePlay=useCallback(()=>{
    if(playing){stopPlay();setPlaying(false);}
    else{
      const maxIdx=EVENTS[catKey].years.length-1;
      if(displayIdxRef.current>=maxIdx){displayIdxRef.current=0;setDisplayIdx(0);setYearIdx(0);}
      setPlaying(true);startPlay();
    }
  },[playing,cat,stopPlay,startPlay]);

  const reset=useCallback(()=>{
    stopPlay();setPlaying(false);displayIdxRef.current=0;setDisplayIdx(0);setYearIdx(0);
  },[stopPlay]);

  useEffect(()=>{
    stopPlay();setPlaying(false);displayIdxRef.current=0;setDisplayIdx(0);setYearIdx(0);setHighlighted(null);
  },[cat]);
  // Keep catKeyRef in sync so RAF loop uses the right dataset
  useEffect(()=>{
    const k = medalType!=="all" ? cat
      : cat==="summerOlympics"    ? "olympicsAllMedals"
      : cat==="winterOlympics"    ? "winterAllMedals"
      : cat==="summerParalympics" ? "summerParaAllMedals"
      : cat==="winterParalympics" ? "winterParaAllMedals"
      : cat;
    catKeyRef.current=k;
  },[cat,medalType]);

  useEffect(()=>()=>{if(rafRef.current)cancelAnimationFrame(rafRef.current);},[]);

  // Resolve actual dataset key: all-medals only for Summer Olympics
  const catKey = medalType!=="all" ? cat
    : cat==="summerOlympics"    ? "olympicsAllMedals"
    : cat==="winterOlympics"    ? "winterAllMedals"
    : cat==="summerParalympics" ? "summerParaAllMedals"
    : cat==="winterParalympics" ? "winterParaAllMedals"
    : cat;
  const ev=EVENTS[catKey],theme=THEME[catKey],years=ev.years;
  const safeYI=Math.min(Math.round(displayIdx),years.length-1);
  const yearLabel=years[safeYI],progress=displayIdx/(years.length-1);
  const isPara=cat.includes("araly");

  return (
    <div style={{fontFamily:"'Trebuchet MS','Lucida Grande',sans-serif",
      background:"#0e1020",color:"#e0e0e0",minHeight:"100vh",
      padding:"12px 10px 28px",boxSizing:"border-box"}}>

      <div style={{textAlign:"center",marginBottom:12}}>
        <div style={{fontSize:"0.62rem",letterSpacing:"0.25em",
          color:"rgba(180,200,255,0.4)",textTransform:"uppercase",marginBottom:3}}>
          NAVIGATIO · {VERSION}
        </div>
        <h1 style={{margin:0,fontSize:"1.5rem",fontWeight:800,letterSpacing:"0.02em",
          color:theme.accent,textShadow:`0 0 24px ${theme.accent}55`}}>
          Geolympics Racer
        </h1>
        <p style={{margin:"2px 0 0",fontSize:"0.67rem",color:"rgba(255,255,255,0.28)"}}>
          {isPara?"IPC / Wikipedia · approx.":"IOC / Wikipedia · approx."}
        </p>
      </div>

      <div style={{display:"flex",justifyContent:"center",gap:4,marginBottom:12,flexWrap:"wrap"}}>
        {[["summerOlympics","☀️ Olympics"],["winterOlympics","❄️ Olympics"],
          ["summerParalympics","☀️ Paralympics"],["winterParalympics","❄️ Paralympics"]
        ].map(([key,label])=>{
          const t=THEME[key],active=cat===key;
          return <button key={key} onClick={()=>setCat(key)} style={{
            padding:"6px 12px",borderRadius:20,
            border:`1px solid ${active?t.accent:"rgba(255,255,255,0.09)"}`,
            background:active?t.dim:"rgba(255,255,255,0.03)",
            color:active?t.accent:"rgba(255,255,255,0.35)",
            fontWeight:active?700:400,fontSize:"0.71rem",cursor:"pointer",transition:"all 0.2s"}}>
            {label}
          </button>;
        })}
      </div>

      <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:6,marginBottom:10,flexWrap:"wrap"}}>
        {/* Top N / All nations toggle */}
        <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderRadius:8,padding:2}}>
          {[["Top 20",false],["Full list",true]].map(([label,val])=>(
            <button key={label} onClick={()=>setShowAll(val)} style={{
              padding:"4px 11px",borderRadius:6,border:"none",cursor:"pointer",
              background:showAll===val?theme.dim:"transparent",
              color:showAll===val?theme.accent:"rgba(255,255,255,0.3)",
              fontWeight:showAll===val?700:400,fontSize:"0.68rem",transition:"all 0.2s"}}>{label}</button>
          ))}
        </div>
        {/* Gold / All Medals toggle — All only active for Summer Olympics */}
        <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderRadius:8,padding:2}}>
          {[["🥇 Gold","gold"],["🏅 All","all"]].map(([label,val])=>{
            const disabled = val==="all" && cat!=="summerOlympics";
            return <button key={val}
              onClick={()=>!disabled&&setMedalType(val)}
              title={disabled?"Only available for Summer Olympics":undefined}
              style={{
                padding:"4px 11px",borderRadius:6,border:"none",
                cursor:disabled?"not-allowed":"pointer",
                background:medalType===val&&!disabled?theme.dim:"transparent",
                color:disabled?"rgba(255,255,255,0.18)":medalType===val?theme.accent:"rgba(255,255,255,0.3)",
                fontWeight:medalType===val&&!disabled?700:400,
                fontSize:"0.68rem",transition:"all 0.2s",opacity:disabled?0.5:1}}>{label}</button>;
          })}
        </div>
        {/* Linear / Log scale toggle */}
        <div style={{display:"flex",background:"rgba(255,255,255,0.04)",borderRadius:8,padding:2}}>
          {[["Linear",false],["Log",true]].map(([label,val])=>(
            <button key={label} onClick={()=>setLogScale(val)} style={{
              padding:"4px 11px",borderRadius:6,border:"none",cursor:"pointer",
              background:logScale===val?theme.dim:"transparent",
              color:logScale===val?theme.accent:"rgba(255,255,255,0.3)",
              fontWeight:logScale===val?700:400,fontSize:"0.68rem",transition:"all 0.2s"}}>{label}</button>
          ))}
        </div>
      </div>

      <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:7,marginBottom:10,flexWrap:"wrap"}}>
        <button onClick={reset} style={{padding:"6px 11px",borderRadius:8,
          border:"1px solid rgba(255,255,255,0.08)",background:"rgba(255,255,255,0.04)",
          color:"rgba(255,255,255,0.4)",fontSize:"0.8rem",cursor:"pointer"}}>⏮</button>
        <button onClick={togglePlay} style={{padding:"7px 20px",borderRadius:8,
          border:`1px solid ${playing?"rgba(255,90,90,0.4)":"rgba(80,200,120,0.4)"}`,
          background:playing?"rgba(255,90,90,0.12)":"rgba(80,200,120,0.12)",
          color:playing?"#ff8080":"#80e0a0",fontWeight:700,fontSize:"0.82rem",cursor:"pointer",minWidth:86}}>
          {playing?"⏸ Pause":"▶ Play"}
        </button>
        <div style={{display:"flex",gap:3}}>
          {[["🐢",2800,"Slow"],["🐇",1800,"Med"],["⚡",900,"Fast"]].map(([icon,s,label])=>(
            <button key={s} onClick={()=>setSpeed(s)} title={label} style={{
              padding:"5px 9px",borderRadius:7,
              border:`1px solid ${speed===s?theme.accent:"rgba(255,255,255,0.07)"}`,
              background:speed===s?theme.dim:"rgba(255,255,255,0.03)",
              color:speed===s?theme.accent:"rgba(255,255,255,0.3)",
              fontSize:"0.78rem",cursor:"pointer"}}>{icon}</button>
          ))}
        </div>
      </div>

      <GamesCard catKey={catKey} yearLabel={yearLabel} theme={theme}/>

      <BarRace catKey={catKey} displayIdx={displayIdx} highlighted={highlighted}
        onHighlight={n=>setHighlighted(p=>p===n?null:n)} logScale={logScale} showAll={showAll}/>

      {!highlighted&&<div style={{textAlign:"center",marginTop:7,fontSize:"0.6rem",
        color:"rgba(255,255,255,0.16)",letterSpacing:"0.05em"}}>
        Tap any bar or line to spotlight it
      </div>}

      <InsightPanel catKey={catKey} yearIdx={safeYI} theme={theme}/>

      <div style={{maxWidth:600,margin:"14px auto 0"}}>
        <div style={{height:2,background:"rgba(255,255,255,0.06)",borderRadius:2,marginBottom:7,overflow:"hidden"}}>
          <div style={{height:"100%",width:`${progress*100}%`,
            background:`linear-gradient(90deg,${theme.accent},${theme.accent}88)`,
            borderRadius:2,transition:"width 0.12s linear"}}/>
        </div>
        <div style={{display:"flex",justifyContent:"center",gap:2,flexWrap:"wrap"}}>
          {years.map((y,i)=>(
            <button key={y} onClick={()=>tweenTo(i)} style={{
              padding:"2px 5px",borderRadius:5,
              border:`1px solid ${yearIdx===i?theme.accent:"rgba(255,255,255,0.06)"}`,
              background:yearIdx===i?theme.dim:"rgba(255,255,255,0.02)",
              color:yearIdx===i?theme.accent:"rgba(255,255,255,0.22)",
              fontWeight:yearIdx===i?700:400,fontSize:"0.62rem",cursor:"pointer",transition:"all 0.15s"}}>
              {y}
            </button>
          ))}
        </div>
        {ev.note&&<div style={{textAlign:"center",marginTop:5,fontSize:"0.58rem",
          color:"rgba(255,255,255,0.18)",letterSpacing:"0.02em"}}>{ev.note}</div>}
      </div>

      <div style={{textAlign:"center",marginTop:16,fontSize:"0.62rem",color:"rgba(255,255,255,0.13)"}}>
        {showAll?`${EVENTS[catKey].items.length} nations tracked`:"Top 20 shown"} · {medalType==="all"?"total medals":"gold medals"} · {VERSION} ·{" "}
        <a href="https://navigatio.earth" style={{color:"rgba(180,200,255,0.3)",textDecoration:"none"}}>navigatio.earth</a>
      </div>
    </div>
  );
}

document.getElementById("loading").style.display="none";
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
