<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counties of England</title>
<style>
:root{--ink:#2c3e50;--ink2:#566573;--ink3:#7f8c8d;--accent:#3498db;--accent-d:#2176ae;--line:#dfe6ec;--bg:#f2f5f7;--card:#fff;--sea:#eaf3f9;--land:#dde4ea}
*{box-sizing:border-box}
html,body{margin:0}
html{overflow-y:scroll}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
header{background:var(--ink);color:#fff;padding:0 16px;display:flex;align-items:center;gap:16px;min-height:52px}
header h1{font-size:18px;margin:0;font-weight:650;letter-spacing:.1px;white-space:nowrap}
nav{margin-left:auto;display:flex;gap:2px}
nav button{background:none;border:0;color:#d5dde3;padding:15px 12px 13px;border-bottom:3px solid transparent;font-weight:550}
nav button[aria-current=page]{color:#fff;border-bottom-color:var(--accent)}
.era{background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px 11px}
.seg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:760px}
.seg button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 4px;line-height:1.2;text-align:center}
.seg button b{display:block;font-size:14px;font-weight:600}
.seg button span{font-size:11.5px;color:var(--ink3)}
.seg button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
.seg button[aria-pressed=true] span{color:#e6f2fa}
.blurbs{display:grid;max-width:760px}
.blurb{grid-area:1/1;margin:8px 0 0;color:var(--ink2);font-size:14px;visibility:hidden}
.blurb.on{visibility:visible}
main{padding:14px 16px 32px;max-width:1320px;margin:0 auto}
.explore{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(320px,1fr);gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px}
.mapcard{position:sticky;top:10px;overflow:hidden}
.maptools{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.maptools label{font-size:13px;color:var(--ink2);display:flex;align-items:center;gap:6px}
select,input[type=search]{background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 8px}
.zoom{margin-left:auto;display:flex;gap:4px}
.zoom button{width:32px;height:32px;background:#fff;border:1px solid var(--line);border-radius:6px;font-size:17px;line-height:1;padding:0}
#maphost{position:relative;height:calc(100vh - 262px);min-height:420px;background:var(--sea)}
#map{width:100%;height:100%;display:block;touch-action:none;user-select:none;-webkit-user-select:none}
.c{fill:var(--land);stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke;cursor:pointer}
.c:hover{filter:brightness(.93)}
.c.sel{fill:var(--accent);stroke:var(--ink);stroke-width:2}
#labels text{font-size:11px;fill:var(--ink);text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:rgba(255,255,255,.82);stroke-width:2.6px;pointer-events:none}
.legend{position:absolute;left:10px;bottom:10px;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:14px;height:10px;margin-right:4px;vertical-align:-1px;border-radius:2px}
.legend div{white-space:nowrap}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:4px 8px;border-radius:4px;font-size:13px;white-space:nowrap;z-index:5;transform:translate(-50%,-130%);display:none}
.panel{padding:14px}
.panel h2{font-size:22px;margin:0;font-weight:650;line-height:1.2}
.k{color:var(--ink3);font-size:13px;margin:2px 0 12px}
.finder{width:100%;margin-bottom:10px}
.az{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px;list-style:none;margin:0;padding:0}
.az button{width:100%;display:flex;align-items:center;gap:9px;background:none;border:0;padding:5px 6px;border-radius:6px;text-align:left}
.az button:hover{background:var(--bg)}
.az img,.az .nf{width:32px;height:20px;object-fit:cover;border:1px solid var(--line);border-radius:2px;flex:none;background:#f0f3f5}
.back{background:none;border:0;color:var(--accent-d);padding:0;margin-bottom:10px;font-size:14px}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.hero figure{margin:0}
.flags{display:flex;gap:6px;aspect-ratio:5/3}
.flags>*{flex:1;min-width:0}
.flags .flagimg{height:100%;aspect-ratio:auto}
.flagimg{display:block;width:100%;aspect-ratio:5/3;object-fit:contain;background:#f5f7f8;border:1px solid var(--line);border-radius:4px}
.noflag{display:flex;align-items:center;justify-content:center;text-align:center;aspect-ratio:5/3;padding:8px;background:#f5f7f8;border:1px dashed #c6d0d8;border-radius:4px;color:var(--ink3);font-size:12.5px}
figcaption{font-size:12.5px;color:var(--ink2);margin-top:4px}
.outline{display:block;width:100%;aspect-ratio:5/3;background:var(--sea);border:1px solid var(--line);border-radius:4px}
.outline .n{fill:#e7ecf0;stroke:#fff;stroke-width:1;vector-effect:non-scaling-stroke}
.outline .o{fill:var(--accent);stroke:var(--ink);stroke-width:1.2;vector-effect:non-scaling-stroke}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;font-size:14.5px}
dt,dd{padding:7px 0;border-top:1px solid var(--line);margin:0}
dt{color:var(--ink2);padding-right:14px}
dd{font-weight:550}
dd small{font-weight:400;color:var(--ink3);font-size:12.5px;margin-left:5px;white-space:nowrap}
.yr{display:block;font-size:12px;color:var(--ink3);font-weight:400}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:3px 9px;font-size:13px}
button.chip:hover{border-color:var(--accent)}
.primary{background:var(--accent);border:0;color:#fff;border-radius:6px;padding:9px 14px;font-weight:600;margin-top:12px;width:100%}
.primary.on{background:#fff;color:var(--accent-d);box-shadow:inset 0 0 0 1px var(--accent)}
.through{margin-top:14px}
.through h3,.sect{font-size:14px;margin:0 0 6px;font-weight:600}
.thumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.thumbs button{background:none;border:0;padding:0;text-align:center;font-size:12px;color:var(--ink2)}
.thumbs svg{display:block;width:100%;aspect-ratio:1;background:var(--sea);border:1px solid var(--line);border-radius:4px;margin-bottom:2px}
.thumbs button[aria-current=true] svg{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.thumbs .o{fill:var(--accent);stroke:var(--ink);stroke-width:1;vector-effect:non-scaling-stroke}
.cmp{padding:14px}
.controls{display:flex;gap:14px 18px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.controls .f>span{display:block;font-size:12.5px;color:var(--ink2);margin-bottom:3px}
.tog{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.tog button{background:#fff;border:0;border-right:1px solid var(--line);padding:6px 11px;font-size:14px}
.tog button:last-child{border-right:0}
.tog button[aria-pressed=true]{background:var(--accent);color:#fff}
.picks{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.picks .chip{background:var(--ink);border-color:var(--ink);color:#fff;font-size:13px}
.picks input{min-width:190px;flex:0 1 240px}
.hint{color:var(--ink3);font-size:13px}
#chart{position:relative}
#chart svg{display:block;width:100%}
.hit{fill:transparent;cursor:pointer}
.row:hover .hit{fill:rgba(52,152,219,.09)}
.axis text,.lab{font-size:12px;fill:var(--ink2)}
.val{font-size:12px;fill:var(--ink);font-weight:600}
.grid{stroke:#e9eef2}
.dot{cursor:pointer;stroke:#fff;stroke-width:2}
details{margin-top:12px}
summary{cursor:pointer;color:var(--accent-d);font-size:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:6px 8px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
thead th{border-top:0;color:var(--ink2);font-weight:600}
.sbs{display:grid;gap:10px;margin-top:14px}
.sbs .col{border:1px solid var(--line);border-radius:6px;padding:8px;min-width:0}
.sbs h3{font-size:15px;margin:6px 0 4px}
.sbs .outline{aspect-ratio:1}
.sbs dl{font-size:13px}
.sbs dt{padding:4px 8px 4px 0}
.sbs dd{padding:4px 0}
.about{padding:16px 18px;max-width:820px}
.about h2{font-size:18px;margin:18px 0 6px}
.about h2:first-child{margin-top:0}
.about p,.about li{color:var(--ink2);font-size:14.5px}
.about ul{padding-left:18px;margin:6px 0}
.about a{color:var(--accent-d)}
.linkbtn{background:none;border:0;padding:0;color:var(--accent-d);text-decoration:underline;font-size:inherit}
.diag{padding:16px 18px;max-width:900px}
.diag h2{font-size:20px;margin:0 0 2px}
.diag h3{font-size:15px;margin:18px 0 4px}
.diag table{font-size:13.5px}
.diag td,.diag th{white-space:normal;text-align:left;vertical-align:top}
.diag td:first-child{color:var(--ink2);width:34%}
.diagbtns{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 2px}
.diagbtns button{background:#fff;border:1px solid var(--line);border-radius:6px;padding:7px 12px}
.diagbtns button.go{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.st{display:inline-block;font-size:12px;font-weight:600;padding:0 6px;border-radius:3px;margin-right:6px;border:1px solid}
.st.ok{color:#1e7145;border-color:#1e7145}.st.warn{color:#9a6200;border-color:#9a6200}.st.fail{color:#b3261e;border-color:#b3261e}
#dreport{width:100%;height:220px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;margin-top:8px;border:1px solid var(--line);border-radius:6px;padding:8px}
.diag .logbox{font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:240px;overflow:auto;background:var(--bg);border-radius:6px;padding:8px;color:var(--ink2);overflow-wrap:anywhere}
@media (min-width:861px){
 .explore{align-items:stretch}
 .panel{contain:size;overflow-y:auto}
}
@media (max-width:860px){
 header{padding:0 10px;gap:8px}
 header h1{font-size:15px}
 nav button{padding:15px 5px 13px;font-size:13.5px}
 .maptools select{max-width:140px}
 .era{padding:8px 10px 9px}
 main{padding:10px 10px 28px}
 .explore{grid-template-columns:minmax(0,1fr)}
 .mapcard{position:static}
 #maphost{height:56vh;min-height:320px}
 .seg button b{font-size:13px}
}
@media (max-width:400px){.az{grid-template-columns:1fr}}
</style>
</head>

<script>

 {id:'historic',tab:'Historic',yrs:'before 1889',kind:'historic counties',blurb:'The ancient shires, drawn as they stood around 1888, before county councils were created.',town:'County town',pop:'2011, on historic boundaries',area:'1891 census',info:'These are the counties of old maps, flags and local identity. Some, like Middlesex and Westmorland, no longer exist in law.'},

 {id:'ceremonial',tab:'Ceremonial',yrs:'since 1997',kind:'ceremonial counties',blurb:'The areas each served by a Lord-Lieutenant. This is the county map most atlases show today.',town:'County town',pop:'mid-2024 estimate',area:'land area',info:'Set by the Lieutenancies Act 1997. They group today’s councils into familiar county areas.'},

];

 'Isle of Wight':{u:'https://en.wikipedia.org/wiki/Special:FilePath/Flag_of_the_Isle_of_Wight.svg?width=360',p:'https://en.wikipedia.org/wiki/Flag_of_the_Isle_of_Wight'}};
const APP_VERSION='1.1',APP_BUILD='2026-11-08';
const LOG=[],FLAGLOAD={};
function log(type,msg){LOG.push({t:new Date().toISOString().slice(11,19),type,msg:String(msg)});if(LOG.length>120)LOG.shift()}
addEventListener('error',e=>{if(e.message)log('error',`${e.message} (line ${e.lineno||'?'})`)});
addEventListener('unhandledrejection',e=>log('error','Promise: '+(e.reason&&e.reason.message||e.reason)));
addEventListener('securitypolicyviolation',e=>log('blocked',`${e.violatedDirective}: ${e.blockedURI}`));
const S={list:'ceremonial',view:'explore',sel:null,colour:'none',picks:[],measure:'p',chart:'rank',scope:'all',q:''};
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ord=n=>{const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])};
const key=n=>n.replace(/^County /,'');

// Geometry: TopoJSON in British National Grid metres, turned into km paths with north up
function prepare(id){
 const L=D.lists[id];if(L.ready)return L;
 const T=L.topo,[sx,sy]=T.transform.scale,[tx,ty]=T.transform.translate;
 const arcs=T.arcs.map(a=>{let x=0,y=0;return a.map(p=>{x+=p[0];y+=p[1];return[(x*sx+tx)/1000,-(y*sy+ty)/1000]})});
 const ring=r=>{const o=[];r.forEach(i=>{const a=i>=0?arcs[i]:arcs[~i].slice().reverse();o.push(...(o.length?a.slice(1):a))});return o};
 L.items.forEach((it,i)=>{const g=T.objects.c.geometries[i],P=g.type==='Polygon'?[g.arcs]:g.arcs;
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9,d='';
  P.forEach(poly=>poly.forEach(r=>{const pts=ring(r);d+='M'+pts.map(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);return p[0].toFixed(2)+' '+p[1].toFixed(2)}).join('L')+'Z'}));
  it.d=d;it.bb=[x0,y0,x1,y1];it.den=it.p/it.a;
  it.px=it.lb[0]/1000;it.py=-it.lb[1]/1000;it.r=it.lb[2]/1000});
 const byName=new Map(L.items.map(i=>[i.n,i]));L.byName=byName;
 L.bb=L.items.reduce((b,i)=>[Math.min(b[0],i.bb[0]),Math.min(b[1],i.bb[1]),Math.max(b[2],i.bb[2]),Math.max(b[3],i.bb[3])],[1e9,1e9,-1e9,-1e9]);
 const M=['p','a','den','hi'];L.rank={};
 M.forEach(m=>{const v=it=>m==='hi'?(it.h?it.h[0]:null):it[m];L.rank[m]=new Map([...L.items].filter(i=>v(i)!=null).sort((a,b)=>v(b)-v(a)).map((it,i)=>[it.n,i+1]))});
 L.ready=true;return L;
}
function sharedFrame(){
 if(D.frame)return D.frame;
 const B=LISTS.map(l=>prepare(l.id).bb),x0=Math.min(...B.map(b=>b[0])),y0=Math.min(...B.map(b=>b[1])),x1=Math.max(...B.map(b=>b[2])),y1=Math.max(...B.map(b=>b[3])),pad=(x1-x0)*.05;
 return D.frame={x:x0-pad,y:y0-pad,w:x1-x0+pad*2,h:y1-y0+pad*2};
}
function contextPath(){
 if(D.ctxD)return D.ctxD;const T=D.context,[sx,sy]=T.transform.scale,[tx,ty]=T.transform.translate;
 const obj=Object.values(T.objects)[0];const arcs=T.arcs.map(a=>{let x=0,y=0;return a.map(p=>{x+=p[0];y+=p[1];return[(x*sx+tx)/1000,-(y*sy+ty)/1000]})});
 let d='';const ring=r=>{const o=[];r.forEach(i=>{const a=i>=0?arcs[i]:arcs[~i].slice().reverse();o.push(...(o.length?a.slice(1):a))});d+='M'+o.map(p=>p[0].toFixed(1)+' '+p[1].toFixed(1)).join('L')+'Z'};
 obj.geometries.forEach(g=>{(g.type==='Polygon'?[g.arcs]:g.arcs).forEach(p=>p.forEach(ring))});return D.ctxD=d;
}
const cfg=()=>LISTS.find(l=>l.id===S.list),cur=()=>prepare(S.list),item=n=>cur().byName.get(n);
const metrics=()=>{const c=cfg(),hasH=cur().items.some(i=>i.h);const m=[{k:'p',l:'Population',u:'',y:c.pop,v:i=>i.p},{k:'a',l:'Area',u:' km²',y:c.area,v:i=>i.a},{k:'den',l:'Density',u:' per km²',y:'people per km²',v:i=>i.den}];if(hasH)m.push({k:'hi',l:'Highest point',u:' m',y:'metres above sea level',v:i=>i.h?i.h[0]:null});return m};

const COAST={sea:'Coastal',est:'Coastal (tidal estuary only)',land:'Landlocked'};
function flagHTML(it,small){
 const own=n=>D.flags[n];
 const mk=(n,cap)=>{
  if(own(n))return`<div><img class="flagimg" alt="Flag of ${esc(n)}" src="${own(n)}"></div>`;return''};
 if(it.f.length)return`<div class="flags">${it.f.map(n=>mk(n)).join('')}</div>`;
 if(EXT[it.n])return`<img class="flagimg" alt="Flag of ${esc(it.n)}" src="${EXT[it.n].u}" onerror="this.outerHTML=window.noExt('${esc(it.n)}')">`;
 const C=it.C&&EXT[it.C];if(C)return`<img class="flagimg" alt="Flag of ${esc(it.C)}" src="${C.u}" onerror="this.outerHTML=window.noExt('${esc(it.C)}')">`;
 return`<div class="noflag">No flag in the<br>source list</div>`;
}
window.noExt=n=>{log('flag',n+' flag did not load');return `<a class="noflag" href="${EXT[n].p}" target="_blank" rel="noopener">${n} flag could not be embedded. Open it here</a>`};
function flagCap(it){
 if(it.f.length){const names=it.f.join(' and ');const sub=it.f.length===1&&D.fmeta[it.f[0]];
  if(it.fi)return `${esc(names)} flag${it.f.length>1?'s':''}${S.list==='today'?'':' (historic county)'}`;
  return sub?esc(sub):'County flag'}
 if(EXT[it.n])return 'County flag';
 if(it.C&&EXT[it.C])return esc(it.C)+' flag';
 return '';
}
function outline(it,opts={}){
 const L=opts.L||cur(),bb=it.bb;let cx=(bb[0]+bb[2])/2,cy=(bb[1]+bb[3])/2,w=bb[2]-bb[0],h=bb[3]-bb[1];
 const ar=opts.ar||5/3;let vw,vh;
 if(opts.size){vw=opts.size;vh=vw/ar}else{vw=Math.max(w*1.14,h*1.14*ar,1);vh=vw/ar}

 return`<svg class="${opts.cls||'outline'}" viewBox="${(cx-vw/2).toFixed(2)} ${(cy-vh/2).toFixed(2)} ${vw.toFixed(2)} ${vh.toFixed(2)}" role="img" aria-label="Outline of ${esc(it.n)}">${nb}<path class="o" fill-rule="evenodd" d="${it.d}"/></svg>`;
}

// ---- Era switch and nav
function drawEras(){
 $('#eras').innerHTML=LISTS.map(l=>`<button data-l="${l.id}" aria-pressed="${l.id===S.list}"><b>${l.tab}</b><span>${l.yrs}</span></button>`).join('');

}
document.addEventListener('click',e=>{
 const t=e.target.closest('button,[data-open]');if(!t)return;
 if(t.dataset.l){S.list=t.dataset.l;prepare(S.list);if(S.sel&&!item(S.sel))S.sel=null;S.picks=S.picks.filter(p=>item(p));if(!metrics().some(m=>m.k===S.measure))S.measure='p';log('era',S.list);render();return}

 if(t.dataset.set){const[a,b]=t.dataset.set.split(':');S[a]=b;renderCompare();return}
 if(t.id==='back'){S.sel=null;vb={...base};setVB();drawPanel();paintSel();return}
});
function go(v){S.view=v;log('view',v);try{history.replaceState(null,'','#'+v)}catch(_){location.hash=v}render()}
function openCounty(n){S.view='explore';S.sel=n;log('select',n);vb=null;render();focusTiny();const p=$('.panel');if(p&&matchMedia('(max-width:860px)').matches)p.scrollIntoView({behavior:'smooth',block:'start'})}

let vb,base;
function renderExplore(m){

 if(!vb)vb={...base};

 setVB();paintCols();drawPanel();paintSel();wireMap(svg);
 $('#zi').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,.66);$('#zo').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1.5);$('#zr').onclick=()=>{vb={...base};setVB()};
}

function labels(){

 <li>Ceremonial boundaries: <a href="https://github.com/evansd/uk-ceremonial-counties" target="_blank" rel="noopener">uk-ceremonial-counties</a>, from ONS ward data.</li>
 <li>District boundaries for 1974–96 and Today: ONS, via <a href="https://github.com/ONSvisual/uk-topojson" target="_blank" rel="noopener">ONSvisual/uk-topojson</a>. Contains OS data © Crown copyright and database right.</li>
 <li>Population, area, county towns and highest points: Wikipedia lists that cite ONS mid-year estimates, the 1891 and 1981 censuses, the Historic Counties Trust and the Database of British and Irish Hills: <a href="https://en.wikipedia.org/wiki/Ceremonial_counties_of_England" target="_blank" rel="noopener">ceremonial counties</a>, <a href="https://en.wikipedia.org/wiki/Unitary_authorities_of_England" target="_blank" rel="noopener">unitary authorities</a>, <a href="https://en.wikipedia.org/wiki/List_of_Administrative_shire_counties_of_England_by_Area" target="_blank" rel="noopener">two-tier counties</a>, <a href="https://en.wikipedia.org/wiki/Counties_in_England_by_population" target="_blank" rel="noopener">historic county population</a>, <a href="https://en.wikipedia.org/wiki/List_of_ancient_counties_of_England_by_area_in_1891" target="_blank" rel="noopener">1891 areas</a>, <a href="https://en.wikipedia.org/wiki/List_of_counties_of_England_by_population_in_1981" target="_blank" rel="noopener">1981 census</a>, <a href="https://en.wikipedia.org/wiki/County_town" target="_blank" rel="noopener">county towns</a>, <a href="https://en.wikipedia.org/wiki/List_of_ceremonial_counties_of_England_by_highest_point" target="_blank" rel="noopener">ceremonial</a> and <a href="https://en.wikipedia.org/wiki/List_of_counties_of_England_and_Wales_in_1964_by_highest_point" target="_blank" rel="noopener">historic</a> highest points.</li></ul><p style="margin-top:18px;font-size:13px">Version ${APP_VERSION} \u00b7 <button class="linkbtn" data-v="diagnostics">Diagnostics</button></p></div>`;
}

// ---- Diagnostics
const EXPECT={historic:39,y74:46,ceremonial:48,today:91};
let frameTest=null;
const cell=(st,txt)=>({st,txt});
function storageOK(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(_){return false}}
function rectText(r){return `left ${r.left.toFixed(1)}, top ${r.top.toFixed(1)}, ${r.width.toFixed(1)} × ${r.height.toFixed(1)} px`}
function testFlags(){
 Object.keys(EXT).forEach(n=>{if(FLAGLOAD[n])return;FLAGLOAD[n]='testing';const i=new Image();const done=v=>{if(FLAGLOAD[n]!=='testing')return;FLAGLOAD[n]=v;log('flag',n+': '+v);if(S.view==='diagnostics')renderDiag($('#main'))};i.onload=()=>done('loaded');i.onerror=()=>done('blocked or unavailable');setTimeout(()=>done('timed out'),6000);i.src=EXT[n].u});
}
function dataRows(){
 return LISTS.map(l=>{const L=prepare(l.id),n=L.items.length,bad=[];
  if(n!==EXPECT[l.id])bad.push(`expected ${EXPECT[l.id]}`);
  const noGeo=L.items.filter(i=>!i.d||i.d.length<8).length,noVal=L.items.filter(i=>!(i.p>0&&i.a>0)).length,dup=n-new Set(L.items.map(i=>i.n)).size,badNb=L.items.reduce((s,i)=>s+i.nb.filter(x=>!L.byName.has(x)).length,0);
  if(noGeo)bad.push(noGeo+' without outline');if(noVal)bad.push(noVal+' without figures');if(dup)bad.push(dup+' duplicate names');if(badNb)bad.push(badNb+' broken border links');
  const pop=L.items.reduce((s,i)=>s+i.p,0),pts=L.topo.arcs.reduce((s,a)=>s+a.length,0);
  return[l.tab,cell(bad.length?'fail':'ok',`${n} areas, population ${fmt(pop)}, ${fmt(pts)} boundary points${bad.length?' — '+bad.join('; '):''}`)]});
}
function flagRows(){
 const rows=[['Embedded images',cell('ok',Object.keys(D.flags).length+' flags')]];
 Object.keys(EXT).forEach(n=>{const v=FLAGLOAD[n]||'not tested';rows.push([n+' (from Wikipedia)',cell(v==='loaded'?'ok':v==='testing'||v==='not tested'?'':'warn',v)])});
 LISTS.forEach(l=>{const L=prepare(l.id),none=L.items.filter(i=>!i.f.length&&!EXT[i.n]&&!(i.C&&EXT[i.C])).map(i=>i.n);rows.push([l.tab+': no flag',none.length?none.join(', '):'none'])});
 return rows;
}
function diagSections(){
 const svg=$('#map'),F=sharedFrame(),z=vb?Math.round(F.w/vb.w*100)+'%':'100%';
 const secs=[
 {t:'App',rows:[['Version',`${APP_VERSION} (${APP_BUILD})`],['Page size',Math.round(document.documentElement.outerHTML.length/1024)+' KB'],['Address',location.protocol+'//'+(location.host||'local file')+location.pathname],['Inside a frame',window.top!==window.self?'yes':'no']]},
 {t:'Device',rows:[['Browser',navigator.userAgent],['Window',`${innerWidth} × ${innerHeight} px, pixel ratio ${devicePixelRatio}`],['Screen',`${screen.width} × ${screen.height} px`],['Touch points',navigator.maxTouchPoints||0],['Language',navigator.language],['Online',navigator.onLine?'yes':'no'],['Browser storage',storageOK()?'available':'unavailable']]},
 {t:'Current state',rows:[['Era',cfg().tab],['Selected',S.sel||'none'],['Colour by',S.colour],['Compare picks',S.picks.join(', ')||'none'],['Map frame (km grid)',`${F.x.toFixed(1)}, ${F.y.toFixed(1)}, ${F.w.toFixed(1)} × ${F.h.toFixed(1)}`],['Current zoom',z]]},
 {t:'Data checks',rows:dataRows()},
 {t:'Flags',rows:flagRows()}];
 if(frameTest)secs.push({t:'Map position test',rows:frameTest});
 return secs;
}
function cellText(c){return c&&c.txt!==undefined?(c.st?'['+c.st.toUpperCase()+'] ':'')+c.txt:String(c)}
function reportText(secs){return `Counties of England diagnostics\n${new Date().toISOString()}\n\n`+secs.map(s=>`== ${s.t}\n`+s.rows.map(r=>`${r[0]}: ${cellText(r[1])}`).join('\n')).join('\n\n')+`\n\n== Event log\n`+(LOG.map(l=>`${l.t} ${l.type}: ${l.msg}`).join('\n')||'empty')}
const ST={ok:'OK',warn:'Check',fail:'Problem'};
function cellHTML(c){if(c&&c.txt!==undefined)return(c.st?`<span class="st ${c.st}">${ST[c.st]}</span>`:'')+esc(c.txt);return esc(c)}
function renderDiag(m){
 testFlags();
 const secs=diagSections();
 const errs=LOG.filter(l=>l.type==='error').length;
 m.innerHTML=`<div class="card diag"><button class="back" data-v="about">← About</button><h2>Diagnostics</h2><p class="k">Nothing here is sent anywhere. Use Copy report to share it when something looks wrong.</p>
 <div class="diagbtns"><button class="go" id="dtest">Test map position</button><button id="dcopy">Copy report</button><button id="dclear">Clear log</button></div><span class="hint" id="dmsg"></span><textarea id="dreport" readonly hidden aria-label="Diagnostics report"></textarea>
 ${secs.map(s=>`<h3>${esc(s.t)}</h3><table><tbody>${s.rows.map(r=>`<tr><td>${esc(r[0])}</td><td>${cellHTML(r[1])}</td></tr>`).join('')}</tbody></table>`).join('')}
 <h3>Event log${errs?` (${errs} error${errs>1?'s':''})`:''}</h3><div class="logbox">${LOG.length?LOG.slice().reverse().map(l=>`${l.t} ${esc(l.type)}: ${esc(l.msg)}`).join('<br>'):'Nothing logged yet'}</div></div>`;
 $('#dclear').onclick=()=>{LOG.length=0;renderDiag($('#main'))};
 $('#dcopy').onclick=async()=>{const txt=reportText(diagSections()),msg=$('#dmsg');try{await navigator.clipboard.writeText(txt);msg.textContent='Report copied'}catch(_){const a=$('#dreport');a.hidden=false;a.value=txt;a.focus();a.select();msg.textContent='Copying was blocked here. The report is selected below, so copy it by hand.'}};
 $('#dtest').onclick=runFrameTest;
}
const tick=()=>new Promise(r=>{let d=false;const f=()=>{if(!d){d=true;r()}};requestAnimationFrame(()=>requestAnimationFrame(f));setTimeout(f,250)});
async function runFrameTest(){
 const keep={list:S.list,view:S.view,sel:S.sel},y=scrollY,keepVb=vb&&{...vb};const out=[];
 S.view='explore';scrollTo(0,0);
 for(const l of LISTS){S.list=l.id;S.sel=keep.sel&&prepare(l.id).byName.has(keep.sel)?keep.sel:null;render();await tick();
  const s=$('#map'),c=s.querySelector('path').getBoundingClientRect(),h=$('#maphost').getBoundingClientRect(),cs=$('#cs').getBoundingClientRect();
  out.push({l:l.tab,box:rectText(h),vb:s.getAttribute('viewBox'),ctx:rectText(c),cs:rectText(cs)})}
 S.list=keep.list;S.sel=keep.sel;S.view=keep.view;vb=keepVb;render();scrollTo(0,y);
 const same=k=>out.every(o=>o[k]===out[0][k]);
 const ok=same('box')&&same('vb')&&same('ctx');
 frameTest=[['Result',cell(ok?'ok':'fail',ok?'The map frame did not move between eras':'The map frame moved between eras')],['Map box',cell(same('box')?'ok':'fail',same('box')?out[0].box:out.map(o=>o.l+': '+o.box).join(' | '))],['View window',cell(same('vb')?'ok':'fail',same('vb')?out[0].vb:out.map(o=>o.l+': '+o.vb).join(' | '))],['Wales and Scotland backdrop',cell(same('ctx')?'ok':'fail',same('ctx')?out[0].ctx:out.map(o=>o.l+': '+o.ctx).join(' | '))]].concat(out.map(o=>['England outline, '+o.l,o.cs]));
 log('test',ok?'Map position stable':'Map position moved');
 renderDiag($('#main'));
}
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==='compare')drawChart();else if(S.view==='explore')queueLabels()},120)});
const VIEWS=['explore','compare','about','diagnostics'];const h=location.hash.slice(1);if(VIEWS.includes(h))S.view=h;
addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(VIEWS.includes(v)&&v!==S.view){S.view=v;render()}});
prepare(S.list);render();
</script>
</body>
