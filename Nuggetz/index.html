        // Main App Component
        function NuggetzApp() {
            const [folders, setFolders] = useState(() => 
                Storage.load('nuggetz_folders', [{ id: 'root', name: 'All Nuggetz', parentId: null, children: [] }])
            );
            const [nuggets, setNuggets] = useState(() => Storage.load('nuggetz_nuggets', []));
            const [currentFolder, setCurrentFolder] = useState(() => Storage.load('nuggetz_last_folder', 'root'));
            const [expandedFolders, setExpandedFolders] = useState(['root']);
            // Search box: the input updates instantly for a responsive
            // feel, but the actual filter (searchQuery) only updates
            // after typing pauses briefly — recomputing a filter across
            // a large collection on every single keystroke was part of
            // what made typing feel laggy.
            const [searchInput, setSearchInput] = useState('');
            const [searchQuery, setSearchQuery] = useState('');
            useEffect(() => {
                const t = setTimeout(() => setSearchQuery(searchInput), 250);
                return () => clearTimeout(t);
            }, [searchInput]);
            const [viewMode, setViewMode] = useState('grid');
            const [showAddNugget, setShowAddNugget] = useState(false);
            const [showAddFolder, setShowAddFolder] = useState(false);
            const [showDiagnostics, setShowDiagnostics] = useState(false);
            const [showRestoreHistory, setShowRestoreHistory] = useState(false);
            
            // Restores a previous Drive revision's data over whatever is
            // currently showing, then immediately re-saves it to Drive —
            // otherwise the very next debounced auto-save (from whatever
            // bad state was live a moment ago) could silently overwrite
            // the restore before it's ever secured.
            const handleRestoreFromHistory = async (data) => {
                const restoredFolders = data.folders || [{ id: 'root', name: 'All Nuggetz', parentId: null, children: [] }];
                const restoredNuggets = data.nuggets || [];
                const restoredPositions = data.nodePositions || {};
                setFolders(restoredFolders);
                setNuggets(restoredNuggets);
                setNodePositions(restoredPositions);
                setShowRestoreHistory(false);
                setShowDiagnostics(false);
                try {
                    await DriveSync.save({ folders: restoredFolders, nuggets: restoredNuggets, nodePositions: restoredPositions });
                    alert(`Restored ${restoredNuggets.length} nugget(s) and ${restoredFolders.length} folder(s), and saved this back to Drive so it's secure.`);
                } catch (e) {
                    alert(`Restored ${restoredNuggets.length} nugget(s) and ${restoredFolders.length} folder(s) locally, but saving back to Drive failed (${e.message}). Please check your connection and try Sync Now from the header before doing anything else.`);
                }
            };
            
            const [editingNugget, setEditingNugget] = useState(null);
            const [previewNugget, setPreviewNugget] = useState(null);
            const [draggedNugget, setDraggedNugget] = useState(null);
            const [draggedFolder, setDraggedFolder] = useState(null);
            const [dragOverFolder, setDragOverFolder] = useState(null);
            const [nodePositions, setNodePositions] = useState(() => Storage.load('nuggetz_positions', {}));
            const [shareDraft, setShareDraft] = useState(null);
            
            // Handles an incoming Web Share Target request: when another
            // app (browser, X, LinkedIn, Facebook...) shares a URL to
            // Nuggetz, Chrome/Edge reload this page with ?title=&text=&url=
            // attached. Pick that up once, prefill the Add Nugget modal,
            // then strip the query string so a refresh doesn't repeat it.
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.has('url') || params.has('text') || params.has('title')) {
                    const sharedUrl = params.get('url') || extractUrlFromText(params.get('text')) || '';
                    const sharedTitle = params.get('title') || '';
                    const sharedText = params.get('text') || '';
                    setShareDraft({
                        url: sharedUrl,
                        title: sharedTitle,
                        description: sharedUrl && sharedText !== sharedUrl ? sharedText : ''
                    });
                    setShowAddNugget(true);
                    window.history.replaceState(null, '', window.location.pathname);
                }
            }, []);
            
            useEffect(() => {
                Storage.save('nuggetz_folders', folders);
            }, [folders]);
            
            useEffect(() => {
                Storage.save('nuggetz_nuggets', nuggets);
            }, [nuggets]);
            
            // Remembered so a fresh tab — opened via the share sheet or
            // the browser extension — defaults the folder picker to
            // wherever you were last working, instead of always "All
            // Nuggetz". Filing something no longer needs a separate
            // "move it to the right place" step afterward.
            useEffect(() => {
                Storage.save('nuggetz_last_folder', currentFolder);
            }, [currentFolder]);
            
            // If the remembered folder no longer exists (deleted since,
            // on this device or another one synced in), fall back to
            // root rather than showing a blank view.
            useEffect(() => {
                if (currentFolder !== 'root' && !folders.some(f => f.id === currentFolder)) {
                    setCurrentFolder('root');
                }
            }, [folders, currentFolder]);
            
            useEffect(() => {
                Storage.save('nuggetz_positions', nodePositions);
            }, [nodePositions]);
            
            // --- Google Drive sync ---
            const [syncEnabled, setSyncEnabled] = useState(() => Storage.load('nuggetz_sync_enabled', false));
            const [syncStatus, setSyncStatus] = useState('idle'); // idle | signed-out | connecting | syncing | synced | error
            const foldersRef = useRef(folders);
            const nuggetsRef = useRef(nuggets);
            const positionsRef = useRef(nodePositions);
            const syncTimeoutRef = useRef(null);
            
            useEffect(() => { foldersRef.current = folders; }, [folders]);
            useEffect(() => { nuggetsRef.current = nuggets; }, [nuggets]);
            useEffect(() => { positionsRef.current = nodePositions; }, [nodePositions]);
            
            // Runs once a Drive access token is granted: compares what's
            // already in the user's Drive against what's on this device
            // and lets them choose which copy wins, then turns sync on.
            const handleTokenReceived = async () => {
                setSyncStatus('syncing');
                try {
                    const remote = await DriveSync.load();
                    const remoteHasData = remote && (
                        (remote.nuggets && remote.nuggets.length) ||
                        (remote.folders && remote.folders.length > 1)
                    );
                    if (remoteHasData) {
                        const useRemote = window.confirm(
                            "Found existing Nuggetz data in Google Drive.\n\n" +
                            "OK = Load it (replaces what's on this device)\n" +
                            "Cancel = Keep this device's data (uploads it, replacing the cloud copy)"
                        );
                        if (useRemote) {
                            setFolders(remote.folders || [{ id: 'root', name: 'All Nuggetz', parentId: null, children: [] }]);
                            setNuggets(remote.nuggets || []);
                            setNodePositions(remote.nodePositions || {});
                        } else {
                            await DriveSync.save({
                                folders: foldersRef.current,
                                nuggets: nuggetsRef.current,
                                nodePositions: positionsRef.current
                            });
                        }
                    } else {
                        await DriveSync.save({
                            folders: foldersRef.current,
                            nuggets: nuggetsRef.current,
                            nodePositions: positionsRef.current
                        });
                    }
                    setSyncEnabled(true);
                    Storage.save('nuggetz_sync_enabled', true);
                    setSyncStatus('synced');
                } catch (e) {
                    console.error('Drive sync error:', e);
                    setSyncStatus('error');
                }
            };
            
            // Waits for the Google Identity Services script to finish
            // loading (it's async/defer), then wires up the token client.
            // If sync was previously enabled on this device, refreshes
            // the token quietly. This must NOT reuse handleTokenReceived
            // (the first-time-connect flow) — that runs a remote-vs-local
            // merge check with a confirm() prompt, which was firing on
            // *every* page load, silently re-deciding whether to keep
            // local data or overwrite it from Drive each time. A normal
            // reload should just keep showing local data as-is.
            useEffect(() => {
                let attempts = 0;
                let cancelled = false;
                const tryInit = () => {
                    if (cancelled) return;
                    attempts++;
                    if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                        DriveSync.init(handleTokenReceived);
                        if (syncEnabled) {
                            setSyncStatus('signed-out');
                            DriveSync.refreshSilently().then(ok => {
                                if (!cancelled) setSyncStatus(ok ? 'synced' : 'signed-out');
                            });
                        }
                    } else if (attempts < 25) {
                        setTimeout(tryInit, 300);
                    }
                };
                tryInit();
                return () => { cancelled = true; };
            }, []);
            
            // Debounced auto-push: whenever data changes while sync is on
            // and we still hold a valid token, push the latest snapshot.
            useEffect(() => {
                if (!syncEnabled || !DriveSync.accessToken) return;
                if (syncTimeoutRef.current) clearTimeout(syncTimeoutRef.current);
                syncTimeoutRef.current = setTimeout(async () => {
                    setSyncStatus('syncing');
                    try {
                        await DriveSync.save({ folders, nuggets, nodePositions });
                        setSyncStatus('synced');
                    } catch (e) {
                        console.error('Drive sync error:', e);
                        setSyncStatus('error');
                    }
                }, 1500);
                return () => clearTimeout(syncTimeoutRef.current);
            }, [folders, nuggets, nodePositions, syncEnabled]);
            
            const handleSyncButtonClick = () => {
                if (GOOGLE_CLIENT_ID.startsWith('REPLACE_WITH')) {
                    alert('Google Drive sync needs a one-time setup step first — see GOOGLE_DRIVE_SETUP_GUIDE.md for how to get a free Client ID from Google Cloud Console.');
                    return;
                }
                if (!syncEnabled) {
                    setSyncStatus('connecting');
                    DriveSync.signIn(false);
                } else if (syncStatus === 'signed-out' || syncStatus === 'error') {
                    setSyncStatus('connecting');
                    DriveSync.signIn(false);
                } else {
                    const disconnect = window.confirm(
                        'Google Drive sync is connected.\n\nOK = Disconnect\nCancel = Sync now'
                    );
                    if (disconnect) {
                        DriveSync.signOut();
                        setSyncEnabled(false);
                        Storage.save('nuggetz_sync_enabled', false);
                        setSyncStatus('idle');
                    } else {
                        (async () => {
                            setSyncStatus('syncing');
                            try {
                                await DriveSync.save({ folders, nuggets, nodePositions });
                                setSyncStatus('synced');
                            } catch (e) {
                                console.error('Drive sync error:', e);
                                setSyncStatus('error');
                            }
                        })();
                    }
                }
            };
            
            const syncButtonLabel = () => {
                if (!syncEnabled) return 'Connect Drive';
                switch (syncStatus) {
                    case 'syncing': return 'Syncing…';
                    case 'signed-out': return 'Reconnect';
                    case 'error': return 'Sync error';
                    default: return 'Synced';
                }
            };
            
            const addFolder = (name, parentId = 'root') => {
                const newFolder = {
                    id: Date.now().toString(),
                    name,
                    parentId,
                    children: []
                };
                setFolders([...folders, newFolder]);
                setExpandedFolders([...expandedFolders, parentId]);
            };
            
            const addNugget = (nuggetData) => {
                const newNugget = {
                    id: Date.now().toString(),
                    ...nuggetData,
                    folderId: nuggetData.folderId || currentFolder,
                    created: new Date().toISOString()
                };
                setNuggets([...nuggets, newNugget]);
            };
            
            const updateNugget = (id, updates) => {
                setNuggets(nuggets.map(n => n.id === id ? { ...n, ...updates } : n));
            };
            
            const deleteNugget = (id) => {
                setNuggets(nuggets.filter(n => n.id !== id));
            };
            
            // Batch-fixes the "every card looks the same" problem for
            // nuggets that never got a thumbnail (e.g. from a bulk
            // import). There's no backend to fetch a real page image, so
            // this uses each link's own domain favicon as a visually-
            // distinctive placeholder — instant even for tens of
            // thousands of nuggets, since it's just setting a URL string;
            // the browser fetches each icon lazily only as it scrolls
            // into view.
            const backfillThumbnails = () => {
                const missing = nuggets.filter(n => !n.thumbnail);
                if (missing.length === 0) {
                    alert('Every nugget already has a thumbnail.');
                    return;
                }
                if (!confirm(`Add a site-icon thumbnail to ${missing.length} nugget(s) that don't have one? This won't touch any nugget that already has a thumbnail set.`)) {
                    return;
                }
                setNuggets(prev => prev.map(n => {
                    if (n.thumbnail) return n;
                    try {
                        const hostname = new URL(n.url).hostname;
                        return { ...n, thumbnail: `https://www.google.com/s2/favicons?sz=128&domain=${hostname}` };
                    } catch (e) {
                        return n;
                    }
                }));
                alert(`Done — added favicon thumbnails to ${missing.length} nugget(s).`);
            };
            
            // Real screenshot thumbnails, via the Cloudflare Worker. This
            // upgrades any nugget that has no thumbnail OR only has the
            // favicon placeholder — it never touches a thumbnail you (or
            // an import) set deliberately. It's naturally resumable: since
            // eligibility is "still favicon-or-blank", closing the app and
            // running it again later just picks up wherever it left off,
            // with no separate progress-tracking needed.
            //
            // The Worker's per-minute rate limit is handled automatically
            // here — hitting it just pauses and retries on its own rather
            // than stopping and making you click the button again. The
            // Worker's DAILY budget is a real, deliberate cap though (see
            // the Worker's own comments for why) — that one genuinely does
            // require coming back another day, since a browser tab can't
            // reasonably be expected to stay open that long.
            const [screenshotProgress, setScreenshotProgress] = useState(null); // { done, total, stopped, waiting } | null
            const screenshotCancelRef = useRef(false);
            
            const captureRealThumbnails = async () => {
                if (THUMBNAIL_WORKER_URL.startsWith('REPLACE_WITH')) {
                    alert('Real screenshot thumbnails need a one-time setup step first — see nuggetz-thumbnail-worker/DEPLOYMENT_GUIDE.md for how to deploy the Cloudflare Worker.');
                    return;
                }
                const eligible = nuggets.filter(n => !n.thumbnail || n.thumbnail.startsWith(FAVICON_PREFIX));
                if (eligible.length === 0) {
                    alert('Nothing left to upgrade — every nugget already has a custom or captured thumbnail.');
                    return;
                }
                if (!confirm(`Capture real screenshot thumbnails for ${eligible.length} nugget(s)? This is capped to a modest amount per day to stay free — for a collection this size, expect it to take many days of leaving this running, or repeated visits, to finish. It picks up where it left off each time, so there's no need to babysit it.`)) {
                    return;
                }
                
                screenshotCancelRef.current = false;
                setScreenshotProgress({ done: 0, total: eligible.length, stopped: false, waiting: false });
                
                let done = 0;
                let stopReason = null;
                
                for (const nugget of eligible) {
                    if (screenshotCancelRef.current) { stopReason = 'stopped'; break; }
                    
                    let advance = false;
                    while (!advance) {
                        if (screenshotCancelRef.current) { stopReason = 'stopped'; break; }
                        try {
                            const res = await fetch(`${THUMBNAIL_WORKER_URL}?url=${encodeURIComponent(nugget.url)}`);
                            if (res.status === 429) {
                                const body = await res.json().catch(() => ({}));
                                if (body.budgetExhausted) {
                                    stopReason = 'budget';
                                    break;
                                }
                                // Short per-minute limit — wait it out
                                // automatically, then retry this same link.
                                setScreenshotProgress({ done, total: eligible.length, stopped: false, waiting: true });
                                for (let i = 0; i < 65 && !screenshotCancelRef.current; i++) {
                                    await new Promise(r => setTimeout(r, 1000));
                                }
                                setScreenshotProgress({ done, total: eligible.length, stopped: false, waiting: false });
                                continue;
                            }
                            if (res.ok) {
                                const body = await res.json();
                                setNuggets(prev => prev.map(n => n.id === nugget.id ? { ...n, thumbnail: body.thumbnail } : n));
                            }
                            advance = true;
                        } catch (e) {
                            // Network hiccup on this one link — move on
                            // rather than getting stuck retrying forever.
                            advance = true;
                        }
                    }
                    if (stopReason) break;
                    done++;
                    setScreenshotProgress({ done, total: eligible.length, stopped: false, waiting: false });
                }
                
                setScreenshotProgress({ done, total: eligible.length, stopped: true, waiting: false });
                if (stopReason === 'budget') {
                    alert(`Captured ${done} thumbnail(s) — reached today's rendering budget. Come back tomorrow (or any later day) and click this again to continue with the rest — it'll pick up exactly where it left off.`);
                } else if (stopReason === 'stopped') {
                    alert(`Stopped after ${done} of ${eligible.length}. Run it again anytime to pick up where you left off.`);
                } else {
                    alert(`Done — captured ${done} real thumbnail(s).`);
                }
                setTimeout(() => setScreenshotProgress(null), 3000);
            };
            
            // Reassigns any nugget whose folderId doesn't match a real
            // folder into a dedicated recovery folder, so it becomes
            // reachable again through normal navigation. Safe to run
            // repeatedly — nuggets already filed somewhere real are
            // never touched.
            const recoverOrphanedNuggets = () => {
                const folderIds = new Set(folders.map(f => f.id));
                const orphaned = nuggets.filter(n => !folderIds.has(n.folderId));
                if (orphaned.length === 0) {
                    alert('Nothing to recover — every nugget is filed in a folder that still exists.');
                    return;
                }
                if (!confirm(`Found ${orphaned.length} nugget(s) filed in a folder that no longer exists. Move them into a new "Recovered Nuggets" folder so you can see and re-file them?`)) {
                    return;
                }
                const recoveryId = 'recovered-' + Date.now();
                setFolders(prev => [...prev, { id: recoveryId, name: 'Recovered Nuggets', parentId: 'root', children: [] }]);
                setNuggets(prev => prev.map(n => folderIds.has(n.folderId) ? n : { ...n, folderId: recoveryId }));
                setExpandedFolders(prev => [...new Set([...prev, 'root', recoveryId])]);
                alert(`Recovered ${orphaned.length} nugget(s) into "Recovered Nuggets".`);
            };
            
            const deleteFolder = (id) => {
                // Collect the whole subtree first (one linear pass using
                // a parent->children index), then apply exactly one
                // setFolders and one setNuggets update. The previous
                // version called setNuggets once per nested folder from a
                // stale closure — only the last call actually took
                // effect (React batches synchronous updates), so most
                // descendant nuggets silently survived, and the
                // descendant folders themselves were never removed at
                // all, only referenced when hunting for their nuggets.
                const childrenOf = new Map();
                folders.forEach(f => {
                    if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                    childrenOf.get(f.parentId).push(f.id);
                });
                const idsToDelete = new Set([id]);
                const stack = [id];
                while (stack.length > 0) {
                    const current = stack.pop();
                    (childrenOf.get(current) || []).forEach(childId => {
                        if (!idsToDelete.has(childId)) {
                            idsToDelete.add(childId);
                            stack.push(childId);
                        }
                    });
                }
                
                setFolders(prev => prev.filter(f => !idsToDelete.has(f.id)));
                setNuggets(prev => prev.filter(n => !idsToDelete.has(n.folderId)));
                if (idsToDelete.has(currentFolder)) {
                    setCurrentFolder('root');
                }
            };
            
            const toggleFolder = (id) => {
                setExpandedFolders(
                    expandedFolders.includes(id)
                        ? expandedFolders.filter(fid => fid !== id)
                        : [...expandedFolders, id]
                );
            };
            
            // Recursive item counts per folder (this folder's own nuggets
            // plus every nested subfolder's), computed once per data
            // change rather than per rendered row — a naive per-folder
            // recursive walk would be the same O(n\u00b2) mistake fixed
            // elsewhere in this file, and at thousands of folders that
            // difference is the gap between instant and frozen.
            const folderRecursiveCounts = useMemo(() => {
                const childrenOf = new Map();
                folders.forEach(f => {
                    if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                    childrenOf.get(f.parentId).push(f.id);
                });
                const directCounts = new Map();
                nuggets.forEach(n => {
                    directCounts.set(n.folderId, (directCounts.get(n.folderId) || 0) + 1);
                });
                const totals = new Map();
                const compute = (folderId) => {
                    if (totals.has(folderId)) return totals.get(folderId);
                    let total = directCounts.get(folderId) || 0;
                    (childrenOf.get(folderId) || []).forEach(childId => {
                        total += compute(childId);
                    });
                    totals.set(folderId, total);
                    return total;
                };
                folders.forEach(f => compute(f.id));
                return Object.fromEntries(totals);
            }, [folders, nuggets]);
            
            // Diagnostic for the "sidebar total looks smaller than the
            // real count" question: a nugget is "orphaned" if its
            // folderId doesn't match any folder that actually exists.
            // These nuggets are still in memory (and still searchable —
            // search scans the whole nuggets array regardless of folder
            // validity) but invisible to folder navigation and to the
            // recursive counts above, since there's no way to click into
            // a folder that doesn't exist.
            const orphanedNuggetCount = useMemo(() => {
                const folderIds = new Set(folders.map(f => f.id));
                return nuggets.filter(n => !folderIds.has(n.folderId)).length;
            }, [folders, nuggets]);
            
            // A second, different way to go invisible: the nugget's own
            // folder exists, but that folder's PARENT chain never
            // actually reaches root — e.g. its parent folder was itself
            // deleted or lost, leaving this folder (and everything
            // nested under it) technically present but unreachable by
            // clicking through the sidebar. Detected once per folder via
            // memoized chain-walking, so this stays fast even at
            // thousands of folders.
            const disconnectedFolderIds = useMemo(() => {
                const byId = new Map(folders.map(f => [f.id, f]));
                const status = new Map();
                const resolve = (id, chain) => {
                    if (status.has(id)) return status.get(id);
                    if (id === 'root') { status.set(id, true); return true; }
                    if (chain.has(id)) {
                        chain.forEach(cid => status.set(cid, false));
                        return false;
                    }
                    const folder = byId.get(id);
                    if (!folder || folder.parentId == null || !byId.has(folder.parentId)) {
                        status.set(id, false);
                        return false;
                    }
                    chain.add(id);
                    const ok = resolve(folder.parentId, chain);
                    status.set(id, ok);
                    return ok;
                };
                return folders.filter(f => !resolve(f.id, new Set())).map(f => f.id);
            }, [folders]);
            
            const disconnectedNuggetCount = useMemo(() => {
                const disconnectedSet = new Set(disconnectedFolderIds);
                return nuggets.filter(n => disconnectedSet.has(n.folderId)).length;
            }, [disconnectedFolderIds, nuggets]);
            
            // A representative "cover" image per folder, so folder cards
            // look distinctive rather than all identical — prefers a
            // real captured screenshot found anywhere in that folder's
            // subtree over a favicon, and only falls back to a favicon
            // if that's genuinely all there is. Single memoized bottom-up
            // pass, same pattern as the recursive counts above, so this
            // stays fast at thousands of folders.
            const folderCoverImages = useMemo(() => {
                const childrenOf = new Map();
                folders.forEach(f => {
                    if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                    childrenOf.get(f.parentId).push(f.id);
                });
                const directReal = new Map();
                const directAny = new Map();
                nuggets.forEach(n => {
                    if (!n.thumbnail) return;
                    if (!directAny.has(n.folderId)) directAny.set(n.folderId, n.thumbnail);
                    if (!n.thumbnail.startsWith(FAVICON_PREFIX) && !directReal.has(n.folderId)) {
                        directReal.set(n.folderId, n.thumbnail);
                    }
                });
                // Two passes: first find a REAL cover anywhere in the
                // subtree (checking every child, not stopping at the
                // first one found); only fall back to a favicon-based
                // cover if truly nothing real exists anywhere below.
                const realCovers = new Map();
                const computeReal = (folderId) => {
                    if (realCovers.has(folderId)) return realCovers.get(folderId);
                    let result = directReal.get(folderId) || null;
                    if (!result) {
                        for (const childId of (childrenOf.get(folderId) || [])) {
                            const childReal = computeReal(childId);
                            if (childReal) { result = childReal; break; }
                        }
                    }
                    realCovers.set(folderId, result);
                    return result;
                };
                const anyCovers = new Map();
                const computeAny = (folderId) => {
                    if (anyCovers.has(folderId)) return anyCovers.get(folderId);
                    let result = computeReal(folderId);
                    if (!result) {
                        result = directAny.get(folderId) || null;
                        if (!result) {
                            for (const childId of (childrenOf.get(folderId) || [])) {
                                const childAny = computeAny(childId);
                                if (childAny) { result = childAny; break; }
                            }
                        }
                    }
                    anyCovers.set(folderId, result);
                    return result;
                };
                folders.forEach(f => computeAny(f.id));
                return Object.fromEntries(anyCovers);
            }, [folders, nuggets]);
            
            // Reattaches just the "top" of each disconnected branch
            // (folders whose parent is missing entirely) back under
            // root — their own children keep pointing to them, so the
            // whole branch's internal organization is preserved exactly,
            // it's just reconnected to the main tree instead of floating
            // disconnected from it.
            const reconnectDisconnectedFolders = () => {
                const byId = new Map(folders.map(f => [f.id, f]));
                const candidates = disconnectedFolderIds.filter(id => {
                    const f = byId.get(id);
                    return f && !byId.has(f.parentId);
                });
                if (candidates.length === 0) {
                    alert('Nothing to reconnect.');
                    return;
                }
                if (!confirm(`Found ${candidates.length} folder(s) disconnected from the main tree (their parent folder no longer exists). Reconnect them directly under "All Nuggetz"? Their own contents and subfolders stay organized exactly as they are — this just reattaches the top of that branch.`)) {
                    return;
                }
                const candidateSet = new Set(candidates);
                setFolders(prev => prev.map(f => candidateSet.has(f.id) ? { ...f, parentId: 'root' } : f));
                setExpandedFolders(prev => [...new Set([...prev, 'root'])]);
            };
            
            const getFolderNuggets = (folderId) => {
                if (folderId === 'root') {
                    return nuggets;
                }
                return nuggets.filter(n => n.folderId === folderId);
            };
            
            const getFilteredNuggets = () => {
                if (!searchQuery) return getFolderNuggets(currentFolder);
                // A search matches across the whole collection, not just
                // the currently open folder — matching how Pearltrees'
                // search behaves, since the point of searching is to
                // find something wherever it's actually filed.
                const q = searchQuery.toLowerCase();
                return nuggets.filter(n =>
                    n.title.toLowerCase().includes(q) ||
                    n.url.toLowerCase().includes(q) ||
                    n.description?.toLowerCase().includes(q)
                );
            };
            
            const getMatchingFolders = () => {
                if (!searchQuery) return [];
                const q = searchQuery.toLowerCase();
                return folders.filter(f => f.id !== 'root' && f.name.toLowerCase().includes(q));
            };
            
            const handleNuggetDragStart = (nugget) => {
                setDraggedNugget(nugget);
            };
            
            const handleNuggetDragEnd = () => {
                setDraggedNugget(null);
                setDragOverFolder(null);
            };
            
            const handleFolderDragOver = (e, folderId) => {
                e.preventDefault();
                setDragOverFolder(folderId);
            };
            
            const handleFolderDrop = (e, folderId) => {
                e.preventDefault();
                if (draggedNugget) {
                    updateNugget(draggedNugget.id, { folderId });
                } else if (draggedFolder && draggedFolder.id !== folderId) {
                    setFolders(folders.map(f =>
                        f.id === draggedFolder.id ? { ...f, parentId: folderId } : f
                    ));
                }
                setDraggedNugget(null);
                setDraggedFolder(null);
                setDragOverFolder(null);
            };
            
            // --- Tree (canvas) view handlers ---
            
            const moveNodePosition = (id, x, y) => {
                setNodePositions(prev => ({ ...prev, [id]: { x, y } }));
            };
            
            const clearNodePosition = (id) => {
                setNodePositions(prev => {
                    if (!(id in prev)) return prev;
                    const next = { ...prev };
                    delete next[id];
                    return next;
                });
            };
            
            const renameFolder = (id, name) => {
                setFolders(folders.map(f => f.id === id ? { ...f, name } : f));
            };
            
            // Dragging one nugget onto another creates a brand-new tree
            // (folder) containing both, mirroring Pearltrees-style nesting.
            const nestNuggets = (draggedId, targetId) => {
                if (draggedId === targetId) return;
                const targetNugget = nuggets.find(n => n.id === targetId);
                if (!targetNugget) return;
                const parentId = targetNugget.folderId || 'root';
                const newFolder = { id: 'f' + Date.now().toString(), name: 'New Tree', parentId, children: [] };
                setFolders(prev => [...prev, newFolder]);
                setNuggets(prev => prev.map(n =>
                    (n.id === draggedId || n.id === targetId) ? { ...n, folderId: newFolder.id } : n
                ));
                setExpandedFolders(prev => [...new Set([...prev, parentId, newFolder.id])]);
                clearNodePosition(draggedId);
                clearNodePosition(targetId);
            };
            
            const moveNuggetIntoFolder = (nuggetId, folderId) => {
                updateNugget(nuggetId, { folderId });
                clearNodePosition(nuggetId);
            };
            
            const nestFolderInFolder = (folderId, targetFolderId) => {
                if (folderId === targetFolderId) return;
                if (isDescendantFolder(folders, folderId, targetFolderId)) return;
                setFolders(folders.map(f => f.id === folderId ? { ...f, parentId: targetFolderId } : f));
                clearNodePosition(folderId);
            };
            
            const exportData = () => {
                const rdfContent = RDFUtil.exportToRDF(folders, nuggets);
                const blob = new Blob([rdfContent], { type: 'application/rdf+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `nuggetz-export-${new Date().toISOString().split('T')[0]}.rdf`;
                a.click();
                URL.revokeObjectURL(url);
            };
            
            const [isImporting, setIsImporting] = useState(false);
            
            const importData = () => {
                if (isImporting) return;
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.rdf,.xml';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        setIsImporting(true);
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const { folders: importedFolders, nuggets: importedNuggets, method } =
                                    RDFUtil.importFromRDF(event.target.result);
                                if (!importedFolders.length && !importedNuggets.length) {
                                    alert("Couldn't find any bookmarks or folders in that file.");
                                    return;
                                }
                                setFolders([...folders, ...importedFolders]);
                                setNuggets([...nuggets, ...importedNuggets]);
                                if (method === 'generic') {
                                    alert(
                                        `Imported ${importedNuggets.length} link(s) into ${importedFolders.length} folder(s), ` +
                                        `filed under "Imported from Pearltrees".\n\nThis wasn't a Nuggetz file, so the folder ` +
                                        `structure was reconstructed heuristically from the RDF — worth a quick look to check ` +
                                        `nesting and titles came through as expected.`
                                    );
                                } else {
                                    alert(`Imported ${importedNuggets.length} nugget(s) and ${importedFolders.length} folder(s).`);
                                }
                            } catch (error) {
                                alert('Import failed: ' + error.message);
                            } finally {
                                setIsImporting(false);
                            }
                        };
                        reader.onerror = () => setIsImporting(false);
                        reader.readAsText(file);
                    }
                };
                input.click();
            };
            
            const getBreadcrumb = () => {
                const path = [];
                let current = folders.find(f => f.id === currentFolder);
                
                while (current) {
                    path.unshift(current);
                    current = folders.find(f => f.id === current.parentId);
                }
                
                return path;
            };
            
            return (
                <>
                    <header className="app-header">
                        <div className="header-content">
                            <div className="logo-block">
                                <div className="logo">Nuggetz</div>
                                <div className="logo-meta">
                                    <span className="app-version">v{APP_VERSION}</span>
                                    <button className="diagnostics-link" onClick={() => setShowDiagnostics(true)}>
                                        Diagnostics
                                    </button>
                                </div>
                            </div>
                            <div className="header-actions">
                                <button className="btn btn-secondary" onClick={() => setShowAddFolder(true)}>
                                    <Icons.Plus /> New Folder
                                </button>
                                <button className="btn btn-primary" onClick={() => setShowAddNugget(true)}>
                                    <Icons.Plus /> Add Nugget
                                </button>
                                <button className="btn btn-secondary" onClick={exportData}>
                                    <Icons.Download />
                                </button>
                                <button className="btn btn-secondary" onClick={importData} disabled={isImporting} title={isImporting ? 'Importing…' : 'Import'}>
                                    {isImporting ? '…' : <Icons.Upload />}
                                </button>
                                <button className="btn btn-secondary" onClick={backfillThumbnails} title="Add a site-icon thumbnail to nuggets missing one">
                                    <Icons.Image />
                                </button>
                                {screenshotProgress ? (
                                    <div className="screenshot-progress" title={`${screenshotProgress.done} of ${screenshotProgress.total}`}>
                                        <Icons.Camera />
                                        <span>{screenshotProgress.waiting ? 'waiting…' : `${screenshotProgress.done}/${screenshotProgress.total}`}</span>
                                        {!screenshotProgress.stopped && (
                                            <button
                                                className="screenshot-stop-btn"
                                                onClick={() => { screenshotCancelRef.current = true; }}
                                                title="Stop capturing"
                                            >
                                                ×
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    <button className="btn btn-secondary" onClick={captureRealThumbnails} title="Capture real screenshot thumbnails (via Cloudflare)">
                                        <Icons.Camera />
                                    </button>
                                )}
                                <button
                                    className={`btn btn-secondary sync-btn sync-${syncEnabled ? syncStatus : 'idle'}`}
                                    onClick={handleSyncButtonClick}
                                    title={syncEnabled ? 'Google Drive sync — click for options' : 'Connect Google Drive to sync across devices'}
                                >
                                    <Icons.Cloud />
                                    <span className="sync-dot" />
                                    <span className="sync-label">{syncButtonLabel()}</span>
                                </button>
                            </div>
                        </div>
                    </header>
                    
                    <div className="main-container">
                        <aside className="sidebar">
                            <div className="sidebar-header">
                                <div className="sidebar-title">Folders</div>
                            </div>
                            <FolderTree
                                folders={folders}
                                expandedFolders={expandedFolders}
                                currentFolder={currentFolder}
                                nuggets={nuggets}
                                folderCounts={folderRecursiveCounts}
                                onToggle={toggleFolder}
                                onSelect={setCurrentFolder}
                                onDelete={deleteFolder}
                                onRename={renameFolder}
                                dragOverFolder={dragOverFolder}
                                onDragOver={handleFolderDragOver}
                                onDrop={handleFolderDrop}
                                onFolderDragStart={setDraggedFolder}
                                onFolderDragEnd={() => setDraggedFolder(null)}
                            />
                        </aside>
                        
                        <main className={`content-area ${viewMode === 'tree' ? 'content-area-tree' : ''}`}>
                            <div className="content-header">
                                <div className="breadcrumb">
                                    {getBreadcrumb().map((folder, idx, arr) => (
                                        <React.Fragment key={folder.id}>
                                            <span
                                                className={`breadcrumb-item ${idx === arr.length - 1 ? 'active' : ''}`}
                                                onClick={() => setCurrentFolder(folder.id)}
                                            >
                                                {folder.name}
                                            </span>
                                            {idx < arr.length - 1 && <span className="breadcrumb-item">/</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="view-controls">
                                <div className="search-box">
                                    <Icons.Search />
                                    <input
                                        type="text"
                                        className="search-input"
                                        placeholder="Search nuggetz..."
                                        value={searchInput}
                                        onChange={(e) => setSearchInput(e.target.value)}
                                    />
                                </div>
                                <div className="view-toggle">
                                    <button
                                        className={`view-btn ${viewMode === 'grid' ? 'active' : ''}`}
                                        onClick={() => setViewMode('grid')}
                                    >
                                        Grid
                                    </button>
                                    <button
                                        className={`view-btn ${viewMode === 'list' ? 'active' : ''}`}
                                        onClick={() => setViewMode('list')}
                                    >
                                        List
                                    </button>
                                    <button
                                        className={`view-btn ${viewMode === 'tree' ? 'active' : ''}`}
                                        onClick={() => setViewMode('tree')}
                                    >
                                        Tree
                                    </button>
                                </div>
                            </div>
                            
                            {viewMode === 'tree' ? (
                                <TreeCanvas
                                    rootFolderId={currentFolder}
                                    folders={folders}
                                    nuggets={nuggets}
                                    nodePositions={nodePositions}
                                    searchQuery={searchQuery}
                                    onNavigateFolder={setCurrentFolder}
                                    onRenameFolder={renameFolder}
                                    onEditNugget={setEditingNugget}
                                    onMoveNode={moveNodePosition}
                                    onNestNuggets={nestNuggets}
                                    onMoveNuggetToFolder={moveNuggetIntoFolder}
                                    onNestFolder={nestFolderInFolder}
                                />
                            ) : (
                                <>
                                    {searchQuery && getMatchingFolders().length > 0 && (
                                        <div className="search-folder-matches">
                                            <div className="search-folder-matches-title">Folders</div>
                                            <div className="search-folder-matches-list">
                                                {getMatchingFolders().slice(0, 20).map(f => (
                                                    <button
                                                        key={f.id}
                                                        className="search-folder-chip"
                                                        onClick={() => { setCurrentFolder(f.id); setSearchInput(''); }}
                                                    >
                                                        <Icons.Folder /> {f.name}
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <NuggetGrid
                                        nuggets={getFilteredNuggets()}
                                        subfolders={searchQuery ? [] : folders.filter(f => f.parentId === currentFolder)}
                                        folderCounts={folderRecursiveCounts}
                                        folderCoverImages={folderCoverImages}
                                        onNavigateFolder={setCurrentFolder}
                                        onEdit={setEditingNugget}
                                        onDelete={deleteNugget}
                                        onDragStart={handleNuggetDragStart}
                                        onDragEnd={handleNuggetDragEnd}
                                        onPreview={setPreviewNugget}
                                    />
                                </>
                            )}
                        </main>
                    </div>
                    
                    {showAddNugget && (
                        <NuggetModal
                            initialData={shareDraft}
                            folders={folders}
                            currentFolder={currentFolder}
                            onClose={() => { setShowAddNugget(false); setShareDraft(null); }}
                            onSave={(data) => {

        function FolderTree({ folders, expandedFolders, currentFolder, nuggets, folderCounts, onToggle, onSelect, onDelete, onRename, dragOverFolder, onDragOver, onDrop, onFolderDragStart, onFolderDragEnd }) {
            // Sidebar folders can number in the thousands after a large
            // import. Two safeguards keep this fast: (1) a collapsed
            // folder's children are never rendered into the DOM at all —
            // previously they were ALWAYS rendered (the whole tree, every
            // render) and merely hidden with CSS max-height, meaning
            // every folder in the entire tree was rebuilt on every
            // keystroke or unrelated state change, not just the visible
            // part; (2) a per-folder cap with "Show more" guards against
            // a single folder having an unusually large number of direct
            // children (e.g. a bulk-import wrapper folder).
            const [childLimits, setChildLimits] = useState({});
            const CHILD_PAGE_SIZE = 200;
            
            const renderFolder = (folder, level = 0) => {
                const allChildren = folders.filter(f => f.parentId === folder.id);
                const isExpanded = expandedFolders.includes(folder.id);
                const totalItems = folderCounts[folder.id] || 0;
                const isDragOver = dragOverFolder === folder.id;
                const limit = childLimits[folder.id] || CHILD_PAGE_SIZE;
                const children = allChildren.slice(0, limit);
                
                return (
                    <li key={folder.id} className="folder-item">
                        <div
                            className={`folder-header ${currentFolder === folder.id ? 'active' : ''} ${isDragOver ? 'drag-over' : ''}`}
                            onClick={() => onSelect(folder.id)}
                            draggable={folder.id !== 'root'}
                            onDragStart={() => folder.id !== 'root' && onFolderDragStart(folder)}
                            onDragEnd={onFolderDragEnd}
                            onDragOver={(e) => onDragOver(e, folder.id)}
                            onDrop={(e) => onDrop(e, folder.id)}
                        >
                            {allChildren.length > 0 && (
                                <Icons.ChevronRight
                                    className={`folder-expand ${isExpanded ? 'expanded' : ''}`}
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onToggle(folder.id);
                                    }}
                                />
                            )}
                            <Icons.Folder />
                            <span
                                className="folder-name"
                                onDoubleClick={(e) => {
                                    if (folder.id === 'root') return;
                                    e.stopPropagation();
                                    const name = window.prompt('Rename folder', folder.name);
                                    if (name && name.trim()) onRename(folder.id, name.trim());
                                }}
                            >
                                {folder.name}
                            </span>
                            <span
                                className="folder-count"
                                title={`${totalItems} link${totalItems === 1 ? '' : 's'} in total${allChildren.length ? `, across ${allChildren.length} subfolder${allChildren.length === 1 ? '' : 's'}` : ''}`}
                            >
                                {totalItems}
                            </span>
                            {folder.id !== 'root' && (
                                <button
                                    className="icon-btn"
                                    title="Rename folder"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        const name = window.prompt('Rename folder', folder.name);
                                        if (name && name.trim()) onRename(folder.id, name.trim());
                                    }}
                                >
                                    <Icons.Edit />
                                </button>
                            )}
                            {folder.id !== 'root' && (
                                <button
                                    className="icon-btn"
                                    title="Delete folder"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        if (confirm(`Delete "${folder.name}" and all its contents?`)) {
                                            onDelete(folder.id);
                                        }
                                    }}
                                >
                                    <Icons.Trash />
                                </button>
                            )}
                        </div>
                        {isExpanded && allChildren.length > 0 && (
                            <ul className="folder-children">
                                {children.map(child => renderFolder(child, level + 1))}
                                {allChildren.length > limit && (
                                    <li className="folder-show-more">
                                        <button
                                            className="btn btn-secondary folder-show-more-btn"
                                            onClick={(e) => {
                                                e.stopPropagation();
                                                setChildLimits(prev => ({ ...prev, [folder.id]: limit + CHILD_PAGE_SIZE }));
                                            }}
                                        >
                                            Show more ({allChildren.length - limit} remaining)
                                        </button>
                                    </li>
                                )}
                            </ul>
                        )}
                    </li>
                );
            };
            
            return (
                <ul className="folder-tree">
                    {folders.filter(f => f.parentId === null).map(folder => renderFolder(folder))}
                </ul>
            );
        }
        
        function NuggetPreviewModal({ nugget, onClose, onEdit }) {

        function NuggetGrid({ nuggets, subfolders, folderCounts, folderCoverImages, onNavigateFolder, onEdit, onDelete, onDragStart, onDragEnd, onPreview }) {
            // With very large collections (bulk imports especially),
            // rendering every card at once can freeze the browser — there's
            // no virtualized-list library here, so this simple page-size
            // cap is the pragmatic guard: render a batch, offer "Load
            // more" for the rest, reset whenever the underlying list
            // changes (switching folders, searching). Subfolders and
            // nuggets are paginated separately, since a folder can have
            // many of one and few of the other.
            const PAGE_SIZE = 300;

                            Start collecting your favorite URLs and organize them into folders

            const visibleFolders = subfolders.slice(0, visibleFolderCount);
            const visible = nuggets.slice(0, visibleCount);
            
            return (

                            <FolderCard

                    {visibleFolderCount < subfolders.length && (
                        <div className="load-more-row">

                                Load more folders ({subfolders.length - visibleFolderCount} remaining)
                            </button>

                    )}
                    {visibleCount < nuggets.length && (
                        <div className="load-more-row">
                            <button className="btn btn-secondary" onClick={() => setVisibleCount(c => c + PAGE_SIZE)}>

        }
        
        function FolderCard({ folder, count, cover, onOpen }) {
