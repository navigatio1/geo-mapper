                                nuggets={nuggets}
                                folderCounts={folderRecursiveCounts}
                                onToggle={toggleFolder}
                                onSelect={setCurrentFolder}
                                onDelete={deleteFolder}
                                onRename={renameFolder}
                                dragOverFolder={dragOverFolder}
                                onDragOver={handleFolderDragOver}
                                onDrop={handleFolderDrop}
                                onFolderDragStart={setDraggedFolder}
                                onFolderDragEnd={() => setDraggedFolder(null)}
                            />
                        </aside>
                        
                        <main className={`content-area ${viewMode === 'tree' ? 'content-area-tree' : ''}`}>
                            <div className="content-header">
                                {(() => {
                                    const here = folderById.get(currentFolder);
                                    const parent = here && currentFolder !== 'root' ? folderById.get(here.parentId || 'root') : null;
                                    return (
                                        <div className="folder-nav-row">
                                            {parent && (
                                                <button
                                                    className="btn btn-secondary up-btn"
                                                    onClick={() => setCurrentFolder(parent.id)}
                                                    title={`Go up to ${parent.name}`}
                                                >
                                                    <span aria-hidden="true">↑</span>
                                                    <span className="up-label">Up to {parent.name}</span>
                                                </button>
                                            )}
                                            {here && (
                                                <button
                                                    className="btn btn-secondary"
                                                    onClick={() => setCoverFolderId(here.id)}
                                                    title={currentFolder === 'root' ? 'Choose how folder cards look across the whole library' : 'Choose how this folder looks on its card'}
                                                >
                                                    {currentFolder === 'root' ? '🖼 Default folder covers' : '🖼 Folder cover'}
                                                </button>
                                            )}
                                        </div>
                                    );
                                })()}
                                <div className="breadcrumb">
                                    {getBreadcrumb().map((folder, idx, arr) => (
                                        <React.Fragment key={folder.id}>
                                            <span
                                                className={`breadcrumb-item ${idx === arr.length - 1 ? 'active' : ''} ${dragOverFolder === folder.id ? 'drop-target' : ''}`}
                                                data-drop-folder={idx < arr.length - 1 ? folder.id : undefined}
                                                onClick={() => setCurrentFolder(folder.id)}
                                                onDragOver={idx < arr.length - 1 ? (e) => handleFolderDragOver(e, folder.id) : undefined}
                                                onDragLeave={() => setDragOverFolder(null)}
                                                onDrop={idx < arr.length - 1 ? (e) => handleFolderDrop(e, folder.id) : undefined}
                                            >
                                                {folder.name}
                                            </span>
                                            {idx < arr.length - 1 && <span className="breadcrumb-item">/</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="view-controls">
                                <div className="search-box">
                                    <Icons.Search />
                                    <input
                                        type="text"
                                        className="search-input"
                                        placeholder="Search nuggetz..."
                                        value={searchInput}
                                        onChange={(e) => setSearchInput(e.target.value)}
                                    />
                                </div>
                                <div className="view-toggle">
                                    <button
                                        className={`view-btn ${viewMode === 'grid' ? 'active' : ''}`}
                                        onClick={() => setViewMode('grid')}
                                    >
                                        Grid
                                    </button>
                                    <button
                                        className={`view-btn ${viewMode === 'list' ? 'active' : ''}`}
                                        onClick={() => setViewMode('list')}
                                    >
                                        List
                                    </button>
                                    <button
                                        className={`view-btn ${viewMode === 'tree' ? 'active' : ''}`}
                                        onClick={() => setViewMode('tree')}
                                    >
                                        Tree
                                    </button>
                                </div>
                            </div>
                            
                            {viewMode !== 'tree' && (
                                <div className="sort-row">
                                    <label>Sort folders:</label>
                                    <select value={folderSort} onChange={(e) => setFolderSort(e.target.value)}>
                                        <option value="default">Original order</option>
                                        <option value="name">Name (A–Z)</option>
                                        <option value="size">Size (largest first)</option>
                                    </select>
                                    <label>Nuggets:</label>
                                    <select value={nuggetSort} onChange={(e) => setNuggetSort(e.target.value)}>
                                        <option value="newest">Recently added first</option>
                                        <option value="oldest">Oldest added first</option>
                                        <option value="title">Title (A–Z)</option>
                                        <option value="default">Original order</option>
                                    </select>
                                </div>
                            )}
                            {viewMode === 'tree' ? (
                                <TreeCanvas
                                    rootFolderId={currentFolder}
                                    folders={folders}
                                    nuggets={nuggets}
                                    nodePositions={nodePositions}
                                    searchQuery={searchQuery}
                                    onNavigateFolder={setCurrentFolder}
                                    onRenameFolder={renameFolder}
                                    onEditNugget={setEditingNugget}
                                    onMoveNode={moveNodePosition}
                                    onNestNuggets={nestNuggets}
                                    onMoveNuggetToFolder={moveNuggetIntoFolder}
                                    onNestFolder={nestFolderInFolder}
                                />
                            ) : (
                                <>
                                    {searchQuery && getMatchingFolders().length > 0 && (
                                        <div className="search-folder-matches">
                                            <div className="search-folder-matches-title">Folders</div>
                                            <div className="search-folder-matches-list">
                                                {getMatchingFolders().slice(0, 40).map(f => (
                                                    <button
                                                        key={f.id}
                                                        className="search-folder-chip"
                                                        onClick={() => { setCurrentFolder(f.id); setSearchInput(''); }}
                                                    >
                                                        <Icons.Folder /> {f.name}
                                                        <span className="chip-meta">
                                                            {(folderRecursiveCounts[f.id] || 0).toLocaleString()} items
                                                            {folderPathLabel(f) ? ' · in ' + folderPathLabel(f) : ''}
                                                        </span>
                                                    </button>
                                                ))}
                                            </div>
                                        </div>
                                    )}
                                    <div className={viewMode === 'list' ? 'list-mode' : ''}>
                                    <NuggetGrid
                                        nuggets={visibleNuggets}
                                        subfolders={visibleSubfolders}
                                        folderCounts={folderRecursiveCounts}
                                        folderCoverImages={folderCoverImages}
                                        onEditCover={setCoverFolderId}
                                        onNavigateFolder={setCurrentFolder}
                                        onEdit={setEditingNugget}
                                        onDelete={deleteNugget}
                                        onDragStart={handleNuggetDragStart}
                                        onDragEnd={handleNuggetDragEnd}
                                        onPreview={setPreviewNugget}
                                        dragOverFolder={dragOverFolder}
                                        onFolderDragOver={handleFolderDragOver}
                                        onFolderDragLeave={() => setDragOverFolder(null)}
                                        onFolderDrop={handleFolderDrop}
                                        onFolderDragStart={setDraggedFolder}
                                        onFolderDragEnd={() => { setDraggedFolder(null); setDragOverFolder(null); }}
                                    />
                                    </div>
                                </>
                            )}
                        </main>
                    </div>
                    
                    {showAddNugget && (
                        <NuggetModal
                            initialData={shareDraft}
                            folders={folders}
                            currentFolder={currentFolder}
                            onClose={() => { setShowAddNugget(false); setShareDraft(null); }}
                            onCreateFolder={createFolder}
                            findExisting={findExisting}
                            onSave={(data) => {
                                rememberRecentFolder(data.folderId || currentFolder);
                                const { _autoTitle, _previewPending, _updateExistingId, ...clean } = data;
                                if (!clean.thumbnail) clean.thumbnail = '';
                                if (_updateExistingId) {
                                    const before = nuggets.find(n => n.id === _updateExistingId);
                                    if (before) {
                                        const changes = { title: clean.title, description: clean.description, thumbnail: clean.thumbnail, folderId: clean.folderId, updated: new Date().toISOString() };
                                        updateNugget(before.id, changes);
                                        const after = { ...before, ...changes };
                                        pushUndo(`Updated ${quote(cardTitle(after.title))} (kept its original date)`,
                                            () => setNuggets(prev => prev.map(n => n.id === before.id ? (recordChange.nugget(before), before) : n)));
                                        if (_previewPending || !after.thumbnail || after.thumbnail.startsWith(FAVICON_PREFIX)) topUpPreview(after, _autoTitle);
                                        setShowAddNugget(false);
                                        setShareDraft(null);
                                        return;
                                    }
                                }
                                const added = addNugget(clean);
                                if (_previewPending || _autoTitle || !added.thumbnail || added.thumbnail.startsWith(FAVICON_PREFIX)) {
                                    topUpPreview(added, _autoTitle);
                                }
                                const fname = (folderById.get(added.folderId) || {}).name || 'All Nuggetz';
                                showToast(`\u2713 Saved to ${quote(fname)}`, 'Open', () => setCurrentFolder(added.folderId));
                                setShowAddNugget(false);
                                setShareDraft(null);
                            }}
                        />
                    )}
                    
                    {showAddFolder && (
                        <FolderModal
                            onClose={() => setShowAddFolder(false)}
                            onSave={(name) => {
                                addFolder(name, currentFolder);
                                setShowAddFolder(false);
                            }}
                        />
                    )}
                    
                    {showDiagnostics && (
                        <DiagnosticsModal
                            onClose={() => setShowDiagnostics(false)}
                            folders={folders}
                            nuggets={nuggets}
                            syncEnabled={syncEnabled}
                            syncStatus={syncStatus}
                            orphanedNuggetCount={orphanedNuggetCount}
                            onRecoverOrphaned={recoverOrphanedNuggets}
                            disconnectedFolderCount={disconnectedFolderIds.length}
                            disconnectedNuggetCount={disconnectedNuggetCount}
                            onReconnectFolders={reconnectDisconnectedFolders}
                            onOpenHistory={() => setShowRestoreHistory(true)}
                            onEnableStaySignedIn={enableStaySignedIn}
                            onOpenTidy={() => { setShowDiagnostics(false); setShowTidy(true); }}
                        />
                    )}
                    
                    {toast && (
                        <div className="saved-toast" role="status" key={toast.at}>
                            <span>{toast.text}</span>
                            {toast.actionLabel && (
                                <button type="button" className="btn btn-secondary" onClick={() => { const a = toast.onAction; setToast(null); if (a) a(); }}>{toast.actionLabel}</button>
                            )}
                            <button type="button" className="saved-toast-close" aria-label="Dismiss" onClick={() => setToast(null)}>×</button>
                        </div>
                    )}
                    {syncEnabled && libraryLoading && syncStatus !== 'signed-out' && syncStatus !== 'error' && (
                        <div className="library-loading" role="status">
                            Loading your library from Drive… Anything you save now is kept.
                        </div>
                    )}

                    {showTidy && (
                        <TidyLibraryModal
                            folders={folders}
                            nuggets={nuggets}
                            onClose={() => setShowTidy(false)}
                            onOpenFolder={(id) => { setShowTidy(false); setCurrentFolder(id); }}
                            onRescue={(newFolders, target) => {
                                setFolders(prev => [...prev, ...newFolders]);
                                setNuggets(prev => prev.map(nu => {
                                    const t = target.get(nu.id);
                                    return t ? { ...nu, folderId: t.folderId, oldPath: t.oldPath } : nu;
                                }));
                            }}
                            onMoveToHolder={(ids, kind, label) => {
                                const moveSet = new Set(ids);
                                setFolders(prev => {
                                    const existing = prev.find(f => f.parentId === 'root' && typeof f.id === 'string' && f.id.startsWith('oldlib-' + kind + '-'));
                                    const holderId = existing ? existing.id : 'oldlib-' + kind + '-' + Date.now();
                                    const moved = prev.map(f => moveSet.has(f.id) ? { ...f, parentId: holderId } : f);
                                    return existing ? moved : [...moved, { id: holderId, name: label, parentId: 'root', children: [] }];
                                });
                            }}
                        />
                    )}

                    {coverFolderId && folderById.get(coverFolderId) && (
                        <FolderCoverModal
                            folder={folderById.get(coverFolderId)}
                            folders={folders}
                            nuggets={nuggets}
                            folderById={folderById}
                            effective={effectiveCovers.get(coverFolderId)}
                            onClose={() => setCoverFolderId(null)}
                            onSave={(cover) => { setFolderCover(coverFolderId, cover); setCoverFolderId(null); }}
                        />
                    )}

                    {showRestoreHistory && (
                        <RestoreHistoryModal
                            onClose={() => setShowRestoreHistory(false)}
                            onRestore={handleRestoreFromHistory}
                        />
                    )}
                    
                    {editingNugget && (
                        <NuggetModal
                            nugget={editingNugget}
                            folders={folders}
                            currentFolder={currentFolder}
                            onClose={() => setEditingNugget(null)}
                            onCreateFolder={createFolder}
                            onSave={(data) => {
                                const before = editingNugget;
                                const moved = data.folderId && data.folderId !== before.folderId;
                                if (moved) rememberRecentFolder(data.folderId);
                                updateNugget(before.id, { ...data, updated: new Date().toISOString() });
                                pushUndo(moved ? `Moved ${quote(data.title)} to ${quote((folderById.get(data.folderId) || {}).name)}` : `Edited ${quote(data.title)}`,
                                    () => setNuggets(prev => prev.map(n => n.id === before.id ? (recordChange.nugget(before), before) : n)));
                                setEditingNugget(null);
                            }}
                        />
                    )}
                    
                    {previewNugget && (
                        <NuggetPreviewModal
                            nugget={previewNugget}
                            onClose={() => setPreviewNugget(null)}
                            onEdit={setEditingNugget}
                        />
                    )}
                </>
            );
        }
        
        function FolderTree({ folders, expandedFolders, currentFolder, nuggets, folderCounts, onToggle, onSelect, onDelete, onRename, dragOverFolder, onDragOver, onDrop, onFolderDragStart, onFolderDragEnd }) {
            // Sidebar folders can number in the thousands after a large
            // import. Two safeguards keep this fast: (1) a collapsed
            // folder's children are never rendered into the DOM at all —
            // previously they were ALWAYS rendered (the whole tree, every
            // render) and merely hidden with CSS max-height, meaning
            // every folder in the entire tree was rebuilt on every
            // keystroke or unrelated state change, not just the visible
            // part; (2) a per-folder cap with "Show more" guards against
            // a single folder having an unusually large number of direct
            // children (e.g. a bulk-import wrapper folder).
            const [childLimits, setChildLimits] = useState({});
            const CHILD_PAGE_SIZE = 200;
            
            const renderFolder = (folder, level = 0) => {
                const allChildren = folders.filter(f => f.parentId === folder.id);
                const isExpanded = expandedFolders.includes(folder.id);
                const totalItems = folderCounts[folder.id] || 0;
                const isDragOver = dragOverFolder === folder.id;
                const limit = childLimits[folder.id] || CHILD_PAGE_SIZE;
                const children = allChildren.slice(0, limit);
                
                return (
                    <li key={folder.id} className="folder-item">
                        <div
                            className={`folder-header ${currentFolder === folder.id ? 'active' : ''} ${isDragOver ? 'drag-over' : ''}`}
                            data-drop-folder={folder.id}
                            onClick={() => onSelect(folder.id)}
                            draggable={folder.id !== 'root'}
                            onDragStart={() => folder.id !== 'root' && onFolderDragStart(folder)}
                            onDragEnd={onFolderDragEnd}
                            onDragOver={(e) => onDragOver(e, folder.id)}
                            onDrop={(e) => onDrop(e, folder.id)}
                        >
                            {allChildren.length > 0 && (
                                <Icons.ChevronRight
                                    className={`folder-expand ${isExpanded ? 'expanded' : ''}`}
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onToggle(folder.id);
                                    }}

        // ---- Touch drag and drop (phones/tablets), 1.6.28 ----
        // Press and hold a nugget or folder card (~0.45s, a short buzz),
        // then drag it onto any folder card, breadcrumb or sidebar folder.
        // A quick swipe still scrolls as normal: moving before the hold
        // completes cancels the drag. Drop targets carry a
        // data-drop-folder attribute. Undo covers mistakes.
        const TouchDrag = {
            handler: null,          // set by the app: (payload, folderId) => void
            timer: null, payload: null, label: '', startX: 0, startY: 0,
            active: false, ghost: null, overEl: null, suppressClickUntil: 0
        };
        const touchDragCleanup = () => {
            clearTimeout(TouchDrag.timer);
            TouchDrag.timer = null;
            if (TouchDrag.ghost) TouchDrag.ghost.remove();
            if (TouchDrag.overEl) TouchDrag.overEl.classList.remove('drop-target');
            document.body.classList.remove('touch-dragging');
            TouchDrag.ghost = null; TouchDrag.overEl = null; TouchDrag.active = false; TouchDrag.payload = null;
            window.removeEventListener('touchmove', touchDragMove, { passive: false });
            window.removeEventListener('touchend', touchDragEnd);
            window.removeEventListener('touchcancel', touchDragCancel);
        };
        const touchDragMove = (e) => {
            const t = e.touches && e.touches[0];
            if (!t) return;
            if (!TouchDrag.active) {
                // Moved before the hold finished: it's a scroll, not a drag.
                if (Math.abs(t.clientX - TouchDrag.startX) > 10 || Math.abs(t.clientY - TouchDrag.startY) > 10) touchDragCleanup();
                return;
            }
            e.preventDefault(); // stop the page scrolling while dragging
            TouchDrag.ghost.style.transform = `translate(${t.clientX + 12}px, ${t.clientY - 28}px)`;
            const el = document.elementFromPoint(t.clientX, t.clientY);
            const target = el && el.closest ? el.closest('[data-drop-folder]') : null;
            if (target !== TouchDrag.overEl) {
                if (TouchDrag.overEl) TouchDrag.overEl.classList.remove('drop-target');
                TouchDrag.overEl = target;
                if (target) target.classList.add('drop-target');
            }
        };
        const touchDragEnd = () => {
            if (TouchDrag.active) {
                TouchDrag.suppressClickUntil = Date.now() + 500;
                const target = TouchDrag.overEl;
                const payload = TouchDrag.payload;
                if (target && payload && TouchDrag.handler) TouchDrag.handler(payload, target.getAttribute('data-drop-folder'));
            }
            touchDragCleanup();
        };
        const touchDragCancel = () => touchDragCleanup();
        const touchDragStart = (e, payload, label) => {
            if (!e.touches || e.touches.length !== 1) return;
            touchDragCleanup();
            const t = e.touches[0];
            TouchDrag.payload = payload; TouchDrag.label = label;
            TouchDrag.startX = t.clientX; TouchDrag.startY = t.clientY;
            window.addEventListener('touchmove', touchDragMove, { passive: false });
            window.addEventListener('touchend', touchDragEnd);
            window.addEventListener('touchcancel', touchDragCancel);
            TouchDrag.timer = setTimeout(() => {
                TouchDrag.active = true;
                document.body.classList.add('touch-dragging');
                const g = document.createElement('div');
                g.className = 'touch-drag-ghost';
                g.textContent = (payload.type === 'folder' ? '\uD83D\uDCC1 ' : '') + (label.length > 40 ? label.slice(0, 38) + '\u2026' : label);
                g.style.transform = `translate(${TouchDrag.startX + 12}px, ${TouchDrag.startY - 28}px)`;
                document.body.appendChild(g);
                TouchDrag.ghost = g;
                try { if (navigator.vibrate) navigator.vibrate(25); } catch (err) {}
            }, 450);
        };
        const touchClickSuppressed = () => Date.now() < TouchDrag.suppressClickUntil;

        // Big folders show 300 items at a time (drawing thousands of
        // cards at once freezes the browser). This loads the next batch
        // automatically when you scroll near the bottom; the button is
        // a fallback for browsers without IntersectionObserver.
        function AutoLoadMore({ onMore, trigger, label }) {
            const ref = useRef(null);
            const [inView, setInView] = useState(false);
            useEffect(() => {
                if (!ref.current || typeof IntersectionObserver === 'undefined') return;
                const io = new IntersectionObserver(entries => setInView(entries[0].isIntersecting), { rootMargin: '600px 0px' });
                io.observe(ref.current);
                return () => io.disconnect();
            }, []);
            useEffect(() => {
                if (!inView) return;
                const t = setTimeout(onMore, 50);
                return () => clearTimeout(t);
            }, [inView, trigger]);
            return (
                <div className="load-more-row" ref={ref}>
                    <button className="btn btn-secondary" onClick={onMore}>{label}</button>
                </div>
            );
        }

        function TreeCanvas({
            rootFolderId, folders, nuggets, nodePositions, searchQuery,
            onNavigateFolder, onRenameFolder, onEditNugget,
            onMoveNode, onNestNuggets, onMoveNuggetToFolder, onNestFolder
        }) {
            const containerRef = useRef(null);
            const dragMovedRef = useRef(false);
            const [pan, setPan] = useState({ x: 90, y: 70 });
            const [zoom, setZoom] = useState(1);
            const [dragState, setDragState] = useState(null); // { id, type, x, y, overTarget }

            const subset = useMemo(
                () => computeTreeSubset(rootFolderId, folders, nuggets),
                [rootFolderId, folders, nuggets]
            );
            const nodesList = subset.nodes;
            const layout = useMemo(
                () => computeTreeLayout(rootFolderId, subset.kids),
                [rootFolderId, subset]
            );
            const hiddenCount = Math.max(0, subset.total - (nodesList.length - 1));

            const getPos = (id) => nodePositions[id] || layout[id] || { x: 0, y: 0 };
            const NODE_W = 160, NODE_H_BOX = 46;

            const toWorld = (clientX, clientY) => {
                const rect = containerRef.current.getBoundingClientRect();
                return {
                    x: (clientX - rect.left - pan.x) / zoom,
                    y: (clientY - rect.top - pan.y) / zoom
                };
            };

            const hitTest = (worldX, worldY, excludeId) => {
                for (const n of nodesList) {
                    if (n.id === excludeId) continue;
                    const p = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                    if (
                        worldX >= p.x - NODE_W / 2 && worldX <= p.x + NODE_W / 2 &&
                        worldY >= p.y - NODE_H_BOX / 2 && worldY <= p.y + NODE_H_BOX / 2
                    ) {
                        return n;
                    }
                }
                return null;
            };

            const startNodeDrag = (e, node) => {
                if (node.id === rootFolderId) return; // root stays anchored
                e.stopPropagation();
                e.preventDefault();
                dragMovedRef.current = false;
                const startPos = getPos(node.id);
                const startClient = { x: e.clientX, y: e.clientY };
                const startWorld = toWorld(e.clientX, e.clientY);
                setDragState({ id: node.id, type: node.type, x: startPos.x, y: startPos.y, overTarget: null });

                const onMove = (ev) => {
                    if (Math.abs(ev.clientX - startClient.x) > 4 || Math.abs(ev.clientY - startClient.y) > 4) {
                        dragMovedRef.current = true;
                    }
                    const w = toWorld(ev.clientX, ev.clientY);
                    const nx = startPos.x + (w.x - startWorld.x);
                    const ny = startPos.y + (w.y - startWorld.y);
                    const target = hitTest(nx, ny, node.id);
                    setDragState({ id: node.id, type: node.type, x: nx, y: ny, overTarget: target ? target.id : null });
                };

                const onUp = (ev) => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    if (!dragMovedRef.current) {
                        setDragState(null);
                        return;
                    }
                    const w = toWorld(ev.clientX, ev.clientY);
                    const nx = startPos.x + (w.x - startWorld.x);
                    const ny = startPos.y + (w.y - startWorld.y);
                    const target = hitTest(nx, ny, node.id);

                    if (target) {
                        if (node.type === 'nugget' && target.type === 'nugget') {
                            onNestNuggets(node.id, target.id);
                        } else if (node.type === 'nugget' && target.type === 'folder') {
                            onMoveNuggetToFolder(node.id, target.id);
                        } else if (node.type === 'folder' && target.type === 'folder') {
                            onNestFolder(node.id, target.id);
                        } else {
                            onMoveNode(node.id, nx, ny);
                        }
                    } else {
                        onMoveNode(node.id, nx, ny);
                    }
                    setDragState(null);
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            const startPan = (e) => {
                if (e.target.closest('.tree-node')) return;
                const start = { x: e.clientX, y: e.clientY };
                const startPanPos = { ...pan };
                const onMove = (ev) => {
                    setPan({ x: startPanPos.x + (ev.clientX - start.x), y: startPanPos.y + (ev.clientY - start.y) });
                };
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.08 : 0.08;
                setZoom(z => Math.min(2, Math.max(0.4, +(z + delta).toFixed(2))));
            };

            const matchesSearch = (id, type) => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                if (type === 'folder') {
                    const f = subset.folderMap.get(id);
                    return !!f && f.name.toLowerCase().includes(q);
                }
                const n = subset.nuggetMap.get(id);
                return !!n && (n.title.toLowerCase().includes(q) || n.url.toLowerCase().includes(q));
            };

            return (
                <div
                    className="tree-canvas-container"
                    ref={containerRef}
                    onPointerDown={startPan}
                    onWheel={handleWheel}
                >
                    <div className="tree-canvas-controls">
                        <button onClick={() => setZoom(z => Math.min(2, +(z + 0.15).toFixed(2)))} title="Zoom in">+</button>
                        <button onClick={() => setZoom(z => Math.max(0.4, +(z - 0.15).toFixed(2)))} title="Zoom out">−</button>
                        <button onClick={() => { setZoom(1); setPan({ x: 90, y: 70 }); }} title="Reset view">⟲</button>
                    </div>

                    <div
                        className="tree-canvas-world"
                        style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})` }}
                    >
                        <svg style={{ position: 'absolute', top: 0, left: 0, width: 1, height: 1, overflow: 'visible' }}>
                            {nodesList.filter(n => n.parentId).map(n => {
                                const p1 = getPos(n.parentId);
                                const p2 = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                                return (
                                    <path
                                        key={`line-${n.id}`}
                                        d={`M ${p1.x} ${p1.y} C ${(p1.x + p2.x) / 2} ${p1.y}, ${(p1.x + p2.x) / 2} ${p2.y}, ${p2.x} ${p2.y}`}
                                        fill="none"
                                        stroke="var(--border-color)"
                                        strokeWidth="2"
                                    />
                                );
                            })}
                        </svg>

                        {nodesList.map(n => {
                            const pos = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                            const isDragging = !!(dragState && dragState.id === n.id);
                            const isTarget = !!(dragState && dragState.overTarget === n.id);
                            const dimmed = !!searchQuery && !matchesSearch(n.id, n.type);

                            if (n.type === 'folder') {
                                const folder = subset.folderMap.get(n.id);
                                if (!folder) return null;
                                return (
                                    <div
                                        key={n.id}
                                        className={`tree-node tree-node-folder ${isDragging ? 'dragging' : ''} ${isTarget ? 'drag-target' : ''} ${dimmed ? 'dimmed' : ''} ${n.id === rootFolderId ? 'is-root' : ''}`}
                                        style={{ left: pos.x, top: pos.y }}
                                        onPointerDown={(e) => startNodeDrag(e, n)}
                                        onDoubleClick={() => {
                                            const name = window.prompt('Rename tree', folder.name);
                                            if (name && name.trim()) onRenameFolder(folder.id, name.trim());
                                        }}
                                        onClick={() => { if (!dragMovedRef.current && n.id !== rootFolderId) onNavigateFolder(folder.id); }}
                                    >
                                        <Icons.Folder />
                                        <span>{folder.name}</span>
                                    </div>
                                );
                            }

                            const nugget = subset.nuggetMap.get(n.id);
                            if (!nugget) return null;
                            return (
                                <div
                                    key={n.id}
                                    className={`tree-node tree-node-nugget ${isDragging ? 'dragging' : ''} ${isTarget ? 'drag-target' : ''} ${dimmed ? 'dimmed' : ''}`}
                                    style={{ left: pos.x, top: pos.y }}
                                    onPointerDown={(e) => startNodeDrag(e, n)}
                                    onClick={() => { if (!dragMovedRef.current) onEditNugget(nugget); }}
                                >
                                    {nugget.thumbnail
                                        ? <img src={nugget.thumbnail} alt="" />
                                        : <div className="tree-node-nugget-fallback">🔗</div>}
                                    <span>{nugget.title}</span>
                                </div>
                            );
                        })}
                    </div>

                    {hiddenCount > 0 && (
                        <div className="tree-canvas-limit">
                            Showing the nearest {(nodesList.length - 1).toLocaleString()} of {subset.total.toLocaleString()} items. Click a folder in the tree to open it and see more of what's inside.
                        </div>
                    )}
                    <div className="tree-canvas-hint">
                        Drag a nugget onto another to start a new tree · drop onto a tree to file it there · scroll to zoom · drag background to pan
                    </div>
                </div>
            );
        }

        // Reads an image file and shrinks it to a small JPEG (so a custom
        // cover adds only a few KB to the library, which also has to fit
        // in a phone's local storage).
        const shrinkImageFile = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('read failed'));
            reader.onload = () => {
                const img = new Image();
                img.onerror = () => reject(new Error('not an image'));
                img.onload = () => {
                    const maxW = 400, maxH = 300;
                    const scale = Math.min(1, maxW / img.width, maxH / img.height);
                    const canvas = document.createElement('canvas');
                    canvas.width = Math.max(1, Math.round(img.width * scale));
                    canvas.height = Math.max(1, Math.round(img.height * scale));
                    canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
                    let quality = 0.8;
                    let url = canvas.toDataURL('image/jpeg', quality);
                    while (url.length > 60000 && quality > 0.35) {
                        quality -= 0.15;
                        url = canvas.toDataURL('image/jpeg', quality);
                    }
                    resolve(url);
                };
                img.src = reader.result;
            };
            reader.readAsDataURL(file);
        });

        function FolderCoverModal({ folder, folders, nuggets, folderById, effective, onClose, onSave }) {
            const isRoot = folder.id === 'root';
            const own = folder.cover || null;
            // Start from the folder's own setting, or (if it has none)
            // from whatever it currently shows, so nothing looks changed
            // until the person actually picks something.
            const startFrom = own || effective || { mode: 'plain' };
            const [mode, setMode] = useState(isRoot && startFrom.mode === 'custom' ? 'plain' : startFrom.mode);
            const [image, setImage] = useState(startFrom.mode === 'custom' ? (startFrom.image || '') : '');
            const [linkText, setLinkText] = useState('');
            const [subfolders, setSubfolders] = useState(isRoot ? true : !!(own && own.subfolders));
            const [uploadNote, setUploadNote] = useState('');

            // Pictures already found inside this folder (and its
            // subfolders), to pick from with one tap.
            const candidates = useMemo(() => {
                if (isRoot) return [];
                const childrenOf = new Map();
                folders.forEach(f => {
                    if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                    childrenOf.get(f.parentId).push(f.id);
                });
                const inTree = new Set([folder.id]);
                const queue = [folder.id];
                while (queue.length) {
                    const id = queue.shift();
                    for (const c of (childrenOf.get(id) || [])) {
                        if (!inTree.has(c)) { inTree.add(c); queue.push(c); }
                    }
                }
                const seen = new Set();
                const out = [];
                for (const n of nuggets) {
                    if (out.length >= 48) break;
                    const t = n.thumbnail;
                    if (!t || t.startsWith(FAVICON_PREFIX) || seen.has(t) || !inTree.has(n.folderId)) continue;
                    seen.add(t);
                    out.push(t);
                }
                return out;
            }, [folder.id, folders, nuggets, isRoot]);

            const sourceFolder = effective && effective.source && effective.source !== folder.id ? folderById.get(effective.source) : null;
            const modeWords = { plain: 'plain', contents: 'a picture from its contents', custom: 'its own picture' };
            const currentText = own
                ? `This folder has its own setting: ${modeWords[own.mode] || 'plain'}${own.subfolders ? ', also used by the folders inside it' : ''}.`
                : sourceFolder
                    ? `No setting of its own — it follows \u201c${sourceFolder.name}\u201d (${modeWords[effective.mode] || 'plain'}).`
                    : 'No setting of its own — it shows as plain (the default).';

            const handleUpload = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = 'image/*';
                input.onchange = async (e) => {
                    const file = e.target.files && e.target.files[0];
                    if (!file) return;
                    try {
                        setUploadNote('Preparing picture…');
                        const url = await shrinkImageFile(file);
                        setImage(url);
                        setUploadNote(`Picture ready (${Math.round(url.length / 1024)} KB).`);
                    } catch (err) {
                        setUploadNote("Sorry — that file couldn't be read as a picture.");
                    }
                };
                input.click();
            };

            const useLink = () => {
                const t = linkText.trim();
                if (/^https?:\/\//i.test(t)) { setImage(t); setUploadNote(''); }
                else setUploadNote('That doesn\u2019t look like a web link — it should start with https://');
            };

            const canSave = mode !== 'custom' || !!image;
            const save = () => {
                if (!canSave) return;
                const cover = { mode, subfolders: !!subfolders };
                if (mode === 'custom') cover.image = image;
                onSave(cover);
            };

            const Option = ({ value, title, help }) => (
                <button type="button" className={`cover-option${mode === value ? ' selected' : ''}`} onClick={() => setMode(value)}>
                    <span aria-hidden="true">{mode === value ? '●' : '○'}</span>
                    <span>
                        <div className="cover-option-title">{title}</div>
                        <div className="cover-option-help">{help}</div>
                    </span>
                </button>
            );

            const previewSrc = mode === 'custom' ? image : null;

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal cover-modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">{isRoot ? 'Default folder covers' : `Cover for \u201c${folder.name}\u201d`}</div>
                        </div>
                        <div className="cover-note">
                            {isRoot
                                ? 'Choose how every folder looks, unless it (or a folder above it) has its own setting.'
                                : currentText}
                        </div>

                        <div className="cover-options">
                            <Option value="plain" title="Plain" help="Just the folder symbol." />
                            <Option value="contents" title="A picture from its contents" help="Uses a picture found inside the folder, chosen automatically." />
                            {!isRoot && <Option value="custom" title="My own picture" help="Pick one of its pictures, paste a link, or upload one." />}
                        </div>

                        {mode === 'custom' && !isRoot && (
                            <div>
                                <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', margin: '0.25rem 0 0.5rem' }}>
                                    <div className="cover-preview">
                                        {previewSrc ? <img src={previewSrc} alt="Chosen cover" /> : <Icons.Folder />}
                                    </div>
                                    <div className="cover-note">{previewSrc ? 'This is the picture that will be used.' : 'No picture chosen yet.'}</div>
                                </div>
                                {candidates.length > 0 && (
                                    <>
                                        <div className="cover-note">Pictures from inside this folder:</div>
                                        <div className="cover-picker">
                                            {candidates.map(src => (
                                                <button type="button" key={src} className={image === src ? 'selected' : ''} onClick={() => { setImage(src); setUploadNote(''); }}>
                                                    <img src={src} alt="" loading="lazy" />
                                                </button>
                                            ))}
                                        </div>
                                    </>
                                )}
                                <div className="cover-custom-row">
                                    <input type="url" className="form-input" placeholder="Or paste an image link (https://…)" value={linkText} onChange={(e) => setLinkText(e.target.value)} />
                                    <button type="button" className="btn btn-secondary" onClick={useLink}>Use link</button>
                                    <button type="button" className="btn btn-secondary" onClick={handleUpload}>Upload…</button>
                                </div>
                                {uploadNote && <div className="cover-note">{uploadNote}</div>}
                            </div>
                        )}

                        {!isRoot && (
                            <label className="cover-check">
                                <input type="checkbox" checked={subfolders} onChange={(e) => setSubfolders(e.target.checked)} />
                                <span>Also use this for the folders inside it <span className="cover-note">(unless they have their own setting)</span></span>
                            </label>
                        )}

                        <div className="modal-actions">
                            <button type="button" className="btn btn-secondary" onClick={onClose}>Cancel</button>
                            {own && (
                                <button type="button" className="btn btn-secondary" onClick={() => onSave(null)}
                                    title={isRoot ? 'Go back to plain folders everywhere' : 'Remove this folder\u2019s own setting'}>
                                    {isRoot ? 'Reset to plain' : 'Remove setting'}
                                </button>
                            )}
                            <button type="button" className="btn btn-primary" onClick={save} disabled={!canSave}>Save</button>
                        </div>
                    </div>
                </div>
            );
        }

        // ---- Old-library tidy-up (1.6.21) ----
        // Compares everything at the top level OTHER than the Pearltrees
        // import folder(s) against the import, by link. Nothing here
        // deletes anything: the tidy step only MOVES old top-level folders
        // into holding folders you can check and delete later.
        const TRACKING_PARAMS = /^(utm_.*|fbclid|gclid|dclid|mc_cid|mc_eid|igshid|ref_src|ref_url|si|feature|cmpid|ocid|at_medium|at_campaign)$/i;
        const normalizeUrlForMatch = (url) => {
            try {
                const u = new URL(String(url).trim());
                let host = u.hostname.toLowerCase().replace(/^(www\d*|m|mobile)\./, '');
                if (host === 'twitter.com') host = 'x.com';
                // Pearltrees' uploaded-file links carry an expiring signature
                // that differs between exports — match on the file path only.
                if (host === 'cdn-file.pearltrees.com') return host + u.pathname;
                if (host === 'youtu.be') return 'youtube.com/watch?v=' + u.pathname.slice(1);
                let p = u.pathname.replace(/\/(index|default)\.(html?|php|aspx?)$/i, '').replace(/\/+$/, '');
                if (host === 'x.com') p = p.replace(/\/(photo|video)\/\d+$/, '');
                const params = [...u.searchParams.entries()]
                    .filter(([k]) => !TRACKING_PARAMS.test(k) && !(host === 'x.com' && (k === 's' || k === 't')))
                    .sort((a, b) => a[0].localeCompare(b[0]));
                if (host === 'youtube.com' && u.searchParams.get('v')) return 'youtube.com/watch?v=' + u.searchParams.get('v');
                const q = params.length ? '?' + params.map(([k, v]) => k + '=' + v).join('&') : '';
                return host + p + q;
            } catch (e) {
                return String(url || '').trim().toLowerCase().replace(/^https?:\/\//, '').replace(/^www\./, '').replace(/\/+$/, '');
            }
        };
        const hostOf = (url) => { try { return new URL(url).hostname.replace(/^www\./, ''); } catch (e) { return '(not a web link)'; } };
        const isImportWrapper = (f) => typeof f.id === 'string' && f.id.startsWith('nsimport-')
            || /^Pearltrees import \d{4}-\d{2}-\d{2}/.test(f.name || '');
        const isOldLibHolder = (f) => typeof f.id === 'string' && f.id.startsWith('oldlib-');
        // Folders made in Nuggetz after the import are left alone.
        const IMPORT_CUTOFF_MS = Date.UTC(2026, 8, 21);
        const isRecentUserFolder = (f) => /^\d{13}$/.test(String(f.id)) && Number(f.id) >= IMPORT_CUTOFF_MS;

        const analyzeOldLibrary = (folders, nuggets) => {
            const folderById = new Map(folders.map(f => [f.id, f]));
            const childrenOf = new Map();
            folders.forEach(f => {
                if (f.id === 'root') return;
                if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                childrenOf.get(f.parentId).push(f);
            });
            const nuggetsIn = new Map();
            nuggets.forEach(n => {
                if (!nuggetsIn.has(n.folderId)) nuggetsIn.set(n.folderId, []);
                nuggetsIn.get(n.folderId).push(n);
            });
            const subtree = (rootId) => {
                const ids = [rootId];
                const seen = new Set(ids);
                for (let i = 0; i < ids.length; i++) {
                    for (const c of (childrenOf.get(ids[i]) || [])) {
                        if (!seen.has(c.id)) { seen.add(c.id); ids.push(c.id); }
                    }
                }
                return ids;
            };
            const sizeOf = (list) => list.reduce((t, n) => t + (n.title || '').length + (n.url || '').length
                + (n.description || '').length + (n.thumbnail || '').length + 90, 0);

            const top = childrenOf.get('root') || [];
            const wrappers = top.filter(isImportWrapper);
            const importNuggets = [];
            let importFolderCount = 0;
            wrappers.forEach(w => subtree(w.id).forEach(id => {
                importFolderCount++;
                (nuggetsIn.get(id) || []).forEach(n => importNuggets.push(n));
            }));
            const importUrls = new Set(importNuggets.map(n => normalizeUrlForMatch(n.url)));
            // Links already rescued from the old library count as safe
            // too, so their other copies there show as duplicates.
            let rescuedCount = 0;
            top.filter(f => typeof f.id === 'string' && f.id.startsWith('oldlib-rescued-')).forEach(h =>
                subtree(h.id).forEach(id => (nuggetsIn.get(id) || []).forEach(n => { rescuedCount++; importUrls.add(normalizeUrlForMatch(n.url)); })));
            const isInImport = (n) => importUrls.has(normalizeUrlForMatch(n.url));
            const uniqueHosts = new Map();
            // Distinct "only here" links (the same link often sits in
            // several old folders): one representative nugget per link,
            // grouped by the old top-level folder it was first found in.
            const rescueByKey = new Map();

            const old = [];
            const kept = [];
            top.forEach(f => {
                if (isImportWrapper(f)) return;
                if (isOldLibHolder(f) || isRecentUserFolder(f)) { kept.push(f); return; }
                const ids = subtree(f.id);
                let total = 0, unique = 0, bytes = 0;
                const samples = [];
                ids.forEach(id => (nuggetsIn.get(id) || []).forEach(n => {
                    total++;
                    bytes += sizeOf([n]);
                    if (!isInImport(n)) {
                        unique++;
                        const key = normalizeUrlForMatch(n.url);
                        const prev = rescueByKey.get(key);
                        if (!prev) rescueByKey.set(key, { nugget: n, origin: f, folderId: id });
                        else if (!prev.nugget.thumbnail && n.thumbnail) rescueByKey.set(key, { ...prev, nugget: n, folderId: id });
                        if (samples.length < 8) samples.push(n);
                        const h = hostOf(n.url);
                        uniqueHosts.set(h, (uniqueHosts.get(h) || 0) + 1);
                    }
                }));
                old.push({ folder: f, folderCount: ids.length, total, unique, bytes, samples });
            });
            let keptFolderCount = 0, keptNuggetCount = 0;
            kept.forEach(f => subtree(f.id).forEach(id => { keptFolderCount++; keptNuggetCount += (nuggetsIn.get(id) || []).length; }));
            const topLevelNuggets = nuggetsIn.get('root') || [];
            const sum = (k) => old.reduce((t, o) => t + o[k], 0);
            return {
                wrappers,
                importFolderCount,
                importNuggetCount: importNuggets.length,
                importBytes: sizeOf(importNuggets),
                old,
                kept,
                oldFolderCount: sum('folderCount'),
                oldNuggetCount: sum('total'),
                oldUniqueCount: sum('unique'),
                oldBytes: sum('bytes'),
                empty: old.filter(o => o.total === 0),
                allDuplicates: old.filter(o => o.total > 0 && o.unique === 0),
                withUnique: old.filter(o => o.unique > 0).sort((a, b) => b.unique - a.unique),
                topLevelNuggetCount: topLevelNuggets.length,
                rescuedCount,
                keptTop: kept.length,
                keptFolderCount,
                keptNuggetCount,
                topHosts: [...uniqueHosts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12),
                rescue: [...rescueByKey.values()],
                pathOf: (folderId) => {
                    const names = [];
                    let fo = folderById.get(folderId), guard = 0;
                    while (fo && fo.id !== 'root' && guard++ < 100) { names.unshift(fo.name); fo = folderById.get(fo.parentId); }
                    return names.join(' \u203a ');
                }
            };
        };

        const formatMB = (bytes) => bytes >= 1e6 ? (bytes / 1e6).toFixed(1) + ' MB' : Math.max(1, Math.round(bytes / 1e3)) + ' KB';

        function TidyLibraryModal({ folders, nuggets, onClose, onMoveToHolder, onOpenFolder, onRescue }) {
            const [report, setReport] = useState(null);
            const [done, setDone] = useState('');
            const [openSamples, setOpenSamples] = useState(null);
            useEffect(() => {
                // Let the "Checking…" message paint first — this reads the whole library.
                const t = setTimeout(() => setReport(analyzeOldLibrary(folders, nuggets)), 30);
                return () => clearTimeout(t);
            }, [folders, nuggets]);

            const move = (items, kind) => {
                if (!items.length) return;
                const label = kind === 'empty' ? 'Old library (empty)' : 'Old library (already in import)';
                if (!confirm(`Move ${items.length.toLocaleString()} old top-level folder(s) into \u201c${label}\u201d?\n\nNothing is deleted \u2014 you can open that folder to check, and move anything back.`)) return;
                onMoveToHolder(items.map(o => o.folder.id), kind, label);
                setDone(`Moved ${items.length.toLocaleString()} folder(s) into \u201c${label}\u201d.`);
            };

            const n = (x) => x.toLocaleString();
            const pl = (x, one, many) => `${n(x)} ${x === 1 ? one : many}`;

            const rescue = () => {
                const items = report.rescue;
                if (!items.length) return;
                if (!confirm(`Move ${n(items.length)} link(s) into a new folder, \u201cRescued from old library\u201d?\n\nOne copy of each is moved; repeats stay where they are. Nothing is deleted.`)) return;
                // Group by old top-level folder; small groups share one folder.
                const groups = new Map();
                items.forEach(it => {
                    const k = it.origin.id;
                    if (!groups.has(k)) groups.set(k, { name: it.origin.name, items: [] });
                    groups.get(k).items.push(it);
                });
                const stamp = Date.now();
                const holderId = 'oldlib-rescued-' + stamp;
                const newFolders = [{ id: holderId, name: 'Rescued from old library', parentId: 'root', children: [] }];
                const target = new Map(); // nugget id -> { folderId, oldPath }
                let smallId = null, i = 0;
                [...groups.values()].sort((a, b) => b.items.length - a.items.length).forEach(g => {
                    let fid;
                    if (g.items.length >= 5) {
                        fid = holderId + '-' + (i++);
                        newFolders.push({ id: fid, name: g.name, parentId: holderId, children: [] });
                    } else {
                        if (!smallId) {
                            smallId = holderId + '-small';
                            newFolders.push({ id: smallId, name: 'From smaller old folders', parentId: holderId, children: [] });
                        }
                        fid = smallId;
                    }
                    g.items.forEach(it => target.set(it.nugget.id, { folderId: fid, oldPath: report.pathOf(it.folderId) }));
                });
                onRescue(newFolders, target);
                setDone(`Rescued ${n(items.length)} link(s) into \u201cRescued from old library\u201d. Now use step 2 below.`);
            };
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal cover-modal tidy-modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header"><div className="modal-title">Tidy old library</div></div>
                        {!report ? (
                            <div className="cover-note">Checking your library… (a few seconds)</div>
                        ) : (
                            <>
                                <div className="tidy-block">
                                    <div className="tidy-head">Pearltrees import (keep)</div>
                                    <div>{pl(report.importNuggetCount, 'nugget', 'nuggets')} in {pl(report.importFolderCount, 'folder', 'folders')} · about {formatMB(report.importBytes)}</div>
                                </div>
                                <div className="tidy-block">
                                    <div className="tidy-head">Old library (everything else at the top level)</div>
                                    <div>{pl(report.old.length, 'top-level folder', 'top-level folders')} ({n(report.oldFolderCount)} in all) · {pl(report.oldNuggetCount, 'nugget', 'nuggets')} · about {formatMB(report.oldBytes)}</div>
                                    <div className="cover-note">
                                        {report.oldNuggetCount === 0
                                            ? 'None of these contain any nuggets.'
                                            : `${n(report.oldNuggetCount - report.oldUniqueCount)} of those nuggets link to something that's also in the Pearltrees import${report.rescuedCount ? ' or already rescued' : ''}; ${n(report.oldUniqueCount)} ${report.oldUniqueCount === 1 ? 'is' : 'are'} only here.`}
                                    </div>
                                </div>
                                {report.topHosts.length > 0 && (
                                    <div className="tidy-block">
                                        <div className="tidy-head">Where the "only here" nuggets link to</div>
                                        <div className="tidy-hosts">
                                            {report.topHosts.map(([h, c]) => <span key={h} className="tidy-host">{h} <b>{n(c)}</b></span>)}
                                        </div>
                                    </div>
                                )}
                                {report.keptTop > 0 && (
                                    <div className="cover-note">
                                        Not counted as old library: {pl(report.keptTop, 'top-level folder', 'top-level folders')} made in Nuggetz after the import, or holding folders from this tidy-up ({pl(report.keptNuggetCount, 'nugget', 'nuggets')}).
                                    </div>
                                )}
                                {report.wrappers.length === 0 && (
                                    <div className="cover-note">No Pearltrees import folder was found, so nothing is marked as a duplicate.</div>
                                )}

                                {report.rescue.length > 0 && (
                                    <div className="tidy-block tidy-rescue">
                                        <div className="tidy-head">Step 1: rescue what's only here</div>
                                        <div>The {n(report.oldUniqueCount)} "only here" nuggets are {pl(report.rescue.length, 'different link', 'different links')} (the rest are repeats of each other).</div>
                                        <div className="cover-note">This moves one copy of each into a new folder, “Rescued from old library”, grouped by where it came from. Nothing is deleted.</div>
                                        <button type="button" className="btn btn-primary" onClick={rescue}>Rescue {pl(report.rescue.length, 'link', 'links')}</button>
                                    </div>
                                )}
                                {report.rescue.length === 0 && report.oldNuggetCount > 0 && (
                                    <div className="cover-note tidy-done">Everything left in the old library is also in the Pearltrees import{report.rescuedCount ? ' or already rescued' : ''}.</div>
                                )}
                                <div className="tidy-head" style={{ marginTop: '0.5rem' }}>{report.rescue.length > 0 ? 'Step 2 (after rescuing): move the old folders aside' : 'Move the old folders aside'}</div>
                                <div className="tidy-actions">
                                    <button type="button" className="btn btn-primary" disabled={!report.empty.length} onClick={() => move(report.empty, 'empty')}>
                                        Move {pl(report.empty.length, 'empty folder', 'empty folders')}
                                    </button>

        function RestoreHistoryModal({ onClose, onRestore }) {

            useEffect(() => {

                DriveSync.listRevisions()
                    .then(list => { if (!cancelled) setRevisions(list); })
                    .catch(e => { if (!cancelled) setError(e.message || 'Failed to load revision history'); });

            const formatSize = (bytes) => {
                const n = parseInt(bytes, 10);

            };

                if (!confirm(`Restore the version from ${new Date(rev.modifiedTime).toLocaleString()} (${formatSize(rev.size)})?\n\nThis replaces what's currently showing in Nuggetz on this device, and immediately re-saves it to Drive so it isn't lost again.`)) {
                    return;
                }
                setRestoringId(rev.id);
                try {
                    const data = await DriveSync.getRevisionContent(rev.id);

                                {revisions.map(rev => (
                                    <div key={rev.id} className="revision-row">

                                            <div className="revision-size">{formatSize(rev.size)}</div>

                                        <button

                                        </button>
                                    </div>

                        </div>
                    </div>

        function DiagnosticsModal({ onClose, folders, nuggets, syncEnabled, syncStatus, orphanedNuggetCount, onRecoverOrphaned, disconnectedFolderCount, disconnectedNuggetCount, onReconnectFolders, onOpenHistory, onEnableStaySignedIn, onOpenTidy }) {
