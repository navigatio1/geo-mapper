        function TreeCanvas({
            rootFolderId, folders, nuggets, nodePositions, searchQuery,
            onNavigateFolder, onRenameFolder, onEditNugget,
            onMoveNode, onNestNuggets, onMoveNuggetToFolder, onNestFolder
        }) {
            const containerRef = useRef(null);
            const dragMovedRef = useRef(false);
            const [pan, setPan] = useState({ x: 90, y: 70 });
            const [zoom, setZoom] = useState(1);
            const [dragState, setDragState] = useState(null); // { id, type, x, y, overTarget }

            const layout = useMemo(
                () => computeTreeLayout(rootFolderId, folders, nuggets),
                [rootFolderId, folders, nuggets]
            );

            const nodesList = useMemo(() => {
                const list = [];
                const addSubtree = (id, depth) => {
                    const folder = folders.find(f => f.id === id);
                    if (!folder) return;
                    list.push({ id, type: 'folder', parentId: depth === 0 ? null : folder.parentId });
                    folders.filter(f => f.parentId === id).forEach(f => addSubtree(f.id, depth + 1));
                    nuggets.filter(n => n.folderId === id).forEach(n =>
                        list.push({ id: n.id, type: 'nugget', parentId: id })
                    );
                };
                addSubtree(rootFolderId, 0);
                return list;
            }, [rootFolderId, folders, nuggets]);

            const getPos = (id) => nodePositions[id] || layout[id] || { x: 0, y: 0 };
            const NODE_W = 160, NODE_H_BOX = 46;

            const toWorld = (clientX, clientY) => {
                const rect = containerRef.current.getBoundingClientRect();
                return {
                    x: (clientX - rect.left - pan.x) / zoom,
                    y: (clientY - rect.top - pan.y) / zoom
                };
            };

            const hitTest = (worldX, worldY, excludeId) => {
                for (const n of nodesList) {
                    if (n.id === excludeId) continue;
                    const p = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                    if (
                        worldX >= p.x - NODE_W / 2 && worldX <= p.x + NODE_W / 2 &&
                        worldY >= p.y - NODE_H_BOX / 2 && worldY <= p.y + NODE_H_BOX / 2
                    ) {
                        return n;
                    }
                }
                return null;
            };

            const startNodeDrag = (e, node) => {
                if (node.id === rootFolderId) return; // root stays anchored
                e.stopPropagation();
                e.preventDefault();
                dragMovedRef.current = false;
                const startPos = getPos(node.id);
                const startClient = { x: e.clientX, y: e.clientY };
                const startWorld = toWorld(e.clientX, e.clientY);
                setDragState({ id: node.id, type: node.type, x: startPos.x, y: startPos.y, overTarget: null });

                const onMove = (ev) => {
                    if (Math.abs(ev.clientX - startClient.x) > 4 || Math.abs(ev.clientY - startClient.y) > 4) {
                        dragMovedRef.current = true;
                    }
                    const w = toWorld(ev.clientX, ev.clientY);
                    const nx = startPos.x + (w.x - startWorld.x);
                    const ny = startPos.y + (w.y - startWorld.y);
                    const target = hitTest(nx, ny, node.id);
                    setDragState({ id: node.id, type: node.type, x: nx, y: ny, overTarget: target ? target.id : null });
                };

                const onUp = (ev) => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    if (!dragMovedRef.current) {
                        setDragState(null);
                        return;
                    }
                    const w = toWorld(ev.clientX, ev.clientY);
                    const nx = startPos.x + (w.x - startWorld.x);
                    const ny = startPos.y + (w.y - startWorld.y);
                    const target = hitTest(nx, ny, node.id);

                    if (target) {
                        if (node.type === 'nugget' && target.type === 'nugget') {
                            onNestNuggets(node.id, target.id);
                        } else if (node.type === 'nugget' && target.type === 'folder') {
                            onMoveNuggetToFolder(node.id, target.id);
                        } else if (node.type === 'folder' && target.type === 'folder') {
                            onNestFolder(node.id, target.id);
                        } else {
                            onMoveNode(node.id, nx, ny);
                        }
                    } else {
                        onMoveNode(node.id, nx, ny);
                    }
                    setDragState(null);
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            const startPan = (e) => {
                if (e.target.closest('.tree-node')) return;
                const start = { x: e.clientX, y: e.clientY };
                const startPanPos = { ...pan };
                const onMove = (ev) => {
                    setPan({ x: startPanPos.x + (ev.clientX - start.x), y: startPanPos.y + (ev.clientY - start.y) });
                };
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.08 : 0.08;
                setZoom(z => Math.min(2, Math.max(0.4, +(z + delta).toFixed(2))));
            };

            const matchesSearch = (id, type) => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                if (type === 'folder') {
                    const f = folders.find(x => x.id === id);
                    return !!f && f.name.toLowerCase().includes(q);
                }
                const n = nuggets.find(x => x.id === id);
                return !!n && (n.title.toLowerCase().includes(q) || n.url.toLowerCase().includes(q));
            };

            return (
                <div
                    className="tree-canvas-container"
                    ref={containerRef}
                    onPointerDown={startPan}
                    onWheel={handleWheel}
                >
                    <div className="tree-canvas-controls">
                        <button onClick={() => setZoom(z => Math.min(2, +(z + 0.15).toFixed(2)))} title="Zoom in">+</button>
                        <button onClick={() => setZoom(z => Math.max(0.4, +(z - 0.15).toFixed(2)))} title="Zoom out">−</button>
                        <button onClick={() => { setZoom(1); setPan({ x: 90, y: 70 }); }} title="Reset view">⟲</button>
                    </div>

                    <div
                        className="tree-canvas-world"
                        style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})` }}
                    >
                        <svg style={{ position: 'absolute', top: 0, left: 0, width: 1, height: 1, overflow: 'visible' }}>
                            {nodesList.filter(n => n.parentId).map(n => {
                                const p1 = getPos(n.parentId);
                                const p2 = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                                return (
                                    <path
                                        key={`line-${n.id}`}
                                        d={`M ${p1.x} ${p1.y} C ${(p1.x + p2.x) / 2} ${p1.y}, ${(p1.x + p2.x) / 2} ${p2.y}, ${p2.x} ${p2.y}`}
                                        fill="none"
                                        stroke="var(--border-color)"
                                        strokeWidth="2"
                                    />
                                );
                            })}
                        </svg>

                        {nodesList.map(n => {
                            const pos = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                            const isDragging = !!(dragState && dragState.id === n.id);
                            const isTarget = !!(dragState && dragState.overTarget === n.id);
                            const dimmed = !!searchQuery && !matchesSearch(n.id, n.type);

                            if (n.type === 'folder') {
                                const folder = folders.find(f => f.id === n.id);
                                if (!folder) return null;
                                return (
                                    <div
                                        key={n.id}
                                        className={`tree-node tree-node-folder ${isDragging ? 'dragging' : ''} ${isTarget ? 'drag-target' : ''} ${dimmed ? 'dimmed' : ''} ${n.id === rootFolderId ? 'is-root' : ''}`}
                                        style={{ left: pos.x, top: pos.y }}
                                        onPointerDown={(e) => startNodeDrag(e, n)}
                                        onDoubleClick={() => {
                                            const name = window.prompt('Rename tree', folder.name);
                                            if (name && name.trim()) onRenameFolder(folder.id, name.trim());
                                        }}
                                        onClick={() => { if (!dragMovedRef.current && n.id !== rootFolderId) onNavigateFolder(folder.id); }}
                                    >
                                        <Icons.Folder />
                                        <span>{folder.name}</span>
                                    </div>
                                );
                            }

                            const nugget = nuggets.find(x => x.id === n.id);
                            if (!nugget) return null;
                            return (
                                <div
                                    key={n.id}
                                    className={`tree-node tree-node-nugget ${isDragging ? 'dragging' : ''} ${isTarget ? 'drag-target' : ''} ${dimmed ? 'dimmed' : ''}`}
                                    style={{ left: pos.x, top: pos.y }}
                                    onPointerDown={(e) => startNodeDrag(e, n)}
                                    onClick={() => { if (!dragMovedRef.current) onEditNugget(nugget); }}
                                >
                                    {nugget.thumbnail
                                        ? <img src={nugget.thumbnail} alt="" />
                                        : <div className="tree-node-nugget-fallback">🔗</div>}
                                    <span>{nugget.title}</span>
                                </div>
                            );
                        })}
                    </div>

                    <div className="tree-canvas-hint">
                        Drag a nugget onto another to start a new tree · drop onto a tree to file it there · scroll to zoom · drag background to pan
                    </div>
                </div>
            );
        }

        function RestoreHistoryModal({ onClose, onRestore }) {
            const [revisions, setRevisions] = useState(null); // null = loading, [] = loaded empty
            const [error, setError] = useState(null);
            const [restoringId, setRestoringId] = useState(null);

            useEffect(() => {
                let cancelled = false;
                DriveSync.listRevisions()
                    .then(list => { if (!cancelled) setRevisions(list); })
                    .catch(e => { if (!cancelled) setError(e.message || 'Failed to load revision history'); });
                return () => { cancelled = true; };
            }, []);

            const formatSize = (bytes) => {
                const n = parseInt(bytes, 10);
                if (!n) return 'unknown size';
                if (n < 1024) return `${n} B`;
                return `${(n / 1024).toFixed(1)} KB`;
            };

            const handleRestore = async (rev) => {
                if (!confirm(`Restore the version from ${new Date(rev.modifiedTime).toLocaleString()} (${formatSize(rev.size)})?\n\nThis replaces what's currently showing in Nuggetz on this device, and immediately re-saves it to Drive so it isn't lost again.`)) {
                    return;
                }
                setRestoringId(rev.id);
                try {
                    const data = await DriveSync.getRevisionContent(rev.id);
                    onRestore(data);
                } catch (e) {
                    alert('Restore failed: ' + e.message);
                } finally {
                    setRestoringId(null);
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal diagnostics-modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">Restore from Drive history</div>
                        </div>
                        <p style={{ color: 'var(--text-secondary)', fontSize: '0.85rem', marginBottom: '1rem' }}>
                            Every save creates a new version in Drive rather than overwriting in place.
                            Pick the size that looks right for what you're expecting back — a much
                            smaller size than you'd expect usually means that's the broken save, not
                            the one to restore.
                        </p>
                        {revisions === null && !error && (
                            <p style={{ color: 'var(--text-secondary)' }}>Loading revision history…</p>
                        )}
                        {error && (
                            <p style={{ color: '#e05252' }}>{error}</p>
                        )}
                        {revisions && revisions.length === 0 && (
                            <p style={{ color: 'var(--text-secondary)' }}>No revision history found for this file.</p>
                        )}
                        {revisions && revisions.length > 0 && (
                            <div className="revision-list">
                                {revisions.map(rev => (
                                    <div key={rev.id} className="revision-row">
                                        <div className="revision-info">
                                            <div className="revision-date">{new Date(rev.modifiedTime).toLocaleString()}</div>
                                            <div className="revision-size">{formatSize(rev.size)}</div>
                                        </div>
                                        <button
                                            type="button"
                                            className="btn btn-secondary"
                                            disabled={restoringId === rev.id}
                                            onClick={() => handleRestore(rev)}
                                        >
                                            {restoringId === rev.id ? 'Restoring…' : 'Restore this'}
                                        </button>
                                    </div>
                                ))}
                            </div>
                        )}
                        <div className="modal-actions">
                            <button type="button" className="btn btn-secondary" onClick={onClose}>
                                Close
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function DiagnosticsModal({ onClose, folders, nuggets, syncEnabled, syncStatus, orphanedNuggetCount, onRecoverOrphaned, disconnectedFolderCount, disconnectedNuggetCount, onReconnectFolders, onOpenHistory }) {
            const [copied, setCopied] = useState(false);

            const storageKB = (() => {
                try {
                    let total = 0;
                    ['nuggetz_folders', 'nuggetz_nuggets', 'nuggetz_positions', 'nuggetz_sync_enabled'].forEach(key => {
                        const val = localStorage.getItem(key);
                        if (val) total += val.length;
                    });
                    return (total / 1024).toFixed(1);
                } catch (e) {
                    return 'unavailable';
                }
            })();

            const isStandalone = !!(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
            const driveConfigured = !GOOGLE_CLIENT_ID.startsWith('REPLACE_WITH');

            const diagnosticsText = [
                'Nuggetz Diagnostics',
                `Generated: ${new Date().toISOString()}`,
                `Version: ${APP_VERSION}`,
                `URL: ${window.location.href}`,
                `Display mode: ${isStandalone ? 'standalone (installed app)' : 'browser tab'}`,
                `Online: ${navigator.onLine}`,
                `Browser: ${navigator.userAgent}`,
                `Folders: ${folders.length}`,
                `Nuggets: ${nuggets.length}`,
                `Orphaned nuggets (filed in a folder that no longer exists): ${orphanedNuggetCount}`,
                `Disconnected folders (exist, but parent chain never reaches root): ${disconnectedFolderCount}`,
                `Nuggets inside disconnected folders: ${disconnectedNuggetCount}`,
                `Local storage used: ~${storageKB} KB`,
                `Drive sync configured: ${driveConfigured ? 'yes' : 'no'}`,
                `Drive sync enabled: ${syncEnabled}`,
                `Drive sync status: ${syncStatus}`
            ].join('\n');

            const handleCopy = async () => {
                try {
                    await navigator.clipboard.writeText(diagnosticsText);
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2000);
                } catch (e) {
                    // Clipboard API unavailable — the text is still
                    // visible in the panel for manual copy.
                }
            };

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal diagnostics-modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">Diagnostics</div>
                        </div>
                        <pre className="diagnostics-text">{diagnosticsText}</pre>
                        <div className="modal-actions">
                            <button type="button" className="btn btn-secondary" onClick={onClose}>
                                Close
                            </button>
                            {orphanedNuggetCount > 0 && (
                                <button type="button" className="btn btn-secondary" onClick={onRecoverOrphaned}>
                                    Recover {orphanedNuggetCount} orphaned
                                </button>
                            )}
                            {disconnectedFolderCount > 0 && (
                                <button type="button" className="btn btn-secondary" onClick={onReconnectFolders}>
                                    Reconnect {disconnectedFolderCount} folder(s)
                                </button>
                            )}
                            {syncEnabled && (
                                <button type="button" className="btn btn-secondary" onClick={onOpenHistory}>
                                    Restore from Drive history
                                </button>
                            )}
                            <button type="button" className="btn btn-primary" onClick={handleCopy}>
                                {copied ? 'Copied!' : 'Copy to clipboard'}
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        function NuggetModal({ nugget, initialData, folders, currentFolder, onClose, onSave }) {
            const [formData, setFormData] = useState({
                title: nugget?.title || initialData?.title || '',
                url: nugget?.url || initialData?.url || '',
                description: nugget?.description || initialData?.description || '',
                thumbnail: nugget?.thumbnail || '',
                folderId: nugget?.folderId || initialData?.folderId || currentFolder || 'root'
            });
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (formData.title && formData.url) {
                    onSave(formData);
                }
            };
            
            // Fills in a sensible default title and, since there's no
            // backend to fetch a real page thumbnail from, a per-site
            // favicon as a visually-distinctive placeholder (via Google's
            // public favicon service — a plain <img> load, no CORS
            // issues, no API key). Never overwrites something the person
            // already typed.
            const fetchMetadata = async () => {
                if (!formData.url) return;
                try {
                    const url = new URL(formData.url);
                    setFormData(prev => ({
                        ...prev,
                        title: prev.title || url.hostname,
                        thumbnail: prev.thumbnail || `https://www.google.com/s2/favicons?sz=128&domain=${url.hostname}`
                    }));
                } catch (e) {
                    console.error('Invalid URL');
                }
            };
            
            const folderOptions = useMemo(() => {
                const options = [];
                const root = folders.find(f => f.id === 'root');
                if (root) options.push({ id: 'root', label: root.name });
                const walk = (parentId, depth) => {
                    folders.filter(f => f.parentId === parentId).forEach(f => {
                        options.push({ id: f.id, label: '\u2014'.repeat(depth) + ' ' + f.name });
                        walk(f.id, depth + 1);
                    });
                };
                walk('root', 1);
                return options;
            }, [folders]);
            
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">{nugget ? 'Edit Nugget' : 'Add New Nugget'}</div>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">URL *</label>
                                <input
                                    type="url"
                                    className="form-input"
                                    value={formData.url}
                                    onChange={(e) => setFormData({ ...formData, url: e.target.value })}
                                    onBlur={fetchMetadata}
                                    required
                                    placeholder="https://example.com"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Title *</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    required
                                    placeholder="Enter a title"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Save to folder</label>
                                <select
                                    className="form-input"
                                    value={formData.folderId}
                                    onChange={(e) => setFormData({ ...formData, folderId: e.target.value })}
                                >
                                    {folderOptions.map(opt => (
                                        <option key={opt.id} value={opt.id}>{opt.label}</option>
                                    ))}
                                </select>
                            </div>
                            <div className="form-group">
                                <label className="form-label">Description</label>
                                <textarea
                                    className="form-input form-textarea"
                                    value={formData.description}
                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                    placeholder="Optional description"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Thumbnail URL</label>
                                <input
                                    type="url"
                                    className="form-input"
                                    value={formData.thumbnail}
                                    onChange={(e) => setFormData({ ...formData, thumbnail: e.target.value })}
                                    placeholder="https://example.com/image.jpg"
                                />
                            </div>
                            <div className="modal-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    {nugget ? 'Update' : 'Add'} Nugget
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }
        
        function FolderModal({ onClose, onSave }) {
            const [folderName, setFolderName] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (folderName.trim()) {
                    onSave(folderName);
                }
            };
            
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">Create New Folder</div>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">Folder Name *</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={folderName}
                                    onChange={(e) => setFolderName(e.target.value)}
                                    required
                                    placeholder="Enter folder name"
                                    autoFocus
                                />
                            </div>
                            <div className="modal-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    Create Folder
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<NuggetzApp />, document.getElementById('root'));
    </script>
</body>
</html>
