                        DriveSync.signOut();
                        setSyncEnabled(false);
                        Storage.save('nuggetz_sync_enabled', false);
                        setSyncStatus('idle');
                    } else {
                        (async () => {
                            setSyncStatus('syncing');
                            try {
                                const saved = await saveToDriveGuarded({ folders, nuggets, nodePositions });
                                setSyncStatus(saved ? 'synced' : 'error');
                            } catch (e) {
                                console.error('Drive sync error:', e);
                                setSyncStatus('error');
                            }
                        })();
                    }
                }
            };
            
            const syncButtonLabel = () => {
                if (!syncEnabled) return 'Connect Drive';
                switch (syncStatus) {
                    case 'syncing': return 'Syncing…';
                    case 'connecting': return 'Connecting…';
                    case 'signed-out': return 'Reconnect';
                    case 'error': return 'Sync error';
                    default: return 'Synced';
                }
            };
            
            const addFolder = (name, parentId = 'root') => {
                const newFolder = {
                    id: Date.now().toString(),
                    name,
                    parentId,
                    children: []
                };
                recordChange.folder(newFolder);
                setFolders([...folders, newFolder]);
                setExpandedFolders([...expandedFolders, parentId]);
            };
            
            const addNugget = (nuggetData) => {
                const newNugget = {
                    id: Date.now().toString(),
                    ...nuggetData,
                    folderId: nuggetData.folderId || currentFolder,
                    created: new Date().toISOString()
                };
                recordChange.nugget(newNugget);
                Storage.save(PENDING_KEY, [...Storage.load(PENDING_KEY, []), newNugget]);
                setNuggets(prev => [...prev, newNugget]);
                return newNugget;
            };
            
            const updateNugget = (id, updates) => {
                setNuggets(prev => prev.map(n => {
                    if (n.id !== id) return n;
                    const changed = { ...n, ...updates };
                    recordChange.nugget(changed);
                    return changed;
                }));
            };
            
            const deleteNugget = (id) => {
                const removed = nuggets.find(n => n.id === id);
                recordChange.deleted(id);
                setNuggets(prev => prev.filter(n => n.id !== id));
                if (removed) pushUndo(`Deleted ${quote(removed.title)}`, () => {
                    recordChange.nugget(removed);
                    setNuggets(prev => prev.some(n => n.id === removed.id) ? prev : [...prev, removed]);
                });
            };

            // Finds nuggets with the same link (http/https, www, twitter.com
            // vs x.com, tracking codes etc. ignored). Index built on demand.
            const urlIndexRef = useRef({ src: null, map: null });
            const findExisting = (url, excludeId) => {
                if (urlIndexRef.current.src !== nuggets) {
                    const m = new Map();
                    nuggets.forEach(n => {
                        const k = normalizeUrlForMatch(n.url);
                        if (!m.has(k)) m.set(k, []);
                        m.get(k).push(n);
                    });
                    urlIndexRef.current = { src: nuggets, map: m };
                }
                return (urlIndexRef.current.map.get(normalizeUrlForMatch(url)) || []).filter(n => n.id !== excludeId);
            };

            // After saving, fill in a picture/title the save form didn't get
            // in time (e.g. saved straight away from the share menu).
            const topUpPreview = (saved, titleWasAuto) => {
                fetchLinkPreview(saved.url).then(p => {
                    if (!p) return;
                    setNuggets(prev => prev.map(x => {
                        if (x.id !== saved.id) return x;
                        const u = { ...x, pvc: 1 };
                        if (p.thumbnail && (!x.thumbnail || x.thumbnail.startsWith(FAVICON_PREFIX))) u.thumbnail = p.thumbnail;
                        if (p.title && titleWasAuto && x.title === saved.title) u.title = p.title;
                        if (p.description && !x.description) u.description = p.description;
                        recordChange.nugget(u);
                        return u;
                    }));
                });
            };

            const createFolder = (name, parentId = 'root') => {
                const folder = { id: Date.now().toString(), name: name.trim(), parentId, children: [] };
                recordChange.folder(folder);
                setFolders(prev => [...prev, folder]);
                return folder;
            };

            // All nugget/folder moves (drag and drop anywhere, Tree view)
            // go through these two, so each can be undone.
            const moveNuggetsTo = (ids, folderId) => {
                const idSet = new Set(ids);
                const before = new Map();
                nuggets.forEach(n => { if (idSet.has(n.id) && n.folderId !== folderId) before.set(n.id, n.folderId); });
                if (!before.size) return;
                setNuggets(prev => prev.map(n => {
                    if (!before.has(n.id)) return n;
                    const c = { ...n, folderId };
                    recordChange.nugget(c);
                    return c;
                }));
                const first = nuggets.find(n => before.has(n.id));
                const what = before.size === 1 ? quote(first && first.title) : `${before.size} nuggets`;
                pushUndo(`Moved ${what} to ${quote((folderById.get(folderId) || {}).name)}`, () =>
                    setNuggets(prev => prev.map(n => {
                        if (!before.has(n.id)) return n;
                        const c = { ...n, folderId: before.get(n.id) };
                        recordChange.nugget(c);
                        return c;
                    })));
            };
            const moveFolderTo = (folderId, targetId) => {
                const f = folderById.get(folderId);
                if (!f || folderId === 'root' || folderId === targetId || f.parentId === targetId) return;
                if (isDescendantFolder(folders, folderId, targetId)) {
                    showToast(`Can't move ${quote(f.name)} into one of its own folders`);
                    return;
                }
                const oldParent = f.parentId;
                setFolders(prev => prev.map(x => x.id === folderId ? { ...x, parentId: targetId } : x));
                pushUndo(`Moved folder ${quote(f.name)} into ${quote((folderById.get(targetId) || {}).name)}`, () =>
                    setFolders(prev => prev.map(x => x.id === folderId ? { ...x, parentId: oldParent } : x)));
            };
            // Touch dragging uses the same moves (so it's undoable too).
            TouchDrag.handler = (payload, folderId) => {
                if (!folderId) return;
                if (payload.type === 'nugget') moveNuggetsTo([payload.id], folderId);
                else if (payload.type === 'folder') moveFolderTo(payload.id, folderId);
            };
            
            // Batch-fixes the "every card looks the same" problem for
            // nuggets that never got a thumbnail (e.g. from a bulk
            // import). There's no backend to fetch a real page image, so
            // this uses each link's own domain favicon as a visually-
            // distinctive placeholder — instant even for tens of
            // thousands of nuggets, since it's just setting a URL string;
            // the browser fetches each icon lazily only as it scrolls
            // into view.
            const backfillThumbnails = () => {
                const missing = nuggets.filter(n => !n.thumbnail);
                if (missing.length === 0) {
                    alert('Every nugget already has a thumbnail.');
                    return;
                }
                if (!confirm(`Add a site-icon thumbnail to ${missing.length} nugget(s) that don't have one? This won't touch any nugget that already has a thumbnail set.`)) {
                    return;
                }
                setNuggets(prev => prev.map(n => {
                    if (n.thumbnail) return n;
                    try {
                        const hostname = new URL(n.url).hostname;
                        return { ...n, thumbnail: `https://www.google.com/s2/favicons?sz=128&domain=${hostname}` };
                    } catch (e) {
                        return n;
                    }
                }));
                alert(`Done — added favicon thumbnails to ${missing.length} nugget(s).`);
            };
            
            // Real screenshot thumbnails, via the Cloudflare Worker. This
            // upgrades any nugget that has no thumbnail OR only has the
            // favicon placeholder — it never touches a thumbnail you (or
            // an import) set deliberately. It's naturally resumable: since
            // eligibility is "still favicon-or-blank", closing the app and
            // running it again later just picks up wherever it left off,
            // with no separate progress-tracking needed.
            //
            // The Worker's per-minute rate limit is handled automatically
            // here — hitting it just pauses and retries on its own rather
            // than stopping and making you click the button again. The
            // Worker's DAILY budget is a real, deliberate cap though (see
            // the Worker's own comments for why) — that one genuinely does
            // require coming back another day, since a browser tab can't
            // reasonably be expected to stay open that long.
            const [mobileSidebarOpen, setMobileSidebarOpen] = useState(false);
            // One-time repair: undo the X logo / generic title that v1.6.12
            // previews wrongly stored on X home/profile links.
            useEffect(() => {
                if (!nuggets.length) return;
                let done = false;
                try { done = !!localStorage.getItem('nuggetz_xfix_v1'); } catch (e) {}
                if (done) return;
                try { localStorage.setItem('nuggetz_xfix_v1', '1'); } catch (e) {}
                if (!nuggets.some(n => n.pvc && isNonStatusXUrl(n.url))) return;
                setNuggets(prev => prev.map(n => {
                    if (!(n.pvc && isNonStatusXUrl(n.url))) return n;
                    const u = { ...n };
                    delete u.pvc;
                    if (u.thumbnail && !u.thumbnail.startsWith(FAVICON_PREFIX)) u.thumbnail = null;
                    if (/what.s happening/i.test(u.title || '')) {
                        try { u.title = new URL(u.url).hostname.replace(/^www\./, ''); } catch (e) {}
                    }
                    if (/^From breaking news/i.test(u.description || '')) u.description = '';
                    return u;
                }));
            }, [nuggets.length]);
            const [folderSort, setFolderSortState] = useState(() => {
                try { return localStorage.getItem('nuggetz_folder_sort') || 'default'; } catch (e) { return 'default'; }
            });
            const setFolderSort = (v) => {
                setFolderSortState(v);
                try { localStorage.setItem('nuggetz_folder_sort', v); } catch (e) {}
            };
            // Nugget order within a folder. Newest first by default, so
            // anything just saved (e.g. shared in from the phone) is at
            // the top instead of after hundreds of older items.
            const [nuggetSort, setNuggetSortState] = useState(() => {
                try { return localStorage.getItem('nuggetz_nugget_sort') || 'newest'; } catch (e) { return 'newest'; }
            });
            const setNuggetSort = (v) => {
                setNuggetSortState(v);
                try { localStorage.setItem('nuggetz_nugget_sort', v); } catch (e) {}
            };
            // Bring the newest Pearltrees-import folder to the top of the list;
            // it was landing after thousands of older top-level folders,
            // where it looked as if the import hadn't happened.
            useEffect(() => {
                const idx = folders.findIndex(f => typeof f.id === 'string' && f.id.startsWith('nsimport-'));
                if (idx > 0) {
                    setFolders(prev => {
                        const i = prev.findIndex(f => typeof f.id === 'string' && f.id.startsWith('nsimport-'));
                        if (i <= 0) return prev;
                        return [prev[i], ...prev.slice(0, i), ...prev.slice(i + 1)];
                    });
                }
            }, [folders]);
            const [screenshotProgress, setScreenshotProgress] = useState(null); // { done, total, stopped, waiting } | null
            // Ask before closing/reloading while a Drive save or a
            // thumbnail run is in progress, since that loses recent work.
            useEffect(() => {
                const busy = syncStatus === 'syncing' || (screenshotProgress && !screenshotProgress.stopped);
                if (!busy) return;
                const h = (e) => { e.preventDefault(); e.returnValue = ''; };
                window.addEventListener('beforeunload', h);
                return () => window.removeEventListener('beforeunload', h);
            }, [syncStatus, screenshotProgress && screenshotProgress.stopped]);
            const screenshotCancelRef = useRef(false);
            
            const captureRealThumbnails = async () => {
                if (THUMBNAIL_WORKER_URL.startsWith('REPLACE_WITH')) {
                    alert('Real screenshot thumbnails need a one-time setup step first — see nuggetz-thumbnail-worker/DEPLOYMENT_GUIDE.md for how to deploy the Cloudflare Worker.');
                    return;
                }
                const eligible = nuggets.filter(n => !n.thumbnail || n.thumbnail.startsWith(FAVICON_PREFIX));
                if (eligible.length === 0) {
                    alert('Nothing left to upgrade — every nugget already has a custom or captured thumbnail.');
                    return;
                }
                if (!confirm(`Capture real screenshot thumbnails for ${eligible.length} nugget(s)? This is capped to a modest amount per day to stay free — for a collection this size, expect it to take many days of leaving this running, or repeated visits, to finish. It picks up where it left off each time, so there's no need to babysit it.`)) {
                    return;
                }
                
                screenshotCancelRef.current = false;
                bulkRunRef.current = true;
                setScreenshotProgress({ done: 0, total: eligible.length, stopped: false, waiting: false });
                
                let done = 0;
                let stopReason = null;
                // Thumbnails are applied in batches (not one at a time):
                // one update per thumbnail re-processed all 91k nuggets
                // and triggered a full Drive upload each time, so saves
                // kept overlapping/being interrupted and progress was lost.
                const pending = {};
                let pendingCount = 0;
                const flushPending = () => {
                    if (pendingCount === 0) return;
                    const batch = { ...pending };
                    Object.keys(pending).forEach(k => delete pending[k]);
                    pendingCount = 0;
                    setNuggets(prev => prev.map(n => batch[n.id] ? { ...n, thumbnail: batch[n.id] } : n));
                };
                
                for (const nugget of eligible) {
                    if (screenshotCancelRef.current) { stopReason = 'stopped'; break; }
                    
                    let advance = false;
                    while (!advance) {
                        if (screenshotCancelRef.current) { stopReason = 'stopped'; break; }
                        try {
                            const res = await fetch(`${THUMBNAIL_WORKER_URL}?url=${encodeURIComponent(nugget.url)}`);
                            if (res.status === 429) {
                                const body = await res.json().catch(() => ({}));
                                if (body.budgetExhausted) {
                                    stopReason = 'budget';
                                    break;
                                }
                                // Short per-minute limit — wait it out
                                // automatically, then retry this same link.
                                setScreenshotProgress({ done, total: eligible.length, stopped: false, waiting: true });
                                for (let i = 0; i < 65 && !screenshotCancelRef.current; i++) {
                                    await new Promise(r => setTimeout(r, 1000));
                                }
                                setScreenshotProgress({ done, total: eligible.length, stopped: false, waiting: false });
                                continue;
                            }
                            if (res.ok) {
                                const body = await res.json();
                                pending[nugget.id] = body.thumbnail;
                                pendingCount++;
                                if (pendingCount >= 25) flushPending();
                            }
                            advance = true;
                        } catch (e) {
                            // Network hiccup on this one link — move on
                            // rather than getting stuck retrying forever.
                            advance = true;
                        }
                    }
                    if (stopReason) break;
                    done++;
                    setScreenshotProgress({ done, total: eligible.length, stopped: false, waiting: false });
                }
                
                bulkRunRef.current = false;
                flushPending();
                setScreenshotProgress({ done, total: eligible.length, stopped: true, waiting: false });
                if (stopReason === 'budget') {
                    alert(`Captured ${done} thumbnail(s) — reached today's rendering budget. Come back tomorrow (or any later day) and click this again to continue with the rest — it'll pick up exactly where it left off.`);
                } else if (stopReason === 'stopped') {
                    alert(`Stopped after ${done} of ${eligible.length}. Run it again anytime to pick up where you left off.`);
                } else {
                    alert(`Done — captured ${done} real thumbnail(s).`);
                }
                setTimeout(() => setScreenshotProgress(null), 3000);
            };
            

            // Fetches each link's own preview image, title and description
            // (or the tweet text/picture for X links) through the Worker's
            // preview mode. No screenshots, so no daily budget; the Worker
            // remembers every answer, so re-running is instant and free.
            // Works on the open folder (and everything inside it), or the
            // whole library when "All Nuggetz" is open. Non-Twitter links
            // go first.
            const fetchPreviews = async () => {
                if (THUMBNAIL_WORKER_URL.startsWith('REPLACE_WITH')) {
                    alert('Previews need the Cloudflare Worker set up first — see nuggetz-thumbnail-worker/DEPLOYMENT_GUIDE.md.');
                    return;
                }
                if (screenshotProgress && !screenshotProgress.stopped) {
                    alert('Another background job is already running. Stop it first (the × next to the counter), then try again.');
                    return;
                }
                let scoped = null;
                let scopeName = 'your whole library';
                if (currentFolder && currentFolder !== 'root') {
                    const kids = new Map();
                    folders.forEach(f => {
                        if (!kids.has(f.parentId)) kids.set(f.parentId, []);
                        kids.get(f.parentId).push(f.id);
                    });
                    scoped = new Set([currentFolder]);
                    const todo = [currentFolder];
                    while (todo.length) {
                        const id = todo.pop();
                        (kids.get(id) || []).forEach(c => { if (!scoped.has(c)) { scoped.add(c); todo.push(c); } });
                    }
                    const cf = folders.find(f => f.id === currentFolder);
                    scopeName = `"${cf ? cf.name : 'this folder'}" (and everything inside it)`;
                }
                const isTweet = (u) => /^https?:\/\/(www\.|mobile\.)?(twitter|x)\.com\//i.test(u);
                const noPicture = (n) => !n.thumbnail || n.thumbnail.startsWith(FAVICON_PREFIX);
                // X posts checked before 1.6.30 and found empty get one more
                // try with the /x lookup (pvx marks that it was tried).
                const xRetry = (n) => !!AUTH_WORKER_URL && n.pvc && !n.pvx && isXStatusUrl(n.url);
                const eligible = nuggets
                    .filter(n => (!scoped || scoped.has(n.folderId)) && (!n.pvc || xRetry(n)) && /^https?:/i.test(n.url || '') && !isNonStatusXUrl(n.url) &&
                        noPicture(n))
                    .sort((a, b) => (isTweet(a.url) ? 1 : 0) - (isTweet(b.url) ? 1 : 0));
                if (eligible.length === 0) {
                    alert(`Nothing to do for ${scopeName} — every link already has a thumbnail or has been checked.`);
                    return;
                }
                const tweetCount = eligible.filter(n => isTweet(n.url)).length;
                if (!confirm(`Fetch preview images and summaries for ${eligible.length} link(s) in ${scopeName}?\n\n` +
                    `${tweetCount} of them are Twitter/X links (done last).\n\n` +
                    `It runs in the background at roughly one link a second. Keep this tab open; you can stop it any time (the × next to the counter) and it picks up where it left off. ` +
                    `Results appear and are saved in batches (every few minutes on big jobs, and at the end), so wait for "Synced" before closing the tab.`)) {
                    return;
                }

                const unloadWarning = (e) => {
                    if (pendingCount > 0) { e.preventDefault(); e.returnValue = ''; }
                };
                window.addEventListener('beforeunload', unloadWarning);
                screenshotCancelRef.current = false;
                bulkRunRef.current = true;
                let done = 0;
                const total = eligible.length;
                let lastProgressPaint = 0;
                const paintProgress = (extra) => {
                    const now = Date.now();
                    if (extra.waiting || extra.stopped || now - lastProgressPaint > 200) {
                        lastProgressPaint = now;
                        setScreenshotProgress({ done, total, stopped: false, waiting: false, ...extra });
                    }
                };
                setScreenshotProgress({ done: 0, total, stopped: false, waiting: false });

                const pending = {};
                let pendingCount = 0;
                let lastFlush = Date.now();
                const flushPending = () => {
                    if (pendingCount === 0) return;
                    const batch = { ...pending };
                    Object.keys(pending).forEach(k => delete pending[k]);
                    pendingCount = 0;
                    lastFlush = Date.now();
                    setNuggets(prev => prev.map(n => {
                        const r = batch[n.id];
                        if (!r) return n;
                        const upd = { ...n, pvc: 1 };
                        if (r.pvx) upd.pvx = 1;
                        if (r.thumbnail) upd.thumbnail = r.thumbnail;
                        // Only replace a title that is just a bare site name
                        // or the URL; never overwrite a real Pearltrees title.
                        if (r.title && (!n.title || n.title === n.url || !/\s/.test(n.title) || (isXStatusUrl(n.url) && isWeakXTitle(n.title)))) upd.title = r.title;
                        if (r.description && !n.description) upd.description = r.description;
                        return upd;
                    }));
                };

                let next = 0;
                let stopReason = null;
                let serviceFailures = 0;
                const runner = async () => {
                    while (!stopReason) {
                        if (screenshotCancelRef.current) { stopReason = 'stopped'; return; }
                        const idx = next++;
                        if (idx >= eligible.length) return;
                        const nugget = eligible[idx];
                        let advance = false;
                        while (!advance && !stopReason) {
                            if (screenshotCancelRef.current) { stopReason = 'stopped'; return; }
                            try {
                                const ctrl = new AbortController();
                                const timer = setTimeout(() => ctrl.abort(), 20000);
                                let res;
                                try {
                                    res = await fetch(`${THUMBNAIL_WORKER_URL}?mode=preview&url=${encodeURIComponent(nugget.url)}`, { signal: ctrl.signal });
                                } finally {
                                    clearTimeout(timer);
                                }
                                if (res.status === 429) {
                                    setScreenshotProgress({ done, total, stopped: false, waiting: true });
                                    lastProgressPaint = Date.now();
                                    for (let i = 0; i < 35 && !screenshotCancelRef.current; i++) {
                                        await new Promise(r => setTimeout(r, 1000));
                                    }
                                    paintProgress({});
                                    continue;
                                }
                                if (res.ok) {
                                    let body = await res.json();
                                    serviceFailures = 0;
                                    let triedX = false;
                                    if (isXStatusUrl(nugget.url) && (!body.thumbnail || isWeakXTitle(body.title))) {
                                        triedX = true;
                                        const x = await xLookup(nugget.url);
                                        if (x) body = { thumbnail: body.thumbnail || x.thumbnail, title: isWeakXTitle(body.title) ? x.title : body.title, description: body.description || x.description };
                                    }
                                    pending[nugget.id] = { thumbnail: body.thumbnail || null, title: body.title || '', description: body.description || '', pvx: triedX };
                                    pendingCount++;
                                } else if (res.status >= 500) {
                                    // Tweet lookup / Worker trouble: don't mark as
                                    // checked, so a later run retries this link.
                                    serviceFailures++;
                                    if (serviceFailures >= 10) { stopReason = 'service'; return; }
                                }
                            } catch (e) {
                                serviceFailures++;
                                if (serviceFailures >= 10) { stopReason = 'service'; return; }
                            }
                            advance = true;
                        }
                        done++;
                        paintProgress({});
                        // Each save uploads the whole library to Drive and keeps
                        // the page busy while it does, so save at a moderate
                        // pace: every 200 results or every 90 seconds. (The
                        // Worker remembers every answer, so if the tab closes
                        // before a save, re-running just replays them almost
                        // instantly — this only limits how much a forced
                        // close/reload could lose in between saves.)
                        if (pendingCount >= 200 || (pendingCount > 0 && Date.now() - lastFlush > 90000)) flushPending();
                    }
                };
                await Promise.all([runner(), runner(), runner()]);

                bulkRunRef.current = false;
                window.removeEventListener('beforeunload', unloadWarning);
                flushPending();
                setScreenshotProgress({ done, total, stopped: true, waiting: false });
                if (stopReason === 'service') {
                    alert(`Paused after ${done} of ${total}: the preview service kept failing. Nothing is lost — try again later and it continues where it stopped.`);
                } else if (stopReason === 'stopped') {
                    alert(`Stopped after ${done} of ${total}. Run it again any time to continue.`);
                } else {
                    alert(`Done — checked ${done} link(s). Wait for "Synced" before closing the tab.`);
                }
                setTimeout(() => setScreenshotProgress(null), 3000);
            };

            // Reassigns any nugget whose folderId doesn't match a real
            // folder into a dedicated recovery folder, so it becomes
            // reachable again through normal navigation. Safe to run
            // repeatedly — nuggets already filed somewhere real are
            // never touched.
            const recoverOrphanedNuggets = () => {
                const folderIds = new Set(folders.map(f => f.id));
                const orphaned = nuggets.filter(n => !folderIds.has(n.folderId));
                if (orphaned.length === 0) {
                    alert('Nothing to recover — every nugget is filed in a folder that still exists.');
                    return;
                }
                if (!confirm(`Found ${orphaned.length} nugget(s) filed in a folder that no longer exists. Move them into a new "Recovered Nuggets" folder so you can see and re-file them?`)) {
                    return;
                }
                const recoveryId = 'recovered-' + Date.now();
                setFolders(prev => [...prev, { id: recoveryId, name: 'Recovered Nuggets', parentId: 'root', children: [] }]);
                setNuggets(prev => prev.map(n => folderIds.has(n.folderId) ? n : { ...n, folderId: recoveryId }));
                setExpandedFolders(prev => [...new Set([...prev, 'root', recoveryId])]);
                alert(`Recovered ${orphaned.length} nugget(s) into "Recovered Nuggets".`);
            };
            
            const deleteFolder = (id) => {
                // Collect the whole subtree first (one linear pass using
                // a parent->children index), then apply exactly one
                // setFolders and one setNuggets update. The previous
                // version called setNuggets once per nested folder from a
                // stale closure — only the last call actually took
                // effect (React batches synchronous updates), so most
                // descendant nuggets silently survived, and the
                // descendant folders themselves were never removed at
                // all, only referenced when hunting for their nuggets.
                const childrenOf = new Map();
                folders.forEach(f => {
                    if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                    childrenOf.get(f.parentId).push(f.id);
                });
                const idsToDelete = new Set([id]);
                const stack = [id];
                while (stack.length > 0) {
                    const current = stack.pop();
                    (childrenOf.get(current) || []).forEach(childId => {
                        if (!idsToDelete.has(childId)) {
                            idsToDelete.add(childId);
                            stack.push(childId);
                        }
                    });
                }
                
                const removedFolders = folders.filter(f => idsToDelete.has(f.id));
                const removedNuggets = nuggets.filter(n => idsToDelete.has(n.folderId));
                removedNuggets.forEach(n => recordChange.deleted(n.id));
                setFolders(prev => prev.filter(f => !idsToDelete.has(f.id)));
                setNuggets(prev => prev.filter(n => !idsToDelete.has(n.folderId)));
                if (idsToDelete.has(currentFolder)) {
                    setCurrentFolder('root');
                }
                const top = removedFolders.find(f => f.id === id);
                pushUndo(`Deleted folder ${quote(top && top.name)}${removedNuggets.length ? ` (${removedNuggets.length.toLocaleString()} nuggets)` : ''}`, () => {
                    removedNuggets.forEach(n => recordChange.nugget(n));
                    setFolders(prev => { const have = new Set(prev.map(f => f.id)); return [...prev, ...removedFolders.filter(f => !have.has(f.id))]; });
                    setNuggets(prev => { const have = new Set(prev.map(n => n.id)); return [...prev, ...removedNuggets.filter(n => !have.has(n.id))]; });
                });
            };
            
            const toggleFolder = (id) => {
                setExpandedFolders(
                    expandedFolders.includes(id)
                        ? expandedFolders.filter(fid => fid !== id)
                        : [...expandedFolders, id]
                );
            };
            
            // Recursive item counts per folder (this folder's own nuggets
            // plus every nested subfolder's), computed once per data
            // change rather than per rendered row — a naive per-folder
            // recursive walk would be the same O(n\u00b2) mistake fixed
            // elsewhere in this file, and at thousands of folders that
            // difference is the gap between instant and frozen.
            const folderRecursiveCounts = useMemo(() => {
                const childrenOf = new Map();
                folders.forEach(f => {
                    if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                    childrenOf.get(f.parentId).push(f.id);
                });
                const directCounts = new Map();
                nuggets.forEach(n => {
                    directCounts.set(n.folderId, (directCounts.get(n.folderId) || 0) + 1);
                });
                const totals = new Map();
                const compute = (folderId) => {
                    if (totals.has(folderId)) return totals.get(folderId);
                    let total = directCounts.get(folderId) || 0;
                    (childrenOf.get(folderId) || []).forEach(childId => {
                        total += compute(childId);
                    });
                    totals.set(folderId, total);
                    return total;
                };
                folders.forEach(f => compute(f.id));
                return Object.fromEntries(totals);
            }, [folders, nuggets]);
            const folderById = useMemo(() => new Map(folders.map(x => [x.id, x])), [folders]);
            
            // Diagnostic for the "sidebar total looks smaller than the
            // real count" question: a nugget is "orphaned" if its
            // folderId doesn't match any folder that actually exists.
            // These nuggets are still in memory (and still searchable —
            // search scans the whole nuggets array regardless of folder
            // validity) but invisible to folder navigation and to the
            // recursive counts above, since there's no way to click into
            // a folder that doesn't exist.
            const orphanedNuggetCount = useMemo(() => {
                const folderIds = new Set(folders.map(f => f.id));
                return nuggets.filter(n => !folderIds.has(n.folderId)).length;
            }, [folders, nuggets]);
            
            // A second, different way to go invisible: the nugget's own
            // folder exists, but that folder's PARENT chain never
            // actually reaches root — e.g. its parent folder was itself
            // deleted or lost, leaving this folder (and everything
            // nested under it) technically present but unreachable by
            // clicking through the sidebar. Detected once per folder via
            // memoized chain-walking, so this stays fast even at
            // thousands of folders.
            const disconnectedFolderIds = useMemo(() => {
                const byId = new Map(folders.map(f => [f.id, f]));
                const status = new Map();
                const resolve = (id, chain) => {
                    if (status.has(id)) return status.get(id);
                    if (id === 'root') { status.set(id, true); return true; }
                    if (chain.has(id)) {
                        chain.forEach(cid => status.set(cid, false));
                        return false;
                    }
                    const folder = byId.get(id);
                    if (!folder || folder.parentId == null || !byId.has(folder.parentId)) {
                        status.set(id, false);
                        return false;
                    }
                    chain.add(id);
                    const ok = resolve(folder.parentId, chain);
                    status.set(id, ok);
                    return ok;
                };
                return folders.filter(f => !resolve(f.id, new Set())).map(f => f.id);
            }, [folders]);
            
            const disconnectedNuggetCount = useMemo(() => {
                const disconnectedSet = new Set(disconnectedFolderIds);
                return nuggets.filter(n => disconnectedSet.has(n.folderId)).length;
            }, [disconnectedFolderIds, nuggets]);
            
            // Folder covers (1.6.17). Plain by default. Each folder can
            // have its own setting — folder.cover = { mode, image,
            // subfolders } where mode is 'plain' | 'contents' | 'custom' —
            // and a setting with subfolders: true is also used by every
            // folder below it that has no setting of its own (the
            // nearest such folder above wins). Setting it on "All Nuggetz"
            // makes it the default for the whole library.
            const effectiveCovers = useMemo(() => {
                const byId = new Map(folders.map(f => [f.id, f]));
                const passDown = new Map(); // what a folder hands to its subfolders
                const getPassDown = (id, depth = 0) => {
                    if (id == null || depth > 200) return null;
                    if (passDown.has(id)) return passDown.get(id);
                    const f = byId.get(id);
                    let result = null;
                    if (f) {
                        if (f.cover && f.cover.subfolders) result = { ...f.cover, source: f.id };
                        else result = getPassDown(f.parentId, depth + 1);
                    }
                    passDown.set(id, result);
                    return result;
                };
                const eff = new Map();
                folders.forEach(f => {
                    if (f.cover) eff.set(f.id, { ...f.cover, source: f.id });
                    else eff.set(f.id, getPassDown(f.parentId) || { mode: 'plain', source: null });
                });
                return eff;
            }, [folders]);

            const folderCoverImages = useMemo(() => {
                const result = {};
                const needContents = new Set();
                effectiveCovers.forEach((c, id) => {
                    if (c.mode === 'custom' && c.image) result[id] = c.image;
                    else if (c.mode === 'contents') needContents.add(id);
                });
                if (needContents.size === 0) return result; // skip the big nuggets pass entirely

                const childrenOf = new Map();
                folders.forEach(f => {
                    if (!childrenOf.has(f.parentId)) childrenOf.set(f.parentId, []);
                    childrenOf.get(f.parentId).push(f.id);
                });
                const directReal = new Map();
                const directAny = new Map();
                nuggets.forEach(n => {
                    if (!n.thumbnail) return;
                    if (!directAny.has(n.folderId)) directAny.set(n.folderId, n.thumbnail);
                    if (!n.thumbnail.startsWith(FAVICON_PREFIX) && !directReal.has(n.folderId)) {
                        directReal.set(n.folderId, n.thumbnail);
                    }
                });
                // Prefer a real picture anywhere in the subtree; only fall
                // back to a site icon if there's truly nothing else.
                const realCovers = new Map();
                const computeReal = (folderId, depth = 0) => {
                    if (realCovers.has(folderId)) return realCovers.get(folderId);
                    realCovers.set(folderId, null); // cycle guard
                    let r = directReal.get(folderId) || null;
                    if (!r && depth < 200) {
                        for (const childId of (childrenOf.get(folderId) || [])) {
                            const c = computeReal(childId, depth + 1);
                            if (c) { r = c; break; }
                        }
                    }
                    realCovers.set(folderId, r);
                    return r;
                };
                const anyCovers = new Map();
                const computeAny = (folderId, depth = 0) => {
                    if (anyCovers.has(folderId)) return anyCovers.get(folderId);
                    anyCovers.set(folderId, null);
                    let r = computeReal(folderId);
                    if (!r) {
                        r = directAny.get(folderId) || null;
                        if (!r && depth < 200) {
                            for (const childId of (childrenOf.get(folderId) || [])) {
                                const c = computeAny(childId, depth + 1);
                                if (c) { r = c; break; }
                            }
                        }
                    }
                    anyCovers.set(folderId, r);
                    return r;
                };
                needContents.forEach(id => { const img = computeAny(id); if (img) result[id] = img; });
                return result;
            }, [effectiveCovers, folders, nuggets]);

            const [coverFolderId, setCoverFolderId] = useState(null);
            const setFolderCover = (folderId, cover) => {
                setFolders(prev => prev.map(f => {
                    if (f.id !== folderId) return f;
                    if (!cover) { const { cover: _removed, ...rest } = f; return rest; }
                    return { ...f, cover };
                }));
            };
            
            // Reattaches just the "top" of each disconnected branch
            // (folders whose parent is missing entirely) back under
            // root — their own children keep pointing to them, so the
            // whole branch's internal organization is preserved exactly,
            // it's just reconnected to the main tree instead of floating
            // disconnected from it.
            const reconnectDisconnectedFolders = () => {
                const byId = new Map(folders.map(f => [f.id, f]));
                const candidates = disconnectedFolderIds.filter(id => {
                    const f = byId.get(id);
                    return f && !byId.has(f.parentId);
                });
                if (candidates.length === 0) {
                    alert('Nothing to reconnect.');
                    return;
                }
                if (!confirm(`Found ${candidates.length} folder(s) disconnected from the main tree (their parent folder no longer exists). Reconnect them directly under "All Nuggetz"? Their own contents and subfolders stay organized exactly as they are — this just reattaches the top of that branch.`)) {
                    return;
                }
                const candidateSet = new Set(candidates);
                setFolders(prev => prev.map(f => candidateSet.has(f.id) ? { ...f, parentId: 'root' } : f));
                setExpandedFolders(prev => [...new Set([...prev, 'root'])]);
            };
            
            // One pass builds "which nuggets are in which folder", so
            // opening a folder no longer scans all 250k nuggets.
            const nuggetsByFolder = useMemo(() => {
                const m = new Map();
                nuggets.forEach(n => {
                    let arr = m.get(n.folderId);
                    if (!arr) { arr = []; m.set(n.folderId, arr); }
                    arr.push(n);
                });
                return m;
            }, [nuggets]);
            const EMPTY_LIST = useMemo(() => [], []);
            // "All Nuggetz" shows only what's filed at the top level (it
            // used to list every nugget in the library underneath its
            // folders). Search still covers the whole library.
            const getFolderNuggets = (folderId) => {
                return nuggetsByFolder.get(folderId) || EMPTY_LIST;
            };
            
            const getFilteredNuggets = () => {
                if (!searchQuery) return getFolderNuggets(currentFolder);
                // A search matches across the whole collection, not just
                // the currently open folder — matching how Pearltrees'
                // search behaves, since the point of searching is to
                // find something wherever it's actually filed.
                const q = searchQuery.toLowerCase();
                return nuggets.filter(n =>
                    n.title.toLowerCase().includes(q) ||
                    n.url.toLowerCase().includes(q) ||
                    n.description?.toLowerCase().includes(q)
                );
            };
            
            const getMatchingFolders = () => {
                if (!searchQuery) return [];
                const q = searchQuery.toLowerCase();
                return folders
                    .filter(f => f.id !== 'root' && f.name.toLowerCase().includes(q))
                    .sort((a, b) => (folderRecursiveCounts[b.id] || 0) - (folderRecursiveCounts[a.id] || 0));
            };
            const folderPathLabel = (f) => {
                const parts = [];
                let p = folderById.get(f.parentId);
                let guard = 0;
                while (p && p.id !== 'root' && guard < 4) { parts.unshift(p.name); p = folderById.get(p.parentId); guard++; }
                return parts.join(' › ');
            };
            const sortFolders = (list) => {
                if (folderSort === 'name') return [...list].sort((a, b) => NAME_COLLATOR.compare(a.name, b.name));
                if (folderSort === 'size') return [...list].sort((a, b) => (folderRecursiveCounts[b.id] || 0) - (folderRecursiveCounts[a.id] || 0));
                return list;
            };
            
            const handleNuggetDragStart = (nugget) => {
                setDraggedNugget(nugget);
            };
            
            const handleNuggetDragEnd = () => {
                setDraggedNugget(null);
                setDragOverFolder(null);
            };
            
            const handleFolderDragOver = (e, folderId) => {
                e.preventDefault();
                setDragOverFolder(folderId);
            };
            
            const handleFolderDrop = (e, folderId) => {
                e.preventDefault();
                if (draggedNugget) {
                    moveNuggetsTo([draggedNugget.id], folderId);
                } else if (draggedFolder && draggedFolder.id !== folderId) {
                    moveFolderTo(draggedFolder.id, folderId);
                }
                setDraggedNugget(null);
                setDraggedFolder(null);
                setDragOverFolder(null);
            };
            
            // --- Tree (canvas) view handlers ---
            
            const moveNodePosition = (id, x, y) => {
                setNodePositions(prev => ({ ...prev, [id]: { x, y } }));
            };
            
            const clearNodePosition = (id) => {
                setNodePositions(prev => {
                    if (!(id in prev)) return prev;
                    const next = { ...prev };
                    delete next[id];
                    return next;
                });
            };
            
            const renameFolder = (id, name) => {
                setFolders(folders.map(f => f.id === id ? { ...f, name } : f));
            };
            
            // Dragging one nugget onto another creates a brand-new tree
            // (folder) containing both, mirroring Pearltrees-style nesting.
            const nestNuggets = (draggedId, targetId) => {
                if (draggedId === targetId) return;
                const targetNugget = nuggets.find(n => n.id === targetId);
                if (!targetNugget) return;
                const parentId = targetNugget.folderId || 'root';
                const newFolder = { id: 'f' + Date.now().toString(), name: 'New Tree', parentId, children: [] };
                setFolders(prev => [...prev, newFolder]);
                setNuggets(prev => prev.map(n =>
                    (n.id === draggedId || n.id === targetId) ? { ...n, folderId: newFolder.id } : n
                ));
                setExpandedFolders(prev => [...new Set([...prev, parentId, newFolder.id])]);
                clearNodePosition(draggedId);
                clearNodePosition(targetId);
            };
            
            const moveNuggetIntoFolder = (nuggetId, folderId) => {
                moveNuggetsTo([nuggetId], folderId);
                clearNodePosition(nuggetId);
            };
            
            const nestFolderInFolder = (folderId, targetFolderId) => {
                moveFolderTo(folderId, targetFolderId);
                clearNodePosition(folderId);
            };
            
            const exportData = () => {
                const rdfContent = RDFUtil.exportToRDF(folders, nuggets);
                const blob = new Blob([rdfContent], { type: 'application/rdf+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `nuggetz-export-${new Date().toISOString().split('T')[0]}.rdf`;
                a.click();
                URL.revokeObjectURL(url);
            };
            
            const [isImporting, setIsImporting] = useState(false);
            
            const importData = () => {
                if (isImporting) return;
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.rdf,.xml,.html,.htm';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        setIsImporting(true);
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const fileText = event.target.result;
                                const { folders: importedFolders, nuggets: importedNuggets, method } =
                                    NetscapeUtil.isNetscape(fileText)
                                        ? NetscapeUtil.parse(fileText)
                                        : RDFUtil.importFromRDF(fileText);
                                if (!importedFolders.length && !importedNuggets.length) {
                                    alert("Couldn't find any bookmarks or folders in that file.");
                                    return;
                                }
                                setFolders(method === 'netscape' ? [...importedFolders, ...folders] : [...folders, ...importedFolders]);
                                setNuggets([...nuggets, ...importedNuggets]);
                                if (method === 'netscape') {
                                    alert(
                                        `Imported ${importedNuggets.length} link(s) into ${importedFolders.length - 1} folder(s), ` +
                                        `all inside a new folder called "${importedFolders[0].name}". Your existing folders were not changed.`
                                    );
                                } else if (method === 'generic') {
                                    alert(
                                        `Imported ${importedNuggets.length} link(s) into ${importedFolders.length} folder(s), ` +
                                        `filed under "Imported from Pearltrees".\n\nThis wasn't a Nuggetz file, so the folder ` +
                                        `structure was reconstructed heuristically from the RDF — worth a quick look to check ` +
                                        `nesting and titles came through as expected.`
                                    );
                                } else {
                                    alert(`Imported ${importedNuggets.length} nugget(s) and ${importedFolders.length} folder(s).`);
                                }
                            } catch (error) {
                                alert('Import failed: ' + error.message);
                            } finally {
                                setIsImporting(false);
                            }
                        };
                        reader.onerror = () => setIsImporting(false);
                        reader.readAsText(file);
                    }
                };
                input.click();
            };
            
            const visibleNuggets = useMemo(() => {
                const list = getFilteredNuggets();
                if (nuggetSort === 'default') return list;
                const time = (n) => { const t = Date.parse(n.created); return isNaN(t) ? 0 : t; };
                if (nuggetSort === 'newest') return [...list].sort((a, b) => time(b) - time(a));
                if (nuggetSort === 'oldest') return [...list].sort((a, b) => time(a) - time(b));
                if (nuggetSort === 'title') return [...list].sort((a, b) => NAME_COLLATOR.compare(a.title || '', b.title || ''));
                return list;
            }, [nuggets, nuggetsByFolder, currentFolder, searchQuery, nuggetSort]);
            const visibleSubfolders = useMemo(
                () => searchQuery ? [] : sortFolders(folders.filter(f => f.parentId === currentFolder)),
                [folders, currentFolder, searchQuery, folderSort, folderRecursiveCounts]
            );

            const getBreadcrumb = () => {
                const path = [];
                let current = folderById.get(currentFolder);
                let guard = 0;
                while (current && guard++ < 200) {
                    path.unshift(current);
                    current = folderById.get(current.parentId);
                }
                
                return path;
            };
            
            return (
                <>
                    <header className="app-header">
                        <div className="header-content">
                            <div className="logo-block">
                                <button className="mobile-menu-btn" onClick={() => setMobileSidebarOpen(o => !o)}>☰ Folders</button>
                                <div className="logo">Nuggetz</div>
                                <div className="logo-meta">
                                    <span className="app-version">v{APP_VERSION}</span>
                                    <button className="diagnostics-link" onClick={() => setShowDiagnostics(true)}>
                                        Diagnostics
                                    </button>
                                </div>
                            </div>
                            <div className="header-actions">
                                <button className="btn btn-secondary" onClick={() => setShowAddFolder(true)}>
                                    <Icons.Plus /> New Folder
                                </button>
                                <button className="btn btn-primary" onClick={() => setShowAddNugget(true)}>
                                    <Icons.Plus /> Add Nugget
                                </button>
                                <button className="btn btn-secondary" onClick={exportData} title="Export a backup file">
                                    <Icons.Download />
                                </button>
                                <button className="btn btn-secondary" onClick={importData} disabled={isImporting} title={isImporting ? 'Importing…' : 'Import'}>
                                    {isImporting ? '…' : <Icons.Upload />}
                                </button>
                                <button className="btn btn-secondary" onClick={backfillThumbnails} title="Add a site-icon thumbnail to nuggets missing one">
                                    <Icons.Image />
                                </button>
                                {screenshotProgress ? (
                                    <div className="screenshot-progress" title={`${screenshotProgress.done} of ${screenshotProgress.total}`}>
                                        <Icons.Camera />
                                        <span>{screenshotProgress.waiting ? 'waiting…' : `${screenshotProgress.done}/${screenshotProgress.total}`}</span>
                                        {!screenshotProgress.stopped && (
                                            <button
                                                className="screenshot-stop-btn"
                                                onClick={() => { screenshotCancelRef.current = true; }}
                                                title="Stop capturing"
                                            >
                                                ×
                                            </button>
                                        )}
                                    </div>
                                ) : (
                                    <button className="btn btn-secondary" onClick={captureRealThumbnails} title="Capture real screenshot thumbnails (via Cloudflare)">
                                        <Icons.Camera />
                                    </button>
                                )}
                                <button className="btn btn-secondary" onClick={fetchPreviews} title="Fetch preview images and summaries for the links in this folder (or the whole library from All Nuggetz)">
                                    Previews
                                </button>
                                <button
                                    className={`btn btn-secondary sync-btn sync-${syncEnabled ? syncStatus : 'idle'}`}
                                    onClick={handleSyncButtonClick}
                                    title={syncEnabled ? 'Google Drive sync — click for options' : 'Connect Google Drive to sync across devices'}
                                >
                                    <Icons.Cloud />
                                    <span className="sync-dot" />
                                    <span className="sync-label">{syncButtonLabel()}</span>
                                </button>
                            </div>
                        </div>
                    </header>
                    
                    <div className="main-container">
                        <div className={`mobile-backdrop${mobileSidebarOpen ? ' show' : ''}`} onClick={() => setMobileSidebarOpen(false)}></div>
                        <aside className={`sidebar${mobileSidebarOpen ? ' mobile-open' : ''}`}>

                            </div>
                            <FolderTree

                                expandedFolders={expandedFolders}
