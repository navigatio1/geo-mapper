<body>
    <div id="root"></div>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        
        // Utility functions for data persistence
        const Storage = {
            save: (key, data) => {
                try {
                    localStorage.setItem(key, JSON.stringify(data));
                    return true;
                } catch (e) {
                    console.error('Storage save error:', e);
                    // Warn once per session: a failed local save used
                    // to be completely silent (e.g. mobile quota hit).
                    // Checked after a short wait rather than straight away:
                    // right after a fresh sign-in, Drive's library arrives
                    // (and overflows this device) a moment BEFORE sync is
                    // marked as on, which used to trigger this warning
                    // falsely while sync was actually just starting up.
                    if (!Storage._warned && !Storage._warnPending) {
                        Storage._warnPending = true;
                        setTimeout(() => {
                            Storage._warnPending = false;
                            let syncOn = false;
                            try { syncOn = JSON.parse(localStorage.getItem('nuggetz_sync_enabled')) === true; } catch (e3) {}
                            const st = Storage.syncState || {};
                            const onItsWay = st.enabled || ['connecting', 'syncing', 'synced'].includes(st.status);
                            if (!syncOn && !onItsWay && !Storage._warned) {
                                Storage._warned = true;
                                alert('Your library is too big to keep on this device, and Google Drive sync is off — so your changes may be lost when you close this page. Turn on Drive sync (top right) to keep everything safe.');
                            }
                        }, 20000);
                    }
                    return false;
                }
            },
            load: (key, defaultValue = null) => {
                try {
                    const item = localStorage.getItem(key);
                    return item ? JSON.parse(item) : defaultValue;
                } catch (e) {
                    console.error('Storage load error:', e);
                    // Keep a copy of the unreadable data so the next
                    // save can't destroy it.
                    try { localStorage.setItem(key + '__unreadable_backup', localStorage.getItem(key)); } catch (e2) {}
                    return defaultValue;
                }
            }
        };
        
        // ============================================================
        // GOOGLE DRIVE SYNC CONFIGURATION
        // Replace this with your own OAuth Client ID from Google Cloud
        // Console (APIs & Services > Credentials > OAuth client ID >
        // Web application). Add your deployed URL — e.g.
        // https://nuggetz.navigatio.earth — to "Authorized JavaScript
        // origins" on that client. See GOOGLE_DRIVE_SETUP_GUIDE.md.
        // ============================================================
        // Bump this on every deploy — shown subtly in the header and in
        // the Diagnostics panel, so you (and I, if you paste diagnostics
        // back to me) can confirm which build is actually live.
        const APP_VERSION = '1.6.17';

        const GOOGLE_CLIENT_ID = '1506146098-u4cb9jk2bv8l83jl3f44qvj17n2q12ee.apps.googleusercontent.com';
        const DRIVE_SCOPE = 'https://www.googleapis.com/auth/drive.appdata';
        const DRIVE_FILE_NAME = 'nuggetz-data.json';

        // The Cloudflare Worker that captures a real screenshot of a
        // page and caches it in R2 — replace with your deployed
        // Worker's URL (see nuggetz-thumbnail-worker/DEPLOYMENT_GUIDE.md).
        const THUMBNAIL_WORKER_URL = 'https://nuggetz-thumbnails.bconway.workers.dev';
        const FAVICON_PREFIX = 'https://www.google.com/s2/favicons';

        // Optional "stay signed in" helper Worker (nuggetz-auth-worker/).
        // It keeps a long-lived Google refresh token so the app doesn't
        // need reconnecting roughly every hour. If it isn't deployed or
        // can't be reached, the app quietly uses the old one-hour sign-in
        // exactly as before — so this is safe to ship before the Worker
        // exists. Set to '' to switch the feature off entirely.
        const AUTH_WORKER_URL = 'https://nuggetz-auth.bconway.workers.dev';
        const AUTH_SESSION_KEY = 'nuggetz_auth_session';

        const fetchWithTimeout = (url, options = {}, ms = 15000) => {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), ms);
            return fetch(url, { ...options, signal: ctrl.signal }).finally(() => clearTimeout(t));
        };

        // Talks to the user's own Google Drive appDataFolder — a hidden,
        // per-app storage space. Nobody but this app (signed in as this
        // user) can see or read it; it doesn't show up in the user's
        // normal Drive file list. No server of ours is involved at all.
        const DriveSync = {
            tokenClient: null,
            codeClient: null,
            accessToken: null,
            fileId: null,
            _refreshing: false,
            _refreshResolve: null,
            // "Stay signed in" (via AUTH_WORKER_URL). session = this
            // device's key for the Worker; authWorkerOk = whether the
            // Worker answered its health check (null = not checked yet).
            session: (() => { try { return localStorage.getItem(AUTH_SESSION_KEY) || null; } catch (e) { return null; } })(),
            authWorkerOk: null,
            _codeMode: null,          // 'connect' | 'upgrade'
            _upgradeResolve: null,
            _onToken: null,
            onAuthChange: null,       // set by the app, to refresh the UI
            onStaySignedInError: null,

            _setSession(value) {
                this.session = value || null;
                try {
                    if (value) localStorage.setItem(AUTH_SESSION_KEY, value);
                    else localStorage.removeItem(AUTH_SESSION_KEY);
                } catch (e) { /* storage full — kept in memory for this visit */ }
                if (this.onAuthChange) this.onAuthChange();
            },

            // Checked in the background at start-up, NOT when a button is
            // clicked: browsers block the Google pop-up if the click has to
            // wait for a network request first.
            async checkAuthWorker() {
                if (!AUTH_WORKER_URL) { this.authWorkerOk = false; return false; }
                try {
                    const res = await fetchWithTimeout(AUTH_WORKER_URL + '/health', {}, 6000);
                    const data = await res.json();
                    this.authWorkerOk = !!(res.ok && data.configured);
                } catch (e) {
                    this.authWorkerOk = false;
                }
                if (this.onAuthChange) this.onAuthChange();
                return this.authWorkerOk;
            },

            canStaySignedIn() {
                return !!(this.codeClient && this.authWorkerOk);
            },

            async _handleCode(resp) {
                const mode = this._codeMode;
                this._codeMode = null;
                const finishUpgrade = (ok) => {
                    const r = this._upgradeResolve;
                    this._upgradeResolve = null;
                    if (r) r(ok);
                };
                if (!resp || !resp.code) {
                    finishUpgrade(false);
                    if (mode === 'connect' && this.onStaySignedInError) this.onStaySignedInError('cancelled');
                    return;
                }
                try {
                    const res = await fetchWithTimeout(AUTH_WORKER_URL + '/exchange', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ code: resp.code })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && data.session && data.access_token) {
                        this._setSession(data.session);
                        this.accessToken = data.access_token;
                        if (mode === 'upgrade') finishUpgrade(true);
                        else if (this._onToken) this._onToken();
                        return;
                    }
                    // No long-term token, but still a working one-hour
                    // token: carry on connected the old way.
                    if (data.error === 'no_refresh_token' && data.access_token) {
                        this.accessToken = data.access_token;
                        if (mode === 'upgrade') finishUpgrade(false);
                        else if (this._onToken) this._onToken();
                        if (this.onStaySignedInError) this.onStaySignedInError('no_refresh_token');
                        return;
                    }
                    throw new Error(data.error || ('HTTP ' + res.status));
                } catch (e) {
                    console.error('Stay-signed-in setup failed:', e);
                    // Use the ordinary one-hour sign-in for the rest of
                    // this visit, so the next click just works.
                    this.authWorkerOk = false;
                    finishUpgrade(false);
                    if (this.onStaySignedInError) this.onStaySignedInError(mode === 'connect' ? 'failed_connect' : 'failed');
                    if (this.onAuthChange) this.onAuthChange();
                }
            },

            // Turns on "stay signed in" for a device that's already
            // connected, without re-running the connect/merge prompt.
            // Must be called straight from a click.
            enableStaySignedIn() {
                return new Promise((resolve) => {
                    if (!this.canStaySignedIn()) return resolve(false);
                    this._codeMode = 'upgrade';
                    this._upgradeResolve = resolve;
                    this.codeClient.requestCode();
                });
            },

            async _workerRefresh() {
                try {
                    const res = await fetchWithTimeout(AUTH_WORKER_URL + '/token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session: this.session })
                    });
                    const data = await res.json().catch(() => ({}));
                    if (res.ok && data.access_token) {
                        this.accessToken = data.access_token;
                        return true;
                    }
                    if (res.status === 401) {
                        // Access was removed on Google's side (or the
                        // session is unknown) — forget it for good.
                        this._setSession(null);
                    }
                } catch (e) {
                    // Worker unreachable right now — keep the session and
                    // fall back to the ordinary refresh for this attempt.
                }
                return false;
            },

            init(onToken) {
                if (!window.google || !window.google.accounts || !window.google.accounts.oauth2) {
                    return false;
                }
                this._onToken = onToken;
                if (AUTH_WORKER_URL && window.google.accounts.oauth2.initCodeClient) {
                    this.codeClient = window.google.accounts.oauth2.initCodeClient({
                        client_id: GOOGLE_CLIENT_ID,
                        scope: DRIVE_SCOPE,
                        ux_mode: 'popup',
                        callback: (resp) => { this._handleCode(resp); },
                        error_callback: () => { this._handleCode(null); }
                    });
                    if (this.authWorkerOk === null) this.checkAuthWorker();
                }
                this.tokenClient = window.google.accounts.oauth2.initTokenClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: DRIVE_SCOPE,
                    callback: (resp) => {
                        if (resp && resp.access_token) {
                            this.accessToken = resp.access_token;
                            // A silent background refresh (triggered by a
                            // 401 mid-session) resolves its own promise
                            // instead of re-running the normal connect
                            // flow, which would otherwise pop the "keep
                            // local or load cloud data?" prompt again on
                            // every token renewal.
                            if (this._refreshing) {
                                this._refreshing = false;
                                const resolve = this._refreshResolve;
                                this._refreshResolve = null;
                                if (resolve) resolve(true);
                                return;
                            }
                            onToken();
                        }
                    },
                    error_callback: () => {
                        if (this._refreshing) {
                            this._refreshing = false;
                            const resolve = this._refreshResolve;
                            this._refreshResolve = null;
                            if (resolve) resolve(false);
                        }
                        // Otherwise: silent reconnect attempts fail quietly
                        // (e.g. no active Google session); the user can
                        // click the sync button to reconnect explicitly.
                    }
                });
                return true;
            },

            signIn(silent) {
                if (!silent && this.canStaySignedIn()) {
                    this._codeMode = 'connect';
                    this.codeClient.requestCode();
                    return;
                }
                if (!this.tokenClient) return;
                this.tokenClient.requestAccessToken({ prompt: silent ? '' : 'consent' });
            },

            // Requests a fresh access token in the background, without
            // showing any UI or running the normal connect flow. Used to
            // recover automatically from an expired token (Google access
            // tokens last about an hour) instead of making the person
            // manually click "reconnect" every time.
            async refreshSilently(attemptsLeft = 2) {
                if (this.session && AUTH_WORKER_URL) {
                    if (await this._workerRefresh()) return true;
                }
                return this._gisRefresh(attemptsLeft);
            },

            _gisRefresh(attemptsLeft = 2) {
                return new Promise((resolve) => {
                    if (!this.tokenClient) return resolve(false);
                    this._refreshing = true;
                    this._refreshResolve = (ok) => {
                        if (ok || attemptsLeft <= 1) { resolve(ok); return; }
                        // One retry: a silent refresh occasionally fails
                        // transiently even with a healthy Google session.
                        setTimeout(() => resolve(this._gisRefresh(attemptsLeft - 1)), 1500);
                    };
                    this.tokenClient.requestAccessToken({ prompt: '' });
                    setTimeout(() => {
                        if (this._refreshing) {
                            this._refreshing = false;
                            const r = this._refreshResolve;
                            this._refreshResolve = null;
                            if (r) r(false);
                        }
                    }, 12000);
                });
            },

            // Runs a Drive call; on an expired-token (401) error, tries
            // one silent refresh and retries the call once before giving
            // up. This is what stops "Drive keeps dropping out" from
            // requiring a manual reconnect for something as routine as
            // an hourly token expiry.
            async withAuthRetry(fn) {
                try {
                    return await fn();
                } catch (e) {
                    if (e && e.status === 401) {
                        const refreshed = await this.refreshSilently();
                        if (refreshed) return await fn();
                    }
                    throw e;
                }
            },

            signOut() {
                if (this.session && AUTH_WORKER_URL) {
                    const session = this.session;
                    fetchWithTimeout(AUTH_WORKER_URL + '/signout', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ session })
                    }).catch(() => {});
                    this._setSession(null);
                }
                if (this.accessToken && window.google?.accounts?.oauth2?.revoke) {
                    window.google.accounts.oauth2.revoke(this.accessToken, () => {});
                }
                this.accessToken = null;
                this.fileId = null;
            },

            async findFile() {
                const res = await fetch(
                    `https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=name%3D%27${DRIVE_FILE_NAME}%27&fields=files(id,modifiedTime)`,
                    { headers: { Authorization: `Bearer ${this.accessToken}` } }
                );
                if (res.status === 401) { const err = new Error('Drive lookup failed: 401'); err.status = 401; throw err; }
                if (!res.ok) throw new Error('Drive lookup failed: ' + res.status);
                const data = await res.json();
                return (data.files && data.files[0]) || null;
            },

            async downloadFile(fileId) {
                const res = await fetch(
                    `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`,
                    { headers: { Authorization: `Bearer ${this.accessToken}` } }
                );
                if (res.status === 401) { const err = new Error('Drive download failed: 401'); err.status = 401; throw err; }
                if (!res.ok) throw new Error('Drive download failed: ' + res.status);
                return res.json();
            },

            // Resumable upload — used for BOTH creating and updating the
            // data file. Google's simple/multipart upload endpoints cap
            // out around 5MB; a large collection (thousands of nuggets,
            // e.g. after a big Pearltrees import) can exceed that easily,
            // which surfaced as sync silently failing. Resumable uploads
            // support far larger payloads and cost only one extra small
            // request to set up.
            async uploadResumable(data, existingFileId) {
                const isCreate = !existingFileId;
                const initUrl = isCreate
                    ? 'https://www.googleapis.com/upload/drive/v3/files?uploadType=resumable&fields=id'
                    : `https://www.googleapis.com/upload/drive/v3/files/${existingFileId}?uploadType=resumable`;
                const initRes = await fetch(initUrl, {
                    method: isCreate ? 'POST' : 'PATCH',
                    headers: {
                        Authorization: `Bearer ${this.accessToken}`,
                        'Content-Type': 'application/json; charset=UTF-8',
                        'X-Upload-Content-Type': 'application/json'
                    },
                    body: isCreate ? JSON.stringify({ name: DRIVE_FILE_NAME, parents: ['appDataFolder'] }) : undefined
                });
                if (initRes.status === 401) { const err = new Error('Drive upload init failed: 401'); err.status = 401; throw err; }
                if (!initRes.ok) throw new Error('Drive upload init failed: ' + initRes.status);
                const sessionUri = initRes.headers.get('Location');
                if (!sessionUri) throw new Error('Drive upload session URI missing');

                const uploadRes = await fetch(sessionUri, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (uploadRes.status === 401) { const err = new Error('Drive upload failed: 401'); err.status = 401; throw err; }
                if (!uploadRes.ok) throw new Error('Drive upload failed: ' + uploadRes.status);
                const json = await uploadRes.json().catch(() => ({}));
                this.fileId = json.id || existingFileId;
                return json;
            },

            async save(data) {
                if (!this.accessToken) return;
                return this.withAuthRetry(async () => {
                    if (!this.fileId) {
                        const existing = await this.findFile();
                        if (existing) {
                            this.fileId = existing.id;
                        } else {
                            await this.uploadResumable(data, null);
                            return;
                        }
                    }
                    await this.uploadResumable(data, this.fileId);
                });
            },

            async load() {
                if (!this.accessToken) return null;
                return this.withAuthRetry(async () => {
                    const existing = await this.findFile();
                    if (!existing) return null;
                    this.fileId = existing.id;
                    return this.downloadFile(existing.id);
                });
            },

            // Drive keeps revision history for files it manages,
            // including the hidden appDataFolder file this app writes
            // to — every save creates a new revision rather than
            // overwriting in place. This is the recovery path for "the
            // data got overwritten with something wrong": list past
            // revisions (each save from earlier today is one), so a
            // known-good one can be restored.
            async listRevisions() {
                return this.withAuthRetry(async () => {
                    if (!this.fileId) {
                        const existing = await this.findFile();
                        if (!existing) return [];
                        this.fileId = existing.id;
                    }
                    const res = await fetch(
                        `https://www.googleapis.com/drive/v3/files/${this.fileId}/revisions?fields=revisions(id,modifiedTime,size)`,
                        { headers: { Authorization: `Bearer ${this.accessToken}` } }
                    );
                    if (res.status === 401) { const err = new Error('Drive revisions list failed: 401'); err.status = 401; throw err; }
                    if (!res.ok) throw new Error('Drive revisions list failed: ' + res.status);
                    const data = await res.json();
                    return (data.revisions || []).sort((a, b) => new Date(b.modifiedTime) - new Date(a.modifiedTime));
                });
            },

            async getRevisionContent(revisionId) {
                return this.withAuthRetry(async () => {
                    const res = await fetch(
                        `https://www.googleapis.com/drive/v3/files/${this.fileId}/revisions/${revisionId}?alt=media`,
                        { headers: { Authorization: `Bearer ${this.accessToken}` } }
                    );
                    if (res.status === 401) { const err = new Error('Drive revision fetch failed: 401'); err.status = 401; throw err; }
                    if (!res.ok) throw new Error('Drive revision fetch failed: ' + res.status);
                    return res.json();
                });
            }
        };

        // RDF Export/Import utilities
        const RDFUtil = {
            exportToRDF: (folders, nuggets) => {
                let rdf = `<?xml version="1.0" encoding="UTF-8"?>
<rdf:RDF xmlns:rdf="http://www.w3.org/1999/02/22-rdf-syntax-ns#"
         xmlns:dc="http://purl.org/dc/elements/1.1/"
         xmlns:bookmark="http://www.w3.org/2002/01/bookmark#">
`;
                
                const processFolders = (folderList, parentId = null) => {
                    folderList.forEach(folder => {
                        if (folder.parentId === parentId) {
                            rdf += `  <bookmark:Folder rdf:about="#folder-${folder.id}">
    <dc:title>${escapeXml(folder.name)}</dc:title>
    <dc:identifier>${folder.id}</dc:identifier>
`;
                            if (parentId) {
                                rdf += `    <bookmark:parentFolder rdf:resource="#folder-${parentId}"/>\n`;
                            }
                            
                            const folderNuggets = nuggets.filter(n => n.folderId === folder.id);
                            folderNuggets.forEach(nugget => {
                                rdf += `    <bookmark:hasBookmark rdf:resource="#bookmark-${nugget.id}"/>\n`;
                            });
                            
                            rdf += `  </bookmark:Folder>\n`;
                            
                            processFolders(folderList, folder.id);
                        }
                    });
                };
                
                processFolders(folders);
                
                nuggets.forEach(nugget => {
                    rdf += `  <bookmark:Bookmark rdf:about="#bookmark-${nugget.id}">
    <dc:title>${escapeXml(nugget.title)}</dc:title>
    <bookmark:recalls>${escapeXml(nugget.url)}</bookmark:recalls>
    <dc:description>${escapeXml(nugget.description || '')}</dc:description>
    <dc:identifier>${nugget.id}</dc:identifier>
    <dc:date>${nugget.created}</dc:date>
`;
                    if (nugget.thumbnail) {
                        rdf += `    <bookmark:thumbnail>${escapeXml(nugget.thumbnail)}</bookmark:thumbnail>\n`;
                    }
                    rdf += `  </bookmark:Bookmark>\n`;
                });
                
                rdf += `</rdf:RDF>`;
                return rdf;
            },
            
            importFromRDF: (rdfContent) => {
                const parser = new DOMParser();
                const xmlDoc = parser.parseFromString(rdfContent, 'text/xml');

                if (xmlDoc.querySelector('parsererror')) {
                    throw new Error('That file is not valid XML.');
                }

                // Try our own export vocabulary first (bookmark:Folder /
                // bookmark:Bookmark). If nothing matches, this isn't a
                // Nuggetz file — fall back to a tolerant, vocabulary-
                // agnostic reader that works with other tools' RDF/XML
                // exports (e.g. Pearltrees), which use their own tag names.
                const native = RDFUtil.importNuggetzFormat(xmlDoc);
                if (native.folders.length || native.nuggets.length) {
                    return { ...native, method: 'native' };
                }
                return { ...RDFUtil.importGenericRDF(xmlDoc), method: 'generic' };
            },

            importNuggetzFormat: (xmlDoc) => {
                const folders = [];
                const nuggets = [];
                
                const folderElements = xmlDoc.getElementsByTagName('bookmark:Folder');
                Array.from(folderElements).forEach(folderEl => {
                    const id = folderEl.querySelector('dc\\:identifier, identifier')?.textContent;
                    const name = folderEl.querySelector('dc\\:title, title')?.textContent;
                    const parentEl = folderEl.querySelector('bookmark\\:parentFolder, parentFolder');
                    const parentId = parentEl ? parentEl.getAttribute('rdf:resource')?.replace('#folder-', '') : null;
                    
                    if (id && name) {
                        folders.push({ id, name, parentId, children: [] });
                    }
                });
                
                const bookmarkElements = xmlDoc.getElementsByTagName('bookmark:Bookmark');
                Array.from(bookmarkElements).forEach(bookmarkEl => {
                    const id = bookmarkEl.querySelector('dc\\:identifier, identifier')?.textContent;
                    const title = bookmarkEl.querySelector('dc\\:title, title')?.textContent;
                    const url = bookmarkEl.querySelector('bookmark\\:recalls, recalls')?.textContent;
                    const description = bookmarkEl.querySelector('dc\\:description, description')?.textContent || '';
                    const thumbnail = bookmarkEl.querySelector('bookmark\\:thumbnail, thumbnail')?.textContent || null;
                    const created = bookmarkEl.querySelector('dc\\:date, date')?.textContent || new Date().toISOString();
                    
                    if (id && title && url) {
                        nuggets.push({ id, title, url, description, thumbnail, created, folderId: null });
                    }
                });
                
                const aboutToId = (about) => about?.replace('#folder-', '').replace('#bookmark-', '');
                
                Array.from(folderElements).forEach((folderEl, idx) => {
                    const hasBookmarks = folderEl.querySelectorAll('bookmark\\:hasBookmark, hasBookmark');
                    Array.from(hasBookmarks).forEach(bookmark => {
                        const bookmarkId = aboutToId(bookmark.getAttribute('rdf:resource'));
                        const nugget = nuggets.find(n => n.id === bookmarkId);
                        if (nugget) {
                            nugget.folderId = folders[idx].id;
                        }
                    });
                });
                
                return { folders, nuggets };
            },

            // Best-effort reader for RDF/XML exports from other tools
            // (Pearltrees and similar "pearl"/"tree" style bookmarking
            // apps) whose exact vocabulary we can't hardcode reliably.
            // It looks for structural clues rather than fixed tag names:
            // any element with rdf:about (or whose own tag name suggests
            // a tree/collection or a pearl/bookmark), pulls a title/url/
            // description from common child-element names, and infers
            // parent/child nesting from rdf:resource references or plain
            // XML nesting. Everything lands under one "Imported from
            // Pearltrees" folder so it's easy to review and re-file
            // anything the heuristics get wrong.
            importGenericRDF: (xmlDoc) => {
                const allEls = Array.from(xmlDoc.getElementsByTagName('*'));
                const localName = (el) => (el.localName || el.tagName.split(':').pop() || '').toLowerCase();
                const getAttr = (el, name) => {
                    for (const attr of Array.from(el.attributes || [])) {
                        if (attr.localName === name || attr.name.split(':').pop() === name) return attr.value;
                    }
                    return null;
                };

                const nodeEls = allEls.filter(el => {
                    const about = getAttr(el, 'about');
                    const rawName = el.localName || el.tagName.split(':').pop() || '';
                    const ln = rawName.toLowerCase();
                    // Exclude Pearltrees' "RootPearl" — every tree has one
                    // representing the tree itself, with no real external
                    // URL; importing it would create a bogus duplicate
                    // bookmark for every folder.
                    // Exclude Pearltrees' "RootPearl" (every tree's self-
                    // reference, no real external URL) and "RefPearl"
                    // (an internal shortcut to another tree in the same
                    // account — the real content it points to already
                    // appears as its own genuine Tree/PagePearl elsewhere
                    // in a full account export, so importing the shortcut
                    // too would just create a confusing duplicate that
                    // points at Pearltrees itself rather than a real site).
                    if (/rootpearl/.test(ln) || /refpearl/.test(ln)) return false;
                    // An element carrying rdf:about is unambiguously a
                    // real RDF node/subject.
                    if (about) return true;
                    // Without rdf:about, only treat it as a node if it
                    // looks like an RDF class reference — by convention
                    // classes are capitalized (Tree, PagePearl) while
                    // properties are lowercase-initial (treeId,
                    // parentTree, inTreeSinceDate). Without this check,
                    // plain data properties that merely contain "tree" or
                    // "pearl" as a substring get misread as folder nodes.
                    return /^[A-Z]/.test(rawName) && /tree|collection|pearl|bookmark/.test(ln);
                });

                const nodes = new Map(); // id -> { el, isFolder, title, url, description }
                const elementToNodeId = new Map(); // DOM element -> node id, for O(1) ancestor lookups
                nodeEls.forEach((el, idx) => {
                    const id = getAttr(el, 'about') || ('__node_' + idx);
                    if (nodes.has(id)) return;
                    const ln = localName(el);
                    const about = getAttr(el, 'about') || '';
                    const isFolder = /tree|collection|folder/.test(ln) && !/pearl|bookmark/.test(ln);

                    const findChildText = (names) => {
                        for (const child of Array.from(el.children || [])) {
                            if (names.includes(localName(child))) {
                                const txt = child.textContent && child.textContent.trim();
                                if (txt) return txt;
                                const res = getAttr(child, 'resource');
                                if (res) return res;
                            }
                        }
                        return '';
                    };

                    let url = '';
                    if (!isFolder) {
                        // Prefer an explicit recalls/url/link child — the
                        // element's own rdf:about is often the tool's
                        // internal page for that pearl/bookmark, not the
                        // actual site it points to.
                        const explicit = findChildText(['recalls', 'url', 'link', 'seealso', 'source', 'identifier']);
                        url = explicit || (/^https?:\/\//i.test(about) ? about : '');
                    }
                    const title = findChildText(['title', 'label', 'name']) || (isFolder ? 'Untitled Tree' : '');
                    const description = findChildText(['description', 'comment', 'note', 'abstract']);

                    nodes.set(id, { el, isFolder, title, url, description });
                    elementToNodeId.set(el, id);
                });

                // Containment: a single child -> parent map (a node has
                // exactly one parent), built by three passes since
                // different tools model "this tree contains this pearl"
                // differently. First pass to claim a given child wins.
                // Using a plain Map here (rather than scanning a
                // parent->children structure per lookup) keeps every
                // lookup below O(1) instead of O(number of folders) —
                // at tens of thousands of nodes that difference is the
                // gap between importing instantly and freezing the tab.
                const childToParent = new Map(); // childId -> parentId
                const addEdge = (parentId, childId) => {
                    if (!parentId || !childId || parentId === childId) return;
                    if (!childToParent.has(childId)) childToParent.set(childId, parentId);
                };

                // Pass 0 — Pearltrees' actual pattern, confirmed from its
                // own export header: each pearl/tree declares ITS OWN
                // parent via a "parentTree"-style property, the reverse
                // direction from a tree listing its children. Any child
                // element whose local name contains "parent" and carries
                // an rdf:resource pointing at a known node is read as
                // "that node is my parent", not "I contain that node".
                nodes.forEach((node, id) => {
                    Array.from(node.el.children || []).forEach(child => {
                        if (/parent/i.test(localName(child))) {
                            const res = getAttr(child, 'resource');
                            if (res && nodes.has(res)) addEdge(res, id);
                        }
                    });
                });

                // Pass 1 — explicit references on a node's DIRECT children
                // (covers exports where a Tree instead lists its children
                // via a property such as rdf:resource). Skips anything
                // already read as a parent-pointer in Pass 0.
                nodes.forEach((node, id) => {
                    Array.from(node.el.children || []).forEach(child => {
                        if (/parent/i.test(localName(child))) return;
                        const res = getAttr(child, 'resource');
                        const childAbout = getAttr(child, 'about');
                        if (res && nodes.has(res)) {
                            addEdge(id, res);
                        } else if (childAbout && nodes.has(childAbout) && childAbout !== id) {
                            addEdge(id, childAbout);
                        }
                    });
                });

                // Pass 2 — for anything still without a parent, use plain
                // XML nesting: walk up to the nearest ancestor element
                // that is itself a recognized node (covers exports where
                // pearls are physically nested inside their tree).
                nodes.forEach((node, id) => {
                    if (childToParent.has(id)) return;
                    let ancestor = node.el.parentNode;
                    while (ancestor && ancestor.nodeType === 1) {
                        const ancestorId = elementToNodeId.get(ancestor);
                        if (ancestorId) {
                            addEdge(ancestorId, id);
                            break;
                        }
                        ancestor = ancestor.parentNode;
                    }
                });

                const parentFolderOf = (id) => {
                    const pid = childToParent.get(id);
                    return (pid && nodes.get(pid)?.isFolder) ? pid : null;
                };

                const wrapperId = 'import-' + Date.now();
                const folders = [{ id: wrapperId, name: 'Imported from Pearltrees', parentId: 'root', children: [] }];
                const folderIdMap = new Map();

                nodes.forEach((node, id) => {
                    if (node.isFolder) {
                        folderIdMap.set(id, 'pt-folder-' + Math.random().toString(36).slice(2, 10));
                    }
                });

                nodes.forEach((node, id) => {
                    if (!node.isFolder) return;
                    const parentId = parentFolderOf(id);
                    folders.push({
                        id: folderIdMap.get(id),
                        name: node.title || 'Untitled Tree',
                        parentId: parentId ? folderIdMap.get(parentId) : wrapperId,
                        children: []
                    });
                });

                const nuggets = [];
                nodes.forEach((node, id) => {
                    if (node.isFolder || !node.url) return;
                    const parentId = parentFolderOf(id);
                    nuggets.push({
                        id: 'pt-nugget-' + Math.random().toString(36).slice(2, 10),
                        title: node.title || node.url,
                        url: node.url,
                        description: node.description || '',
                        thumbnail: null,
                        created: new Date().toISOString(),
                        folderId: parentId ? folderIdMap.get(parentId) : wrapperId
                    });
                });

                return { folders, nuggets };
            }
        };
        

        // Imports a Pearltrees "Netscape bookmarks" HTML export. Nesting comes
        // straight from the nested <DL> lists, so the folder tree is exact.
        const NetscapeUtil = {
            isNetscape(text) {
                return /<!DOCTYPE\s+NETSCAPE-Bookmark-file/i.test(text.slice(0, 600));
            },
            decode(str) {
                return str.replace(/&(#x[0-9a-f]+|#[0-9]+|amp|lt|gt|quot|apos|nbsp);/gi, (m, e) => {
                    const l = e.toLowerCase();
                    if (l === 'amp') return '&';
                    if (l === 'lt') return '<';
                    if (l === 'gt') return '>';
                    if (l === 'quot') return '"';
                    if (l === 'apos') return "'";
                    if (l === 'nbsp') return ' ';
                    try {
                        const code = l[1] === 'x' ? parseInt(l.slice(2), 16) : parseInt(l.slice(1), 10);
                        return String.fromCodePoint(code);
                    } catch (err) { return m; }
                }).trim();
            },
            parse(text) {
                const stamp = Date.now().toString(36);
                const wrapperId = 'nsimport-' + stamp;
                const folders = [{
                    id: wrapperId,
                    name: 'Pearltrees import ' + new Date().toISOString().slice(0, 10),
                    parentId: 'root',
                    children: []
                }];
                const nuggets = [];
                const stack = [wrapperId];
                let pending = null;
                const tok = /<DT><H3[^>]*>([\s\S]*?)<\/H3>|<A\s([^>]*)>([\s\S]*?)<\/A>|<DL>|<\/DL>/gi;
                let m;
                while ((m = tok.exec(text)) !== null) {
                    const t = m[0];
                    if (m[1] !== undefined) {
                        const id = 'nsf-' + stamp + '-' + folders.length;
                        folders.push({
                            id,
                            name: NetscapeUtil.decode(m[1]) || 'Untitled',
                            parentId: stack[stack.length - 1],
                            children: []
                        });
                        pending = id;
                    } else if (m[2] !== undefined) {
                        const hm = /HREF="([^"]*)"/i.exec(m[2]);
                        if (!hm) continue;
                        const url = NetscapeUtil.decode(hm[1]);
                        const dm = /ADD_DATE="(\d+)"/i.exec(m[2]);
                        let created = new Date().toISOString();
                        if (dm) { try { created = new Date(parseInt(dm[1], 10) * 1000).toISOString(); } catch (err) {} }
                        nuggets.push({
                            id: 'nsn-' + stamp + '-' + nuggets.length,
                            title: NetscapeUtil.decode(m[3]) || url,
                            url,
                            description: '',
                            thumbnail: null,
                            created,
                            folderId: stack[stack.length - 1]
                        });
                    } else if (t.toUpperCase() === '<DL>') {
                        if (pending) { stack.push(pending); pending = null; }
                        else stack.push(stack[stack.length - 1]);
                    } else {
                        if (stack.length > 1) stack.pop();
                    }
                }
                return { folders, nuggets, method: 'netscape' };
            }
        };

        // X/Twitter home, profile and list links (not a single tweet) only
        // ever return X's generic logo page, so they are never previewed.
        const isNonStatusXUrl = (u) => {
            try {
                const x = new URL(u);
                return /(^|\.)(twitter|x)\.com$/i.test(x.hostname) && !/^\/[^/]+\/status(?:es)?\/\d+/.test(x.pathname);
            } catch (e) { return false; }
        };

        // Prevents nesting a folder inside its own descendant
        const isDescendantFolder = (folders, folderId, potentialDescendantId) => {
            let current = folders.find(f => f.id === potentialDescendantId);
            while (current) {
                if (current.parentId === folderId) return true;
                current = folders.find(f => f.id === current.parentId);
            }
            return false;
        };

        // Auto-layout for the Tree (canvas) view: positions every folder/nugget
        // beneath rootId as a horizontal tree, spacing leaves vertically.
        const computeTreeLayout = (rootId, folders, nuggets) => {
            const positions = {};
            const NODE_H = 64;
            const LEVEL_W = 200;
            let cursorY = 0;

            const walk = (id, depth) => {
                const childFolders = folders.filter(f => f.parentId === id);
                const childNuggets = nuggets.filter(n => n.folderId === id);
                const kids = [
                    ...childFolders.map(f => ({ id: f.id, isFolder: true })),
                    ...childNuggets.map(n => ({ id: n.id, isFolder: false }))
                ];

                if (kids.length === 0) {
                    const y = cursorY;
                    cursorY += NODE_H;
                    positions[id] = { x: depth * LEVEL_W, y };
                    return y;
                }

                const childYs = kids.map(k => walk(k.id, depth + 1));
                const y = (Math.min(...childYs) + Math.max(...childYs)) / 2;
                positions[id] = { x: depth * LEVEL_W, y };
                return y;
            };

            walk(rootId, 0);
            return positions;
        };

        const escapeXml = (str) => {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&apos;');
        };

        // Pulls the first http(s) URL out of shared text (used by the
        // Web Share Target handler, since apps like X/LinkedIn often
        // share a "text" blob with the link embedded rather than a
        // separate "url" param).
        const extractUrlFromText = (text) => {
            if (!text) return '';
            const match = text.match(/https?:\/\/\S+/);
            return match ? match[0] : '';
        };
        
        // SVG Icons
        const Icons = {
            Folder: () => (
                <svg className="folder-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z" />
                </svg>
            ),
            ChevronRight: ({ className }) => (
                <svg className={className} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M9 5l7 7-7 7" />
                </svg>
            ),
            Plus: () => (
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M12 4v16m8-8H4" />
                </svg>
            ),
            Search: () => (
                <svg className="search-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                </svg>
            ),
            Edit: () => (
                <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
