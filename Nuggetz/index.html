        // ---- Display helpers (1.6.31) ----
        // X post numbers encode when the post was made, so every X nugget
        // (old or new) can show the date of the message itself.
        const xPostDate = (url) => {
            try {
                const m = String(url || '').match(/^https?:\/\/(?:www\.|mobile\.)?(?:twitter|x)\.com\/[^/]+\/status(?:es)?\/(\d{15,25})/i);
                if (!m) return null;
                const ms = Number((BigInt(m[1]) >> 22n) + 1288834974657n);
                if (ms < Date.UTC(2010, 10, 4) || ms > Date.now() + 86400000) return null;
                return new Date(ms);
            } catch (e) { return null; }
        };
        const nuggetDate = (n) => xPostDate(n.url) || new Date(n.created);
        // Cards show what the post SAYS, not who sent it:
        // 'Helen Day on X: "The modern world…"' -> 'The modern world…'.
        // The full title (with the sender) stays in Edit and the preview.
        const cardTitle = (title) => {
            const t = String(title || '');
            const m = t.match(/^(.{1,80}?) on (?:X|Twitter)\s*:\s*[\u201c"](.+?)[\u201d"]?\s*(?:\/\s*(?:X|Twitter))?\s*$/s);
            return m && m[2].trim() ? m[2].trim() : t;
        };

        // ---- Link previews for new nuggets (1.6.29) ----
        // The save form now asks the thumbnail Worker (the same
        // "?mode=preview" the Previews button uses, which also knows how
        // to read X posts) for the real title, description and picture.
        // Cached per link, so the form and the after-save top-up share
        // one request.
        const linkPreviewCache = new Map();
        const cleanSharedTitle = (t) => String(t || '').replace(/^\(\d+\+?\)\s*/, '').trim();
        const previewUrlFor = (url) => {
            try {
                const u = new URL(url);
                if (/(^|\.)(twitter|x)\.com$/i.test(u.hostname)) {
                    u.searchParams.delete('s'); u.searchParams.delete('t');
                }
                return u.toString();
            } catch (e) { return url; }
        };
        const fallbackTitleFor = (url) => {
            try {
                const u = new URL(url);
                const host = u.hostname.replace(/^(www|mobile|m)\./, '');
                const x = u.pathname.match(/^\/([^/]+)\/status(?:es)?\/\d+/);
                if (/^(twitter|x)\.com$/i.test(host) && x) return `@${x[1]} on X`;
                return host;
            } catch (e) { return url; }
        };
        // X posts the thumbnail Worker can't read: ask the nuggetz-auth
        // Worker's /x lookup (FxTwitter), which returns the post's text
        // and its photo / video still / quoted image / author picture.
        const isXStatusUrl = (url) => { try { const u = new URL(url); return /(^|\.)(twitter|x)\.com$/i.test(u.hostname) && /\/status(?:es)?\/\d{5,}/.test(u.pathname); } catch (e) { return false; } };
        const xLookup = async (url) => {
            if (!AUTH_WORKER_URL || !isXStatusUrl(url)) return null;
            try {
                const res = await fetchWithTimeout(`${AUTH_WORKER_URL}/x?url=${encodeURIComponent(url)}`, {}, 15000);
                if (!res.ok) return null;
                const b = await res.json();
                return { title: b.title || '', description: b.description || '', thumbnail: b.thumbnail || '' };
            } catch (e) { return null; }
        };
        // A title that just names the site isn't worth keeping over the post's own.
        const isWeakXTitle = (t) => !t || /^(x|twitter|x\.com|twitter\.com|.* on x|.* \/ x)$/i.test(t.trim()) || /^(post|tweet)$/i.test(t.trim());
        const withXFallback = async (url, found) => {
            if (!isXStatusUrl(url) || (found && found.thumbnail && !isWeakXTitle(found.title))) return found;
            const x = await xLookup(url);
            if (!x) return found;
            return {
                title: found && !isWeakXTitle(found.title) ? found.title : (x.title || (found && found.title) || ''),
                description: (found && found.description) || x.description,
                thumbnail: (found && found.thumbnail) || x.thumbnail
            };
        };
        const fetchLinkPreview = (url) => {
            if (!url || !/^https?:\/\//i.test(url) || !THUMBNAIL_WORKER_URL) return Promise.resolve(null);
            const key = previewUrlFor(url);
            if (linkPreviewCache.has(key)) return linkPreviewCache.get(key);
            const p = (async () => {
                for (let attempt = 1; attempt <= 2; attempt++) {
                    try {
                        const res = await fetchWithTimeout(`${THUMBNAIL_WORKER_URL}?mode=preview&url=${encodeURIComponent(key)}`, {}, 15000);
                        if (res.ok) {
                            const b = await res.json();
                            return withXFallback(key, { title: cleanSharedTitle(b.title), description: b.description || '', thumbnail: b.thumbnail || '' });
                        }
                        if (res.status < 500 && res.status !== 429) return withXFallback(key, null);
                    } catch (e) { /* network trouble: try once more */ }
                    await new Promise(r => setTimeout(r, 1500));
                }
                return withXFallback(key, null);
            })();
            linkPreviewCache.set(key, p);
            p.then(r => { if (!r) linkPreviewCache.delete(key); });
            return p;
        };

        // ---- Folder picker for saving nuggets (1.6.23) ----
        // Replaces a drop-down that listed all ~35,000 folders (and took
        // ages to build every time the save form opened, e.g. from the
        // share menu). Shows the chosen folder with its path, one-tap
        // recent folders, and a type-to-search box.
        const RECENT_FOLDERS_KEY = 'nuggetz_recent_folders';
        const loadRecentFolders = () => { try { return JSON.parse(localStorage.getItem(RECENT_FOLDERS_KEY)) || []; } catch (e) { return []; } };
        const rememberRecentFolder = (id) => {
            if (!id) return;
            const list = [id, ...loadRecentFolders().filter(x => x !== id)].slice(0, 8);
            try { localStorage.setItem(RECENT_FOLDERS_KEY, JSON.stringify(list)); } catch (e) {}
        };
        const folderPathNames = (id, byId) => {
            const names = [];
            let f = byId.get(id), guard = 0;
            while (f && guard++ < 100) { names.unshift(f.name); f = byId.get(f.parentId); }
            return names;
        };
        const shortPath = (names) => {
            const inner = names.slice(1, -1); // drop "All Nuggetz" and the folder itself
            if (inner.length === 0) return names.length > 1 ? 'All Nuggetz' : '';
            return (inner.length > 3 ? '\u2026 \u203a ' : '') + inner.slice(-3).join(' \u203a ');
        };

        function FolderPicker({ folders, value, onChange, onCreateFolder }) {
            const byId = useMemo(() => new Map(folders.map(f => [f.id, f])), [folders]);
            const lowerNames = useMemo(() => folders.map(f => [f, (f.name || '').toLowerCase()]), [folders]);
            const [query, setQuery] = useState('');
            // "New subfolder" mode: the box names a new folder inside the
            // chosen one, instead of searching.
            const [naming, setNaming] = useState(false);
            const recents = useMemo(() => loadRecentFolders().filter(id => byId.has(id)), [byId]);

            // Where a folder lives: the Pearltrees import is ranked first,
            // then everything else, then old-library holding folders.
            const areaRank = (id) => {
                let f = byId.get(id), guard = 0;
                while (f && guard++ < 100) {
                    if (typeof f.id === 'string' && f.id.startsWith('oldlib-')) return 2;
                    if (isImportWrapper(f)) return 0;
                    f = byId.get(f.parentId);
                }
                return 1;
            };

            const results = useMemo(() => {
                const q = query.trim().toLowerCase();
                if (naming || q.length < 2) return [];
                const hits = [];
                for (const [f, name] of lowerNames) {
                    if (f.id === 'root') continue;
                    const i = name.indexOf(q);
                    if (i < 0) continue;
                    const matchRank = name === q ? 0 : i === 0 ? 1 : /[\s\-_/(]/.test(name[i - 1]) ? 2 : 3;
                    hits.push({ f, matchRank });
                    if (hits.length > 2000) break;
                }
                hits.forEach(h => { h.area = areaRank(h.f.id); });
                hits.sort((a, b) => a.area - b.area || a.matchRank - b.matchRank || NAME_COLLATOR.compare(a.f.name, b.f.name));
                return hits.slice(0, 40);
            }, [query, lowerNames, naming]);

            const chosen = byId.get(value);
            const choose = (id) => { onChange(id); setQuery(''); setNaming(false); };
            const typed = query.trim();
            const exactExists = typed.length > 0 && results.some(r => r.f.name.trim().toLowerCase() === typed.toLowerCase());
            const create = (parentId) => {
                if (!onCreateFolder || !typed) return;
                const f = onCreateFolder(typed, parentId);
                if (f) choose(f.id);
            };
            const chosenName = chosen ? chosen.name : 'All Nuggetz';

            return (
                <div className="folder-picker">
                    <div className="folder-picker-chosen">
                        <Icons.Folder />
                        <div className="folder-picker-text">
                            <div className="folder-picker-name">{chosen ? chosen.name : 'All Nuggetz'}</div>
                            {chosen && shortPath(folderPathNames(chosen.id, byId)) && (
                                <div className="folder-picker-path">in {shortPath(folderPathNames(chosen.id, byId))}</div>
                            )}
                        </div>
                        {onCreateFolder && !naming && (
                            <button type="button" className="folder-picker-newsub" onClick={() => { setNaming(true); setQuery(''); }}
                                title={`Make a new folder inside \u201c${chosenName}\u201d`}>
                                + New subfolder here
                            </button>
                        )}
                    </div>
                    {!naming && recents.filter(id => id !== value).length > 0 && (
                        <select className="form-input folder-recent-select" value="" onChange={(e) => { if (e.target.value) choose(e.target.value); }}>
                            <option value="">Recent folders…</option>
                            {recents.filter(id => id !== value).map(id => {
                                const where = shortPath(folderPathNames(id, byId));
                                return <option key={id} value={id}>{byId.get(id).name}{where ? ` \u2014 in ${where}` : ''}</option>;
                            })}
                        </select>
                    )}
                    <input
                        type={naming ? 'text' : 'search'}
                        className={`form-input ${naming ? 'folder-picker-naming' : ''}`}
                        placeholder={naming ? `Name of the new folder inside \u201c${chosenName}\u201d` : 'Type to find a folder, or to name a new one\u2026'}
                        value={query}
                        autoFocus={naming}
                        key={naming ? 'naming' : 'search'}
                        onChange={(e) => setQuery(e.target.value)}
                        onKeyDown={(e) => {
                            if (e.key === 'Escape' && naming) { e.preventDefault(); setNaming(false); setQuery(''); }
                            if (e.key !== 'Enter') return;
                            e.preventDefault();
                            if (naming) create(value || 'root');
                            else if (results[0]) choose(results[0].f.id);
                        }}
                    />
                    {naming && (
                        <div className="folder-picker-create">
                            <button type="button" className="folder-result folder-create" disabled={!typed} onClick={() => create(value || 'root')}>
                                <span className="folder-result-name">{typed ? `+ Create \u201c${typed}\u201d` : 'Type a name above'}</span>
                                <span className="folder-result-path">new subfolder inside “{chosenName}”</span>
                            </button>
                            <button type="button" className="tidy-link" onClick={() => { setNaming(false); setQuery(''); }}>Cancel — back to choosing a folder</button>
                        </div>
                    )}
                    {!naming && typed.length >= 1 && onCreateFolder && !exactExists && (
                        <div className="folder-picker-create">
                            <button type="button" className="folder-result folder-create" onClick={() => create(value || 'root')}>
                                <span className="folder-result-name">+ Create “{typed}”</span>
                                <span className="folder-result-path">new folder inside “{chosenName}”</span>
                            </button>
                            {value && value !== 'root' && (
                                <button type="button" className="folder-result folder-create" onClick={() => create('root')}>
                                    <span className="folder-result-name">+ Create “{typed}” at the top level</span>
                                    <span className="folder-result-path">inside All Nuggetz</span>
                                </button>
                            )}
                        </div>
                    )}
                    {query.trim().length >= 2 && (
                        <div className="folder-picker-results">
                            {results.length === 0 && <div className="cover-note">No existing folders match \u201c{query.trim()}\u201d.</div>}
                            {results.map(({ f, area }) => (
                                <button type="button" key={f.id} className="folder-result" onClick={() => choose(f.id)}>
                                    <span className="folder-result-name">{f.name}</span>
                                    <span className="folder-result-path">{shortPath(folderPathNames(f.id, byId))}{area === 2 ? ' (old library)' : ''}</span>
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        function NuggetModal({ nugget, initialData, folders, currentFolder, onClose, onSave, onCreateFolder, findExisting }) {
            const [formData, setFormData] = useState({
                title: nugget?.title || cleanSharedTitle(initialData?.title) || '',
                url: nugget?.url || initialData?.url || '',
                description: nugget?.description || initialData?.description || '',
                thumbnail: nugget?.thumbnail || '',
                folderId: nugget?.folderId || initialData?.folderId || currentFolder || 'root'
            });
            
            // 'idle' | 'loading' | 'found' | 'none'
            const [previewState, setPreviewState] = useState('idle');
            const lastPreviewUrl = useRef('');
            const isPlaceholderThumb = (t) => !t || t.startsWith(FAVICON_PREFIX);
            const runPreview = (url) => {
                if (nugget) return; // editing: leave it alone (use Previews for that)
                if (!/^https?:\/\/[^\s]+\.[^\s]+/i.test(url || '') || url === lastPreviewUrl.current) return;
                lastPreviewUrl.current = url;
                setPreviewState('loading');
                fetchLinkPreview(url).then(p => {
                    if (lastPreviewUrl.current !== url) return; // link changed meanwhile
                    if (!p || (!p.title && !p.thumbnail)) { setPreviewState('none'); return; }
                    setPreviewState('found');
                    setFormData(prev => ({
                        ...prev,
                        title: prev.title && prev.title !== fallbackTitleFor(url) ? prev.title : (p.title || prev.title),
                        description: prev.description || p.description,
                        thumbnail: isPlaceholderThumb(prev.thumbnail) ? (p.thumbnail || prev.thumbnail) : prev.thumbnail
                    }));
                });
            };
            // A shared or pre-filled link is looked up straight away.
            useEffect(() => { if (formData.url) runPreview(formData.url); }, []);
            // Pasted/typed links: look up once they stop changing.
            useEffect(() => {
                const t = setTimeout(() => runPreview(formData.url), 700);
                return () => clearTimeout(t);
            }, [formData.url]);

            // Link field goes first only when starting from nothing; for a
            // shared link or an edit it's already known, so it goes last.
            const [linkFirst] = useState(() => !nugget && !(initialData && initialData.url));

            // Already saved? Offer to update that nugget (keeping its date
            // and folder) instead of making a second copy.
            const [existing, setExisting] = useState(null);
            const [updateExisting, setUpdateExisting] = useState(true);
            const defaultFolderRef = useRef(formData.folderId);
            useEffect(() => {
                if (nugget || !findExisting) return;
                const t = setTimeout(() => {
                    const found = /^https?:\/\//i.test(formData.url || '') ? (findExisting(formData.url) || [])[0] : null;
                    setExisting(prev => (prev && found && prev.id === found.id) ? prev : (found || null));
                }, 400);
                return () => clearTimeout(t);
            }, [formData.url]);
            useEffect(() => {
                if (!existing) return;
                if (updateExisting) {
                    setFormData(prev => ({
                        ...prev,
                        folderId: existing.folderId,
                        title: existing.title && !isWeakXTitle(existing.title) ? existing.title : prev.title,
                        description: existing.description || prev.description,
                        thumbnail: isPlaceholderThumb(existing.thumbnail) ? prev.thumbnail : existing.thumbnail
                    }));
                } else {
                    setFormData(prev => ({ ...prev, folderId: defaultFolderRef.current }));
                }
            }, [existing, updateExisting]);

            const handleSubmit = (e) => {
                e.preventDefault();
                if (!formData.url) return;
                const autoTitle = !formData.title.trim();
                onSave({
                    ...formData,
                    title: autoTitle ? fallbackTitleFor(formData.url) : formData.title,
                    // Tells the app to top up title/picture after saving if
                    // the lookup hasn't finished yet.
                    _autoTitle: autoTitle,
                    _previewPending: previewState === 'loading' || previewState === 'idle',
                    _updateExistingId: existing && updateExisting ? existing.id : null
                });
            };
            
            // Fills in a sensible default title and, since there's no
            // backend to fetch a real page thumbnail from, a per-site
            // favicon as a visually-distinctive placeholder (via Google's
            // public favicon service — a plain <img> load, no CORS
            // issues, no API key). Never overwrites something the person
            // already typed.
            const fetchMetadata = async () => {
                if (!formData.url) return;
                try {
                    const url = new URL(formData.url);
                    setFormData(prev => ({
                        ...prev,
                        title: prev.title || url.hostname,
                        thumbnail: prev.thumbnail || `https://www.google.com/s2/favicons?sz=128&domain=${url.hostname}`
                    }));
                } catch (e) {
                    console.error('Invalid URL');
                }
            };
            

            const linkField = (
                <div className="form-group">
                    <label className="form-label">Link</label>
                    <input
                        type="url"
                        className="form-input"
                        value={formData.url}
                        onChange={(e) => setFormData({ ...formData, url: e.target.value })}
                        required
                        placeholder="https://example.com"
                    />
                </div>
            );
            const existingFolderName = existing ? ((folders.find(f => f.id === existing.folderId) || {}).name || '') : '';

            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal nugget-modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">{nugget ? 'Edit Nugget' : 'Add New Nugget'}</div>
                        </div>
                        <form onSubmit={handleSubmit} className="nugget-form">
                            {linkFirst && linkField}
                            {existing && (
                                <div className="dup-banner">
                                    <div className="dup-head">Already in Nuggetz</div>
                                    <div className="dup-what">
                                        “{cardTitle(existing.title)}”{existingFolderName ? <> in “{existingFolderName}”</> : null} · {nuggetDate(existing).toLocaleDateString()}
                                    </div>
                                    <label className="dup-choice">
                                        <input type="radio" checked={updateExisting} onChange={() => setUpdateExisting(true)} />
                                        <span>Update that one (keeps its date and folder)</span>
                                    </label>
                                    <label className="dup-choice">
                                        <input type="radio" checked={!updateExisting} onChange={() => setUpdateExisting(false)} />
                                        <span>Save a separate new copy</span>
                                    </label>
                                </div>
                            )}
                            <div className="form-group">
                                <label className="form-label">Title</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    placeholder={previewState === 'loading' ? 'Fetching the title\u2026' : 'Enter a title (or leave blank)'}
                                />
                                {!nugget && previewState !== 'idle' && (
                                    <div className={`preview-status preview-${previewState}`}>
                                        {previewState === 'loading' && 'Fetching title and picture\u2026 (you can save now \u2014 they\u2019ll be added)'}
                                        {previewState === 'found' && '\u2713 Title and picture filled in \u2014 change anything you like'}
                                        {previewState === 'none' && 'No title or picture found for this link \u2014 type a title, or leave it blank'}
                                    </div>
                                )}
                            </div>
                            <div className="form-group">
                                <label className="form-label">Picture</label>
                                {formData.thumbnail && !isPlaceholderThumb(formData.thumbnail) && (
                                    <img className="form-thumb-preview" src={formData.thumbnail} alt="" onError={(e) => { e.currentTarget.style.display = 'none'; }} />
                                )}
                                <input
                                    type="url"
                                    className="form-input"
                                    value={formData.thumbnail}
                                    onChange={(e) => setFormData({ ...formData, thumbnail: e.target.value })}
                                    placeholder="Picture link (paste an image address)"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">{nugget || (existing && updateExisting) ? 'Folder \u2014 choose another to move it' : 'Save to folder'}</label>
                                <FolderPicker
                                    folders={folders}
                                    value={formData.folderId}
                                    onChange={(id) => setFormData(fd => ({ ...fd, folderId: id }))}
                                    onCreateFolder={onCreateFolder}
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Description</label>
                                <textarea
                                    className="form-input form-textarea"
                                    rows={2}
                                    value={formData.description}
                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                    placeholder="Optional description"
                                />
                            </div>
                            {!linkFirst && linkField}
                            <div className="modal-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    {nugget ? 'Update nugget' : existing && updateExisting ? 'Update existing' : 'Save nugget'}
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }
        
        function FolderModal({ onClose, onSave }) {
            const [folderName, setFolderName] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (folderName.trim()) {
                    onSave(folderName);
                }
            };
            
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">Create New Folder</div>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">Folder Name *</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={folderName}
                                    onChange={(e) => setFolderName(e.target.value)}
                                    required
                                    placeholder="Enter folder name"
                                    autoFocus
                                />
                            </div>
                            <div className="modal-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    Create Folder
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<NuggetzApp />, document.getElementById('root'));
    </script>
</body>
</html>
