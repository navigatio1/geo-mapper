            Globe: () => (
                <svg width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={1.5} d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                </svg>
            )
        };
        
        // Main App Component
        function NuggetzApp() {
            const [folders, setFolders] = useState(() => 
                Storage.load('nuggetz_folders', [{ id: 'root', name: 'All Nuggetz', parentId: null, children: [] }])
            );
            const [nuggets, setNuggets] = useState(() => Storage.load('nuggetz_nuggets', []));
            const [currentFolder, setCurrentFolder] = useState('root');
            const [expandedFolders, setExpandedFolders] = useState(['root']);
            const [searchQuery, setSearchQuery] = useState('');
            const [viewMode, setViewMode] = useState('grid');
            const [showAddNugget, setShowAddNugget] = useState(false);
            const [showAddFolder, setShowAddFolder] = useState(false);
            const [editingNugget, setEditingNugget] = useState(null);
            const [draggedNugget, setDraggedNugget] = useState(null);
            const [draggedFolder, setDraggedFolder] = useState(null);
            const [dragOverFolder, setDragOverFolder] = useState(null);
            const [nodePositions, setNodePositions] = useState(() => Storage.load('nuggetz_positions', {}));
            const [shareDraft, setShareDraft] = useState(null);
            
            // Handles an incoming Web Share Target request: when another
            // app (browser, X, LinkedIn, Facebook...) shares a URL to
            // Nuggetz, Chrome/Edge reload this page with ?title=&text=&url=
            // attached. Pick that up once, prefill the Add Nugget modal,
            // then strip the query string so a refresh doesn't repeat it.
            useEffect(() => {
                const params = new URLSearchParams(window.location.search);
                if (params.has('url') || params.has('text') || params.has('title')) {
                    const sharedUrl = params.get('url') || extractUrlFromText(params.get('text')) || '';
                    const sharedTitle = params.get('title') || '';
                    const sharedText = params.get('text') || '';
                    setShareDraft({
                        url: sharedUrl,
                        title: sharedTitle,
                        description: sharedUrl && sharedText !== sharedUrl ? sharedText : ''
                    });
                    setShowAddNugget(true);
                    window.history.replaceState(null, '', window.location.pathname);
                }
            }, []);
            
            useEffect(() => {
                Storage.save('nuggetz_folders', folders);
            }, [folders]);
            
            useEffect(() => {
                Storage.save('nuggetz_nuggets', nuggets);
            }, [nuggets]);
            
            useEffect(() => {
                Storage.save('nuggetz_positions', nodePositions);
            }, [nodePositions]);
            
            // --- Google Drive sync ---
            const [syncEnabled, setSyncEnabled] = useState(() => Storage.load('nuggetz_sync_enabled', false));
            const [syncStatus, setSyncStatus] = useState('idle'); // idle | signed-out | connecting | syncing | synced | error
            const foldersRef = useRef(folders);
            const nuggetsRef = useRef(nuggets);
            const positionsRef = useRef(nodePositions);
            const syncTimeoutRef = useRef(null);
            
            useEffect(() => { foldersRef.current = folders; }, [folders]);
            useEffect(() => { nuggetsRef.current = nuggets; }, [nuggets]);
            useEffect(() => { positionsRef.current = nodePositions; }, [nodePositions]);
            
            // Runs once a Drive access token is granted: compares what's
            // already in the user's Drive against what's on this device
            // and lets them choose which copy wins, then turns sync on.
            const handleTokenReceived = async () => {
                setSyncStatus('syncing');
                try {
                    const remote = await DriveSync.load();
                    const remoteHasData = remote && (
                        (remote.nuggets && remote.nuggets.length) ||
                        (remote.folders && remote.folders.length > 1)
                    );
                    if (remoteHasData) {
                        const useRemote = window.confirm(
                            "Found existing Nuggetz data in Google Drive.\n\n" +
                            "OK = Load it (replaces what's on this device)\n" +
                            "Cancel = Keep this device's data (uploads it, replacing the cloud copy)"
                        );
                        if (useRemote) {
                            setFolders(remote.folders || [{ id: 'root', name: 'All Nuggetz', parentId: null, children: [] }]);
                            setNuggets(remote.nuggets || []);
                            setNodePositions(remote.nodePositions || {});
                        } else {
                            await DriveSync.save({
                                folders: foldersRef.current,
                                nuggets: nuggetsRef.current,
                                nodePositions: positionsRef.current
                            });
                        }
                    } else {
                        await DriveSync.save({
                            folders: foldersRef.current,
                            nuggets: nuggetsRef.current,
                            nodePositions: positionsRef.current
                        });
                    }
                    setSyncEnabled(true);
                    Storage.save('nuggetz_sync_enabled', true);
                    setSyncStatus('synced');
                } catch (e) {
                    console.error('Drive sync error:', e);
                    setSyncStatus('error');
                }
            };
            
            // Waits for the Google Identity Services script to finish
            // loading (it's async/defer), then wires up the token client.
            // If sync was previously enabled on this device, tries a
            // silent reconnect so the user isn't re-prompted every visit.
            useEffect(() => {
                let attempts = 0;
                let cancelled = false;
                const tryInit = () => {
                    if (cancelled) return;
                    attempts++;
                    if (window.google && window.google.accounts && window.google.accounts.oauth2) {
                        DriveSync.init(handleTokenReceived);
                        if (syncEnabled) {
                            setSyncStatus('signed-out');
                            DriveSync.signIn(true);
                        }
                    } else if (attempts < 25) {
                        setTimeout(tryInit, 300);
                    }
                };
                tryInit();
                return () => { cancelled = true; };
            }, []);
            
            // Debounced auto-push: whenever data changes while sync is on
            // and we still hold a valid token, push the latest snapshot.
            useEffect(() => {
                if (!syncEnabled || !DriveSync.accessToken) return;
                if (syncTimeoutRef.current) clearTimeout(syncTimeoutRef.current);
                syncTimeoutRef.current = setTimeout(async () => {
                    setSyncStatus('syncing');
                    try {
                        await DriveSync.save({ folders, nuggets, nodePositions });
                        setSyncStatus('synced');
                    } catch (e) {
                        console.error('Drive sync error:', e);
                        setSyncStatus('error');
                    }
                }, 1500);
                return () => clearTimeout(syncTimeoutRef.current);
            }, [folders, nuggets, nodePositions, syncEnabled]);
            
            const handleSyncButtonClick = () => {
                if (GOOGLE_CLIENT_ID.startsWith('REPLACE_WITH')) {
                    alert('Google Drive sync needs a one-time setup step first — see GOOGLE_DRIVE_SETUP_GUIDE.md for how to get a free Client ID from Google Cloud Console.');
                    return;
                }
                if (!syncEnabled) {
                    setSyncStatus('connecting');
                    DriveSync.signIn(false);
                } else if (syncStatus === 'signed-out' || syncStatus === 'error') {
                    setSyncStatus('connecting');
                    DriveSync.signIn(false);
                } else {
                    const disconnect = window.confirm(
                        'Google Drive sync is connected.\n\nOK = Disconnect\nCancel = Sync now'
                    );
                    if (disconnect) {
                        DriveSync.signOut();
                        setSyncEnabled(false);
                        Storage.save('nuggetz_sync_enabled', false);
                        setSyncStatus('idle');
                    } else {
                        (async () => {
                            setSyncStatus('syncing');
                            try {
                                await DriveSync.save({ folders, nuggets, nodePositions });
                                setSyncStatus('synced');
                            } catch (e) {
                                console.error('Drive sync error:', e);
                                setSyncStatus('error');
                            }
                        })();
                    }
                }
            };
            
            const syncButtonLabel = () => {
                if (!syncEnabled) return 'Connect Drive';
                switch (syncStatus) {
                    case 'syncing': return 'Syncing…';
                    case 'signed-out': return 'Reconnect';
                    case 'error': return 'Sync error';
                    default: return 'Synced';
                }
            };
            
            const addFolder = (name, parentId = 'root') => {
                const newFolder = {
                    id: Date.now().toString(),
                    name,
                    parentId,
                    children: []
                };
                setFolders([...folders, newFolder]);
                setExpandedFolders([...expandedFolders, parentId]);
            };
            
            const addNugget = (nuggetData) => {
                const newNugget = {
                    id: Date.now().toString(),
                    ...nuggetData,
                    folderId: currentFolder,
                    created: new Date().toISOString()
                };
                setNuggets([...nuggets, newNugget]);
            };
            
            const updateNugget = (id, updates) => {
                setNuggets(nuggets.map(n => n.id === id ? { ...n, ...updates } : n));
            };
            
            const deleteNugget = (id) => {
                setNuggets(nuggets.filter(n => n.id !== id));
            };
            
            const deleteFolder = (id) => {
                const deleteRecursive = (folderId) => {
                    const childFolders = folders.filter(f => f.parentId === folderId);
                    childFolders.forEach(cf => deleteRecursive(cf.id));
                    setNuggets(nuggets.filter(n => n.folderId !== folderId));
                };
                
                deleteRecursive(id);
                setFolders(folders.filter(f => f.id !== id));
                if (currentFolder === id) {
                    setCurrentFolder('root');
                }
            };
            
            const toggleFolder = (id) => {
                setExpandedFolders(
                    expandedFolders.includes(id)
                        ? expandedFolders.filter(fid => fid !== id)
                        : [...expandedFolders, id]
                );
            };
            
            const getFolderNuggets = (folderId) => {
                if (folderId === 'root') {
                    return nuggets;
                }
                return nuggets.filter(n => n.folderId === folderId);
            };
            
            const getFilteredNuggets = () => {
                const folderNuggets = getFolderNuggets(currentFolder);
                if (!searchQuery) return folderNuggets;
                
                return folderNuggets.filter(n =>
                    n.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    n.url.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    n.description?.toLowerCase().includes(searchQuery.toLowerCase())
                );
            };
            
            const handleNuggetDragStart = (nugget) => {
                setDraggedNugget(nugget);
            };
            
            const handleNuggetDragEnd = () => {
                setDraggedNugget(null);
                setDragOverFolder(null);
            };
            
            const handleFolderDragOver = (e, folderId) => {
                e.preventDefault();
                setDragOverFolder(folderId);
            };
            
            const handleFolderDrop = (e, folderId) => {
                e.preventDefault();
                if (draggedNugget) {
                    updateNugget(draggedNugget.id, { folderId });
                } else if (draggedFolder && draggedFolder.id !== folderId) {
                    setFolders(folders.map(f =>
                        f.id === draggedFolder.id ? { ...f, parentId: folderId } : f
                    ));
                }
                setDraggedNugget(null);
                setDraggedFolder(null);
                setDragOverFolder(null);
            };
            
            // --- Tree (canvas) view handlers ---
            
            const moveNodePosition = (id, x, y) => {
                setNodePositions(prev => ({ ...prev, [id]: { x, y } }));
            };
            
            const clearNodePosition = (id) => {
                setNodePositions(prev => {
                    if (!(id in prev)) return prev;
                    const next = { ...prev };
                    delete next[id];
                    return next;
                });
            };
            
            const renameFolder = (id, name) => {
                setFolders(folders.map(f => f.id === id ? { ...f, name } : f));
            };
            
            // Dragging one nugget onto another creates a brand-new tree
            // (folder) containing both, mirroring Pearltrees-style nesting.
            const nestNuggets = (draggedId, targetId) => {
                if (draggedId === targetId) return;
                const targetNugget = nuggets.find(n => n.id === targetId);
                if (!targetNugget) return;
                const parentId = targetNugget.folderId || 'root';
                const newFolder = { id: 'f' + Date.now().toString(), name: 'New Tree', parentId, children: [] };
                setFolders(prev => [...prev, newFolder]);
                setNuggets(prev => prev.map(n =>
                    (n.id === draggedId || n.id === targetId) ? { ...n, folderId: newFolder.id } : n
                ));
                setExpandedFolders(prev => [...new Set([...prev, parentId, newFolder.id])]);
                clearNodePosition(draggedId);
                clearNodePosition(targetId);
            };
            
            const moveNuggetIntoFolder = (nuggetId, folderId) => {
                updateNugget(nuggetId, { folderId });
                clearNodePosition(nuggetId);
            };
            
            const nestFolderInFolder = (folderId, targetFolderId) => {
                if (folderId === targetFolderId) return;
                if (isDescendantFolder(folders, folderId, targetFolderId)) return;
                setFolders(folders.map(f => f.id === folderId ? { ...f, parentId: targetFolderId } : f));
                clearNodePosition(folderId);
            };
            
            const exportData = () => {
                const rdfContent = RDFUtil.exportToRDF(folders, nuggets);
                const blob = new Blob([rdfContent], { type: 'application/rdf+xml' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `nuggetz-export-${new Date().toISOString().split('T')[0]}.rdf`;
                a.click();
                URL.revokeObjectURL(url);
            };
            
            const importData = () => {
                const input = document.createElement('input');
                input.type = 'file';
                input.accept = '.rdf,.xml';
                input.onchange = (e) => {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = (event) => {
                            try {
                                const { folders: importedFolders, nuggets: importedNuggets, method } =
                                    RDFUtil.importFromRDF(event.target.result);
                                if (!importedFolders.length && !importedNuggets.length) {
                                    alert("Couldn't find any bookmarks or folders in that file.");
                                    return;
                                }
                                setFolders([...folders, ...importedFolders]);
                                setNuggets([...nuggets, ...importedNuggets]);
                                if (method === 'generic') {
                                    alert(
                                        `Imported ${importedNuggets.length} link(s) into ${importedFolders.length} folder(s), ` +
                                        `filed under "Imported from Pearltrees".\n\nThis wasn't a Nuggetz file, so the folder ` +
                                        `structure was reconstructed heuristically from the RDF — worth a quick look to check ` +
                                        `nesting and titles came through as expected.`
                                    );
                                } else {
                                    alert(`Imported ${importedNuggets.length} nugget(s) and ${importedFolders.length} folder(s).`);
                                }
                            } catch (error) {
                                alert('Import failed: ' + error.message);
                            }
                        };
                        reader.readAsText(file);
                    }
                };
                input.click();
            };
            
            const getBreadcrumb = () => {
                const path = [];
                let current = folders.find(f => f.id === currentFolder);
                
                while (current) {
                    path.unshift(current);
                    current = folders.find(f => f.id === current.parentId);
                }
                
                return path;
            };
            
            return (
                <>
                    <header className="app-header">
                        <div className="header-content">
                            <div className="logo">Nuggetz</div>
                            <div className="header-actions">
                                <button className="btn btn-secondary" onClick={() => setShowAddFolder(true)}>
                                    <Icons.Plus /> New Folder
                                </button>
                                <button className="btn btn-primary" onClick={() => setShowAddNugget(true)}>
                                    <Icons.Plus /> Add Nugget
                                </button>
                                <button className="btn btn-secondary" onClick={exportData}>
                                    <Icons.Download />
                                </button>
                                <button className="btn btn-secondary" onClick={importData}>
                                    <Icons.Upload />
                                </button>
                                <button
                                    className={`btn btn-secondary sync-btn sync-${syncEnabled ? syncStatus : 'idle'}`}
                                    onClick={handleSyncButtonClick}
                                    title={syncEnabled ? 'Google Drive sync — click for options' : 'Connect Google Drive to sync across devices'}
                                >
                                    <Icons.Cloud />
                                    <span className="sync-dot" />
                                    <span className="sync-label">{syncButtonLabel()}</span>
                                </button>
                            </div>
                        </div>
                    </header>
                    
                    <div className="main-container">
                        <aside className="sidebar">
                            <div className="sidebar-header">
                                <div className="sidebar-title">Folders</div>
                            </div>
                            <FolderTree
                                folders={folders}
                                expandedFolders={expandedFolders}
                                currentFolder={currentFolder}
                                nuggets={nuggets}
                                onToggle={toggleFolder}
                                onSelect={setCurrentFolder}
                                onDelete={deleteFolder}
                                dragOverFolder={dragOverFolder}
                                onDragOver={handleFolderDragOver}
                                onDrop={handleFolderDrop}
                                onFolderDragStart={setDraggedFolder}
                                onFolderDragEnd={() => setDraggedFolder(null)}
                            />
                        </aside>
                        
                        <main className={`content-area ${viewMode === 'tree' ? 'content-area-tree' : ''}`}>
                            <div className="content-header">
                                <div className="breadcrumb">
                                    {getBreadcrumb().map((folder, idx, arr) => (
                                        <React.Fragment key={folder.id}>
                                            <span
                                                className={`breadcrumb-item ${idx === arr.length - 1 ? 'active' : ''}`}
                                                onClick={() => setCurrentFolder(folder.id)}
                                            >
                                                {folder.name}
                                            </span>
                                            {idx < arr.length - 1 && <span className="breadcrumb-item">/</span>}
                                        </React.Fragment>
                                    ))}
                                </div>
                            </div>
                            
                            <div className="view-controls">
                                <div className="search-box">
                                    <Icons.Search />
                                    <input
                                        type="text"
                                        className="search-input"
                                        placeholder="Search nuggetz..."
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                    />
                                </div>
                                <div className="view-toggle">
                                    <button
                                        className={`view-btn ${viewMode === 'grid' ? 'active' : ''}`}
                                        onClick={() => setViewMode('grid')}
                                    >
                                        Grid
                                    </button>
                                    <button
                                        className={`view-btn ${viewMode === 'list' ? 'active' : ''}`}
                                        onClick={() => setViewMode('list')}
                                    >
                                        List
                                    </button>
                                    <button
                                        className={`view-btn ${viewMode === 'tree' ? 'active' : ''}`}
                                        onClick={() => setViewMode('tree')}
                                    >
                                        Tree
                                    </button>
                                </div>
                            </div>
                            
                            {viewMode === 'tree' ? (
                                <TreeCanvas
                                    rootFolderId={currentFolder}
                                    folders={folders}
                                    nuggets={nuggets}
                                    nodePositions={nodePositions}
                                    searchQuery={searchQuery}
                                    onNavigateFolder={setCurrentFolder}
                                    onRenameFolder={renameFolder}
                                    onEditNugget={setEditingNugget}
                                    onMoveNode={moveNodePosition}
                                    onNestNuggets={nestNuggets}
                                    onMoveNuggetToFolder={moveNuggetIntoFolder}
                                    onNestFolder={nestFolderInFolder}
                                />
                            ) : (
                                <NuggetGrid
                                    nuggets={getFilteredNuggets()}
                                    onEdit={setEditingNugget}
                                    onDelete={deleteNugget}
                                    onDragStart={handleNuggetDragStart}
                                    onDragEnd={handleNuggetDragEnd}
                                />
                            )}
                        </main>
                    </div>
                    
                    {showAddNugget && (
                        <NuggetModal
                            initialData={shareDraft}
                            onClose={() => { setShowAddNugget(false); setShareDraft(null); }}
                            onSave={(data) => {
                                addNugget(data);
                                setShowAddNugget(false);
                                setShareDraft(null);
                            }}
                        />
                    )}
                    
                    {showAddFolder && (
                        <FolderModal
                            onClose={() => setShowAddFolder(false)}
                            onSave={(name) => {
                                addFolder(name, currentFolder);
                                setShowAddFolder(false);
                            }}
                        />
                    )}
                    
                    {editingNugget && (
                        <NuggetModal
                            nugget={editingNugget}
                            onClose={() => setEditingNugget(null)}
                            onSave={(data) => {
                                updateNugget(editingNugget.id, data);
                                setEditingNugget(null);
                            }}
                        />
                    )}
                </>
            );
        }
        
        function FolderTree({ folders, expandedFolders, currentFolder, nuggets, onToggle, onSelect, onDelete, dragOverFolder, onDragOver, onDrop, onFolderDragStart, onFolderDragEnd }) {
            const renderFolder = (folder, level = 0) => {
                const children = folders.filter(f => f.parentId === folder.id);
                const isExpanded = expandedFolders.includes(folder.id);
                const folderNuggets = nuggets.filter(n => n.folderId === folder.id);
                const isDragOver = dragOverFolder === folder.id;
                
                return (
                    <li key={folder.id} className="folder-item">
                        <div
                            className={`folder-header ${currentFolder === folder.id ? 'active' : ''} ${isDragOver ? 'drag-over' : ''}`}
                            onClick={() => onSelect(folder.id)}
                            draggable={folder.id !== 'root'}
                            onDragStart={() => folder.id !== 'root' && onFolderDragStart(folder)}
                            onDragEnd={onFolderDragEnd}
                            onDragOver={(e) => onDragOver(e, folder.id)}
                            onDrop={(e) => onDrop(e, folder.id)}
                        >
                            {children.length > 0 && (
                                <Icons.ChevronRight
                                    className={`folder-expand ${isExpanded ? 'expanded' : ''}`}
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        onToggle(folder.id);
                                    }}
                                />
                            )}
                            <Icons.Folder />
                            <span className="folder-name">{folder.name}</span>
                            <span className="folder-count">{folderNuggets.length}</span>
                            {folder.id !== 'root' && (
                                <button
                                    className="icon-btn"
                                    onClick={(e) => {
                                        e.stopPropagation();
                                        if (confirm(`Delete "${folder.name}" and all its contents?`)) {
                                            onDelete(folder.id);
                                        }
                                    }}
                                >
                                    <Icons.Trash />
                                </button>
                            )}
                        </div>
                        {children.length > 0 && (
                            <ul className={`folder-children ${isExpanded ? 'expanded' : ''}`}>
                                {children.map(child => renderFolder(child, level + 1))}
                            </ul>
                        )}
                    </li>
                );
            };
            
            return (
                <ul className="folder-tree">
                    {folders.filter(f => f.parentId === null).map(folder => renderFolder(folder))}
                </ul>
            );
        }
        
        function NuggetGrid({ nuggets, onEdit, onDelete, onDragStart, onDragEnd }) {
            if (nuggets.length === 0) {
                return (
                    <div className="empty-state">
                        <div className="empty-state-icon"><Icons.Globe /></div>
                        <div className="empty-state-title">No Nuggetz Yet</div>
                        <div className="empty-state-text">
                            Start collecting your favorite URLs and organize them into folders
                        </div>
                    </div>
                );
            }
            
            return (
                <div className="nuggets-grid">
                    {nuggets.map(nugget => (
                        <NuggetCard
                            key={nugget.id}
                            nugget={nugget}
                            onEdit={onEdit}
                            onDelete={onDelete}
                            onDragStart={onDragStart}
                            onDragEnd={onDragEnd}
                        />
                    ))}
                </div>
            );
        }
        
        function NuggetCard({ nugget, onEdit, onDelete, onDragStart, onDragEnd }) {
            const [isDragging, setIsDragging] = useState(false);
            
            const handleDragStart = (e) => {
                setIsDragging(true);
                onDragStart(nugget);
            };
            
            const handleDragEnd = (e) => {
                setIsDragging(false);
                onDragEnd();
            };
            
            return (
                <div
                    className={`nugget-card ${isDragging ? 'dragging' : ''}`}
                    draggable
                    onDragStart={handleDragStart}
                    onDragEnd={handleDragEnd}
                >
                    <div className="nugget-thumbnail">
                        {nugget.thumbnail ? (
                            <img src={nugget.thumbnail} alt={nugget.title} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
                        ) : (
                            <Icons.Globe />
                        )}
                    </div>
                    <div className="nugget-content">
                        <div className="nugget-title">{nugget.title}</div>
                        <a href={nugget.url} target="_blank" rel="noopener noreferrer" className="nugget-url">
                            {new URL(nugget.url).hostname}
                        </a>
                        <div className="nugget-meta">
                            <span>{new Date(nugget.created).toLocaleDateString()}</span>
                            <div className="nugget-actions">
                                <button className="nugget-action-btn" onClick={() => onEdit(nugget)}>
                                    <Icons.Edit />
                                </button>
                                <button
                                    className="nugget-action-btn"
                                    onClick={() => {
                                        if (confirm('Delete this nugget?')) {
                                            onDelete(nugget.id);
                                        }
                                    }}
                                >
                                    <Icons.Trash />
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }
        
        function TreeCanvas({
            rootFolderId, folders, nuggets, nodePositions, searchQuery,
            onNavigateFolder, onRenameFolder, onEditNugget,
            onMoveNode, onNestNuggets, onMoveNuggetToFolder, onNestFolder
        }) {
            const containerRef = useRef(null);
            const dragMovedRef = useRef(false);
            const [pan, setPan] = useState({ x: 90, y: 70 });
            const [zoom, setZoom] = useState(1);
            const [dragState, setDragState] = useState(null); // { id, type, x, y, overTarget }

            const layout = useMemo(
                () => computeTreeLayout(rootFolderId, folders, nuggets),
                [rootFolderId, folders, nuggets]
            );

            const nodesList = useMemo(() => {
                const list = [];
                const addSubtree = (id, depth) => {
                    const folder = folders.find(f => f.id === id);
                    if (!folder) return;
                    list.push({ id, type: 'folder', parentId: depth === 0 ? null : folder.parentId });
                    folders.filter(f => f.parentId === id).forEach(f => addSubtree(f.id, depth + 1));
                    nuggets.filter(n => n.folderId === id).forEach(n =>
                        list.push({ id: n.id, type: 'nugget', parentId: id })
                    );
                };
                addSubtree(rootFolderId, 0);
                return list;
            }, [rootFolderId, folders, nuggets]);

            const getPos = (id) => nodePositions[id] || layout[id] || { x: 0, y: 0 };
            const NODE_W = 160, NODE_H_BOX = 46;

            const toWorld = (clientX, clientY) => {
                const rect = containerRef.current.getBoundingClientRect();
                return {
                    x: (clientX - rect.left - pan.x) / zoom,
                    y: (clientY - rect.top - pan.y) / zoom
                };
            };

            const hitTest = (worldX, worldY, excludeId) => {
                for (const n of nodesList) {
                    if (n.id === excludeId) continue;
                    const p = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                    if (
                        worldX >= p.x - NODE_W / 2 && worldX <= p.x + NODE_W / 2 &&
                        worldY >= p.y - NODE_H_BOX / 2 && worldY <= p.y + NODE_H_BOX / 2
                    ) {
                        return n;
                    }
                }
                return null;
            };

            const startNodeDrag = (e, node) => {
                if (node.id === rootFolderId) return; // root stays anchored
                e.stopPropagation();
                e.preventDefault();
                dragMovedRef.current = false;
                const startPos = getPos(node.id);
                const startClient = { x: e.clientX, y: e.clientY };
                const startWorld = toWorld(e.clientX, e.clientY);
                setDragState({ id: node.id, type: node.type, x: startPos.x, y: startPos.y, overTarget: null });

                const onMove = (ev) => {
                    if (Math.abs(ev.clientX - startClient.x) > 4 || Math.abs(ev.clientY - startClient.y) > 4) {
                        dragMovedRef.current = true;
                    }
                    const w = toWorld(ev.clientX, ev.clientY);
                    const nx = startPos.x + (w.x - startWorld.x);
                    const ny = startPos.y + (w.y - startWorld.y);
                    const target = hitTest(nx, ny, node.id);
                    setDragState({ id: node.id, type: node.type, x: nx, y: ny, overTarget: target ? target.id : null });
                };

                const onUp = (ev) => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                    if (!dragMovedRef.current) {
                        setDragState(null);
                        return;
                    }
                    const w = toWorld(ev.clientX, ev.clientY);
                    const nx = startPos.x + (w.x - startWorld.x);
                    const ny = startPos.y + (w.y - startWorld.y);
                    const target = hitTest(nx, ny, node.id);

                    if (target) {
                        if (node.type === 'nugget' && target.type === 'nugget') {
                            onNestNuggets(node.id, target.id);
                        } else if (node.type === 'nugget' && target.type === 'folder') {
                            onMoveNuggetToFolder(node.id, target.id);
                        } else if (node.type === 'folder' && target.type === 'folder') {
                            onNestFolder(node.id, target.id);
                        } else {
                            onMoveNode(node.id, nx, ny);
                        }
                    } else {
                        onMoveNode(node.id, nx, ny);
                    }
                    setDragState(null);
                };

                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            const startPan = (e) => {
                if (e.target.closest('.tree-node')) return;
                const start = { x: e.clientX, y: e.clientY };
                const startPanPos = { ...pan };
                const onMove = (ev) => {
                    setPan({ x: startPanPos.x + (ev.clientX - start.x), y: startPanPos.y + (ev.clientY - start.y) });
                };
                const onUp = () => {
                    window.removeEventListener('pointermove', onMove);
                    window.removeEventListener('pointerup', onUp);
                };
                window.addEventListener('pointermove', onMove);
                window.addEventListener('pointerup', onUp);
            };

            const handleWheel = (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.08 : 0.08;
                setZoom(z => Math.min(2, Math.max(0.4, +(z + delta).toFixed(2))));
            };

            const matchesSearch = (id, type) => {
                if (!searchQuery) return true;
                const q = searchQuery.toLowerCase();
                if (type === 'folder') {
                    const f = folders.find(x => x.id === id);
                    return !!f && f.name.toLowerCase().includes(q);
                }
                const n = nuggets.find(x => x.id === id);
                return !!n && (n.title.toLowerCase().includes(q) || n.url.toLowerCase().includes(q));
            };

            return (
                <div
                    className="tree-canvas-container"
                    ref={containerRef}
                    onPointerDown={startPan}
                    onWheel={handleWheel}
                >
                    <div className="tree-canvas-controls">
                        <button onClick={() => setZoom(z => Math.min(2, +(z + 0.15).toFixed(2)))} title="Zoom in">+</button>
                        <button onClick={() => setZoom(z => Math.max(0.4, +(z - 0.15).toFixed(2)))} title="Zoom out">−</button>
                        <button onClick={() => { setZoom(1); setPan({ x: 90, y: 70 }); }} title="Reset view">⟲</button>
                    </div>

                    <div
                        className="tree-canvas-world"
                        style={{ transform: `translate(${pan.x}px, ${pan.y}px) scale(${zoom})` }}
                    >
                        <svg style={{ position: 'absolute', top: 0, left: 0, width: 1, height: 1, overflow: 'visible' }}>
                            {nodesList.filter(n => n.parentId).map(n => {
                                const p1 = getPos(n.parentId);
                                const p2 = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                                return (
                                    <path
                                        key={`line-${n.id}`}
                                        d={`M ${p1.x} ${p1.y} C ${(p1.x + p2.x) / 2} ${p1.y}, ${(p1.x + p2.x) / 2} ${p2.y}, ${p2.x} ${p2.y}`}
                                        fill="none"
                                        stroke="var(--border-color)"
                                        strokeWidth="2"
                                    />
                                );
                            })}
                        </svg>

                        {nodesList.map(n => {
                            const pos = (dragState && dragState.id === n.id) ? dragState : getPos(n.id);
                            const isDragging = !!(dragState && dragState.id === n.id);
                            const isTarget = !!(dragState && dragState.overTarget === n.id);
                            const dimmed = !!searchQuery && !matchesSearch(n.id, n.type);

                            if (n.type === 'folder') {
                                const folder = folders.find(f => f.id === n.id);
                                if (!folder) return null;
                                return (
                                    <div
                                        key={n.id}
                                        className={`tree-node tree-node-folder ${isDragging ? 'dragging' : ''} ${isTarget ? 'drag-target' : ''} ${dimmed ? 'dimmed' : ''} ${n.id === rootFolderId ? 'is-root' : ''}`}
                                        style={{ left: pos.x, top: pos.y }}
                                        onPointerDown={(e) => startNodeDrag(e, n)}
                                        onDoubleClick={() => {
                                            const name = window.prompt('Rename tree', folder.name);
                                            if (name && name.trim()) onRenameFolder(folder.id, name.trim());
                                        }}
                                        onClick={() => { if (!dragMovedRef.current && n.id !== rootFolderId) onNavigateFolder(folder.id); }}
                                    >
                                        <Icons.Folder />
                                        <span>{folder.name}</span>
                                    </div>
                                );
                            }

                            const nugget = nuggets.find(x => x.id === n.id);
                            if (!nugget) return null;
                            return (
                                <div
                                    key={n.id}
                                    className={`tree-node tree-node-nugget ${isDragging ? 'dragging' : ''} ${isTarget ? 'drag-target' : ''} ${dimmed ? 'dimmed' : ''}`}
                                    style={{ left: pos.x, top: pos.y }}
                                    onPointerDown={(e) => startNodeDrag(e, n)}
                                    onClick={() => { if (!dragMovedRef.current) onEditNugget(nugget); }}
                                >
                                    {nugget.thumbnail
                                        ? <img src={nugget.thumbnail} alt="" />
                                        : <div className="tree-node-nugget-fallback">🔗</div>}
                                    <span>{nugget.title}</span>
                                </div>
                            );
                        })}
                    </div>

                    <div className="tree-canvas-hint">
                        Drag a nugget onto another to start a new tree · drop onto a tree to file it there · scroll to zoom · drag background to pan
                    </div>
                </div>
            );
        }

        function NuggetModal({ nugget, initialData, onClose, onSave }) {
            const [formData, setFormData] = useState({
                title: nugget?.title || initialData?.title || '',
                url: nugget?.url || initialData?.url || '',
                description: nugget?.description || initialData?.description || '',
                thumbnail: nugget?.thumbnail || ''
            });
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (formData.title && formData.url) {
                    onSave(formData);
                }
            };
            
            const fetchMetadata = async () => {
                if (!formData.url) return;
                
                try {
                    const url = new URL(formData.url);
                    if (!formData.title) {
                        setFormData(prev => ({ ...prev, title: url.hostname }));
                    }
                } catch (e) {
                    console.error('Invalid URL');
                }
            };
            
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">{nugget ? 'Edit Nugget' : 'Add New Nugget'}</div>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">URL *</label>
                                <input
                                    type="url"
                                    className="form-input"
                                    value={formData.url}
                                    onChange={(e) => setFormData({ ...formData, url: e.target.value })}
                                    onBlur={fetchMetadata}
                                    required
                                    placeholder="https://example.com"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Title *</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={formData.title}
                                    onChange={(e) => setFormData({ ...formData, title: e.target.value })}
                                    required
                                    placeholder="Enter a title"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Description</label>
                                <textarea
                                    className="form-input form-textarea"
                                    value={formData.description}
                                    onChange={(e) => setFormData({ ...formData, description: e.target.value })}
                                    placeholder="Optional description"
                                />
                            </div>
                            <div className="form-group">
                                <label className="form-label">Thumbnail URL</label>
                                <input
                                    type="url"
                                    className="form-input"
                                    value={formData.thumbnail}
                                    onChange={(e) => setFormData({ ...formData, thumbnail: e.target.value })}
                                    placeholder="https://example.com/image.jpg"
                                />
                            </div>
                            <div className="modal-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    {nugget ? 'Update' : 'Add'} Nugget
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }
        
        function FolderModal({ onClose, onSave }) {
            const [folderName, setFolderName] = useState('');
            
            const handleSubmit = (e) => {
                e.preventDefault();
                if (folderName.trim()) {
                    onSave(folderName);
                }
            };
            
            return (
                <div className="modal-overlay" onClick={onClose}>
                    <div className="modal" onClick={(e) => e.stopPropagation()}>
                        <div className="modal-header">
                            <div className="modal-title">Create New Folder</div>
                        </div>
                        <form onSubmit={handleSubmit}>
                            <div className="form-group">
                                <label className="form-label">Folder Name *</label>
                                <input
                                    type="text"
                                    className="form-input"
                                    value={folderName}
                                    onChange={(e) => setFolderName(e.target.value)}
                                    required
                                    placeholder="Enter folder name"
                                    autoFocus
                                />
                            </div>
                            <div className="modal-actions">
                                <button type="button" className="btn btn-secondary" onClick={onClose}>
                                    Cancel
                                </button>
                                <button type="submit" className="btn btn-primary">
                                    Create Folder
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            );
        }
        
        ReactDOM.render(<NuggetzApp />, document.getElementById('root'));
    </script>
</body>
</html>
